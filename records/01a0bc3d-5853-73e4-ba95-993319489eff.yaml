context: |-
  Replication scopes per idea and task: private (this node only), fleet (every node of the owner, addressed to owner:<fingerprint> on the transport the way an invite proof already is), and team (every member's fleet, addressed to the project). Ideas start at fleet, not team; a draft task starts at fleet so the owner's own nodes see it; publishing moves a task to team; an idea moves to team only on an explicit share (h9k idea share <id>, which a discovery walk can do at its end). A fleet-scoped item never appears on another member's board or feed. Builds on the existing private flag (h9k idea set-private, drafts private by default) and on the trust chain's signature checks, which keep a fleet item inside the fleet. Brian, 2026-09-19: an owner should be able to work an idea alone or within their fleet until it is ready for the team. Priority: fold-in before any team rollout, alongside idea 18464daa (publish approvals).

  Walked with Brian 2026-09-19 20:1x EDT from idea 8c5993c5; his calls: a share command for ideas and tasks that works on drafts; team is one-way; existing shared ideas keep team. Why one task: the scope field, the defaults, and the addressing are useless apart. Why fleet is cheap: the transport already carries owner-addressed envelopes (an invite proof goes to owner:<fingerprint>) and the trust chain already verifies who may write, so a fleet item stays inside the fleet by the same signatures that keep a spoofed message out. Builds on: the private flag (h9k idea set-private, ReplicationOwnership.IsPrivate, drafts private by default), EventReplicationOutbox (addressing), EventReplicationInbox (application), EventCatchUpResponder (scope check beside the private check), EventScopeRegistry. Relation: idea 18464daa (publish approvals) needs a draft that can be shared for approval, which h9k task share provides. Vocabulary: fleet means an owner's own nodes. Placement: Mac (its own outbox and inbox code; a free slot now).

