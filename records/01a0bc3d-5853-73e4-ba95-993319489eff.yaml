objective: Every idea and task carries a replication scope, private, fleet, or team; ideas and drafts start at fleet so only the owner's own nodes see them, publishing a task makes it team, and h9k idea share and h9k task share make an item team on the owner's word, whatever its state
criteria:
  - |-
    Every idea and task carries a scope: private, fleet, or team. h9k idea scope <id> <scope> and h9k task scope <id> <scope> set it as a recorded event naming who and when; h9k idea share <id> and h9k task share <id> set team the same way and work on a draft as well as a published item; the existing set-private command stays as an alias for private; h9k idea show and h9k task show name the scope
  - |-
    Defaults: a new idea and a new draft start at fleet; publishing a task sets team; team is one-way, so once other members hold a copy the scope never goes back below team; existing items keep their current effective scope (team if shared today, private if private today) and only new items take the new defaults
  - The replication outbox addresses a fleet item's events to the owner's root fingerprint (owner:<fingerprint>, the addressing an invite proof already uses) and a team item's to the project; a private item's events never leave; a scope change re-sends the item's full history at the new scope so a shared item arrives whole
  - The inbox applies owner-addressed events only when addressed to this node's own owner root, verified through the trust chain; the catch-up responder serves an item only to a requester its scope allows and answers events-unavailable otherwise; a fleet item never appears on another member's board, feed, or status
  - Unit tests cover the defaults, the share transition on a draft and on a published item, the one-way rule, addressing per scope, the full-history resend, the inbox refusing owner-addressed events for another owner, the responder's refusal, and the show output as a golden; no test creates branches or touches GitHub
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder; docs/concepts.md describes the three scopes, the defaults, and the share commands
