objective: A review-feedback lap's fix reply posts only after the platform's push has moved the pull request's head, and names that push, so a reply under the owner's login never says Fixed for work the pull request does not carry yet
criteria:
  - |-
    h9k pr reply with --disposition fix posts nothing during the session, into a bot's thread or a person's. It vets the body against the writing conventions exactly as today, records the reply on the run as pending with its thread and body, and prints that the platform will post it and resolve the thread after it pushes the lap's work, so the session does not resolve that thread itself. A decline or a route is unchanged: into a bot's thread it posts at once, and into a person's thread it is refused and the run parks.
  - |-
    When the platform's push of the lap's work moves the pull request's head away from the head the lap started from (the head closeout recorded when it dispatched the lap, or, when none was recorded, the tip this task had recorded as last pushed to this branch when the platform's push step began; with neither known, the replies are withheld), the daemon posts each pending fix reply in its thread with one appended line naming the push: the before and after short shas and GitHub's compare link between them. It then resolves that thread and records the post as ReviewThreadReplyPosted. All of this finishes before the task reads complete. A post or a resolve that fails is logged with gh's error and leaves that thread open, without failing the run or stopping the other posts.
  - |-
    A pending fix reply never posts when the lap ends without moving the head: a push whose tip is the head the lap started from, a gate failure, a failed run, a run whose task was abandoned before its push, or a run the generation fence refuses at completion. A parked run's pending replies stay pending and post only if that run later pushes and moves the head. h9k task show lists each pending reply that has not posted, with its thread and body: marked as waiting for the push until the run's push step has decided it, and as withheld, with the reason, once that step has passed without posting it (the head did not move, the closing triage contradicted it, or the post failed, with gh's error) or the run has failed, been abandoned, or been superseded first, so the owner can read what the lap would have claimed.
  - |-
    A pending fix reply posts at most once: when the daemon restarts and runs the push step again for the same run, a reply the run already recorded as posted is not posted again.
  - |-
    The check that compares a reply's claimed disposition with the session's own closing triage still covers fix replies now that they wait: a pending fix reply into a person's thread whose THREAD DISPOSITION block in the closing summary says decline or route is withheld instead of posted, and stays withheld if the run later resumes from a park and pushes; the run log warning still names the thread and says the reply was withheld.
  - |-
    The texts that teach a dispatched session to reply say the new order: the posting-route and fix-rule fragments of .claude/templates/agent-prompt-builder/thread-handling.md, steps 7 and 9 of the resolve-review-threads skill (keeping its standalone carve-out), and the hall9k-cli-reference skill's h9k pr reply paragraph. Each says that a fix reply posts after the platform pushes and carries the push range on its own, that the session does not resolve a fix's thread, and that a finding already satisfied on the head the lap started from (the pull request as GitHub shows it, not a local commit the lap made) is not a fix: it is a decline whose evidence names the commit that satisfies it, posted on a bot's thread and drafted and parked on a person's.
  - |-
    The h9k pr reply review-body form that c4ee5f06 adds follows the same rule: a fix answer to a review body, a bot's or a person's, waits for the push and then posts as its top-level comment carrying the same push line. A decline or a route answer to a review body behaves exactly as c4ee5f06 leaves it.
  - |-
    Unit tests, with no test running git or reaching GitHub: the head the lap started from and the pushed tip are inputs, and gh is a fake process runner whose calls are recorded. They show that a fix reply records pending and posts nothing; a moved head posts it with the range line and resolves the thread; an unmoved head, a gate failure, and an abandon post nothing and show the reply as withheld in h9k task show; a parked run keeps it pending; a second pass over the same run posts nothing new; one failed post leaves the others posting; a fix reply into a person's thread that the closing triage calls a decline is withheld; a bot thread's decline still posts at once; a person's decline is still refused; and a fix answer to a review body waits and then posts as a comment.
