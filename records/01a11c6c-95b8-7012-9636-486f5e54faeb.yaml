context: |-
  Origin: arx-platform PR #2220 (Taylor's transport note b21c6dce, item 2). Discovery: notes/taylor-observations-2026-10-08/discovery-d435fa38/summary.md in the hall9k project home; read its lineage section before starting. The lap made a real fix at 13:45:52Z and folded it into the existing Expose commit by fixup and autosquash, keeping that commit's 2026-10-07 author date. It replied Fixed at 13:46:06Z and resolved the thread, and the platform pushed only at 14:13:41Z, after the verify gate. For 27 minutes the pull request showed a resolved thread saying Fixed over a head that lacked the change, and a gate failure would have left that claim standing with nothing behind it. The cause is ordering: h9k pr reply posts during the session, while the agent never pushes and the platform pushes after its gates.

  Built on c4ee5f06's branch (stacked). That draft adds the review-body form of h9k pr reply and extends the reply-guard hook to every headless session, in the same files this one touches; do not redo any of it. Criterion 7 brings its body form's fix answers under this rule.

  The seams on main (5fa78e34b); reuse them rather than adding a queue or a second posting path:
  - The hold. src/Hall9k.Cli/Commands/PullRequestReplyCommand.cs: ReplyAsync vets with PostedProse.Vet (about line 168) and then posts at once with GitHubReviewReplies.ReplyInThreadAsync (about line 174). A fix stops after the vet and appends a new run event recording the pending reply (thread, disposition, the human-authored flag the command already computes, and the vetted body), projected into RunDetails beside ReviewThreadRepliesPosted and registered in EventScopeRegistry and TaskActClassificationRegistry like ReviewThreadReplyPosted and ReviewThreadReplyRefused. The existing run-stream existence fence (about line 134) applies to it unchanged.
  - The post. src/Hall9k.Daemon/Execution/PullRequestOpener.cs, OpenAsync: PushBranchAsync then RecordBranchPushedAsync (about lines 124 and 125), then the generation fence and the TaskCompleted append. RerequestChangesRequestedReviewersAsync is the precedent for a best-effort provider write tied to the push. The fix posts belong after GenerationFence.AllowsAsync admits this run and before TaskCompleted is appended, because closeout starts reading the pull request once the task completes, and a thread still open at that read buys a lap over a reply about to post. Record each post in its own session as it lands, as RerequestChangesRequestedReviewersAsync does (lines 317 to 330), never in the completion session, so a completion that loses its race, or a daemon stopping mid-loop, cannot drop the record of a reply already on GitHub; that also narrows the window criterion 4 accepts to one reply. The decide-and-post step records each withheld reply and its reason on the run as it decides, because a run whose push left the head unmoved still reads AwaitingReview afterward, so its state alone cannot tell h9k task show the reply was withheld. Build the GitHubReviewReplies over the opener's injected processRunner (the daemon's registered ProjectScopedGitHubRunner, Program.cs line 238), with project.RepositoryPath as the working directory, so each reply posts under the project's own GitHub account; neither GitHubReviewReplies' parameterless default nor PushBranchAsync's deadline runner does that. RecordBranchPushedAsync (lines 914 to 936) reads refs/heads/<branch> but returns nothing and swallows a failed read; the decide step needs that tip, so change it to return it, and withhold when it cannot be read.
  - The heads. The head the lap started from is RunDetails.OpeningReviewSinceSha (RunDispatched carries it from TaskAggregate.FollowUpPullRequestHeadSha; null for a manual h9k pr resolve reopen and a rebase follow-up), with TaskDetails.LastPushedBranchTip as read at the top of OpenAsync, before this run's push is recorded, as the fallback. The pushed tip is the one RecordBranchPushedAsync reads (refs/heads/<branch>). On a restart that re-runs the push step, the fallback reads the new tip and so withholds; that errs the safe way.
  - The resolve. No resolveReviewThread mutation exists in the daemon or Connectors on main (GitHubReviewThreads only reads; GitHubReviewReplies has only the reply mutation and CommentAsync). Add the resolve beside ReplyInThreadAsync in GitHubReviewReplies, on the same gh seam and with the same errors-array check.
  - The compare link. A narrative lap rewrites history, so the link should be GitHub's two-dot compare between the two shas, which diffs the commits directly; confirm the form against a force-pushed pull request's own timeline link.
  - The claim check. RunSupervisor.WarnOnContradictedReplyClaims (about line 2437) iterates ReviewThreadRepliesPosted when the closing triage lands, which is before the push, so once fixes wait it would never see one. Criterion 5 keeps it covering them. A person's thread withheld this way then has no posted reply, so RunSupervisor.HumanThreadReplyDrafts (about line 2726) already parks it with a blank draft; nothing new is needed there.
  - The show. TaskShowCommand renders refused replies (about line 1763); pending and withheld replies render beside them.
  - Testability. PushBranchAsync uses ExternalProcess.RunnerWithDeadline, not the injected runner, so OpenAsync itself is not unit-testable over a fake. Keep the decide-and-post step a unit that takes the two heads, the run's records, and a GitHubReviewReplies over a fake runner.

  Behaviour that stays as it is: declines and routes on both kinds of thread, the person-thread refusal and park, the writing-conventions vet, CloseoutEngine.WasAnsweredOrParked (it reads declines and routes only), and the changes-requested lap's own rule not to reply in threads (review-requested-changes.md).

  Residuals, named rather than closed: a session can still resolve a fix's thread itself through gh before the push, since the hook does not refuse resolveReviewThread (a bot decline still needs it); the prompt rule holds that. A daemon stopping between a gh post and its record could post that one reply twice on the re-run, the same window PullRequestReplyCommand's own post-then-record order accepts. A withheld reply is not carried to a retry's new run; its thread stays open and the next lap answers it. An abandon or a newer claim that lands after the push but before the TaskCompleted save can leave replies posted for a run that does not complete; the push did carry the work, so the replies are true. The rule proves the push carried the lap's work, not that it carried each thread's fix; the compare link is how a reader checks one. A person pushing to the branch between the reopen and the dispatch makes a lap that changed nothing read as a moved head, since OpeningReviewSinceSha is the head closeout observed at the reopen; rare, and narrower than the failure. A resumed session after a park, or a later fix session in the same lap, can record a second pending fix reply on the same thread; letting a later pending reply replace the earlier one is the build's call. A satisfied-already finding on a person's thread parks for the owner, which is deliberate: a fix reply there would be withheld for an unmoved head and the thread would buy another lap. Two prompt goldens (tests/Hall9k.Tests/Fixtures/PromptGoldens/AgentPromptBuilder/build-follow-up.golden.txt and build-follow-up-foreign-retry-reason.golden.txt) carry the posting-route text and are regenerated, not read as a defect.

  Out of scope: treating a review whose commit is no longer an ancestor of the head as stale (recommended against in the discovery summary, since every narrative-style lap rewrites history), and the courier's pushed-its-work wording on a lap that pushed nothing (a separate report).
