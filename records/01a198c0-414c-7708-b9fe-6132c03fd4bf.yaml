context: |-
  From issue 788. The two git allow rules stay, and a pull request diff file is not part of this task. Order: after the prompt-wording task 68359f61, not stacked; this task lifts that task's test forbidding the statement from naming git show, git grep, git blame, and git ls-files. h9k pr review shares CreatePrReviewCheckoutAsync and takes the same shape. Resolve the object directory the way ResolveLockDirectoryAsync does rather than assuming a bare clone. Fetch tags as well as remote-tracking refs. Set GH_REPO for the sessions so gh reads work with no remote. A project using Git LFS has no remote to download from in this checkout, so skip smudging on the checkout step. Note to the orchestrator: after merge, confirm on the next real review that its stream files show git show and git grep running, and that a gh read works in the human lap.
