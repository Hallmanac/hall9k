objective: A pr-review checkout is a standalone clone, so a review session can search and read any revision of any file with read-only git
criteria:
  - A pr-review checkout, whether cut by the daemon or by h9k pr review, is a standalone repository with a real .git directory, borrowing objects from the project's repository whether that repository is bare or an ordinary clone, with no remote and no hooks
  - The checkout holds the pull request's head, every remote-tracking ref the project's repository holds, and its tags
  - gh pr view, gh pr diff, gh pr checks, and gh issue view run by number in the checkout against the project's repository, in pr-review sessions and in the human review lap, and a test pins the setting that makes this work
  - Removing a pr-review checkout, of the new shape or a linked worktree cut before this change, removes it and leaves the project's repository and its other worktrees untouched
  - A directory delete happens only for a standalone checkout directly beside the project's repository, and a test shows that any other path, the repository itself included, is refused
  - A checkout whose creation fails partway leaves no directory behind
  - The shell-limits template names git show, git grep, git blame, and git ls-files as available to a pull-request review
  - Prompts, CLI messages, and doc comments describe this checkout as a standalone clone rather than a worktree of the project's clone
  - The git rules in PrReviewAllowedTools are unchanged, so sessions running in linked worktrees keep git diff and git log
  - A unit test pins the generated git command sequence, and no new test creates a branch or touches GitHub
  - Build and fix worktrees keep today's layout
