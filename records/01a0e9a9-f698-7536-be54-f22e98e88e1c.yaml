  ```
  A security review (idea 6be68ee2) found several places where text written by someone with no relationship to this repository reaches an agent's prompt unfenced. This closes the two spots a non-member can actually reach: the review lap and the changes-requested fix lap. The replicated-context half of the same review (reasons, handoffs, addenda, lessons) is a separate task stacked on 055ff347.

  - The review lap's opening briefing now fences a pull request's own body and, on a scoped lap, the reviewer's thread replies, since both are written by whoever can open a pull request or comment on one with no association filter at all. A new working rule states that boundary for the reviewer's own interactive session directly, distinct from the build-agent wording the existing thread-text-boundary rule carries elsewhere.
  - The changes-requested fix lap fences every finding body the same way, bounded well above an honest review's length with a labelled line back to the review when the bound actually bites. This is the one site a non-member reaches at all: GitHubPullRequestInspector admits that review from any human who isn't the pull request's author.
  - A spike's own objective is one-lined and capped everywhere it lands in a Markdown heading, since a spike's task can be minted from a discovery workspace an earlier, unattended run wrote.

  The fence-wrapping shape itself moved into `RelayedText.Fenced`, since the two new call sites would otherwise have triplicated the exact code `MentionFollowUpPromptBuilder.Block` already carried.
  ```
