context: |-
  Card C2 of idea 8d0b724b (ideas/8d0b724b-*/workspace/draft-task.md, report.md, and the rulings in workspace/journal.md), stacked on C1 (62d382cc, #688), which adds the assignee field, the TaskAssigneeSet and TaskAssigneeCleared events, and the hand-off rules; build on C1's branch and do not redo any of it. C2 is the verb flip: assign records ownership only and never dispatches; queue is the go signal (TaskAssigned stays the go event on the wire, per the wire-shape ruling); dequeue returns a task to Published keeping its assignee. Only the Published-to-Queued go moves to queue: h9k task assign --node on an already queued task keeps changing placement (TaskPlacementChanged), and re-entries into Queued (retry, requeue, release, takeover, reopen, handback, grant, RemoteStackedParentObserved) are unchanged. Start, work, pr review, and the auto-pr-review mints keep writing TaskAssigned; they are go acts (criterion 9). Vocabulary: call the field the assignee; "holder" is the ledger lock and "claim" is the node lease. Governing decisions, already recorded (do not record new ones; an agent run cannot, and linking them to Decisions Log #34 is the orchestrator window's act at closeout): 30338b96 (every verb names the board column the task lands in), f951013c (hard flip, publish --assign refuses for one minor), 8a5822cc, e495334c, 4e29c5fb (C2 ships as a minor with Brian's nodes updated first). The cell B pair 6 challenge (verdict-opus.md and verdict-fable.md in this task's directory) confirmed the cited sites on origin/main at a032a6377; EventReplicationInbox lives in Hall9k.Connectors. Tests: no branches, git, or GitHub; the Postgres fixture is fine for replay and dispatcher tests. If one session cannot finish, criteria 1 to 5 and 8 to 10 come before the sweep in 6 and 7, on the same branch; a half flip must not ship. This is a user-facing behavior change for teammates whose habit is "assign means go"; the PR description must say so plainly.
