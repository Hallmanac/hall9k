objective: Assign means I hold this and never dispatches; queue is the go signal; nothing dispatches without a queue
criteria:
  - h9k task queue <id> [--node [NODE]] on a Published task writes TaskAssigned for the recorded assignee. With no assignee, the actor becomes the assignee through that same TaskAssigned (C1's rule that TaskAssigned sets the assignee). With another owner as assignee, it refuses, names them, and names the assignee's hand-off (h9k task assign <id> <member>) as the way out. Dependencies and placement behave exactly as assign behaves today, and in a tracker-assignee project it offers the take the way assign does now.
  - h9k task assign on a Published task records ownership only. Its output says the task is not queued and gives h9k task queue <id>. A test asserts that the task stays Published.
  - |-
    h9k task dequeue <id> returns a Queued or Blocked task to Published and keeps the assignee. It writes TaskUnassigned with a field marking that the assignee is kept, and a TaskUnassigned with no such field replays as it always did. h9k task unassign on a queued task dequeues and clears the assignee in one append. The PR description states what a pre-C1 node and a C1-only node do with a dequeue (an older node replays it as a full unassign: the task lands Published, so nothing runs, but the assignee is cleared there), and that an un-updated node's task assign still queues, so every node of every member updates before anyone relies on assign meaning hold.
  - h9k task release --unassign and the pre-flight park return the task to Published with its assignee kept, recorded the same way so older events replay unchanged.
  - h9k task publish --queue publishes and queues in one transaction for the recorded assignee, or for the actor when there is none; it takes no owner argument and refuses when the assignee is another owner. The interactive offer after a plain publish asks whether to queue, not to assign, and --no-queue replaces --no-assign, which stays accepted as its alias. h9k task publish --assign refuses for one minor release with a pointer to --queue (decision f951013c), and is never kept as a silent alias for --queue.
  - |-
    Every hint, park line, refusal, and help text that names task assign as the go signal names task queue instead. This covers TaskShowCommand's Next: line, AttentionComposer, ProjectSetCommand, ProjectShowCommand, TaskPublishCommand, TaskWorkCommand, TaskStartCommand, TaskUnassignCommand, TaskReleaseCommand, TaskTakeCommand, TaskAddCommand, IdeaPromoteCommand, CliCommandTree, AutoPrReviewEngine, DispatchEngine, ReviewRequestPane, ProjectAgentsDocument, TaskDecider's refusal messages, and the doc comments that call assign 'the human go' (ReviewMentionOutcome, ReviewRequestOutcome, PullRequestReviewGateParked, TaskListItem, TaskAggregate, TrackerClaimCheck, TrackerClaimGate). C1's refusal of a hand-off on a Queued task names h9k task dequeue. Every line in src/ outside the legacy decisions log that still matches task assign or --assign describes recording the assignee, a hand-off, --take, or --node placement; no such line says go, go signal, dispatch, so it dispatches, or starts it, except the TaskAssigned wire event's own doc comment. The PR description lists the remaining matches by file.
  - |-
    The docs, skills, and templates describe both verbs: docs/cli.md, docs/concepts.md, docs/scope.md, docs/operations.md, docs/getting-started.md, README.md, TASK-MODEL.md, ORCHESTRATOR-WINDOW.md, .claude/skills/hall9k-cli-reference/SKILL.md, and .claude/skills/orchestrator-recipe-generator/ (its SKILL.md and every recipe template it renders), so a regenerated orchestrator recipe teaches publish --queue, and every template or prompt that forbids a session to assign also forbids it to queue. The same positive rule as criterion 6 holds for every match of task assign or --assign in docs/, .claude/, and the top-level markdown files, with SLICE-1.md and backlog/ exempt as history.
  - The TaskDecider.Assign doc comment no longer claims that no monitor appends TaskAssigned.
  - h9k task start, h9k task work, h9k pr review, and both auto-pr-review mints still write TaskAssigned in their own append and behave as before; they are go acts, and the tests that pin them pass unchanged. No other site writes TaskAssigned, and a test or the PR description enumerates the callers.
  - DispatchedSessionCommandClassification refuses task queue and task dequeue to a dispatched session, as it refuses task assign and unassign. A test asserts that a TaskUnassigned serialized without the kept field replays as a clearing unassign.
