objective: h9k pr review --since-my-review never presents a commit range it could not compute as an empty one, and computes the range from the reviewer's own submitted review on GitHub when the platform recorded no reviewed head
criteria:
  - When the task records no reviewed head (PrReviewReviewedHeadSha is blank) and the reviewer's newest submitted review on GitHub is APPROVED or CHANGES_REQUESTED and carries a commit oid, the scoped packet lists the commits pushed since that commit and carries their diff exactly as it does from a recorded head, and the line naming the reviewed commit says it was read from the review on GitHub rather than recorded by the platform. A recorded head, when there is one, is still the one used.
  - Whenever the commit range was not computed (no reviewed commit from either source, no checkout under --no-worktree, or git refusing the range), the 'Commits pushed since your review' section opens with a sentence saying the range could not be computed and why, where the why states only what the lap observed (for a missing commit, that neither the platform's record nor the reviewer's newest review on GitHub supplied one), and the packet nowhere reads as an empty range; 'None were observed' appears only when git computed the range and it held no commits, and the line about the reviewed commit no longer says the packet holds the commits it could observe.
  - A thread the reviewer opened that has no new comment and no recorded watermark is counted neither as unchanged nor as moved; the thread half says how many such threads there are, that whether their resolution changed since the review cannot be told, and how many of them are resolved now. While any such thread exists, the thread half never says the reviewer opened no threads, nor that none of their threads moved. Threads that do have a watermark are judged exactly as before.
  - Tests, over a fake process runner and the prompt goldens, show five things. A blank recorded head with a CHANGES_REQUESTED review carrying a commit oid yields that range's commit list and diff and the from-the-review wording, with the fake git answering only for a range that starts at that commit. A recorded head beside a CHANGES_REQUESTED review naming a different commit yields the range from the recorded head and the existing wording. A blank recorded head whose newest review is COMMENTED, and one whose newest review carries no commit, each yield the could-not-compute opening and no 'None were observed'. Threads with no watermark and no new comment, one of them resolved, yield the cannot-tell wording with the resolved count, are absent from the unchanged count, and the packet contains neither 'have moved since their review' nor 'they opened none'. The existing since-my-review golden (recorded head, computed range) is byte-for-byte unchanged.
