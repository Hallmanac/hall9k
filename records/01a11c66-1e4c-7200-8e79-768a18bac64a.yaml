context: |-
  Origin: TaylorDenny, arx-platform#2201, 2026-10-06 (transport note 5b401477, item 1; item 2 is draft 8b410ac0). The scoped briefing printed 'None were observed' under the commits heading and 'all 11 of them are unchanged' under thread replies, with the caveat that no commit was recorded for the review further down. Three commits had landed after the review (dd757512, f4cb7fb9, 79d15838) and all fifteen threads were resolved; Taylor caught it only because he had measured the range with gh himself. His review was CHANGES_REQUESTED, which matters for criterion 1.

  Where it lives (origin/main at 5fa78e34b). src/Hall9k.Cli/Commands/PullRequestReviewCommand.cs: ComposeScopedPacketAsync at line 1093 already reads the conversation at line 1117, and conversation.LatestReviewOf(reviewerLogin) gives the reviewer's newest submitted review with its CommitOid, so no extra GitHub call is needed. ReadPushedSinceAsync at line 1190 returns an empty commit list plus a note for a blank head (line 1197), no checkout (line 1205), and a range git refuses (line 1214). The moved-or-unchanged rule is lines 1137 to 1150: stateChanged is false whenever no watermark exists, so such a thread lands in the unchanged count. src/Hall9k.Connectors/WorkItems/GitHubReviewThreads.cs: SubmittedReview at line 127, ReviewConversation.LatestReviewOf at line 193, ReadLatestReviewByLogin at line 425 (newest per login out of the newest hundred reviews; a login missing from a truncated page returns null, which is simply "no review commit"). src/Hall9k.Connectors/Prompts/ReviewLapPromptBuilder.cs: ScopedReviewPacket at line 98 and AppendSinceMyReviewSection at line 404, which prints the head-unknown fragment for any blank ReviewedHeadSha and prints commits-none for any empty NewCommits, before the DiffNote that says why (lines 505 to 523). The template is .claude/templates/review-lap-prompt-builder/since-my-review.md (head-unknown at line 7, commits-none at line 47). Watermarks are taken at the first follow-through poll, not at the review (TaskAggregate.cs, the doc above line 1077), so a lap opened before that poll, or on a task whose follow-through never opened, has none.

  Why only APPROVED or CHANGES_REQUESTED: PrReviewFollowThroughEngine.TryReopenHead (line 447) already takes a review's commit as the reviewed head only for those two states, because a COMMENTED review, which includes a lone thread reply, reviews no code; a reply made after a push would carry a later commit and shrink the range, which is the wrong direction to fail in. Use the same rule here. A COMMENTED newest review falls through to the honest could-not-compute wording.

  Not in this task: Taylor proposed deriving the range from the review's submitted_at against commit dates; rejected because commit dates move under rebases and fold-in fixes, while the review's oid is GitHub's own record. The derived commit is read live on every lap and not stored on the task. No resolved-at time is inferred for a thread; the honest count is the fix.

  Tests: tests/Hall9k.Tests/Integration/ReviewLapTests.cs drives the scoped lap through ScopedLapGh, a fake process runner (line 1197 onward), and tests/Hall9k.Tests/Connectors/ReviewLapPromptBuilderGoldenTests.cs holds since-my-review and since-my-review-minimal. The minimal golden has a blank head and an empty commit list and is expected to change; the full one is not. No test that runs git or reaches GitHub.

  Note to the orchestrator: 8b410ac0 also edits ReviewLapPromptBuilder.cs (its route line in the briefing), in a different section; whichever merges second may need a rebase, and if 8b410ac0's line lands in the scoped section the since-my-review golden moves with it. Not stacked.

  Notes from the challenge pair (2026-10-08): SeedWaitingPrReviewTaskAsync (tests/Hall9k.Tests/Integration/ReviewLapTests.cs about line 1624) records a reviewed head and a T1 watermark, so the new cases need a seed with neither; the null-head opening at about line 215 of the same file is the pattern to copy. The minimal golden fixture SinceMyReviewMinimalBriefing (golden tests about lines 206 to 219) pairs a blank head with a force-push note, a combination the composer cannot produce; if the build decides "not computed" from an explicit packet field, that fixture must set it. On arx#2201 itself, a later thread reply by Taylor would be a newer COMMENTED review and route to the could-not-compute opening; criterion 2 ends the failure he reported either way, and the recovered range is the bonus, not the fix.
