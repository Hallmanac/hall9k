  ```
  Title: fix: fail a missing blocker only when this node's own purge destroyed it

  Work item: [#845](https://github.com/Hallmanac/hall9k/issues/845)

  The dependency sweep used to treat any blocker id that named no task on the node as gone and record a `TaskDependencyFailed` for it. That event is project-scoped, so a teammate's node that had joined only the dependent's project would park the task for everyone, and a node that could see the blocker would lift the hold again on its next cycle, which meant the two views flipped it back and forth.

  The rule now is that the sweep records the failure only when this node's own purge record names the missing blocker. I chose that because a dependency edge is a bare id that records no project for its blocker, and a purge deletes the blocker project's own record, so neither one can tell a project this node hasn't seen from one it purged. A purge this node carried out is the only evidence that can't be wrong, so `ProjectPurgeEngine` now stores a `PurgedTaskRecord` for every task it destroys, in the same save as the deletes. It's a plain document rather than an event, so it never replicates. A dependent whose blocker this node purged still fails with the same reason as before, and any other missing blocker leaves the dependent Blocked with nothing recorded.

  Since the sweep no longer says anything about those blockers, `h9k status`, `h9k task show`, and the orchestrator feed heading now show them as an unknown blocker. The line names the blocker by short id only, never an objective, and hints that it most likely belongs to a project held on a teammate's node.

  One thing to flag for the release notes: the flip-flop only ends once every node in the project runs this fix, because a node on the old code will still record the failure from its partial view.
  ```
