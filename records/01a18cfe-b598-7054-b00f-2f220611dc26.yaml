context: |-
  A Linear connector, so a project whose work and backlog live in Linear gets the same tracker integration hall9k gives Jira and GitHub issues.

  Stacked on the Linear connection and adoption card; use its requester and connection as built. Build notes. The shape to follow is JiraDoctor for the probe. Add the Linear team as a trailing Optional on ProjectSettingsChanged and ProjectTeamSettingsChanged, and copy every JiraProjectKey step (From, both aggregate Apply methods, both projection paths with TryStampTeamSetting). Keep "the project's tracker is Linear" in one predicate so idea c14bfb15 replaces one place. Look a team up with the teams query and a TeamFilter key filter; team(id:) is not documented to take a key.

  Facts this card leans on are cited, and the unverified ones are listed, in notes/challenge-e76868de/journal.md in the project home; the discovery workspace's findings.md holds the survey.

  Out of scope: claim gate and mirror (B), PR title and closing words (C), creating issues (D), reassign (E), idea links (F), any webhook, and OAuth.

