objective: A retry after a forced takeover of a run that never pushed its branch starts clean from the base branch instead of failing at launch on a branch that exists neither locally nor on origin
criteria:
  - RunLauncher.CheckoutFreshOrRetryAsync treats a resume branch that exists neither locally nor on origin as gone artifacts and cuts a fresh worktree from the base branch, recording that the retry started clean, instead of throwing WorktreeException from GitWorktreeManager.CheckoutExistingAsync (observed 2026-09-19 14:33 and 14:35 EDT on a56cf16e, runs 01a0baf1 and 01a0baf3, after h9k task take --force from a Mac run that had built 11 minutes without pushing)
  - h9k task show on a task whose last run was on another node no longer prints that node's worktree path as this node's Worktree and branch line; it names the branch and says where it was last seen
  - The forced-take output and h9k task retry help say plainly that a branch the superseded run never pushed cannot be resumed and the next run starts clean, so the human is not told the branch resumes when it will not
  - |-
    A test covers takeover then retry with no branch on origin: the run launches from the base branch
