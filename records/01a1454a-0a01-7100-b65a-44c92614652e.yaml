objective: An owner-role or member-role invite minted on a successor node completes, from any node in the owner's fleet, instead of expiring with nothing anywhere to approve
criteria:
  - |-
    A member-role invite minted on a node of the owner's fleet that does not hold a live root key completes with no approval: the teammate's h9k project join finishes and the teammate appears in h9k project members, as long as the root node's daemon, on a build with this fix, runs at any point before the invite expires, however long after the match that is
  - An owner-role invite minted on such a node is held on the root node until the invite itself expires, not for a fixed ten minutes, and h9k project member approve on the root at any point in that time completes the join
  - While the minting node waits, its h9k status line names the node the request was sent to and the time the wait ends. On the root, the held line states the same time
  - h9k project member approve on a node that holds no write for the invite names the node that does hold it
  - h9k project members marks the node holding the owner's original root key "(root)" and never "(successor)"; all other labels are unchanged
  - Tests over fakes (no multi-node, git, or GitHub integration tests) cover, for each role, a request that reaches the root more than ten minutes after it was sent but before the invite expires, and an owner-role hold approved more than ten minutes after it was held. Each case ends with the member write landed and the invite spent on the minting node
