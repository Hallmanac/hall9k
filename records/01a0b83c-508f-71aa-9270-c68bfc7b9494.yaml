objective: The Decisions Log renumbering runs before the mandatory final pass even when the pre-final-pass rebase is skipped, and closeout never merges a pull request whose PLAN.md tail still carries the branch's own placeholder
criteria:
  - When EnsureRebasedBeforeFinalPassAsync skips the rebase for any reason (origin fetch failed, origin unreadable, git deadline, worktree missing, dirty, or not on its branch, pull request base mismatch, or no rebase owed), the Decisions Log renumbering of this task's own tail placeholder still runs against the worktree's current base before the mandatory final pass, its commit moves HEAD, and the full gate runs over it like any other tip move; h9kd.log names which skip happened and that the renumbering ran
  - |-
    Closeout never merges a pre-approved pull request whose PLAN.md section 16 tail still carries this task's own placeholder: it reopens the task for a replay lap that renumbers (the existing StackReplay path already does this when a retarget is owed) or, when no lap is available, parks the task with a sentence naming the token and the fix
  - |-
    Unit tests cover: the renumbering running on the fetch-failed skip path and on the dirty-worktree skip path; closeout refusing the merge on a placeholder tail and taking the replay lap; the ordinary path unchanged when the rebase runs
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder; no test creates branches or touches GitHub
