objective: When a non-elevated h9k daemon autostart enable is refused because schtasks cannot overwrite an elevated (Highest) logon task, the refusal says why and what to do, instead of only relaying schtasks' bare 'Access is denied'.
criteria:
  - |-
    When `h9k daemon autostart enable` runs `schtasks /Create` and it fails while the existing logon task's run level reads Highest and the shell is not elevated (by the same elevation check the run-level refusal uses), the refusal keeps the schtasks output it relays today and adds one sentence: the existing task runs at Highest, so changing it needs an elevated shell, and `h9k daemon autostart enable --run-level limited` run from an elevated shell lowers it. The existing level is read on this failure path even when `--run-level` was given, because the run-level choice skips that read whenever a level is passed, and `--run-level limited` is the only invocation that reaches schtasks in this state.
  - The condition does not depend on the text of the schtasks error, which Windows localizes. Every other `schtasks /Create` failure (no existing task, an existing task at Limited, an unreadable level, or an elevated shell) keeps its current wording exactly.
  - A unit test drives the failure path through the existing elevation and task-inspector fakes with `--run-level limited` given and the existing task reading Highest, and pins the added sentence; another test shows a failure outside that condition with its wording unchanged. No test needs Windows or touches GitHub.
