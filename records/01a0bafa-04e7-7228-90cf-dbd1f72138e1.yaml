objective: |-
  A task assigned on one node is claimable by every node of the same owner: assignment carries the owner's root fingerprint, and the dispatcher matches on it rather than on the assigning node's local owner record id
criteria:
  - TaskAssigned carries the assigning owner's root fingerprint beside the local owner id (optional field; old streams replay unchanged), and h9k task show and h9k status render the owner by name or fingerprint on every node, never a foreign local Guid
  - DispatchEngine's owner check for a claim compares root fingerprints when the event carries one and falls back to the local id only for events that predate the field, so a task assigned on the Mac is claimed by Windows when its slot is free, and vice versa
  - |-
    Unit tests cover: a replicated assignment from another node of the same owner is claimable; a different owner's assignment is not; an old-shape assignment still works locally; no test creates branches or touches GitHub
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder
