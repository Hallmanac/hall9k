context: |-
  Captured 2026-09-19 14:4x EDT by the Mac project window under the dogfood rule, first two-node day. Evidence: 693ffe5d assigned on the Mac at 14:24 EDT replicated to Windows showing 'Assigned to 01a00d41-5a50-7368-b048-72bcfee948bf' (the Mac's OwnerDetails id); with a free slot for ten minutes the Windows dispatcher logged nothing about it, not even a stays-queued line (Windows project window, mailbox 14:34 and 14:39 EDT). Owner events are OwnerScoped (EventScopeRegistry) and never replicate, so a local owner Guid means nothing on a peer. Same class as PR #491 (cooperative-take grants verify the owner by fingerprint, not a self-declared Guid). Pointers: TaskAssigned event, DispatchEngine's assignment check (about line 951 on main at 2026-09-19), h9k task assign. Workaround used today: unassign on the Mac, assign on Windows. Lineage: a gap in the distributed-team design, not a fix of a fix.
