context: |-
  Hall9k should make small pull requests the pit of success: a draft, a plan, and a build are steered and held so the work arrives as pull requests a human (and an agent) can digest, and a too-large one is split or stopped before it opens, not after.

  This is piece B1 of idea f2e984f0, from section 10 of the idea's discovery report (`ideas/f2e984f0-hall9k-should-make-small-pull-requests-the-pit-of-success-a/workspace/discovery.md` in the project home). Brian said go on 2026-11-12, accepting the report's recommendations: a split starts as a proposal a person accepts (automatic accept is piece B2 and out of scope); a lineage splits once per plan, and a second split parks for a person with the existing Question reason; Refactor and Chore drafts never split. Extending discovery's `TASK:` lines with order and stack hints, and `plan pursue` cutting with them, is piece C and out of scope. The orchestrator recipes in the project home are regenerated separately and are not edited here.

  ## Where things stand at commit ee555e7ae

  - The refinement outcome contract is `REFINEMENT: revised | unchanged | question` (`src/Hall9k.Daemon/Plan/RefinementReport.cs:10`); `RefinementOutcome` (`src/Hall9k.Domain/Features/Tasks/RefinementOutcome.cs`) also has should-not-run, offered only to a feedback step. The reader requires the marker to be the last non-blank line and skips blank lines in its closing run (`RefinementReport.cs:49-73`), while discovery's block ends at a blank line and accepts its lines in any order (`DiscoveryReport.cs:86-120`). Criterion 1 pins the split block's own edges for that reason.
  - `PlanDecider.AfterRefinement` (`src/Hall9k.Domain/Features/Plan/Handlers/PlanDecider.cs:204`) parks a question with `PlanParkReason.Question` (line 209) and maps should-not-run outside a feedback step to Question too (line 216). The engine reads the report and calls it from `src/Hall9k.Daemon/Plan/PlanEngine.cs` (lines 857 and 1060).
  - The discovery reader is `src/Hall9k.Domain/Features/Plan/DiscoveryReport.cs` (in Domain, not Daemon). Its `TASK:` line handling (the marker regex, `CloseWrapper`, `CleanObjective`) is private; share it rather than copy it, so piece C reads both reports' task lines the same way. `RefinementReport` uses daemon-side helpers (`ChallengeReport.ReadTailAsync`, `FenceLine`, `StripVerdictDecoration`), so the Domain split reader uses `DiscoveryReport`'s own tail and fence handling instead.
  - A plan's drafts are called fixed once cut in the `PlanDraftsCut` doc comment (`src/Hall9k.Domain/Features/Plan/Events/PlanDraftsCut.cs:5`), the `PlanStarted` doc comment (`PlanStarted.cs:14`), pursue's printed output (`src/Hall9k.Cli/Commands/PlanPursueCommand.cs:216`) and help (`src/Hall9k.Cli/Infrastructure/CliCommandTree.cs:2435`), `docs/cli.md:534`, `PLAN.md:57`, and `.claude/skills/hall9k-cli-reference/SKILL.md:209`. This task relaxes that for the accept event only. The docs' plan command table is at `docs/cli.md:589-591`.
  - The refinement prompt's split wording is the "State the shape" bullet in the `job` section of `.claude/templates/agent-prompt-builder/plan-refinement.md` (line 118 at this commit). Piece A (57e1af02, which this is stacked on) rewrites that bullet and the `job-judge` section to say a split ends with the question outcome naming the increments. This task switches only the ordinary plan's shape wording to the split outcome; A's `job-judge` wording keeps the question outcome, because that section renders only for `RefinementPurpose.JudgeVerdict` (`src/Hall9k.Daemon/Execution/AgentPromptBuilder.cs:4934-4941`), which only a feedback step reaches (`PlanDecider.cs:300`). The `job` section also renders for a feedback step's first session (`FeedbackRefine`, `PlanAggregate.cs:86`), so its split wording has to depend on whether the plan is a feedback step, for example through a placeholder the builder fills per purpose. No golden renders a feedback-step refinement today. Piece A's own last criterion keeps every closing marker behind a placeholder; keep that true for the split and increment markers too.

  ## Pointers for the build

  - `PlanParkReason` (`src/Hall9k.Domain/Features/Plan/PlanParkReason.cs`) documents that a plan's record holds nothing a session or a draft wrote. So the increments live only in the session's report (`RunPaths.RefinementReportFile`), never in an event, and both `h9k plan show` and the accept read them from the file, the way discovery's gate is shown and pursued. The new reason's way forward mirrors `Question`'s, which routes a person's answer through the journal that the next session honours.
  - A refinement revision passes `MemberTextCopyGuard.Refusal` (`src/Hall9k.Daemon/Plan/PlanEngine.cs:945`) before it is applied. A split applies no revision, so the engine applies the same check to the increment lines where it reads the split at session end, with the member list the job already holds (`job.MemberTasks`), and parks with `RevisionRefused` when it fires. A person's later edit of the report is not checked.
  - The CLI may not reference the daemon project, and `RefinementReport` lives in `Hall9k.Daemon`. The split block reader has to be reachable from the CLI, so it belongs in Domain beside `DiscoveryReport`.
  - `h9k plan pursue` (`src/Hall9k.Cli/Commands/PlanPursueCommand.cs`) is the model for the accept: it re-reads the report at run time, vets each draft's tracker attestation before the cut and takes `--no-existing-item` and `--untracked`, builds each draft with `TaskDecider.Add` (which takes `stackedOnTaskId`, `sourceIdeaId`, and `epicId`), appends to the plan fenced on the stream version, and rings the doorbell. Attestation matters because a plan started on a linked draft records none (`TaskDecider.cs:522-547`, `PlanStartRules.cs:105-111`) and its publish passes only the plan's flags (`PlanEngine.cs:516`). Register the new command beside pursue in `src/Hall9k.Cli/Infrastructure/CliCommandTree.cs`, and classify it Refused in `DispatchedSessionCommandClassification.cs` as pursue is.
  - A local stacked edge whose parent is not in the blocked-by set is refused (`TaskDecider.cs:242-249`), so each increment carries both edges to the one before it.
  - The idea link runs both ways, as `h9k task add --from-idea` does it: the new task's `TaskAdded` names the idea, and the idea records an `IdeaTaskCut`, which is what `h9k idea show` lists. Cutting is refused unless the idea is still Captured (`src/Hall9k.Domain/Features/Idea/IdeaDecider.cs`).
  - A park's way forward is specialized in three places: `PlanShowComposer.cs:267`, the draft park line `PlanParkLine` in `src/Hall9k.Domain/Features/Orchestrator/OrchestratorFeedDescription.cs:380-383`, and the Needs you line in `src/Hall9k.Cli/Commands/StatusCommand.cs:1419-1421`, which today offers only `h9k plan resume` for every draft park.
  - The original draft keeps its existing criteria and edges; its new refinement session revises the criteria to fit the first increment. Tasks that were blocked by the original are not re-pointed at a later increment; a person adjusts them if they need the whole feature.
  - The lineage cap is per plan: the accept event names the original and the new drafts, and the plan's state remembers that each of them has split.
