objective: A plan refinement session can end its report with a split outcome that proposes the draft's increments in order, the plan then parks showing those increments, and one command, h9k plan split accept <plan>, turns them into stacked sibling drafts in the same plan, each refined and challenged on its own.
criteria:
  - |-
    A refinement report whose closing block is a `REFINEMENT: split` line followed by two or more `TASK: <objective>` lines, with no blank line between any of them, reads as a split with those objectives in that order. Each `TASK:` line is read by the same rules a discovery report's `TASK:` lines are read by, so the same list marker, emphasis, backticks, and trailing period are forgiven and a blank objective is refused. A split block with fewer than two `TASK:` lines, a blank objective, a blank line inside it, a `TASK:` line directly above the `REFINEMENT: split` line, or a second `REFINEMENT:` line is unreadable, and so is a `TASK:` line after any other outcome. An unreadable report parks the plan as it does today. A report ending in revised, unchanged, question, or should-not-run reads exactly as it does at commit ee555e7ae.
  - When a readable split ends a refinement session on a draft that is allowed to split, no revision is applied, and the plan parks on that draft with a new park reason. That reason's way forward names `h9k plan split accept <plan>` to cut the increments and, to keep the draft as one task, recording that decision in the draft's journal.md and then running `h9k plan resume`. `h9k plan show` lists that draft's proposed increments in order, read from the session's report when the command runs. `h9k status` lists the plan under Needs you with the new reason, and both its line and the orchestrator feed's park line offer `h9k plan split accept` beside `h9k plan resume`.
  - A split ends in the existing Question park, with no split accept offered, when the draft is typed Refactor or Chore, when the draft was the original or one of the new drafts of a split already accepted in the same plan, or when the plan is a task's feedback step. A split whose increment lines copy another member project's task text, by the same rule a refinement revision is refused under, is not offered as a split, and the plan parks with the existing RevisionRefused reason.
  - After `h9k plan split accept <plan>`, the original draft's objective is the first increment, and every later increment is a new draft in the same project. Each new draft has the original's type and epic, names the original's idea as its source and is recorded on that idea as a task cut from it (as `h9k task add --from-idea` does), and has a context that carries the original's context and names the draft it was split from. The second increment is blocked by and stacked on the original, and each later one is blocked by and stacked on the increment before it. The plan lists the new drafts after the drafts it already carried, in increment order, and the daemon then takes the original and each new draft through refinement and challenge as it does a draft newly cut into a plan, without a restart. The accept vets each new draft's tracker attestation as `h9k plan pursue` vets its drafts, and takes `--no-existing-item` and `--untracked` with the same meaning.
  - |-
    `h9k plan split accept` is refused with the reason and the command to run instead, and records nothing, in each of these cases: the plan is not live; no draft of it is parked on a split; the report no longer reads as a split (so a person's edit to its closing block counts); `--draft <draft>` names a draft that is not parked on a split; more than one draft is parked on a split and `--draft` is not given; the original's idea can no longer have a task cut from it; or a new draft's tracker attestation would be refused at publish. Of two accepts run at once on the same plan, exactly one cuts drafts and the other is refused. The command is refused inside a dispatched session, like every other `h9k plan` command that writes.
  - |-
    The refinement prompt (`.claude/templates/agent-prompt-builder/plan-refinement.md`) tells a session judging the draft's shape in an ordinary plan that, when the draft should split, it ends with the split outcome followed by one increment line per increment, smallest useful one first, says in the report what each increment delivers alone and what it builds on, and writes no revision. For an ordinary plan it no longer says to end with the question outcome for a split or that the session cannot create drafts. A feedback step's prompt offers the split outcome nowhere: the `job` section as rendered for a feedback step and the `job-judge` section still send a split to the question outcome. The ordinary report section's closing-line contract offers split and the feedback-step report section does not. The outcome and increment markers are rendered from placeholders rather than written as literals. The prompt goldens are regenerated, and `dotnet test --filter "FullyQualifiedName~AgentPromptBuilderGoldenTests|FullyQualifiedName~PromptTemplateContractTests"` passes.
  - |-
    `h9k plan split accept --help` carries a description, a `[Description]` on every argument and option, and at least one example. The plan loop's description and the plan command table in `docs/cli.md`, and the plan commands in `.claude/skills/hall9k-cli-reference/SKILL.md`, describe the split outcome, its park, the once-per-lineage limit with the Refactor and Chore exemption, and the accept command. No text in `h9k plan pursue`'s help or printed output, the `PlanStarted` or `PlanDraftsCut` doc comments, `docs/cli.md`, `PLAN.md`, or that skill still says a plan's drafts are fixed once cut.
  - Tests that fail without the change cover the split block reading, the split and Question park decisions, the refusal of a split that copies another member project's task text, a feedback step's rendered refinement prompt offering no split outcome, and an accept that cuts and stacks the drafts. `dotnet test --filter "FullyQualifiedName~RefinementReportTests|FullyQualifiedName~DiscoveryReportTests|FullyQualifiedName~PlanDeciderTests|FullyQualifiedName~PlanSplitAcceptTests"` passes, where `PlanSplitAcceptTests` is the class that covers the accept.
