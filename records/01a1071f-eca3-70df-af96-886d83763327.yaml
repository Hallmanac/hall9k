objective: A dispatch prompt or park line names a mention as aimed at this owner only when the mention tagged this install's login
criteria:
  - When an ordinary pr-review dispatch carries a mention (the minting row or task.LatestMention*), RunLauncher (about lines 771 to 786) appends BuildMintAddendum only when MentionFollowUpGate.Decide, given this install's gh login (read with the existing ReadOwnLoginWithRetryAsync), the comment's author, and the comment's body, proceeds. A comment that tags another login, or a login that cannot be read, dispatches the review without the addendum and logs why; the recorded tagged login is never trusted in place of the body match.
  - A review dispatched without the addendum parks with a needs-you line that names no mention. The mention follow-up park wording (PrReviewEngine.cs, about line 1185) is unchanged, because its launch is already gated.
  - |-
    A test (the existing Postgres fixture in AutoPrReviewMentionEngineTests with its faked process runner, or a pure function extracted for the decision; no branch, git, or GitHub) covers, for an install logged in as brian: a comment by ryan tagging @taylor with no tagged login recorded adds no addendum; a comment tagging @Brian in different letter case adds it; an unreadable login adds none and the review still dispatches.
  - The existing tests for each touched path still pass unchanged.
