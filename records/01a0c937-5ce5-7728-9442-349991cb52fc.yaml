objective: |-
  A dispatched session cannot drive the project's lifecycle: the h9k binary refuses lifecycle verbs (task abandon, publish, assign, retry, resolve, conclude, archive, idea conclude and archive, and their like) when it runs inside a run's worktree, printing the run it is inside and that the orchestrator or a person owns that call, so a build session can no longer abandon a task or conclude an idea on its own
criteria:
  - |-
    Every headless agent the platform spawns carries HALL9K_DISPATCHED_RUN_ID holding its run id, set once at the spawn site: in ClaudeExecutor.SpawnAsync for every daemon dispatch (build, fix, review, verify, final pass, recovery, courier, and any other AgentSpawnRequest), and in HeadlessLaunch.SpawnDetached for both of its callers (h9k task start's agent and h9k task delegate's contractor). An operator's attended session (h9k task work, a pasted prompt, --direct-launch) does not carry it. A unit test over the spawn request (ProcessSpawnRequest.Environment, which both process managers copy verbatim) proves the variable equals the run id
  - |-
    With HALL9K_DISPATCHED_RUN_ID present, one interceptor at the CLI entry (Spectre SetInterceptor, classifying by settings type, reading the environment through an injected reader) refuses, before anything reaches the store, every verb that changes the state of a task, idea, epic, run, decision, project, node, owner, connection, config, daemon, orchestrator, or install other than the calling run's own reporting: the task verbs abandon, publish, assign, unassign, set-pre-approved, retry, resolve, draft, start, work, link-issue, revise, take, grant, refuse, handoff, delegate, set-session-cap, set-review-caps, scope, share, set-private, link-jira, push-to-jira, pull; the idea verbs conclude, archive, promote, assign, revise, scope, share, set-private; epic add, close, link-jira; run kill; decide supersede and decide import; review resolve, proceed, fixed; pr review, approve, request-changes, resolve, reply; message send and handle; every project, owner, node, connection, config, daemon, install, uninstall, update, and orchestrator verb except orchestrator feed. The refusal names the verb, the run, and the task, says the orchestrator or a person owns this call and that the session states the need in its closing summary instead of retrying, and exits with ExitCodes.BusinessRule; --help on a refused verb still renders. Read-only verbs (show, list, status, logs, decide list and show, learn list and show, messages, doctor) and the verbs a dispatched session legitimately uses (learn record, retire, distill; decide record with its existing attendance refusal; task register-session, verify, deliver, handback, release, log-interaction, write-jira, run-local; pr reply-guard; orchestrator feed; idea add) are untouched. A test walks CliCommandTree the way CommandTreeHelpTests does and fails on any command not classified read-only, allowed, or refused, so the list cannot rot
  - No prompt template, skill, or generated AGENTS.md line addressed to a dispatched session names a refused verb; .claude/templates/work-prompt-builder/build.md (its correction line, near line 58) says a session reports a correction in its closing summary and a human supersedes the decision; the orchestrator-recipe-generator skill's task-refinement text and conformance-review.md each carry one sentence that an acceptance criterion never instructs a session to drive another task's or idea's lifecycle and that such a criterion is the orchestrator's act at closeout rather than an unmet criterion, citing decision 13f11af2
  - |-
    Unit tests through the injected environment reader, never the process environment: one refused verb with the variable set (exit code 70, nothing appended to any stream), the same verb without it, one allowed verb with it, and --help on a refused verb with it; the spawn-request test from criterion 1; the tree-classification test from criterion 2. No git or daemon integration test; dotnet build and dotnet test pass
