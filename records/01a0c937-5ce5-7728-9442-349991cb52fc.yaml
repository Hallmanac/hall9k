context: |-
  Evidence, 2026-09-22 04:07 EDT on the Windows node (ef6ab27d): task 5dd55a3a's build session (its first run ce293c59, dispatched 03:43, which later failed its host gate and was superseded) ran h9k task abandon 7af7204a with the reason 'Superseded by task 5dd55a3a (idea d805fd8b, piece 4)' and h9k idea conclude 2fa45efc, both from the worktree's own binary. Both records replicated to the Mac and stand on both nodes. Both outcomes matched what Brian would have chosen, and 5dd55a3a's second acceptance criterion read 'Task 7af7204a is abandoned and idea 2fa45efc concluded, each with a reason naming this task', so the session did as written. The defect is two-sided: the binary hands a dispatched session every verb the owner holds, and the walk wrote a criterion telling it to use them. The rule half is recorded as decision 13f11af2 (Brian, 2026-09-22 at this walk; h9k decide show 13f11af2): an acceptance criterion never instructs a session to drive another task's or idea's lifecycle; that is the orchestrator's act at closeout. This task is the door half.

  Verified by a challenge session on 2026-09-22 against main 6df5d3d6e. Discriminator: a new daemon-stamped variable is the smallest and safest signal. HALL9K_DETACHED_SESSION is stamped only by HeadlessLaunch.SpawnDetached and never by ClaudeExecutor, so the origin session carried nothing. RecordingProvenanceReader.Classify needs the task and run in hand, and h9k task abandon 7af7204a names somebody else's task; decision 264 already rejected CLAUDE_PID on Windows (the recorded pid is cmd.exe's). The working directory cannot serve: an operator's h9k task work claim cuts the identical wt-<task>-<run> layout and legitimately holds every verb inside it, Brian inspects worktrees by hand, cd defeats it, and the courier runs in RunPaths.GlobalDirectory. Decision 264's inherited-variable leak runs the other way (an attended session's variable flowing into a contractor); this variable flows only from the daemon into the agent and its Bash children, and nothing attended descends from an h9kd child. Stamp it once in ClaudeExecutor.SpawnAsync, not in the eighteen AgentSpawnRequest builders, and once in SpawnDetached. Name it HALL9K_DISPATCHED_RUN_ID, distinct from HALL9K_INTERACTIVE_RUN_ID whose semantics decision 264 pins. On Windows the daemon sets it on cmd.exe's start block, /c passes the block to claude.exe, and the Bash tool's shell receives it like any child; HALL9K_DETACHED_SESSION already rides that shim.

  Seat and shape: no Spectre interceptor exists today; add one config.SetInterceptor classifying by settings type; --help is resolved before any interceptor so it keeps working. Exit code ExitCodes.BusinessRule (70) via an exception Program already maps; the reply guard's 2 is hook protocol, not this. Read the environment through an injected Func<string, string?> as ProjectGitHubClient does, so no test mutates the process environment shared across parallel test classes. decide supersede matters most: DecisionDecider.Supersede has no attendance gate and build.md tells every session it is the correction verb, so a session can end a binding decision today; that line changes to report-and-a-human-supersedes, the self-correct shape decision 264 gave decide record.

  The opposite failure: no template tells a dispatched session to run anything on the refused list, the closeout is daemon code with no CLI, and the recovery session runs no h9k verb, so nothing legitimate is blocked. A refusal mid-task (a criterion like 5dd55a3a's) exits non-zero, the session continues, the criterion stays unmet, the conformance reviewer reports it, and a fix session hits the same wall, so one to three wasted laps and a park rather than a gate failure or a loop; the refusal text and the conformance-review sentence are what stop the laps. Honest caveat: the guard lives in the binary, and a worktree built from a branch cut before this merges has no guard. The refinement recipe itself lives in the project home (recipes/task-refinement.md), hand-edited; the build session edits the generator skill's text in repo/dev/skills and the orchestrator folds the sentence into the live recipe by hand at closeout. Not a whack-a-mole: this is the first draft on this lineage.
