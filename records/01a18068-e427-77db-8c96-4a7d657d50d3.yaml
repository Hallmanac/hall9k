objective: Remove the hidden h9k task work alias, so h9k task drive is the only spelling of the verb.
criteria:
  - |-
    `h9k task work` is no longer registered: `h9k task work 28b19893` exits 64 and prints `Unknown command 'work'.`, exactly as any unknown task verb does, and a test proves this through the shipped command tree.
  - |-
    `TaskWorkAliasCommand`, its stderr notice, and the tests that exist only for the alias are gone, and `TaskDriveCommand` is sealed again like its sibling commands.
  - |-
    The proofs the alias's test file holds for `drive` survive: tests still show that `h9k task drive` binds `TaskDriveCommand.Settings`, that `h9k task --help` lists `drive`, and that a dispatched session is refused `h9k task drive` with the run id in the message. `TaskDriveCommand.Settings` stays `Refused` in `DispatchedSessionCommandClassification`, and the drive tests outside the alias's test file are unchanged and pass.
  - |-
    `git grep -l -P "task work\b"` on the branch finds exactly two historical files, `backlog/52-hall9k-cutover.md` and `src/Hall9k.Domain/Features/Decision/Legacy/v0-decisions-log.md`; the PR lists the result.
