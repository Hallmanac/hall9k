context: |-
  Progressive automation: a user drives a task's lifecycle phase by phase from manual to full auto through h9k task drive (renamed from h9k task work), with a task-scoped session, a deterministic h9k task next, skip to PR as a recorded manual override, analysis-only closeout while a human drives, iterating on a task already at the PR stage, and a per-task record of which phases ran by hand. Seven cards, 0 to 6.

  The alias was added by PR #773; read that diff first. It is three pieces: the registration at `src/Hall9k.Cli/Infrastructure/CliCommandTree.cs:1955`, `src/Hall9k.Cli/Commands/TaskWorkAliasCommand.cs`, and the alias cases in `tests/Hall9k.Tests/Cli/TaskWorkAliasCommandTests.cs`. There is no alias-specific refusal: the row at `DispatchedSessionCommandClassification.cs:115` is shared with drive and stays. `DispatchedSessionTreeTests` only checks that a row exists, so the `drive` row of `A_dispatched_session_is_refused_either_name_the_same_way` is the only proof that drive is refused; keep it, in a file named for drive. Three live mentions still need fixing: `.claude/skills/hall9k-cli-reference/SKILL.md:63`, `docs/scope.md:174`, and `src/Hall9k.Domain/Features/Tasks/Queries/TaskPassageQuery.Classification.cs:23`. The `work` prompt-builder key (`PromptBuilderKey.Work` and its mentions in the docs and the skill) is a stored key rather than this verb and stays, as do test names such as `_by_task_work`.

