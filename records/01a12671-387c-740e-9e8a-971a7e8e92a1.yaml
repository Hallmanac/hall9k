objective: A dispatched session that needs a server running for a measurement or a browser check is told the one supported way to start and stop it, and never to stop a process by name, pattern, or port
criteria:
  - |-
    The foreground-gates rule (`.claude/templates/work-prompt-builder/foreground-gates.md`, rendered by WorkPromptBuilder.AppendForegroundGatesRule, in both its session-runs-gates and session-does-not-run-gates variants) keeps its ban on starting a build or test gate with the harness's background tools, and gains one carve-out for a helper process the session itself needs, such as a dev server for a measurement or a browser check: start it with Bash `run_in_background` as the plain server command (no `nohup`, no `( … & )` subshell, no trailing `&`, no `setsid`, no `disown`), and stop it before the final message with `TaskStop`, by the id `run_in_background` returned, loading `TaskStop` through `ToolSearch` first if it is not already in the tool list.
  - The same rule says never to stop any process by name, pattern, or port, with cross-platform examples (pkill, killall, `pgrep … | xargs kill`, `kill $(lsof -t …)`, `taskkill /IM`, `Stop-Process -Name`), and never to send a kill or cleanup command's stderr to /dev/null.
  - |-
    No prompt tells a session to start a server detached or to kill its process tree by hand: the design review's driving mechanics (`.claude/templates/design-review-prompt-builder/drive.md`, driven-mechanics) and the QA review's tear-down line (`.claude/templates/qa-review-prompt-builder/checks.md`) both point at the carve-out's start-and-stop route instead, and drive.md keeps its ephemeral-port, report-the-port, and if-it-will-not-come-up rules.
  - Golden files are regenerated, and a test asserts that every leg rendering either variant of the foreground-gates rule, and the driven design review prompt, contains the carve-out's start and stop instructions and the never-by-name line.
