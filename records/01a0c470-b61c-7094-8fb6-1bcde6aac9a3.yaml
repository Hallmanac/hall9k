objective: A newcomer who registers a project whose ledger already has an owner is told so and asked for their invite token instead of being minted as a second owner root, so the first thing a teammate sees is the door into the team rather than a private copy of the project
criteria:
  - |-
    ProjectJoinCommand on the no --owner path, when this install has no root claim of its own and the target ledger already holds genesis members under another root, writes nothing: no root.yaml, no node.yaml, no OwnerRootClaimed event. It prints one sentence naming the project existing owner (login when the members chain knows it, else the root fingerprint) and that joining needs an invite from them
  - When stdin is a terminal the same command then asks for the invite token on the spot; a pasted token runs the existing --invite path in that same invocation and reports as h9k project join --invite does today; pressing Enter skips and prints the exact command to run later, h9k project join <project> --invite <token>. When stdin is not a terminal (an agent, a script, a daemon) it never prompts, prints the same instruction, and exits successfully with the registration kept
  - h9k project add accepts --invite <token> and passes it to its join, so one command registers and joins; with or without it, a registered project that is not yet joined reads not joined, invite needed on h9k project show and on the h9k status project line until the vouch lands, and the daemon skips that project sweep quietly rather than warning every tick
  - The first owner of an empty ledger still establishes their own root exactly as today; a re-run by an owner who already claims a root is unchanged; a second root an earlier build already minted for a newcomer is retired by their invite join as today, and the Decisions Log entry names that as the repair path for anyone who joined before this shipped
  - |-
    The help text of h9k project add and h9k project join describes the flow in the order a newcomer meets it: register, be told the owner, paste the invite, wait a minute for the vouch; one Decisions Log entry under this task placeholder records the rule that a join never mints a root on a ledger that already has genesis
  - |-
    Tests on the fake ledger the join tests already use: existing genesis and no local claim writes nothing and names the owner; a terminal with a token runs the invite path; a terminal with Enter prints the command; a non-terminal prints the command without prompting; an empty ledger establishes the root; project add --invite passes the token through. No test touches a repository or remote. dotnet build and dotnet test pass
