context: |-
  Origin: Brian, 2026-09-21 late morning, Windows project window, while walking through what a teammate experiences setting up hall9k on the arx-platform repo this week. Today: h9k project add runs ProjectJoinCommand with no --owner (ProjectAddCommand.cs TryJoinAsync about lines 294 to 323); on an install that has never claimed a root, claimedFingerprint falls back to this node own key (ProjectJoinCommand.cs about lines 297 to 308), establishingRoot is true, and the join writes owners/<their-fp>/root.yaml and nodes/<id>/node.yaml onto a ledger that already carries the real owner root and genesis members; the genesis members write is the only thing that backs off (HasAnyAsync members/, about lines 628 to 640, a silent early exit). The screen then says Joined, this is this owner root (Report, about lines 445 to 450). Nothing names the existing owner, nothing mentions an invite, and the newcomer proceeds as a solo owner on the shared repo: publishes file GitHub issues and runs open pull requests under their login, while every message they send is dropped by the team as SenderNotVouched. The invite flow that already exists: h9k project invite <project> (ProjectInviteCommand.cs about line 107) or h9k node invite mints a secret; h9k project join <project> --invite <secret> writes the HMAC proof into node.yaml (about lines 245 to 295 and 733), retires a previously self-created root (316 to 333, 480 to 533), and the minting owner daemon vouches on its next sweep (InviteSweepEngine.cs 384 to 461 and 519 to 529) and writes members with role member (570 to 574). Brian wants the encounter with an existing owner to become the prompt: say there is already an owner, ask for the invite token right there when a human is at the keyboard, otherwise print the exact command. Existing owner identity for the message: the members chain (GitLedgerChainReader.ComputeMembersAsync, ProjectMembersCommand.cs shows how login and role are rendered). Related, out of scope here: the automatic bootstrap keys on no local history at all (MessageSweepEngine HasAnyLocalHistoryAsync), so a newcomer who drafted one task before the invite never bootstraps; follow-up once 74a7cd0b and 252bc5cf deliver. Writing conventions: no em dashes, full sentences. Testing rule (Brian, 2026-09-13): no test touches a repository or remote; use the fake ledger the join and chain tests already use.
