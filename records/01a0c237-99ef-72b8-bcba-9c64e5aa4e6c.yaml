objective: |-
  WindowsStopRequestWatcherTests no longer fails intermittently on the windows-latest CI leg: each test waits for the watcher's own signal that it has polled the stop-request file instead of a fixed 600 ms delay, so a loaded runner cannot make a green main look red
criteria:
  - |-
    RunBrieflyAsync in tests/Hall9k.Tests/Daemon/WindowsStopRequestWatcherTests.cs no longer waits a fixed 600 ms: each of the three watcher-loop tests waits, with an async poll (await Task.Delay, never a blocking spin), for the outcome it asserts on before stopping the watcher (for the two ignored-and-cleared cases, the stop-request file and its .claimed sibling both gone from disk; for the honored case, the fake lifetime's StopRequested true), and the assertions themselves are unchanged. One CancellationTokenSource, widened from 5 s to 30 s, bounds both StartAsync and the wait (the watcher links it into its own stopping token); a wait that reaches the bound fails the test with a message naming what never happened and the bound, rather than passing, hanging, or surfacing a bare cancellation
  - |-
    The test file is the only file touched: src/Hall9k.Daemon/WindowsStopRequestWatcher.cs and every other production file are unchanged, the two synchronous IsOwnStopRequest tests in the class are unchanged, no OS skip and no collection attribute is added, and the flake is never reproduced by loading a host; the evidence is the two saved CI job logs in this task's workspace/ (ci-run-35559561420-attempt1-job-106209688379-windows.log and ci-run-35559561420-attempt2-job-106211236766-windows.log) and the reading of the watcher loop in the context
