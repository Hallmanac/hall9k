context: |-
  Observed on main run 35559561420 (commit ee3081a9f, the #531 merge), captured by the project orchestrator hall9k-f9 on 2026-09-21 00:1x EDT. Attempt 1 (job 106209688379) failed A_stop_request_naming_a_different_pid_is_ignored_and_cleared with 'Expected File.Exists(DaemonRuntime.StopRequestFile) to be False because the stale file is cleared here ... but found True' after 11 s. Attempt 2 (job 106211236766, a re-run of the failed job) passed that test and failed its sibling A_stop_request_naming_this_process_is_honored with 'Expected lifetime.StopRequested to be True, but found False' after 2 s, alongside the known ProcessManagerParityTests flake (task 2383aa79) in the same attempt. The true logs of both attempts are saved in this task's workspace/ (gh run view --job resolves both ids to the all-green attempt 3; use the saved files). The watcher is registered only on Windows (Program.cs); the tests have no OS gate, run on both legs, and have only ever failed on windows-latest. Ubuntu passed all five at about 613 ms in the same run.

  Diagnosis (orchestrator reading of main, verified by a challenge session on 2026-09-22): the class's RunBrieflyAsync starts the watcher, waits a fixed Task.Delay of 600 ms, then stops it. The watcher's ExecuteAsync is a do-while that polls once synchronously inside StartAsync (BackgroundService calls ExecuteAsync on the caller's thread) and then every 250 ms on a PeriodicTimer. So the first poll always happens before the delay begins, and the race only bites when that first poll fails transiently and no retry completes before StopAsync cancels the loop. The likely transient is inferred, not observed (the move's catch is silent and the tests use NullLogger): IsOwnStopRequest claims the request by File.Move and swallows an IOException from a sharing violation (a scanner or indexer holding the just-written file open, common on windows-latest), returning false for the next tick to retry. In attempt 1 the file was still at the request path at assertion time, so the move itself never succeeded during the loop's life. Both logs show heavy concurrent load at the failure (dotnet publish tests at 12 to 17 s, GitLedger tests at 14 to 15 s), and every watcher-loop test ran seconds longer than its 600 ms delay. The mechanism of that load is test-only: the watcher's awaits carry no ConfigureAwait(false) and StartAsync is called from inside the test, so every tick continuation posts onto xUnit's concurrency-capped synchronization context and competes for the same worker slots as every other test, including those blocking on child processes; the production host has no synchronization context. The path plumbing is not the cause: PlatformPaths.Home honors the AsyncLocal override ScopedTestHome opens in the field initializer, and it flows into the watcher's synchronous first poll and every timer continuation; a plumbing fault would fail deterministically and on ubuntu too. xUnit runs a class's tests sequentially on fresh instances with fresh Guid-named homes, so no sibling leaves a .claimed file behind; the start time round-trips exactly through JSON on both sides.

  Fix shape, ruled by Brian 2026-09-22: observe the outcome the test already asserts on, with an async bounded wait, the way 43cf3ed7 did for the shutdown-mid-gate test; do not add a per-poll signal to the production watcher. For the ignored cases wait until both the request file and its .claimed sibling (the request path plus '.claimed') are gone: 'request file gone' proves only the claim, and when the read after the claim fails the watcher leaves the claimed copy and decides on the next tick, so a wait on the request file alone can stop the watcher before any decision and pass both assertions vacuously. The decision follows the claimed copy's deletion with no further I/O, and StopAsync waits the in-progress poll out before the assertions run. The bound: the existing 5 s token is linked by BackgroundService into the watcher's stopping token, so it kills the loop too; widen that one token to 30 s and share it between StartAsync and the wait. The outcome wait returns the moment the outcome lands, faster than today's 600 ms in the common case, so the wide bound costs nothing on the pass path. Helper shape is the build session's call; one helper replacing RunBrieflyAsync that takes the outcome predicate and the failure words is the obvious one. Never reproduce the flake by loading a host (memory: never stress the host to chase a flake). No git integration or host-load test; the proof is the reasoning above, the saved logs, and a green windows-latest leg.
