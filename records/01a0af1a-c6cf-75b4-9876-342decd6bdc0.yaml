context: |-
  Hall9k for a distributed team: nodes and projects talk to each other through a per-project relay now and a peer-to-peer network later. The immediate driver is the ARX platform's .NET Core migration, a strangler-fig port one MVC route, controller, or action at a time, where QA runs ahead of engineering writing baseline end-to-end tests per route and then validates each port before and after; QA needs Hall9k on their machines, and the coordination has to run through Hall9k rather than around it. Today two nodes talk through comments on a private GitHub issue, which works for one person and not for a team. Short term: a relay server anyone can stand up per project (and a node can stand one up for its own shared work) that carries the messages and shared state a team needs; long term: those relays become part of a broader peer-to-peer network so a new node or project joins and benefits without infrastructure. Design the relay so the peer-to-peer layer replaces the transport, not the boundary. This umbrella consolidates the tracker-as-substrate MVP (64c75e43, largely shipped: claim gate, take in tracker, issue carries the task record), the node mailbox prototype and its open questions (notes/node-mailbox.md), the container node with peer-managed nodes (efe71721), the QA-in-the-loop ideas (4e670c74, 21ddf2b3), and the backlog documents backlog/p2p/PLAN-additions.md, backlog/p2p/P2P-KICKOFF-PROMPT.md, backlog/IDEA-p2p-lazy-sync.md, and backlog/IDEA-per-project-store.md with 64e4ebd2's database-as-room model.

  Idea 202383dc (Hall9k for a distributed team). Cut 2026-09-17 morning on Brian's ruling in the hall9k-b9 window after the replication (c8dd149c) dispute of 2026-09-17 03:1x exposed that a project's id is per install and that the receiver mapped a sender's project to its own only through the ledger it read from. Verified on the c8dd149c worktree: MessageEnvelopeV1.ProjectKey is documented as the project's ledger-derived key and is stamped at flush from TrustChain.GenesisRootFingerprint, which is the fingerprint named by the first commit of refs/hall9k/ledger/members, an owner's key, so two projects with one genesis owner share it (hall9k and odonomics on this machine do); no receiver reads ProjectKey today (MessageInbox and the Replication connectors do not reference it). The rewrite-on-apply rule ruled 2026-09-17 03:1x stays and keys on this id instead of the ledger. Stacked on c8dd149c so it inherits the events envelope; catch-up 9408d525 is re-stacked onto this task so its events-request envelope carries the key from the start. Testing rule (Brian, 2026-09-13): no test touches the project's repository or any remote; a throwaway temp bare repository is allowed only in A1's tests and the chain reader's; everything else tests through the transport seam with an in-memory fake.

