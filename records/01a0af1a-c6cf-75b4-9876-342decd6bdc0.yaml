objective: |-
  A project's key is a generated id minted once at genesis, never the genesis owner's fingerprint: every install records it on its local project, every message and replication envelope and every replicated event carries it, and a receiver resolves its local project by that key and refuses what does not match, so a project's identity no longer depends on which ledger a message arrived through
criteria:
  - Writing a project's genesis members commit generates a fresh ULID with the Ulid NuGet package (Cysharp's, chosen by Brian 2026-09-17 for speed; the codebase's other ids stay DomainId UUIDv7) and records its 26-character string in that commit as the project key; the trust chain exposes it as ProjectKey, and the genesis owner's root fingerprint is no longer used as a project key anywhere (GenesisRootFingerprint stays an owner fact)
  - |-
    Every install records the key on its local project: creating genesis or joining by invite appends a node-part ProjectKeyAssigned event to the local Project stream (never travels), and h9k project show prints the key; a ledger whose genesis predates this piece gets its key from a one-time signed commit by the genesis owner (h9k project assign-key, refused for anyone else), and the genesis guard's documented adoption procedure gains that step before the first invite
  - |-
    Every envelope carries the key: MessageEnvelopeV1.ProjectKey holds the generated key; the events envelope and the events-request envelope carry it; a replicated event's origin headers carry it beside owner root, node, event id, and sequence
  - |-
    Receivers resolve by the key, not by the ledger: the message inbox and the replication inbox look up the local project by the key on the envelope, the apply-time rewrite of a replicated event's project coordinate keys on it, and an envelope whose key does not match the project whose ledger it arrived through is refused and named in h9k status
  - |-
    Compatibility under the switch-on checkpoint: an envelope written before this piece (null key, or an owner-fingerprint key) is still read, never refused as malformed; no production deployment predates this task
  - |-
    Tests through the seam with the in-memory transport and a fake ledger: genesis mints and exposes the key; a join records it; each envelope kind carries it; a mismatched key is refused and named; a legacy envelope is read; two stores registered under different local project ids exchange a task's events and resolve by key to their own project
  - |-
    dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each, the log recording Brian's ruling of 2026-09-17: the project key is a generated id so the transport can change, not the owner fingerprint
