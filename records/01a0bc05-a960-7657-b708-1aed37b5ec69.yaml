objective: The daemon keeps, per project on this node, an orchestrator feed of the events an orchestrator would want to know, filtered by a project setting, and h9k orchestrator feed reads and drains it, replacing the log tally an orchestrator window parses today
criteria:
  - |-
    The feed is a per-project cursor over this node's own event stream plus an interest filter, never a second store: an item is an event past the cursor that the filter admits; reading it is one query and nothing is buffered elsewhere
  - |-
    h9k project set <name> --orchestrator-feed actionable|transitions|everything (default transitions) picks the level: actionable is parks and disputes, gate and run failures, a merge that stays failed, daemon trouble, and any message from a person or another node's window; transitions adds task state changes (published, working, delivered, done, failed, abandoned), ideas logged or updated, and claims or takeovers involving another node; everything adds run phase changes; docs/concepts.md says what each level carries
  - h9k orchestrator feed --project <name> prints the undrained items oldest first, grouped by task, each as the one-line plain description h9k status already uses for that event, never a bare id; --drain advances the cursor after printing; --since <time> reads history without moving the cursor; the orchestrator recipe's start-up step runs the drain in place of the log tally
  - The filter is one deterministic table from event type to level; a message from a person is admitted at every level; nothing in the feed depends on a model
  - Unit tests cover cursor advance and idempotent re-reads, each level's membership, the person-message rule, and the grouped output as a golden; no test creates branches or touches GitHub
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder
