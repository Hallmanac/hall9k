context: |-
  The platform owns the orchestrator's watching: a lesser-model watcher session that polls the daemon (transport messages, actionable log lines, parks) and forwards only actionable items to the orchestrator window, spawned from the orchestrator recipe; longer term the daemon itself notifies or kicks off an agent when something actionable lands, so no window polls. Brian, 2026-09-19: no machine-level background tasks (memory limits differ per machine); something agentic that is looking for work, on a cheap model, with the high-end orchestrator deciding. First hand-written form: recipes/watcher.md in the hall9k project home; the recipe generator should emit it.

  Piece 2 of 3 of idea 89471598 (the orchestrator feed and courier), walked with Brian 2026-09-19 19:3x EDT; his call: ship all three levels. Why a projection, not a buffer: every item is already an event in the store, so a cursor plus filter keeps one truth and costs one query per sweep (tools before tokens). Consumers: piece 3 (the courier, stacked on this) spawns only when the feed has items and an orchestrator is live (piece 1, 579dcd44) and drains through this command; the orchestrator recipe's start-up step drains it to learn what happened while no window was live, which replaces notes/waiters/sweep.sh's log tally and most of the journal's re-orientation. Wording: reuse the descriptions AttentionComposer and PublishedFacts already render for h9k status. Pointers: EventReplicationInboxCursor (the cursor shape to mirror), EventScopeRegistry (event types), ProjectSettingsChanged (the setting is NodeScoped like the other project settings), the h9k orchestrator command group. Name: feed, not outbox (the ledger message outbox owns that word). Siblings: piece 1 presence (579dcd44, independent), piece 3 courier (stacked on this, blocked by presence). Placement: Mac, after the fingerprint pair lands.

