objective: |-
  An owner can place a task on one of their own nodes: h9k task assign --node <node> records the placement, only that node's dispatcher claims it, and every other node of the same owner stands down without a forced take
criteria:
  - h9k task assign <id> --node <node-id or unambiguous fragment> records a node placement on the task (a project-scoped event that replicates), refuses a node not vouched into the owner's fleet for that project, and h9k task show and h9k status name the placed node
  - DispatchEngine on any node of the same owner declines to claim a task placed on another node, logging the reason once per sweep at debug level, and claims it when the placement names this node; a task with no placement behaves exactly as today (first free dispatcher of the owner claims)
  - h9k task assign <id> --node with no node named clears the placement; a forced or cooperative take that moves the task to another node records that node as the new placement so the old node stands down after a takeover without a second command
  - |-
    Unit tests cover: a placed task is skipped by a non-placed node and claimed by the placed node; an unplaced task is unchanged; the refusal for an unknown node; a takeover rewrites the placement; no test creates branches or touches GitHub
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder; docs/concepts.md says how placement, ownership, and takeover relate
