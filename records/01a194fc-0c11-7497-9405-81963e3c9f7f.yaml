context: |-
  Shape: one of four tasks in epic 5e451233, section A1 of the brief, its own pull request. No dependencies and no stacking: A2 is independent of it, and B1 is blocked by it, not stacked, because they touch different code. That is already ruled.

  Why and what was decided: `ideas/13403621-named-agent-files-claude-code-s-claude-agents-as-a-bridge-be/workspace/plan-work-brief.md`, section A1. The proven verdict shape, with a probe: `notes/challenge-826bbde3/journal.md`. Both are in the project home. Refinement's reasoning is `notes/refine-3e3c9f7f/journal.md`.

  The request and the session. Copy `CardPublicationEngine`: a request event on a Draft, a daemon sweep, `ProjectCheckout.ForReading` plus `RefreshReadingCheckoutAsync`, the dispatch event saved under a fence before the spawn, `RunPaths.GlobalDirectory(sessionId)`, `TaskId` and `SessionName` on the spawn request. Give it its own sweep loop so a long challenge never holds up a card. Unlike that engine, the request event is NodeScoped in `EventScopeRegistry`, like `WorkItemPublicationSessionStarted`, and names no node. The dispatch event is ProjectScoped and names the node. Take recovery from `CloseoutTriageSessions` rather than the publication adoption path: a dispatch on the stream with nothing running is failed, never re-dispatched. Recovery acts on this node's own dispatches; another node's is failed past `ForeignPublicationCeiling`, as `ExpireForeignAsync` does.

  Permissions. Pass `project.SkipPermissions` and use `ClaudeSettingsFile.Build`, as publication does. That is the skip-permissions path. Without skip-permissions pass `UsesReviewPermissions: true` and `AssessmentFile` with the report's path, and add an optional parameter to `BuildForPrReview` for extra read roots: the idea workspace and the task directory. Change that builder's two write rules (`ClaudeSettingsFile.cs:451`, `:459`) from `Write(` to `Edit(`, with their tests: Claude Code 2.1.316 refuses the Write tool under a `Write(...)` allow rule and allows it under `Edit(...)`. Once e8fc520c lands this path has no git, so the prompt asks for none there. On the skip-permissions path `BuildForPrReview` cannot serve: it allows only git reads and denies `Bash(claude:*)`, so no probe could run. A deny list would not hold either, since `--dangerously-skip-permissions` voids the permission engine (`ClaudeSettingsFile.cs:123`). The line is held by `DispatchedSessionInterceptor`, which `ClaudeExecutor` already arms on every spawn. Classify the new verb as Refused in `DispatchedSessionCommandClassification`.

  The report. The contract is a closing block in the report file, read with the bounded read of `CloseoutTriageSessions.ReadReportAsync` and `ReviewResultParser.LastMarkerValue`, one line per item: `VERDICT: <verdict>`, then `CHANGE: <must|should|park> - <what> - <evidence>`. Prose above the block is free. The prompt asks for it and for an exact proposed criteria set where they change. Normalise before matching: strip emphasis and a trailing period and compare case-insensitively, since `LastMarkerValue` matches only a line that starts with the marker. Split a change line on its first two ` - ` separators. The prompt says a condition, or a question only a person can settle, is a must line and never text on the verdict line.

  The prompt. Add `AgentPromptBuilder.BuildChallenge` over a template in `.claude/templates`, pinned as a golden. Take the content from the hand-offs under `notes/challenge-*`: treat the refinement's reasoning as a claim to test; check each criterion is checkable by someone who did not write it; check no criterion drives another item's lifecycle (decision 13f11af2); do not reopen a recorded ruling or the shape. Tell it that security detail stays in the report file and out of task text, and name no other project. Include the project's writing conventions. Frame an adopted draft's text as the build prompt does, with its data-only rule (`WorkPromptBuilder.cs:564`, gated as at `AgentPromptBuilder.cs:2973`). Name the project home, since the draft's pointers are relative to it. Pass the commit and `CheckoutRefresh.Detail` into the prompt. Tell the session not to fetch, because the daemon just did. The cheap-tier model comes from `ResolveCourierModel`, substituted into the prompt, so no probe model is compiled in.

  The gate. Add parameters to `TaskDecider.Publish` that default to not required, so the other doors (`PullRequestReviewCommand.cs:806`, `AutoPrReviewEngine.cs:1364` and `:2669`) and the tests stay as they are, and only `TaskPublishCommand` passes the project's setting. The reason goes on `TaskPublished`, clamped when the gate did not ask, as `noExistingItemRecorded` is. The gate also reads whether a revision landed after the latest verdict, the same fact `h9k task show` prints. Eight test files publish through the command and will need the setting or the flag.

  The model. Add `AgentRole.Challenge`, `ResolveChallengeModel`, `ResolveChallengeEffort`, and `AgentModel.ChallengeDefault` with the value `claude-opus-5-5[1m]`. Follow `ResolveCourierModel`: project, then role, then the compiled floor, with no task link and no `DefaultModel`. Effort follows the same chain with a floor of high, skipping the node-wide value. The `RoleModelDefaults` field ships blank, as `ModelPolicyTests` asserts. The Refinement role is deliberately not reused: it falls through to the node default, so the rule would not hold on a node with a cheaper one, and B1 needs that knob for refinement itself.

  The record. New events go in `EventScopeRegistry` as ProjectScoped and in `TaskActClassificationRegistry`. The dispatch and the recorded outcome are Conditional, and both need a place in `PreAssignmentCapableConditionalTypes` in `EventReplicationInbox`, because a draft is usually unassigned and a member's verdict on their own draft would otherwise be held. Add the feed entry to `OrchestratorFeedInterest` at Transitions, with its text in `OrchestratorFeedDescription`. Add the dispatch to `TaskPassageQuery.IsSessionDispatch`. `FoldRun` reads run streams only, so it counts through the `taskEvents` line 826bbde3 adds; add that line if 826bbde3 has not merged. `h9k task show` derives the report path from the session id, so no event carries it. Reuse `PublicationTokensRecorded` for spend, since `PeriodSpend`, `SpendPressure`, and `ProjectPurgeEngine` already fold it. The event holds no session prose because hall9k's ledger refs are public and verdicts carry security detail, the same reasoning as the `CloseoutTriageSessions` doc comment.

  The setting. Add it to `ProjectSettingsChanged` as an `Optional<bool>`, stored so that absent reads on, with a `ProjectShowCommand` row beside close-linked-issue.

  The recipe generator. `.claude/skills/orchestrator-recipe-generator/SKILL.md` holds the words only at lines 337 and 558, and the verbs text starts at line 533. Line 892 keeps its walk sentence until B1 supersedes it. Say in the docs that a challenge holds no ceiling slot.

  Not in this task: applying a verdict, a refinement-and-challenge loop (B1), a per-project prompt addendum, and any change to `.claude/skills/challenge` in the project home, which is an in-conversation reasoning audit and a different thing; the prompt must not refer to it. No test spawns a real agent, creates a branch, or touches GitHub. Lesson picker 826bbde3 is building now and touches the same registries, so expect a rebase.

  Note to the orchestrator (decision 13f11af2), not to the build session: after this merges, the dated `Tier override` line at `recipes/orchestrator.md:234` survives regeneration by design, so it comes out by hand when the regenerated recipe is adopted, and the challenge memory rule moves to the verb. The Mac needs no config change, since the floor is its current triple.
