objective: A draft gets an independent challenge from a headless session the daemon runs, its parsed verdict is on the record, and publishing refuses a draft with no usable verdict unless a person states why
criteria:
  - |-
    `h9k task challenge <id>` records a request and returns without waiting, and the daemon on the node where it was run starts exactly one headless session for it. The request never leaves that node, so no other node starts a session for it, and a request arriving by replication starts nothing. A request made while the daemon is stopped waits for it, and `h9k task show` on that node says so.
  - |-
    `h9k task challenge` is refused, with the reason, for anyone who may not publish the task, and for a task that is not a Draft, has no acceptance criteria, belongs to an archived project, has no working checkout, or already has a challenge requested or running. A draft with a recorded verdict or failure may be challenged again by repeating the verb; nothing repeats it on its own.
  - The session's prompt holds the draft as the store has it at dispatch (objective, criteria, context, type, dependencies, stacking, epic, idea), and an adopted draft's quoted text is framed as data the way a build prompt frames it. It names the project home and the commit the checkout is at, says when that checkout could not be brought up to the project's remote base branch, and points at the idea's workspace and the draft's `journal.md` when they exist. It tells the session to test claims against that commit rather than improve the draft, and to answer every point that journal asks it to press on.
  - |-
    A challenge changes nothing about the draft: its objective, criteria, context, type, and state are the same before and after. Inside the session `h9k task publish`, `revise`, `assign`, `queue`, and `challenge` are refused, and nothing in the daemon applies a verdict.
  - |-
    On a project that runs agents with skip-permissions, the session has the same shell a build session has, so it can run a command and start a one-turn model session as a probe. Its prompt states the limits: at most five such sessions on the model the policy resolves for the cheap tier, files only under its own session directory, no build, no test suite and no host load, no git writes, and every probe reported in the verdict with its result. On a project without skip-permissions the session's settings let it read the checkout, the idea's workspace, the draft's directory, and its own session directory, and write its report and nothing else; its prompt says no probe can run and the verdict must mark any claim it could not test.
  - The daemon reads the verdict from one report file in the session's own directory, whose closing block holds one verdict line and one line per change. A report is readable only when that block names exactly one of publish as written, publish as revised, or do not publish, and every change line is marked must, should, or park and has non-blank text for both the change and its evidence. Markdown emphasis or a trailing period on a line does not make it unreadable; other text on the verdict line does. Publish as written with a must or should, publish as revised with neither, and do not publish with no must are all unreadable.
  - A readable verdict lands as one event on the task's stream recording the verdict, the count of must, should, and park changes, the model, the effort, the session, and the node. The event holds nothing the session wrote verbatim and no machine path; the prose stays in the report file.
  - A session that cannot start, ends in error, ends with no result, exceeds its bound, writes no report, or writes an unreadable one records a failure from a closed list, with no verdict, and the report and transcript stay on disk. A task that stopped being a Draft before dispatch records the same way with no session spawned. A session running when the daemon restarts is recorded as failed on the next start and never re-dispatched, and a dispatch naming another node that has stood past the foreign-session ceiling with no outcome is recorded as failed, so the draft can be challenged again. The bound is a daemon option defaulting to 30 minutes, a session past it is terminated, and a node runs one challenge at a time.
  - |-
    `h9k task show` prints the latest challenge: requested, running, failed with its reason, or the verdict with its counts, when it landed, its model and effort, its report path, and whether the draft was revised since. On a node that does not hold the report it names the node that does. Wherever `h9k task add`, `h9k task draft`, `h9k task revise`, or `h9k task show` prints a Draft's `Next:` line, it points at `h9k task challenge` while the publish gate would refuse it.
  - A recorded verdict or failure reaches the project's orchestrator feed as an ordinary item, not an urgent one, and the feed text carries only the verdict and counts or the failure reason, so a window learns the outcome without polling.
  - With the requirement on, `h9k task publish` refuses a Draft whose latest verdict is missing, is do not publish, or is publish as revised holding a must with no revision of the draft since that verdict landed, and the refusal names `h9k task challenge`, `--skip-challenge`, and the project setting. Any other latest verdict passes, including after later revisions, because revising is how a verdict gets applied. A newer verdict replaces an older one, and a failure replaces nothing.
  - |-
    `h9k task publish --skip-challenge "<reason>"` publishes past the gate. A blank reason is refused. The reason and who gave it are recorded on the publish and shown by `h9k task show`, and a reason passed where the gate asked for nothing is not recorded.
  - The requirement never applies to a pr-review task or a spike, and every daemon-minted publish behaves as it does today.
  - |-
    `h9k project set <name> --require-challenge on|off` sets the requirement, and it reads on for every project that has recorded no value, including projects registered before this shipped. `h9k project show` prints the value and whether it is the default. With it off, publish asks for nothing and the verb still works.
  - With nothing configured, a challenge runs on Opus 5.5 at high effort on any node, whatever that node's default model, node-wide effort, or role settings for other sessions say, and a draft's own model or effort does not move it. `h9k config set --model-challenge` and `--effort-challenge` change it for a node, `h9k project set`'s model and effort still win as they do for the courier, and `h9k config show` prints the value in force and where it came from.
  - The session's tokens land in the spend lines of `h9k status` and `h9k config show` under the model it ran on, and the session count in `h9k task show` includes it.
  - |-
    The recipe generator skill stops carrying a challenge as something a window launches by hand: it leaves the model tier table and the spawned-session lists, and the task-verbs text tells a window to run `h9k task challenge`, read the verdict, apply what it accepts, and then publish. A recipe generated after this holds no launch line or model for a challenge.
  - |-
    `docs/cli.md` and the hall9k-cli-reference skill document the verb, the setting, the flag, and the role wherever the neighbouring verbs and roles are documented, and every publish example in `README.md` and `docs/getting-started.md` still works as written for a new project with the default on.
