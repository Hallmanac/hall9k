context: |-
  A Linear connector, so a project whose work and backlog live in Linear gets the same tracker integration hall9k gives Jira and GitHub issues

  The challenge verdict is notes/challenge-de1f4613/journal.md in the project home; it holds the file:line evidence and the Linear sources behind each criterion. Facts the build leans on: a team with Triage on sends an issueCreate with no stateId to Triage (linear.app/developers/graphql), which is why criterion 5 passes Team.defaultIssueState; teamId is an id, not a key, and teams(filter: { key: { eq: ... } }) resolves a key (public schema); Team, IssueCreateInput, and IssuePayload are in packages/sdk/src/schema.graphql in the linear/linear repository. Unverified, so check them against the public schema or docs and never a live workspace: whether stateId is honoured on a Triage-on team, Linear's title limit, and what a repeated client-supplied issue id does. Parked: h9k task publish --linear-team (trigger: an operator has to create an issue by hand in a non-default team twice; until then, create it in Linear and use h9k task link-linear); Linear labels from --backlog-routing (trigger: the team wants hall9k-created issues labelled); regenerating the description's checklist on task revise (trigger: a teammate reads criteria from the Linear issue rather than the card); a client-supplied issue id for idempotency (trigger: a duplicate is actually observed).

