context: |2-
   Brian, 2026-09-26 08:1x EDT, in the hall9k project window. Today the ledger records no person's name or account anywhere (docs/concepts.md: 'GitHub confirms the person, and the ledger never records the account'). ProjectMembersCommand fills its Login column from the local OwnerDetails record for each root fingerprint, and only this node's own owner exists locally, so every other member prints 'unknown'. The member file the invite sweep writes (InviteSweepEngine.WriteMemberVouchAsync, members/<root>.yaml) holds only role and issued_at. Each node already reads its own gh login and numeric id at join and daemon start (ProjectJoinCommand via NodeBootstrap.RefreshGitHubIdentityAsync; h9k owner show lists them), and a node with push mirrors the repository's collaborators as read-only observations (ProjectGitHubMembers: AccountId, Login, Role). What is missing is the pairing of root fingerprint to login. Brian's ruling: the joiner's node writes its own login and numeric id into its own signed node file as a declared claim; the members table shows the declared login and cross-checks it against the collaborator mirror (declared login present with push reads confirmed, otherwise flagged). No prompt for a typed name: the gh login is the identity GitHub permissions already run on. Parked for later, not in this task: a verified pairing via GitHub's published SSH keys (github.com/<login>.keys) matched to the node's ssh-ed25519 key. Not a fold-in to 1629bc9d, which is about replication order. Brian, 2026-09-26 15:19 EDT, in the hall9k project window, on the parked verification: the shape is GitHub's SSH signing keys, not the .keys authentication list and not a gist proof. A member registers their node's own ledger key (ssh-ed25519) as an SSH signing key on their GitHub account through one explicit, interactive command (working name h9k owner verify) that asks for the admin:ssh_signing_key scope, adds the key titled for the node, and hands the scope back in the same step if gh auth refresh can remove a scope (verify that before writing its criteria); join calls the same command for a new member, and existing members run it once. Verification is anonymous: the per-user ssh_signing_keys list is public. Chosen over a gist proof because the consent screen is GitHub's own, the key type means exactly this-key-signs-for-me, and the key is visible and revocable in the account's settings. That is a separate draft stacked on this one; this task ships the declared claim only, and its members table must show declared versus verified so the nudge to run the verify command is visible to the whole team. Also his ruling: 'at join' is not enough, since every fleet node has already joined; a node already joined writes its declared login on its first daemon start after the update, where RefreshGitHubIdentityAsync already runs, so existing members fill in with no action. 

  Walked 2026-09-26 16:06 EDT with Brian (four criteria after the challenge), challenged the same hour (verdict in this task's journal.md, verified against main at 9fff3bd78, v0.10.53); Brian accepted all five open points: (a) the writer moves to Hall9k.Connectors and the daemon rewrite runs as a one-shot off the first sweep tick, never inside NodeContext.InitializeAsync (Hall9k.Daemon cannot reference Hall9k.Cli, DispatchLoop.cs near 265); (b) a declaration is taken only from a node.yaml whose newest commit is signed by its own public_key, because today no reader checks a non-root node file's newest commit (GitLedgerChainReader.cs near 656 to 672) and anyone with push could forge a login; (c) h9k project members refreshes the collaborator roster through ProjectGitHubAccessMirror.ObserveAsync (its only caller today is ProjectJoinCommand near 295; nothing reads ProjectGitHubMembers but the purge delete) and dates the fallback; (d) every distinct declared account is listed instead of a 'conflicting' state; (e) the display name is its own draft stacked on this one. The daemon rewrite must read the current file and change only the two fields: the existing writer regenerates the whole file from arguments and would write invite_proof null, erasing a pending proof the minter's invite sweep matches on. The nodes ref is pushed directly by GitLedger.WriteAsync (GitLedger.cs near 86) and fetched by every other node's chain reader on each message sweep (FetchRefsAsync NodesRefPrefix near 222); event replication is not involved. The daemon holds the committer and signing key the way the CLI does (DispatchEngine.cs near 1889, InviteSweepEngine.cs near 72). Ten files carry a copy of ExtractQuotedYamlValue; the chain reader's is internal static and shared with InMemoryMessageTransport, which reads only public_key and needs no change. ProjectMembersCommandTests asserts only the exit code (line 59). The stacked display-name draft carries the per-project name, its owner-level default, and its use in feed, courier, messages, and status lines.
