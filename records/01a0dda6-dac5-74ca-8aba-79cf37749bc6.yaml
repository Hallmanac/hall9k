objective: |-
  A member's GitHub login appears beside their root fingerprint in h9k project members: each node writes its own GitHub login and account id into its signed node file as a self-declared claim, at join and, for a node already joined, once after its first daemon start following this change, and the members table shows every declared account with a truthful trust state cross-checked against a freshly read collaborator roster
criteria:
  - |-
    The node file (nodes/<nodeId>/node.yaml) gains github_login and github_account_id, taken from the project's connection's observed GitHub identity (ConnectionDetails by project.ConnectionId, the read ProjectGitHubClient.ResolveAccountAsync already performs near line 220). The writer moves out of ProjectJoinCommand (its private WriteNodeFileAsync, BuildYaml, QuoteYaml near lines 1405 to 1473) into Hall9k.Connectors beside NodeSelfAnnouncedKeyResolver, and both the join command and the daemon call it; at join the fields are written with the rest. For a node already joined, the daemon runs a one-shot after startup, off the first tick of an existing per-project engine (MessageSweepEngine already lists eligible projects and reads each chain), never inside NodeContext.InitializeAsync and never blocking start: for each joined project whose nodes/<id>/node.yaml already exists (ledger read reports Exists; the daemon never creates a node file, since the invite sweep treats a new one as a join candidate), it reads the current file and rewrites only when the two fields are absent or differ from what it observed, changing only those fields and preserving every other field byte for byte, invite_proof included, as an 'Update node facts' commit signed by the node's own key. A failed push is logged and retried at the next start; when gh cannot answer, nothing is written, never guessed. Tests prove the join write, the daemon one-shot rewrite for an existing node, no rewrite when the values already match, a pending invite_proof surviving the rewrite, no file created where none exists, and an unreadable gh leaving the file untouched.
  - |-
    The trust chain reader (GitLedgerChainReader), which already reads public_key and owner_fingerprint from every node file, also reads github_login and github_account_id through its existing ExtractQuotedYamlValue, and takes a declaration only from a node.yaml whose newest commit is signed by that file's own public_key (the IsSignedByAsync pattern near lines 656 to 672), for root and non-root nodes alike; a node file whose newest commit is not so signed yields no declaration and is reported in UnverifiedWrites. The chain exposes the declaration per node and, per member, the distinct declared accounts across that member's nodes (distinct by account id, newest login per id, so a renamed account is one entry and two accounts on two nodes are two entries, never an error). The fields are optional: a node file written before this exists reads as no declaration. Tests in the chain reader and trust chain suites cover a declaring node, a pre-existing node file without the fields, two nodes of one owner declaring different accounts, a node file rewritten by a key other than its own being refused, and, on the existing real-bare-repo harness, clone B reading clone A's declaration after a fetch.
  - |-
    h9k project members first re-reads the repository's collaborators through the existing ProjectGitHubAccessMirror.ObserveAsync when gh answers (so the command opens a writing session), and falls back to the stored ProjectGitHubMembers roster when it cannot, printing one line under the table, 'collaborator roster as of <LastObservedAt>', on fallback. The Login column lists every distinct declared account for each member including this node's own owner, or 'unknown' when none of their nodes declares one. The Verified column stops printing the literal 'verified' and states, per listed account: 'declared, push confirmed' when the account is in the roster with push; 'declared, read only' when it is there without push; 'declared, not a collaborator' when a roster exists and the account is absent; 'declared, unchecked here' when this node holds no roster because it lacks push itself; and 'unknown' when nothing is declared. The cross-check matches on account id first and login second, and the roster read lives in one small helper a later verify command can reuse. The members tests cover every one of those states and the fallback line.
  - |-
    Everything that states the old rule says the new one: docs/concepts.md near lines 1388 to 1390 (the members row, 'the login this install knows for it'), near 1411 to 1420 ('GitHub confirms the person, and the ledger never records the account', which becomes: the ledger records each node's self-declared GitHub login and account id, signed by that node, and what 'declared' means against 'verified'), and near 1533 to 1538 (the first-session walkthrough); docs/cli.md near line 733 (the members row, 'whether it verified'); docs/getting-started.md near lines 37 to 47 (joining); the help in CliCommandTree.cs near lines 308 to 312 and the summary in ProjectMembersCommand.cs near lines 14 to 20. The join walkthrough says a node declares its login at join and, for a node already joined, once after its first daemon start following this change. No doc test or grep guard is required; the build session reads each named passage and the reviewer checks the list.
