objective: A claim request is acted on only when the task it names belongs to the project whose message carried it
criteria:
  - |-
    A claim request naming a task that belongs to a different project than the message it arrived in is dropped without acting: nothing is appended to the task's stream, its ledger holder and tracker assignee are unchanged, no reply is queued to the requester, and the message is marked handled
  - ClaimRequestEngine's receive, grant, and refuse each refuse, before any write, a project that is not the task's own, so no caller can act on a task under another project's take policy, repository, or outbox
  - Tests in the existing ClaimRequestEngineTests seam (PostgresFixture, FakeLedger) cover a cross-project request dropped with nothing recorded, and a same-project request that still records TaskTakeRequested and grants or parks as today; no new test creates a branch, touches git, or calls GitHub
