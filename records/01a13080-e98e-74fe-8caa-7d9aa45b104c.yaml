context: |-
  Found 2026-10-12 by the read-only cross-project leak check (notes/cross-project-leak-check-2026-10-12-1013/journal.md, section 1, defect D1), read at origin/main cece31c74. ClaimRequestWatchLoop (about :167) takes the project from the message; ClaimRequestEngine.ReceiveRequestAsync (about :72-112) and GrantAsync act on request.TaskId with only a holder check (task.HolderNodeId != myNodeId), never checking the task's own project. A vouched member of one project can therefore send a claim request through that project's outbox naming a task of another project this node holds, and this node appends TaskTakeRequested (and possibly TaskHolderReleased) under the first project's TakePolicy; those events are ProjectScoped and resolve from the task's own project, so they replicate out through the other project's ledger. Integrity, not a read leak. Practical reach: needs the task id, and hall9k's task ids are public in its ledger refs. Fix shape: refuse with DomainConflictException, mark the message handled, record nothing; put the check in ReceiveRequestAsync, GrantAsync and the refuse path, or once in the watch loop after the task loads. Worse under take-policy auto (challenge): GrantAsync releases the holder in the message project's repository, finds no record there, gets HolderReleaseVerdict.NotHeld rather than Failed (TaskLedgerHolder.cs about :45-55), and appends TaskHolderReleased anyway, so the task's own stream says released while its own ledger still names this node, and the ClaimGranted reply is queued in the wrong project. Smallest placement: one guard beside the existing holder guard in each of the three engine methods, right after the aggregate loads; not only in the watch loop, whose taskForGate is a projection read before the fenced aggregate. Throwing DomainConflictException before the append reuses the loop's existing DomainException catch, which marks the message handled; no reply is owed, since an honest requester always queues under the task's own project. Challenge verdict in this task's journal. Walked with Brian 2026-10-12.
