objective: h9k update --restart (and h9k install --restart, the same finish path) brings an install whose schema predates the new binary current before the new daemon starts, so an update that carries a schema change (Marten 8.38.1 in v0.10.43, Marten 9 in v0.10.44) completes with the new daemon running on a current schema and never leaves the old daemon in place behind a stack trace
criteria:
  - |-
    Running h9k update --restart (and h9k install --restart) on an install whose store schema predates the new binary ends with the daemon running the new version on a current schema, exit code zero, no stack trace: verified on Windows by the build session with the isolated HALL9K_HOME recipe in this task's context, and on macOS by the operator with the same recipe once the pull request lands, recorded on the card at closeout.
  - The pull request quotes the captured stderr of the reproduction, names the exception type and the call it was thrown from, and states whether the hand-off to the new binary covers it.
  - The live-gate wait runs in the old binary before the swap, so it still works against the old schema and --now still skips it; after the swap the old process only launches the newly installed h9k as a child and relays its exit code, and everything from the stop onward runs in the new binary.
  - The schema repair is h9k doctor --yes run from the new binary after the stop and before the start, so Marten's objects are repaired by the same call the doctor already makes and its outcome is printed (schema updated, or already healthy); Wolverine's tables stay the daemon's own start-time migration; docs/operations.md says that --restart may start a stopped Postgres container because doctor --yes does.
  - A failure before the child's stop signal (the gate wait, the swap, launching the child) leaves the old daemon running; a failure after it names the step that failed and prints only the steps not yet done; either way the command exits non-zero.
  - A unit test covers the planned child sequence and the stop-at-first-failure behaviour through a fake runner, with no real migration, daemon, or git; docs/operations.md's stale-schema paragraph and its Marten 9 section say update --restart handles a stale schema, with the hand order (stop, doctor --yes, start) kept as the fallback.
