context: |-
  Evidence (Windows hall9k-4a, 2026-09-23 08:00 EDT, transport note 66ad5e6d): h9k update --restart from v0.10.42 to v0.10.43 installed the binaries, then the daemon restart threw 'Cannot derive schema migrations for public.mt_jsonb_patch Diff AutoCreate.CreateOnly' (the Weasel 8.15 function rewrite that #568's Marten 8.38.1 bump brings), update ended in a stack trace, and the OLD v0.10.42 daemon was left running. Hand recovery that worked: h9k daemon stop; h9k doctor --yes (prints Schema updated); h9k daemon start. Expected path per the 4154c80f challenge verdict (tasks/4154c80f-*/journal.md): InstallCommand.FinishAsync swaps bin, DaemonLifecycle.StopAsync then StartAsync, StartAsync runs DatabaseDoctor with staleSchemaRepairedByCaller: true and h9kd runs EventStoreSchemaGuard.EnsureCurrentAsync at boot; something on the update --restart path opens a CreateOnly store with the new binary before that guard runs, or the stop/start sequence itself does. Find which call throws (the stack trace is on Windows; ask hall9k-4a for it, or reproduce on the Mac, which is still on v0.10.42 with a v0.10.43-stale schema as of 08:05 EDT on 2026-09-23). v0.10.44 (Marten 9, #569) carries a larger one-way migration, so this must be fixed or the recovery order documented before that tag is posted. Related: 29b0ca1a criterion 7 documents the restart window; docs/operations.md gained the stale-schema sentence in #568.
  Mac evidence (hall9k-c6, 2026-09-23 08:22 EDT): with v0.10.44 binaries installed over a v0.10.43-stale schema (Marten 9 over 8.38.1), h9k daemon stop printed 'Could not check for a live verification gate on this node (Cannot derive schema migrations for public.mt_jsonb_patch Diff, public.mt_safe_unaccent Diff AutoCreate.CreateOnly) — the check was skipped.' and then stopped the daemon cleanly; h9k doctor --yes printed 'Schema updated'; h9k daemon start came up on the new schema and adopted 2 runs. So the live-verification-gate check inside the stop path is one call that opens a CreateOnly store with the new binary before EventStoreSchemaGuard runs; on the Mac it was caught and skipped, on Windows something on the update --restart path was not. The Mac's rollback dump is backups/hall9k-store-pre-v0.10.44-20260923-0806.dump in the project home. The Windows stack trace was requested 2026-09-23 over the transport (note seq 1190, --about 9d30a92a).
  Windows evidence (hall9k-4a, 2026-09-23 08:24 EDT, transport note 06765ba6): the full trace is gone (terminal only; two frames kept, 'at Program.<Main>$(String[] args)' and 'at Program.<Main>(String[] args)', so the exception reached the top level uncaught). Its h9kd.log shows NO stop request when update --restart ran at about 07:59:30; the old v0.10.42 daemon (pid 26256) kept running; the next lines are the hand stop at 08:00:16 and 'Hall9k daemon starting: version 0.10.43' at 08:00:20 after doctor --yes. So the throw came in the updating CLI's own path BEFORE DaemonLifecycle.StopAsync signalled anything. The message matched what h9k daemon status printed on those binaries: 'Cannot derive schema migrations for public.mt_jsonb_patch Diff AutoCreate.CreateOnly' (mt_jsonb_patch only; mt_safe_unaccent joins it for the 9.39 diff). Windows's 08:22 backup (notes/backups/hall9k-pre-v0.10.44-20260923-0822.sql on that node) holds a v0.10.43 schema; the Mac's backups/hall9k-store-pre-v0.10.44-20260923-0806.dump holds a v0.10.42 schema (the Mac never took v0.10.43's migration until 08:20).

  What the source says (orchestrator hall9k-c6 and the challenge session of 2026-09-23 09:04 EDT, read at tags v0.10.42, v0.10.43, v0.10.44; full verdict with line numbers in this task directory's journal.md): the process that runs 'h9k update --restart' (and 'h9k install --restart', the same InstallCommand.FinishAsync path) is the OLD binary, which keeps executing its own code after SwapIntoPlace. The swap deliberately leaves the new files at the old absolute paths on both platforms (Windows retires the locked files aside, Unix renames bin to bin.old), and the runtime resolves each assembly lazily on first touch, so the old process's first load of any assembly it had not yet touched (Weasel.Postgresql, JasperFx.Events, whatever the store needs) comes from the new release. The only store open on the post-swap path is LiveGateGuard.FindOnThisNodeAsync (reached through WaitUnlessNowAsync's delegate, then again from DaemonLifecycle.StopAsync), and it is inside catch (Exception); Program.cs also catches SchemaMigrationException and NpgsqlException and prints doctor advice, no trace. So the exception that reached Main is NOT the schema exception Windows remembered: it is most likely a load-time failure (TypeLoadException, MissingMethodException, FileLoadException, TypeInitializationException) raised while the runtime compiled FindOnThisNodeAsync itself, which lands at the delegate call site outside every try. A captured stderr settles it; that is criterion 2. Windows's log shows no stop request, so the throw sits between the restart offer and the stop signal.

  Approach (Brian's calls of 2026-09-23 after the challenge): the live-gate wait runs in the OLD binary BEFORE the swap (old binary, old schema, the check works and --now keeps its meaning; a post-swap wait would find 'could not check' on every schema-changing update and wait for nothing). After the swap the old process only launches the newly installed h9k as a child and relays its exit code. The child runs h9k daemon stop, h9k doctor --yes, h9k daemon start, in that order: start alone will not do, because DatabaseDoctor prompts on a terminal even with staleSchemaRepairedByCaller, and the daemon's EventStoreSchemaGuard prints nothing on success. doctor --yes starts a stopped hall9k-postgres container without asking; inside --restart that is accepted and must be said in docs/operations.md. The doctor repairs Marten's objects (same two lines as the daemon guard: a CreateOrUpdate store and ApplyAllConfiguredChangesToDatabaseAsync); Wolverine's envelope tables stay the daemon's own start-time migration through IntegrateWithWolverine (CreateOrUpdate), as docs/operations.md already documents. The point of no return is the child's stop signal: before it, any failure leaves the old daemon running; after it, the command names the failed step and prints only the steps not yet done. Test seam: FinishAsync already takes optional delegates (portListeningProbe); add an optional child runner and gate finder in the same style so the planned child sequence is data a unit test can assert, with a fake runner for stop-at-first-failure; DaemonLifecycleStopTests and LiveGateGuardTests show the pattern; a fake running daemon is a pid file under the scoped test home naming the test's own process.

  Reproduction recipe (SAFE; the earlier one on this card would have acted on the live install and is withdrawn): never run update, install --restart, daemon stop/start, or doctor --yes against the real home. Isolate with HALL9K_HOME (PlatformPaths.Home), which moves bin, pid file, stop file, config, and log together: HALL9K_HOME=<scratch> with the v0.10.42 release binaries copied into <scratch>/bin; HALL9K_CONNECTION_STRING at a scratch database carrying a v0.10.42 schema (an empty install's schema is enough for the crash; the Mac's dump backups/hall9k-store-pre-v0.10.44-20260923-0806.dump restored into a NEW database also works for the crash reproduction only); a pid file under the scratch home naming a long-lived dummy process (a sleep) so --restart finds 'a daemon'; then '<scratch>/bin/h9k install --from-release <extracted v0.10.43 payload> --restart --now 2> stderr.txt'. That reproduces the crash with no daemon involved. To verify the fix end to end, do not start a daemon on a copy of the live store (it would adopt real runs and poll GitHub); use a scratch database whose schema came from an empty install, or the fake pid with a stub h9kd. Never stress the host (Brian, 2026-09-10). macOS verification is the Mac window's act with this same recipe as soon as the pull request lands, recorded on the card at closeout.
