objective: The orchestrator feed, and so the courier's delivered message, names a completed task's pull request without claiming a push the task record does not hold, and h9k review resolve on a pr-review task says what this command posted rather than seeming to deny what the walk posted
criteria:
  - When a task completes with a pull request URL on the record, its line in h9k orchestrator feed names that pull request and does not say the run pushed anything; the word "pushed" does not appear in it. One sentence serves every task type, pr-review and build alike. A completion with no URL still reads "the run finished with no pull request to watch".
  - After h9k review resolve --merge-ready on a pr-review task, the closing line says that this command posted nothing to the pull request and that anything already posted during the findings walk stands, and it does not say the daemon completes the task (a full review waits on the pull request after resolve). The bare "Nothing was posted to the pull request." and "the daemon completes the task" are both gone from that line.
  - The feed golden in tests/Hall9k.Tests/Domain/OrchestratorFeedRendererTests.cs includes a TaskCompleted carrying a pull request URL and pins its rendered line exactly, and a test pins the text of the resolve command's closing line. Neither test creates a branch, pushes, or calls GitHub.
