context: |-
  Drafted 2026-09-20 09:0x EDT at Brian's ask from the gate-timeout discussion; walked with him before publishing. Evidence: the Mac's final pass on 19489eff this morning ran the fast gate in 65 seconds and the host gate in 18m19s alone in its slot; Windows's host gate ran past the 30-minute limit on 37b5ec69. notes/test-suite-runtime-analysis-2026-09-08.md traced the time to the [Collection("Hall9kHome")] lane: xUnit runs a collection on one thread, and the classes in it (79 files today, 29 of them each starting a Postgres container in series) reproduce the gate's wall-clock. Production reads HALL9K_HOME in exactly one place, PlatformPaths.Home, on every access; 53 test files set the variable directly and 18 use SetTempHome. The container bound is unchanged by this work: CrossProcessContainerGate holds at most four containers machine-wide through exclusive file locks on fixed slot files, across every process, and the host gate is serialized per node, so parallel classes queue for permits rather than adding containers. Classes that spawn a real child process (the RealProcessSpawn set) still need the variable in the child's environment and keep a smaller serial collection of their own.
