objective: |-
  The test suite runs in parallel: a test redirects the platform home and the database connection string through a flow-scoped seam instead of process-wide environment variables, every Hall9kHome class converts and the collection tag retires, and every Postgres-backed class builds its DocumentStore once, so the Mac's host gate drops from about eighteen minutes to near the longest single class's own time, ReviewEngineTests at about six minutes less its own store savings
criteria:
  - |-
    PlatformPaths.Home and the database connection-string resolver (Hall9kDatabase.Resolve) each consult a flow-scoped override before their environment variable: a test opens one scope that redirects both the home and the connection string for its own async flow and every background task it starts, two tests running in parallel never see each other's values, and disposing the scope restores the previous ones; production behavior with no scope open is unchanged, and no production code sets a scope
  - |-
    One shared test helper replaces the private SetTempHome copies and the direct writes of HALL9K_HOME and HALL9K_CONNECTION_STRING across the test project: it creates a fresh temporary home, opens the scope from a constructor or field initializer (never inside an async lifetime method, whose flow-scoped values do not reach the test), and removes the directory on dispose; the existing home-isolation guard (HomeEnvironmentIsolationTests) is rewritten to two rules over the whole test project, no write of either variable outside the environment collection and no scope opened inside an async lifetime method, and it fails the build when either is broken
  - |-
    Every class carrying the Hall9kHome mark (74 at drafting: 28 Postgres-backed, 46 not) converts to the helper or, where it never touches either variable, simply drops the tag; afterwards no [Collection("Hall9kHome")] attribute remains in the test project; any class that hands the home to a child process keeps the environment variable for the child; classes that write any other process-wide environment variable (the claude path, Hall9k__ settings, the MSBuild node-reuse flag) move to one small serial collection named for the environment, the only serialized collection left, and the two that set a Jira token switch to class-unique variable names instead of joining it
  - Every test class holding a PostgresFixture (62 at drafting) builds its DocumentStore once, as a lazily initialized per-class field shared across its tests, and no test builds its own; any test that fails under sharing is fixed by seeding its own ids rather than by keeping a private store
  - |-
    The gain is shown in the pull request description: the fast and host gate wall-clocks from the daemon log for the branch's own final full pass, against the most recent final pass on main before it on the same node; a test asserts the Postgres fixture still acquires a permit from the cross-process container gate before starting a container and that the cap is still four; no test is run in parallel copies or under artificial load to produce the numbers
  - dotnet build and dotnet test pass with the host gate green on the branch's final full pass; the decision log carries one entry under this task's placeholder naming the seam and the rule that a test never sets HALL9K_HOME or HALL9K_CONNECTION_STRING except to hand one to a child process; the repository's testing guidance gains a short section on redirecting the home and the database through the helper and on the shared per-class store; no test creates branches or touches GitHub
