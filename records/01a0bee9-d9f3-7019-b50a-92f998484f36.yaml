objective: |-
  The test suite's Hall9kHome serial lane dissolves: a test redirects the platform home and the database connection string through a flow-scoped seam instead of process-wide environment variables, so the classes that today queue one at a time on a single thread run in parallel and the Mac's host gate drops from about eighteen minutes to the longest single class's own time, ReviewEngineTests at about six minutes
criteria:
  - |-
    PlatformPaths.Home and the database connection-string resolver (Hall9kDatabase.Resolve) each consult a flow-scoped override before their environment variable: a test opens one scope that redirects both the home and the connection string for its own async flow and every background task it starts, two tests running in parallel never see each other's values, and disposing the scope restores the previous ones; production behavior with no scope open is unchanged, and no production code sets a scope
  - |-
    One shared test helper replaces the private SetTempHome copies and the direct writes of HALL9K_HOME and HALL9K_CONNECTION_STRING in the converted classes: it creates a fresh temporary home, opens the scope from a constructor or field initializer (never inside an async lifetime method, whose flow-scoped values do not reach the test), and removes the directory on dispose; the existing home-isolation guard (HomeEnvironmentIsolationTests) is rewritten in this task to two rules, no write of either variable outside the environment collection and no scope opened inside an async lifetime method, and it fails the build when either is broken
  - Every class carrying both the Hall9kHome and RequiresDocker marks (28 at drafting) is converted to the helper and drops its Hall9kHome collection tag, so those classes run in parallel and contend for the four machine-wide container permits like the other Postgres classes; any class that hands the home to a child process keeps the environment variable for the child; classes that write any other process-wide environment variable (the claude path, Hall9k__ settings, the MSBuild node-reuse flag) move to a small serial collection named for the environment, and the two that set a Jira token switch to class-unique variable names instead of joining it
  - |-
    The gain is shown in the pull request description: the host gate's wall-clock from the daemon log for the branch's own final full pass, against the most recent final pass on main before it on the same node; a test asserts the Postgres fixture still acquires a permit from the cross-process container gate before starting a container and that the cap is still four; no test is run in parallel copies or under artificial load to produce the numbers
  - dotnet build and dotnet test pass with the host gate green on the branch's final full pass; the decision log carries one entry under this task's placeholder naming the seam and the rule that a test never sets HALL9K_HOME except to hand it to a child process; the repository's testing guidance gains a short section on redirecting the home through the helper; no test creates branches or touches GitHub
