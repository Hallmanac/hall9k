context: |-
  One task for the whole suite conversion, folded 2026-09-20 11:1x on Brian's word ("do what you have to do") from three: the seam (this task as first walked), c0c55037 (tag retirement, the remaining 46 classes) and eaa9cd4b (one DocumentStore per class), both abandoned as superseded by this. Reason for one task: all three touch the same 74 test classes and the store change is one line in each class the seam already edits; run apart they cost six host gates and three review laps, together two and one. Walked with Brian and revised after a headless challenge session (verdict in tasks/98484f36-*/journal.md): the connection string is a second process-wide variable in seven of the Postgres classes; a scope opened inside an async lifetime method does not reach the test; the lane is 74 classes (28 Postgres-backed, 46 not); the floor after the seam is the longest single class. Evidence: the Mac's final pass on 19489eff ran the fast gate in 65 seconds and the host gate in 18m19s alone; Windows's host gates ran past the 30-minute limit (memory gate-limit-stays-at-thirty: the limit is never raised, the suite gets faster). Production readers: PlatformPaths.Home (src/Hall9k.Domain/Infrastructure/Storage/PlatformPaths.cs, 27 call sites) and Hall9kDatabase.Resolve (line 71, environment before config.json); 53 test files set HALL9K_HOME directly, 18 through a private SetTempHome, 12 set the connection string through Hall9kDatabase.EnvironmentVariableName. Precedent for the seam: tests/Hall9k.Tests/TestSupport/ScopedConsoleCapture.cs and CultureScope.cs already use AsyncLocal. The container bound is unchanged: CrossProcessContainerGate holds four permits machine-wide by exclusive file locks across every process, and the host gate is serialized per node. Isolation between tests comes from fresh DomainId values in the seed helpers, not from a fresh store (notes/test-suite-runtime-analysis-2026-09-08.md, win 1). The Domain project needs InternalsVisibleTo for the test project's setter. tests/Hall9k.Tests/README.md lines 110 to 112 state the premise this removes. Memory never-stress-the-host-to-chase-a-flake: no parallel copies of the suite to produce numbers. Placed on the Mac.
