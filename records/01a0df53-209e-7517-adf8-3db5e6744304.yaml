objective: A member can set the display name teammates see for them, per project or as this machine's default; their node file in each project carries the effective name, and h9k project members shows it
criteria:
  - h9k owner set --display-name '<name>' --project <project> records a display name for that project on this machine, and h9k owner set --display-name '<name>' without --project records this machine's default. The effective name for a project is its own entry, else this machine's default, else none. --display-name '' --project <project> removes that project's entry so the default applies again, and --display-name '' alone clears the default. A --project naming a project this node has not joined is refused. The value is trimmed and a blank value means clear; otherwise it must be 1 to 64 characters with no control characters (newline, carriage return, and tab included), and anything else is refused with a message echoing the value, before anything is recorded. Tests cover each form, the precedence of project entry over default, both clears, the unjoined project, and the refusal.
  - |-
    After any of those commands, the node file of each affected project (the named one, or every joined, non-archived project when the default changed) carries the effective name as display_name, or no display_name line when there is none. The file is written only when it differs, as an 'Update node facts' commit signed by the node's own key, with every other line preserved byte for byte (invite_proof and the GitHub declaration included), and a file naming a different public key than the signing key is left untouched. One project's failed write does not stop the others: the local setting is still saved, and the command names each failed project, says the next daemon start brings it up to date, and exits nonzero. The daemon's existing once-per-project refresh on the first message sweep then brings display_name to the effective value alongside the GitHub declaration, and h9k project join writes the effective name into the file it creates or rewrites, so a re-join never erases it. Tests cover the per-project write, a default reaching two projects, one project failing while the other lands, a clear removing the line, the daemon refresh correcting a stale file, and a re-join keeping the name.
  - The trust chain reader reads display_name from each node file under the same rule as the GitHub declaration (a node file whose newest commit is not signed by its own key yields no name), and exposes per member the newest name declared across their nodes, as a label only that never feeds any trust or cross-check decision. h9k project members shows that name in the member's row without adding a column and with the Login and Verified cells still aligned line for line, and shows nothing extra when no name is declared. Tests cover the reader (newest across two nodes, an improperly signed file yielding none) and the table's captured console output with and without a name, not the exit code alone.
  - |-
    A successful h9k project join ends with one dim line giving the command to set the name teammates see, with the joined project filled in: h9k owner set --display-name '<name>' --project <project>. A test asserts the line on a successful join.
  - |-
    The documentation describes the display name as set per project or as this machine's default, per machine because owner settings stay on the node that set them, written as the effective value into that node's file, and a label only. The places are: the joining walkthrough in docs/getting-started.md, which gains a passage for the agent reading it on a person's behalf (after a join, offer the person a display name for this project, suggest one from their GitHub login or git user.name, and say it can be changed later with the same command or cleared with an empty string); the owner set bullets in the same file; one sentence in the membership section of docs/concepts.md; the project members row and the owner set row and section of docs/cli.md; the owner set examples block in docs/operations.md; and the help text of h9k owner set and h9k project members. No doc test or grep guard is required; the reviewer checks the list.
