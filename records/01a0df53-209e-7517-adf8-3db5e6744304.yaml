context: |-
  Walked with Brian 2026-09-26 as criterion 5 of 37749bc6 (the declared GitHub login, merged as #596) and split out on that task's challenge verdict. Challenged 2026-09-26 (verdict in this draft's journal.md); Brian accepted all five open points 2026-09-27. Brian's rulings: the name is per project, with a default beneath it; it is a label only, never part of any trust decision; and it must be used downstream. The downstream use (feed, courier, messages, status, task views) is NOT this task: it is the stacked draft b7d8222e, which builds on this task's reader field.

  The effective-name model (verdict point 1). The node file has one field, so a seeded default is indistinguishable from a per-project name; the local owner record therefore holds this machine's default plus a per-project map, the file always carries the effective value, and every writer compares the file with that value exactly as the one-shot compares the login. OwnerSettingsChanged (src/Hall9k.Domain/Features/Owner/OwnerSettingsChanged.cs) gains the two fields as optional parameters appended at the end, for the replay reason its own doc gives. It is OwnerScoped (EventScopeRegistry.cs:302), so the default is per machine by construction: call it "this machine's default", never "owner-level". Two machines with different defaults each write only their own node file, and the reader takes the newest across a member's nodes, so they settle rather than flip-flop. Rejected: members/<root>.yaml as the home, because a member-role root cannot write a membership file.

  The writer. src/Hall9k.Connectors/Trust/NodeFileWriter.cs: RefreshGitHubDeclarationAsync and WithDeclaration hard-code github_login and github_account_id; generalise the read-change-write path to a set of field changes (including removing a line) rather than adding a second copy, and have the daemon's NodeGitHubDeclarationOneShot (src/Hall9k.Daemon/Messaging) apply display_name through it in the same pass. WriteAsync (the join path, called from ProjectJoinCommand.cs:616) regenerates the whole file from its arguments, so it must take the display name as it takes the declaration. The CLI wiring for a ledger write from a command (bootstrap context, keyStore.EnsureAsync, committer, LedgerSigningKey, the per-project loop with collected failures and a closing DomainValidationException) is NodeVouchCommand.cs:58-150; one fetch and push per project, the same bill h9k node vouch pays. OwnerSetCommand.cs takes an [OWNER] positional and has no ledger wiring today.

  The value. A DisplayName value object in Shared/ValueObjects on the VoiceSkillName pattern (VoiceSkillName.cs: MaximumLength, Parse that trims and treats blank as None, IsWellFormed, DomainValidationException with a legible echo). The rule is mandatory because QuoteYaml escapes only backslash and quote and ExtractQuotedYamlValue (GitLedgerChainReader.cs) is line-based.

  The reader and the table. GitLedgerChainReader already collects a per-node NodeGitHubDeclaration with its declared-at time under the signed-by-own-key rule; the name rides the same read. ProjectMembersCommand.RenderAccounts already puts one line per declared account in the Login cell, aligned line for line with the Verified cell, so a name added as an extra Login line would break that alignment; a second line in the Root cell under the fingerprint is the likely home, and the build decides. tests/Hall9k.Tests/TestSupport/ScopedAnsiConsoleCapture.cs is the capture pattern for the rendering assertion. The join success print is ProjectJoinCommand.cs near 745.

  Boundaries. A criterion never drives the lifecycle of another task (decision 13f11af2). Dispatched sessions must not run install, update, join, or reconcile against the live install. No em dashes in anything authored.
