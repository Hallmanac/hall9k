objective: The paste handoffs of h9k task drive --print-prompt and h9k pr review name a bound project's Claude Code account and give a start command that runs under it, so a person following either handoff starts Claude Code under the right account
criteria:
  - |-
    For a task whose project is bound to a claude-code connection, `h9k task drive <task> --print-prompt` prints two things before the prompt. The first is a line naming the bound account as `ClaudeCodeAccount.Describe` reads it (the recorded email and the config directory, or "an unobserved account" and the directory when no email is recorded). The second is a start command of the form `claude --settings "<the settings file it wrote>"`, with the path quoted the way `LaunchTextDefaults.TaskDriveLine` quotes `--settings`. The start command carries the account in the host shell's form that printed launch lines already use: the `CLAUDE_CONFIG_DIR='<dir>'` prefix in POSIX, and in PowerShell the `try { $env:CLAUDE_CONFIG_DIR='<dir>'; ... } finally { Remove-Item Env:CLAUDE_CONFIG_DIR -ErrorAction Ignore }` wrapper. It is printed on a line of its own, raw and unwrapped, the way `LaunchLineWriter.Write` prints launch lines. The account named is the project's current binding: the same one that `h9k task drive <task>` with neither flag puts on its printed launch line, including on a re-entry after the project was rebound.
  - For a project bound to a claude-code connection, the handoff that `h9k pr review <pull-request>` prints names the bound account and gives a start command in the form, print path, and binding rule of the previous criterion, carrying the lap's settings file. It does so whether the command adopts the pull request, attaches to a task this node already holds for it, or re-enters a lap already open, and whatever the push guard's outcome. For a project bound to a connection this node does not record, `h9k pr review` refuses with `ClaudeCodeAccounts.LoadAsync`'s own text before it adopts, attaches, or records anything.
  - |-
    In a bound project's handoff, each line that at commit 1fdfbf66 tells the reader how to start or set up a Claude Code session either points the reader to the start command or itself carries the account. In `h9k task drive --print-prompt` these are the settings-file line and the line introducing the prompt. In `h9k pr review` they are the settings-file line, the line introducing the briefing, and the push-guard lines for a checkout that already had a guard file, for a guard that could not be written, and for no worktree. The prompt and the briefing themselves are unchanged. For a project with no bound claude-code account, both handoffs print exactly the text they print at commit 1fdfbf66: no account line or start command is added and no existing line changes.
  - The "Claude Code accounts" section of docs/cli.md and the account section of the hall9k-cli-reference skill say that both handoffs name a bound project's account and give a start command carrying it, and the `--help` text for `h9k task drive --print-prompt` and the description of `h9k pr review` say the same.
  - Unit tests show each handoff for a bound project in both the POSIX and PowerShell forms, using a config directory that contains a single quote and a settings path that contains a space; one test per handoff per shell suffices when it uses both values. For `h9k pr review`, they cover each of the three push-guard outcomes named in the third criterion. They also show each handoff for an unbound project matching the text it prints at commit 1fdfbf66. A store-backed test shows `h9k task drive --print-prompt`, on a re-entry after the project was rebound, naming the new binding.
