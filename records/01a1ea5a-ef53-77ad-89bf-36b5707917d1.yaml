context: |-
  Per-project Claude Code account on a node: an operator logs an alternate Claude Code config directory in by
  hand, registers it as a claude-code connection, and binds some projects to it, so every claude process
  Hall9k starts or prints for a bound project runs under that account while unbound projects keep the default
  `~/.claude` login. That work has shipped and merged. Two gaps its challenges parked were ruled worth doing at
  the owner's go on 2026-11-17. This task closes the second of them: two paste handoffs tell a person to start
  Claude Code without naming the account. The first gap, `h9k doctor` warning about an inherited
  CLAUDE_CONFIG_DIR, is a separate task and is not part of this one.

  ## The two handoffs

  - `TaskDriveCommand.PrintPromptHandoff` (`src/Hall9k.Cli/Commands/TaskDriveCommand.cs:644`) tells the reader
    to pass `--settings` "to your own claude invocation" and to paste the prompt into "a Claude Code session
    started anywhere". Its only caller is line 338, where `session` and `project` are in scope. Unlike the
    default path (line 348), it never reads the project's account today.
  - **A trap at that call site.** The `account` local in scope at lines 336-338 is `ClaudeCodeAccount.Default`
    on the `--print-prompt` path (lines 246-248), and `DirectLaunchAccountAsync` (line 685) returns the account
    the run froze on a re-entry. Neither is the account this handoff names; read it with
    `CliClaudeAccount.ForProjectAsync`.
  - `PullRequestReviewCommand.PrintHandoff` (`src/Hall9k.Cli/Commands/PullRequestReviewCommand.cs:1584`) says
    the same for the review briefing. Its only caller is line 208, reached by adoption, attachment, and re-entry
    alike, with `session` and `project` in scope. The push-guard lines for an already-present guard file, a
    failed write, and no worktree (lines 1609, 1611, and 1613) also tell the reader to start the session with
    `--settings`. Note the comment above the guard switch on escaping: that method's interpolated calls escape
    their holes themselves, while its plain `MarkupLine` call does not.
  - **When `h9k pr review` reads the account.** Today it never loads the connection (adoption records only the
    binding's id). A read beside `PrintHandoff` would come after adoption, `RecordLapOpenedAsync` (line 179), and
    the doorbell (line 207), so a stale binding would leave an adopted lap with no handoff. Read the account
    once the project is resolved (line 124), before adoption or attachment, and pass it down to `PrintHandoff`.
  - Neither handoff has a test today, so the unbound pin in the tests is the first; its baseline is the text at
    commit 1fdfbf66. `ScopedAnsiConsoleCapture` (`tests/Hall9k.Tests/TestSupport/`) captures console output.

  ## What to reuse

  - The account: `CliClaudeAccount.ForProjectAsync` (`src/Hall9k.Cli/ClaudeCode/CliClaudeAccount.cs:33`) gives
    the project's current binding with its email; `PrintedLineDirectoryAsync` (line 46) is the directory alone,
    which is what printed launch lines carry. A person reads an account through `ClaudeCodeAccount.Describe`
    (`src/Hall9k.Domain/Features/Connection/ClaudeCodeAccount.cs:29`), "email (dir)", or "an unobserved
    account (dir)" when no email is recorded. A binding to a connection this node no longer records is refused
    by `ClaudeCodeAccounts.LoadAsync`, as it already is on the default drive path.
  - The shell forms: `LaunchLineAccount.Prefix` and `Suffix` (`src/Hall9k.Cli/Orchestrator/LaunchLineAccount.cs`),
    or `LaunchLineAccount.Apply` on a composed line, with `LaunchTextDefaults.HostShell`. Printed launch lines
    quote the settings path with `Quoted` in `LaunchTextDefaults.TaskDriveLine` (around line 118); `Quoted` is
    local to that method and the escaping behind it is private, so the handoff needs it exposed or its
    equivalent.
  - The print path: `LaunchLineWriter.Write` (`src/Hall9k.Cli/Orchestrator/LaunchLineWriter.cs`) writes a line
    raw and unwrapped. Spectre's own writers wrap at the profile width even when piped, and `MarkupLine` would
    parse a bracket in a path as markup.

  ## Settled, not to reopen

  - The handoffs name the project's current binding, not the account a run froze. A `--print-prompt` paste
    session registers the account it actually runs under (`TaskRegisterSessionCommand.cs:200-206`), and the next
    `h9k task drive` offers a resume only when that account equals the current binding
    (`src/Hall9k.Cli/Orchestrator/TaskDriveResume.cs:19-31`), so naming the frozen account after a rebind would
    make the next drive refuse the resume. A review lap has no resume to protect.
  - Printed lines and handoffs for an unbound project carry no prefix.

  ## Docs

  `docs/cli.md` "Claude Code accounts" (line 2475) and the hall9k-cli-reference skill's account section
  (starting at line 1519 of `.claude/skills/hall9k-cli-reference/SKILL.md`). The `--print-prompt` option's
  description is at `src/Hall9k.Cli/Commands/TaskDriveCommand.cs:116-122`, and `h9k pr review`'s at
  `src/Hall9k.Cli/Infrastructure/CliCommandTree.cs:664`.
