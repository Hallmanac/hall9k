objective: A review session is told accurately which search and history commands work, so it never reports itself blind while working search is available
criteria:
  - The shell-limits template no longer forbids shell grep and no longer says that without a search tool only named paths can be read, and it still says a session may use the Grep tool if it lists one
  - The rendered statement names `grep -rn`, `find`, and `ls` for searching the checkout, and the Read tool or `cat` for reading files
  - The rendered statement teaches `git log -p -- <path>` for a file's history, `git log -G<regex>` for finding the commits that changed a matching line, and `git diff 4b825dc642cb6eb9a060e54bf8d69288fbee4904 <revision> -- <path>` for reading a file at any revision
  - |-
    The rendered statement no longer says that pipes and chains are refused outright: it says one runs only if every command in it is allowed, and that `$(...)` is refused
  - The statement still says that the session starts in the checkout, never to use `cd` or `git -C`, that anything not allowed is refused without a prompt, not to retry a variation of a refused command, and to report what could not be checked
  - A test fails if any session in the persona registry or the mention follow-up lacks the new wording, and a test fails if the statement names `git show`, `git grep`, `git ls-files`, `git blame`, `git status`, `git rev-parse`, or any `gh` command
  - The only prompt golden files that change are the pull-request review ones that already carry the statement
