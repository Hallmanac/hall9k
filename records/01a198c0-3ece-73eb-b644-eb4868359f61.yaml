context: |-
  From issue 788. The template is `.claude/templates/agent-prompt-builder/shell-limits.md`, which `AppendShellLimits` renders into the pr-review persona sessions and the mention follow-up. This task deliberately starts naming commands, which reverses an earlier rule: replace `The_shell_limits_statement_names_no_individual_allowed_command` with the test criterion 6 describes, and correct the doc comment on `AppendShellLimits`. Name only the commands in the criteria. They were checked to keep working after task c03fd4bf, while `git log -L` and `git diff -U10` were not, so do not teach those, and do not list refused commands, because that list would go stale. Regenerate fixtures with `UPDATE_GOLDENS=1`, scoped to the golden test classes by name. This task changes no permission or setting. Order: before c03fd4bf, not stacked. Wording that passed a live check: "Shell commands are restricted in this session. You start in the checkout, so never use `cd` or `git -C`. Only a short list of read-only commands is allowed, and anything else is refused without a prompt. A pipe or a chain runs only if every command in it is allowed, and `$(...)` is always refused. Search the checkout with `grep -rn <pattern> <path>`, `find <path> -name <glob>`, and `ls`, or with the Grep tool if this session lists one. Read files with the Read tool or `cat`. For history, `git log -p -- <path>` shows a file's changes, `git log -G<regex> --oneline` finds the commits that changed a matching line, and `git diff 4b825dc642cb6eb9a060e54bf8d69288fbee4904 <revision> -- <path>` prints a file as it stood at any revision. If a command is refused, do not retry a variation of it: use what you can read, and say in your report what you could not check or search as a result."
