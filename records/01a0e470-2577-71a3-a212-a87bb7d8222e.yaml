objective: The orchestrator feed, the courier, and the message commands name another member by the display name this node currently knows for them in that project, then their declared GitHub login, then the short fingerprint
criteria:
  - The message sweep records, per project, the labels that project's trust chain shows as a node-scoped observed event with a projection, appended only when that project's labels change. The labels are each member's root fingerprint, the node ids of their current fleet (revoked nodes excluded), their newest display name, and one declared login (the login of their newest account declaration, ties broken by the higher node id as the chain already breaks them). A registered project whose project key is not assigned yet is recorded too. Tests cover the event appended on a change and not on a repeat, a member with two declared accounts, and a revoked node absent from the recorded fleet.
  - One Domain resolver answers from that projection alone, with no ledger read, the label for a fingerprint or a node id in a given project. For a fingerprint the label is the display name, else the declared login, else the short fingerprint; for a node id it is the owning member's label, or nothing when the projection does not know the node. Tests cover the precedence, an unknown fingerprint resolving to its short form, an unknown node id resolving to nothing, and one member with a different display name in each of two projects resolving to each name in its own project.
  - The lines that name a member by fingerprint show that label instead, resolved when the line is rendered, so an older feed line shows the member's current name and h9k orchestrator feed agrees with the courier. They are the feed's received-message line and its claim lines that name a claimant by fingerprint (and therefore the courier's delivered text, which is those lines verbatim), h9k message show's From line, and h9k message handle's confirmation. Message show keeps the short fingerprint beside the label and message handle keeps the full fingerprint it prints today beside the label. Tests cover a feed line with a name, with only a login, and with neither, the message show From line, and the message handle confirmation.
  - The lines that name a node by id keep the id and append the owning member's label in parentheses (for example "node 1a2b3c4d (Brian)"). They are the feed's received-message fallback for a message with no fingerprint, its claimed-by-node lines, its takeover line (the new holder and the previous one), its take-request, refusal, and released-to-node lines, and the Sender column of h9k messages. A node of this machine's own owner, and a node the projection does not know, shows the id alone. Tests cover a takeover line naming another member's node, one naming this owner's own node, and one naming an unknown node.
  - |-
    The feed description stays deterministic: it takes the lookup as an optional input that defaults to empty, every existing test that calls it compiles and passes with no edit, and the header of OrchestratorFeedDescription.cs says the same record and lookup always produce the same sentence.
  - |-
    Trust-bearing output prints exactly what it prints today, with no label substituted for or added to a fingerprint or node id: h9k project members, h9k owner show, this node's own identity lines and the unverifiable-write line in h9k status, the unverified-writes block, h9k node vouch, h9k node revoke, h9k project member remove, the node-not-enrolled errors of h9k node invite, vouch, and revoke, and h9k task take's ledger-override verdict. The reviewer confirms none of these changes in the diff.
  - docs/concepts.md's membership section says where the display name appears (the feed, the courier, and the message commands), that it is the name this node currently knows (a change arrives within one message sweep of reaching this node's ledger, while its daemon runs), that a node of this machine's own owner shows its id alone, that a revoked node or a member removed from the project falls back to the id or fingerprint, and that trust-bearing output keeps the fingerprint. No doc test or grep guard is required.
