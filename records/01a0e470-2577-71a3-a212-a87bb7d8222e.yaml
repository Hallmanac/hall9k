context: |-
  Split from e6744304 (a member sets a per-project display name) on its challenge verdict, points 4, 5, and 9 (tasks/e6744304-*/journal.md), accepted by Brian 2026-09-27; this card then took its own challenge verdict (tasks/b7d8222e-*/journal.md) and was split again into two stacked pull requests. This is the first: the mechanism plus the feed, courier, and message surfaces, which is Brian's ruling at the 2026-09-26 walk whole ("a courier or feed line about another member's node names them by display name, not by fingerprint"). The second, stacked on this one, carries the status, task, learning, catch-up, and join surfaces and the docs/operations.md table. Stacked on e6744304 because the build needs that task's unmerged reader field on TrustChain (the newest display name per member); blocked-by alone would leave nothing to build on.

  Where the label is recorded. MessageSweepEngine computes each eligible project's chain (MessageSweepEngine.cs:136) and persists chain-derived facts at :155 (PersistUnverifiedWritesAsync), which runs before the no-project-key skip at :167; put the label write beside it. The change-only precedent is ProjectDecider.cs:641-649 (returns null when the observed set equals the stored one), and ProjectGitHubCollaboratorsObserved is the same NodeScoped shape (EventScopeRegistry.cs:289). Login: TrustChain.DeclaredAccountsOf (TrustChain.cs:195-207) returns a list. Fleet: TrustChain.FleetNodeIds (TrustChain.cs:94) already excludes revoked nodes. Rejected: the in-process enrolledNodes record (MessageSweepEngine.cs:147), which the CLI cannot reach, and a live chain read per surface, which is a git fetch per project and fails offline. The projection is written by the daemon only, so a CLI on a machine whose daemon is down keeps the last recorded name; that is expected, and no timing test is wanted.

  Where the label is used. The feed sentence is built in the Domain from event data (OrchestratorFeedDescription.cs), called from OrchestratorFeedSelection.cs:93 and driven by OrchestratorFeedReader in both the CLI (OrchestratorFeedCommand.cs:71) and the courier (CourierEngine.cs:227), whose prompt is the feed lines verbatim (CourierPromptBuilder.cs:30-40). Every surface already has a project in hand (MessageDetails.ProjectId, the feed's per-project read). Line references at origin/main 9a2e67df1: fingerprint lines at OrchestratorFeedDescription.cs:202-217 (received message) and the Claimant helper at :223 used by the claim arms at :100-102; MessageShowCommand.cs:132-138; MessageHandleCommand.cs:89. Node-id lines at OrchestratorFeedDescription.cs:104-105 (claimed by node), :129-133 (takeover), :135-139 (take request and refusal), :140-141 (released to node), :203 (the received-message fallback), and MessagesCommand.cs:85. "This machine's own owner" is the local owner's root fingerprint and fleet. Tests that call OrchestratorFeedDescription.Of today (OrchestratorFeedRendererTests, OrchestratorFeedMessageLineTests, and the two duplicate-review tests) must not need edits.

  Staleness and impersonation. The label comes from a node file signed by a vouched node of that member, so only a member or their own node can name themselves, but nothing stops two members choosing the same name. PARKED, not built: when two members of a project currently declare the same label, append the short fingerprint to both (Brian accepted parking it, 2026-09-27). The detail views and the trust surfaces keeping the fingerprint are the mitigation for now.

  Note to the orchestrator, not the build: decision 241 in v0-decisions-log.md says the feed sentence depends on the record alone; once this merges it depends on the record and the node-local lookup, and the decision's wording is the orchestrator's to amend through the decision events.

  Boundaries. A criterion never drives the lifecycle of another task (decision 13f11af2). Dispatched sessions must not run install, update, join, or reconcile against the live install. No em dashes in anything authored.
