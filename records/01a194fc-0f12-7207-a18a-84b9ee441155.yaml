context: |-
  ## Why

  This is section A2 of `ideas/13403621-named-agent-files-claude-code-s-claude-agents-as-a-bridge-be/workspace/plan-work-brief.md` under the project home; read that section and the Rulings in `journal.md` beside it. The owner's time is scarcer than tokens, so the stop comes after automated review, and it is per task because a stop on every task makes the owner the bottleneck.

  ## Shape

  One task and one pull request, the second of four in epic 5e451233. It stands alone: no blockers, nothing stacked. The challenge feature, the plan concept, task notes, Ralph loops, agent files, and multi-vendor work are out of scope.

  ## Settled decisions, with reasons

  - The field is a new per-task flag, not `InteractiveModeEnabled`. That flag parks at all four boundaries and changes prompts and closeout, while the gate wants exactly one stop. The gate reuses the interactive park, so `ParkedIsInteractiveGate` stays true and the existing levers apply. It does not reuse `InteractiveGateCleared`, which any earlier proceed, resolve, or skip also sets. The gate reads its own run fact, set by an answer at this boundary or by `skip-to-pr`, and reset by a fix dispatch or a hand fix.
  - There is no project or node default. A default that is on is the bottleneck the brief rules out, and one that is off does nothing.
  - A late human change owes the same review a fix session's commits get. The route exists, but `h9k review fixed` was built for a run still in its loop, so the settled state needs clearing at this park (see below). The recorded way to skip that is `h9k review resolve --merge-ready --reason`, which settles as `Settled`.
  - The gate does not depend on `h9k task run-local`. The briefing offers it where a run skill exists, and a project without one still gets the gate, with the worktree on the page. A known run-skill parser defect is a separate task, so do not fix it here.
  - The summary reuses the `PR SUMMARY:` block rather than a new session (tools before tokens). Median merged hall9k pull-request body: 247 words, so the opening paragraph is the bound, not the whole body.
  - `h9k task skip-to-pr` and the `h9k pr review` lap are not reused at this park. Skip refuses here because nothing is left to skip. The lap needs a pull request and is read-only, so borrow only the idea of its factual sections.

  ## Where the code is (verified at ef0ee52f9)

  - The boundary: `src/Hall9k.Daemon/Review/ReviewEngine.cs:840`, with the park helper `EnsureInteractiveProceedAsync` at :7394. It reads the flag fresh; do the same. A follow-up reaches this case too, which is why the gate must check for an open pull request.
  - Choices: `src/Hall9k.Domain/Features/Run/InteractiveBoundaryChoices.cs`. `LeversFor` keys on the phase alone and `TaskNextCommand.AppendParkChoices` reads it, so it needs to learn the gate.
  - `h9k review fixed` is refused at this boundary by the `ParkedFromReviewPhase != FixNeeded` check in `src/Hall9k.Cli/Commands/ReviewFixedCommand.cs:147`.
  - `h9k task drive` refuses a headless claim through `TaskDriveCommand.cs` (`UnclaimableStateAdvice`, and the state check in `ClaimAndCutAsync`). Do not convert the claim, because that would turn on interactive mode and its other stops.
  - The moved-tip hole exists today: `Apply(ReviewBoundaryApproved)` returns to MergeReady and `PullRequestOpener` pushes whatever the branch holds, so commits made at this park reach a pull request unread and still record as a clean review. `h9k review proceed` may run from a machine without the worktree, so the check belongs with the daemon. `RunAggregate.CycleHeadSha` moves only when a cycle starts and so misses a pre-final-pass rebase; record the tip at the park instead.
  - `run-local` has no run-state check and tears down only on closeout or a missing worktree: `src/Hall9k.Daemon/LocalLaunches/LocalLaunchSweepEngine.cs`.
  - A parked run holds no dispatch slot (`src/Hall9k.Daemon/Dispatch/NodeLoad.cs`), and its lease is refreshed, so a gate can wait for days.

  - `Apply(ReviewHumanFixApplied)` at `RunAggregate.cs:1443`, when parked from MergeReady, must do what the needs-fixes branch at `:1731` to `:1753` does (verdict, budget base, final-pass rounds). Both must also clear `_humanEndedTheLoop`, which nothing clears today. Without this the Bar clause (`ReviewEngine.cs:7890`) settles at `:1158` with no pass, which was 35 of the last 90 settles.
  - `EnsureTipAnswersTheFixAsync` (`ReviewFixedCommand.cs:387`) compares to `CycleHeadSha`. At this boundary compare to the recorded park tip.
  - The moved-tip check reads the branch ref, because `PullRequestOpener` pushes the branch, and treats an unreadable tip or status as moved.
  - A run with stray uncommitted work fails or spends a recovery session at the gates (`VerificationRunner.cs:184`), which is why the `--merge-ready` guard and the anchor's hand-back line exist.
  - The older-summary check compares author date, because the rebase at `ReviewEngine.cs:509` rewrites commit dates.
  - `LocalLaunchTeardown.Reason` takes no run state and its sweep ticks every 20 seconds, so the stop on leaving the gate belongs in the review loop's re-entry, ahead of the gate.

  ## Constraints

  Events stay additive so older streams replay. New verbs go in `DispatchedSessionCommandClassification`. Tests never create branches or touch GitHub: make the moved-tip decision a pure function over observed facts and test that.
