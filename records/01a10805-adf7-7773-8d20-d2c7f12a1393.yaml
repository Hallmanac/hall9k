objective: Every hall9k tag publishes as a GitHub pre-release, and every node sees only releases Brian has cleared unless its person opts in to all of them, through one shared release lookup
criteria:
  - .github/workflows/release.yml's gh release create publishes the release as a pre-release. The existing re-run guard (skip when isDraft is false) still holds.
  - The latest-release lookup that UpdateCommand.ResolveLatestTagAsync performs today moves into Hall9k.Connectors, together with the ReleasePlatform RID and asset-name table it needs, so the daemon can call it. h9k update calls the moved lookup, and on the cleared channel it installs the same release it would today whenever that release's assets are complete.
  - |-
    A durable per-node setting, h9k config set --release-channel <cleared|all> (shown by h9k config show; default cleared), selects what the lookup returns: cleared returns GitHub's latest release, which excludes pre-releases; all returns the published release with the highest version by BuildVersionOrdering, pre-release or not, never by creation date. Drafts never count. Nothing but the shared lookup and h9k config show reads the setting, and the lookup reads it at each call, so a change takes effect without a daemon restart. A missing or unreadable config file, or an unrecognized channel value, resolves to cleared with a one-line warning; it never fails h9k update and never stops the daemon from starting.
  - The lookup returns a release only when its asset list carries this platform's archive and checksums.txt. When they are missing, it returns a distinct "not yet complete" result rather than the tag, and h9k update says so.
  - |-
    The lookup's result tells success apart from each failure: gh missing, gh failing or signed out, a timeout, and unparseable output. h9k update keeps its current messages for each one.
  - |-
    docs/operations.md's "Installing on a bare machine" section says three things: tags publish as pre-releases; a release reaches h9k update and the bootstrap scripts only once cleared with gh release edit <tag> --prerelease=false --latest; and --release-channel all opts a node in to every release.
  - Unit tests cover the channel selection, the incomplete-asset case, and each failure class over a fake gh. Per the house rule, there are no tests that touch GitHub.
