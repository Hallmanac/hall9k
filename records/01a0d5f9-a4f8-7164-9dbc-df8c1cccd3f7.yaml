context: |-
  Blocked by b72b51cf (the convergence layer: the younger of two colliding auto-created pr-review tasks is abandoned on every node and refused at claim). Sequencing only, not code: nothing here builds on the parent's branch. Design, settled by the challenge session of 2026-09-24 20:42 EDT (verdict in this task's journal.md): a symmetric hold is a no-op on the collision because both nodes pay it and the gap between their mints never changes (the three incidents had sightings 7 to 32 s apart against 83 to 119 s of replication). The rule is asymmetric: the node whose id sorts lowest among the owner's currently enrolled, unrevoked nodes mints on the first sweep, every other node holds. The hold is measured off GitHub's own RequestedAt (read fresh every tick near AutoPrReviewEngine line 483, already a mint precondition), not ObservedReviewRequest.FirstObservedAt, so a node waking late mints at once and nothing new is persisted. The hold sits after the four questions DecideAsync already asks (covered, time known, past cutoff, setting on; near lines 393 to 507) and before CreateOneAsync, so the gh pr view import is never paid while held; speed (First, Now, Normal) is decided inside CreateOneAsync and stays blind to the hold. The enrolled set is TrustedOwner.Nodes from ILedgerChainReader.ComputeAsync, a git fetch the message sweep already does per project every 15 to 45 s (MessageSweepEngine near line 133) and never persists; the engine must not fetch: a small in-process holder the message sweep writes its last chain per project into, read by the engine; no chain yet, a chain naming only this node, or no ledger at all all read as leader (today's behaviour). EventOriginProgress (peers seen so far) is the wrong source: it lingers for a revoked node. Setting shape follows MessageActivePollMinSeconds (DaemonOptions near line 132, whole seconds, not TimeSpan): a nullable on OperatingSettings with a Default const, a key in PlatformConfigFile (near lines 317 and 340), an option on ConfigSetCommand (near line 232), a ConfigShowCommand row with origin (near lines 94 to 99), the daemon-status line; #584's effort knob is the freshest walk of that path. Default 300 s (the 3-minute poll interval plus a replication allowance); zero means this node never defers. Status: one new ReviewRequestOutcome (HeldForPeer), one entry in FromInput (ReviewRequestOutcome.cs near line 78, so an older CLI does not render it Unknown), one Compose branch in ReviewRequestPane ahead of the closing informational one (near lines 370 to 373); IsReportable fires on outcome change so the two log lines fall out of the existing Info line near engine line 588; Settle's hiccup clause keeps HeldForPeer through a tick that cannot read the time. Decision logic is a pure function in AutoPrReviewObservation (my node id, enrolled node ids, RequestedAt, now, hold) so most tests need no Docker; the engine reads DateTimeOffset.UtcNow directly (near lines 551, 760, 1149), control age through the scripted timeline's requestedAt. Two-store harness: EventReplicationTests (OpenStoreB, FakeLedger, InMemoryMessageTransport, outbox flush then inbox read, near lines 62 to 130) with PrReviewTaskEngineTests' scripted gh and PollOnceAsync. Mentions are out of scope: DecideMentionAsync mints through CreateFromMentionAsync and the mention record is a one-shot dedupe; the convergence layer already settles a mention twin; a follow-up may apply the leader rule there. Known hazard, accepted: a newly enrolled node with a lower id is invisible to the old leader until its next chain compute (15 to 45 s), so for one sweep both may mint; convergence settles it. Note to the orchestrator: on today's fleet the Mac (01a00d41) sorts before Windows (01a04de3) and has arx-platform off, so Windows needs its hold set to zero for arx-platform reviews until both nodes watch that project again; a chosen rank instead of lowest id needs a fleet-scoped setting the platform does not have and is parked. No em dashes in anything authored.
