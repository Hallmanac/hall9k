objective: On a fleet, exactly one node mints the pr-review task for a review request on the first sweep that sees it and every other node holds, so two nodes that watch the same project produce one task with no added delay instead of a twin the convergence layer must abandon
criteria:
  - |-
    Leader mints, followers hold: on a fleet, the node whose id sorts lowest among the owner's currently enrolled, unrevoked nodes mints on the first sweep that sees a review request no live task covers, exactly as today; every other node records the request as held for the leader and mints only on a later sweep where GitHub's own requested-at time is older than the hold and still nothing covers the reference; a single-node owner, a node whose chain names only itself, and a node whose chain cannot be read all behave as the leader, so nothing about a single-node install changes
  - The hold is a node setting in whole seconds (h9k config set --auto-pr-review-mint-hold, printed by h9k config show and h9k daemon status with its origin, bound at daemon start like MessageActivePollMinSeconds), defaulting to the auto-pr-review poll interval plus a two-minute replication allowance (300 s); zero means this node never defers and mints on the first sweep whatever its rank
  - The enrolled-node set the rank is computed from is the message sweep's most recently computed trust chain for that project, handed to the auto-pr-review engine in process; the engine performs no git fetch of its own
  - While held, h9k status shows the request as an informational row naming the leader node and the clock time the hold ends, never as a needs-you row; the daemon log writes one line when the hold starts and one when it ends in a mint or in a covering task, never one per tick; mentions are unchanged by this task
  - |-
    Tests: a pure decision test covers the leader minting at once, a follower holding, a follower minting once the requested-at time is older than the hold, an explicit zero, and the single-node and unreadable-chain cases; one engine test proves the held row, its outcome, and the single log line through PollOnceAsync with a scripted gh; one two-store test where both stores see the same request within the hold, with replication replayed between them, ends with exactly one mint and one live task on both sides and no abandon
