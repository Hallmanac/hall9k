context: |-
  Per-project Claude Code account on a node: an operator logs an alternate Claude Code config directory in by
  hand, registers it as a claude-code connection, and binds some projects to it, so every claude process
  Hall9k starts or prints for a bound project runs under that account while unbound projects keep the default
  `~/.claude` login. That work has shipped and merged. Two gaps its challenges parked were ruled worth doing at
  the owner's go on 2026-11-17. This task closes the first: an inherited CLAUDE_CONFIG_DIR is now removed for
  sessions that resolve to the default login without a word. The second gap, the account on two paste
  handoffs, is the task this one is stacked on and is not part of this one.

  ## Why the warning is needed

  - Every daemon spawn under the default login removes the variable from the child's environment
    (`ProcessSpawnRequest.RemovedEnvironment`, `src/Hall9k.Daemon/ProcessManagement/IProcessManager.cs:33`,
    set in `src/Hall9k.Daemon/Execution/ClaudeExecutor.cs:151`). That covers unbound projects and solutions
    whose members do not all share one binding (`ClaudeCodeAccountBinding.ForSolution`,
    `src/Hall9k.Domain/Features/Connection/ClaudeCodeAccountBinding.cs:51-57`). The CLI's own spawns do the
    same through `ClaudeCodeEnvironment.Apply` (`src/Hall9k.Connectors/ClaudeCode/ClaudeCodeAccounts.cs:52`),
    called from `HeadlessLaunch.cs:127` (task start and delegate), `TaskDriveCommand.cs:2111` (`--direct-launch`),
    and `OrchestratorMeasureProbe.cs:65` (`h9k orchestrator measure`, whose node probe always passes
    `ClaudeCodeAccount.Default`, `OrchestratorMeasureCommand.cs:121`). That is correct, but a node whose daemon
    inherited the variable used to run everything under that directory and now silently runs these sessions
    under the default login.
  - Printed lines for an unbound project, and the node window's line, carry no prefix (a ruling of the account
    work, not to be reopened), so a bare `claude` line pasted into a shell that exports the variable runs under
    it. That is why doctor's own shell gets a warning too. The shell warning names commands as examples rather
    than as an exhaustive list, so a later spawn site does not make it false.

  ## Where it goes

  - The section to extend is `src/Hall9k.Cli/Diagnostics/ClaudeCodeDoctor.cs`. It returns early when no
    claude-code connection is recorded (lines 50-54), which is exactly the node this warning matters most on,
    and its existing override check (`EnvironmentOverrides`, line 138, used at line 59) reads only doctor's
    own shell and treats an empty value as absent. `DoctorCommand.cs:81-86` returns before this section when
    the database check fails, which criterion 4 accepts.
  - The CLI has no view of h9kd's environment today. What it reads about a running daemon is the pid file
    (`DaemonProcessDescriptor`, `src/Hall9k.Domain/Infrastructure/Storage/DaemonPidFile.cs:9`, written by
    `src/Hall9k.Daemon/SingleInstanceGuard.cs:45` under `DaemonRuntime.PidFile`, `DaemonRuntime.cs:25`, and read
    with a pid-and-start-time aliveness check by `DaemonProcess.Probe`, `src/Hall9k.Cli/DaemonControl/DaemonProcess.cs:38`).
    How the daemon reports what it inherited is the build's choice, a field in the pid file or a file beside
    it, as long as it is read through the same aliveness check so a stale record never warns. The pid file is
    written with `File.WriteAllText` and no file mode, so whatever carries the value should hold that one
    variable and nothing else.
  - Two traps in the record's shape. First, the record must let an older build's pid file read differently
    from a daemon that recorded no variable; a nullable field on the positional `DaemonProcessDescriptor`
    cannot, because both deserialize to null. A file beside the pid file must carry the writing daemon's pid
    and start time so it is read through the same aliveness check and never attributed to a later daemon.
    Second, a field on `DaemonProcessDescriptor` also travels into the Windows stop-request file
    (`DaemonLifecycle.cs:494`, `WindowsDaemonAutostart.cs:490`), whose watcher logs the file's content on a
    mismatch (`src/Hall9k.Daemon/WindowsStopRequestWatcher.cs:176-179`). That stays on the node, but choose it
    deliberately or keep the field off the descriptor the stop request uses.
  - Existing coverage to extend: `tests/Hall9k.Tests/Cli/ClaudeCodeAccountCliTests.cs` (line 253 already drives
    `EnvironmentOverrides` with a fake reader, the pattern for the shell warning), `tests/Hall9k.Tests/Domain/DaemonPidFileTests.cs`,
    and `tests/Hall9k.Tests/Daemon/SingleInstanceGuardTests.cs`. The unit tests for a node with no connection
    and for a dead daemon's record need the section's composition factored so the connection list and the
    aliveness check can be supplied by the test.
  - Where the case arises: a daemon started by hand, by `h9k daemon start` when no autostart is registered
    (it inherits the operator's shell, `DaemonEnvironment.cs:6-8`; with autostart registered it starts through
    the service manager, `DaemonLifecycle.cs:146`), and the AppHost dev loop. Under the macOS LaunchAgent the
    daemon's environment is pinned (`src/Hall9k.Cli/DaemonControl/DaemonEnvironment.cs:31-37`). The Windows
    launcher merges everything it inherited (`WindowsDaemonLaunch.cs:175`), so whether the Windows autostart
    carries a user-level variable is unobserved but not ruled out.
  - The cannot-tell line matters because `h9k install` and `h9k update` take `--no-restart`, so the first
    doctor run after an upgrade can see a running daemon that left no record.

  ## Left out on purpose

  - The daemon reporting which override credential variables it inherited (names only) was parked by the
    challenge and is not part of this task.

  ## Docs

  `docs/cli.md` "Claude Code accounts" (line 2475 at the time of writing) and the hall9k-cli-reference skill's
  account section (starting at line 1519 of `.claude/skills/hall9k-cli-reference/SKILL.md`). Doctor's `--help`
  description is at `src/Hall9k.Cli/Infrastructure/CliCommandTree.cs:824-843`. Both docs sections are also
  edited by the task this one is stacked on, so this task's docs edits go on top of that task's text and the
  line numbers will have moved.
