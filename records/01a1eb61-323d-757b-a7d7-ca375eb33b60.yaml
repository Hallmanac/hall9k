objective: h9k doctor warns when the running h9kd or the shell it runs in carries a non-empty CLAUDE_CONFIG_DIR, saying what that value does and does not change for projects with no bound Claude Code account and naming the fix
criteria:
  - |-
    With h9kd running in an environment that carries a non-empty CLAUDE_CONFIG_DIR (for example, started from a shell that exports it, by hand or with `h9k daemon start` when no autostart is registered, or under the AppHost dev loop), `h9k doctor` prints a yellow warning that names the daemon and the inherited value, whatever doctor's own shell carries. The warning says that every session h9kd starts under the default login (for a project with no bound claude-code account, or for a solution whose members do not all share one) runs under the default login regardless of that value, while a session for a bound project runs under its own connection's directory. It names the fix: register the directory with `h9k connection add claude-code --config-dir <dir>` and bind the projects that should use it with `h9k project set <project> --claude-code-account <connection>`, or remove the variable from the daemon's environment and restart the daemon.
  - No daemon warning prints when no daemon is running, including when a pid file or any other record outlives a daemon that has exited, or when the running daemon's environment does not carry the variable (or carries it empty), even if doctor's own shell does. When a daemon is running but left no record of what it inherited (it was started from a build that predates this change), doctor prints one yellow line saying that it cannot tell whether the daemon carries the variable and that restarting the daemon lets it tell, rather than staying silent.
  - When the shell `h9k doctor` runs in carries a non-empty CLAUDE_CONFIG_DIR, doctor prints a separate yellow warning that names the value. It says that every Claude Code session h9k itself starts from this shell under the default login (for example `h9k task start`, `h9k task delegate`, `h9k task drive --direct-launch`, and `h9k orchestrator measure`) runs under the default login regardless of the variable. It also says that a line printed for a project with no bound account, or for the node's own window, runs under the directory the variable names when pasted into this shell, and that a daemon started directly from this shell inherits the variable. It names the fix of unsetting the variable before pasting such a line or starting the daemon. With the variable unset or empty in doctor's shell, no such warning prints.
  - Both warnings print in doctor's Claude Code accounts section on every run whose database check passes, whether or not this node records any claude-code connection, and neither changes the exit code of `h9k doctor`. The daemon records only the CLAUDE_CONFIG_DIR value it inherited, or the fact that it inherited none, together with the pid and start time that identify the daemon that wrote it, and no other environment variable's name or value. The record is written to a file in the same directory as the daemon's pid file (the pid file itself or one beside it), and this change adds no event type and no field to any event.
  - The "Claude Code accounts" section of docs/cli.md and the account section of the hall9k-cli-reference skill describe both warnings, the cannot-tell line, and their fixes, and the `--help` description of `h9k doctor` says that it warns when the daemon's environment or its own shell carries CLAUDE_CONFIG_DIR.
  - Unit tests show the daemon warning printing for a running daemon whose record carries the variable, and staying silent for one whose record says it inherited none, for a record left by a daemon that has exited, and with no daemon at all, each independently of doctor's own shell; they show the cannot-tell line for a running daemon with no record. They show the daemon's record reading back with its value, with an explicit none, and as no record from a pid file an older build wrote. They show the shell warning printing when its variable is set and staying silent when it is absent or empty, and both warnings printing on a node with no claude-code connection recorded.
