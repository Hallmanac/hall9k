context: |-
  Platform defect surfaced by the distributed-team chain (idea 202383dc), captured under the dogfood rule. Since 2026-09-18 08:00 EDT every test gate on this project fails deterministically on one test, on every branch and on a clean checkout of main at 22e0ed92.

  Evidence: InviteCommandsTests.cs line 48 fixes `Now = 2026-09-15 12:00:00Z`; the failing test (line 522 on main) seeds a member-of-project invite with `ExpiresAt = Now.AddHours(72)` = 2026-09-18 12:00:00Z; ProjectJoinCommand.RunAsync (src/Hall9k.Cli/Commands/ProjectJoinCommand.cs lines 186 and 277) compares that against `DateTimeOffset.UtcNow` and throws "Invite ... expired at 2026-09-18 12:00:00Z". The wall clock crossed that instant at 08:00 EDT today. Bites observed: C prime 28953e7d run 01a0b47b gate at 09:04 (1 of 6235 failed, this test) and a67fa552 run 01a0b47c gate at 09:05 (this test plus one of its own); both verify-test.log files under tasks/<id>/runs/<run>/ carry the exception. Lineage: the test arrived with T2 invites (commit 74ca9f3e, 2026-09-15, PR #405), a feature, not a fix; nothing loops back. a67fa552's build session noticed the same bomb and left it alone as out of scope (its handoff.md).

  Smallest fix preferred: keep the test's fixed clock for everything that never reaches the production clock, and seed the expiry the join command reads from `DateTimeOffset.UtcNow.AddHours(72)` (or inject a clock). Do not weaken the expiry check itself.
