  Challenge findings folded in (verdict in this task's journal, 2026-10-11): DecideMembershipGate lives on AutoPrReviewObservation in AutoPrReviewEngine.cs (about line 237), matches by numeric account id only, and answers Unknown (skip, ask next sweep) when no roster is computed; the inspector's ReviewsQuery reads only login and __typename, so each author's databaseId must be added. resolve-review-threads step 2 fetches every thread's whole comment list today, bodies included. The owner's go is a CLI act: reuse an existing h9k verb if one fits, otherwise add one subcommand and name it in the PR summary. A declined non-member thread stays unresolved and still holds a pre-approved merge, as an unresolved thread does today; that is intended. HasHumanEngagement must not count a non-member's new thread as cause to lift the per-obstruction cap. Parked: the opt-in countersign re-requests review from every reviewer, and GitHub may refuse a request to a non-collaborator; unreachable while the interaction limit holds, an idea before task C lifts it.

  Split 2026-10-11 by the project window under Brian's delegation (challenge nice (a)): this task, A1, is the gate alone and closes the security hole. A2, stacked on this task, adds the read-only evaluator that drafts an assessment for the owner before the go; leave a clean seam for it at the needs-you item (the item must be able to carry an assessment link later), but build no evaluator here.

  From the A1 challenge (verdict in this task's journal): h9k status gives each task row one attention cause (AttentionComposer), and a running lap's state replaces it. So several items on one task, or an item beside a member's running lap, need their own list on h9k status; ReviewRequestPane is the precedent. A ChangesRequestedReview stored before this change carries a login only (src/Hall9k.Domain/Features/Run/ChangesRequestedReview.cs about line 52). Suggested shape, not required: the go records the feedback key as admitted, so the next poll's ordinary flow dispatches the lap and names the thread to the skill; only a review whose head has moved needs stored text. Suggested hardening: the platform's thread reply command (thread-handling.md) refuses a non-member's thread with no go. A non-member's reply inside a member's thread raises no item in this task; it is simply never read. The merge hold on an undecided item is deliberate (a stranger can stall a pre-approved merge until the owner declines; the repo's interaction limit holds strangers out until task C). Note to the window: giving the go on a stranger's feedback stays Brian's, outside the window's standing needs-you authority (window ruling under Brian's delegation, 2026-10-11).
