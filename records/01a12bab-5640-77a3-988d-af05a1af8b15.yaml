context: |-
  Ready the public hall9k repo for outside contributors: Apache-2.0 with NOTICE and third-party notices in release archives, DCO sign-off with members exempt, community files (CONTRIBUTING issues-first, SECURITY via private reporting, Code of Conduct at h9k@hallmanac.com, templates, SUPPORT), GitHub settings (description and topics, Discussions, external workflow approval, GitHub-owned actions only), and a membership gate on feedback laps so a non-member's requested changes or review threads never reach a skip-permissions agent; the interaction limit set 2026-10-10 lifts only once that gate runs on both nodes. Walked with Brian 2026-10-10/11; notes and drafts in this idea's workspace.

  Security fix from idea fd736bba (walked with Brian 2026-10-10/11; workspace notes.md, exposure findings 1 and 2). Today GitHubPullRequestInspector.ReadChangesRequestedReviews (src/Hall9k.Daemon/Closeout/GitHubPullRequestInspector.cs about line 488) admits any human who is not the PR author; CloseoutEngine reopens and requeues; the review body and inline comments go fenced into the build prompt (src/Hall9k.Daemon/Execution/AgentPromptBuilder.cs about 647-780; 'no association filter' at about 727). Unresolved threads: CloseoutEngine.cs about 1083-1185; resolve-review-threads handles every thread whoever wrote it. Reuse the trust-chain roster and fail-closed rule from AutoPrReviewEngine.DecideMembershipGate; pr-review sessions already run under a minimal permission file (ClaudeExecutor.cs about 58-66). Brian's addition: evaluating feedback before any fix lets a requested change that missed the intent be challenged. Every Hall9k user with a public repository is exposed, so the PR summary and release notes call it a security fix. Independent of task B (mention race). Notes to this window, not criteria: SECURITY.md, CONTRIBUTING.md, SUPPORT.md, the issue forms, PR template, README Security section, and enabling Discussions land with or after this task; lifting the repo interaction limit waits for this and B to be released on both nodes.

