objective: A changes-requested review or an unresolved review thread from someone outside the project's trust-chain roster never dispatches a build lap; it raises a needs-you item, and only the owner's explicit go dispatches a fix lap for it
criteria:
  - |-
    On a repository where the membership gate is on (the rule AutoPrReviewObservation.DecideMembershipGate applies: on for a public repository unless h9k project set --review-requires-membership says otherwise), a CHANGES_REQUESTED review from a human account whose numeric GitHub account id is not in the project's trust-chain roster (EnrolledNodeSnapshots) does not reopen the task into a build or fix lap until the owner gives the go for that review. Until then no skip-permissions session reads its text, either in its prompt or through a command its prompt or a skill tells it to run, including the review-requested-changes fallbacks that point at gh pr view --json reviews. A review stored on a lap reopened or queued before this change shipped carries no account id and is treated as a non-member's. A member's review, and every review on a repository where the gate is off, keeps today's flow unchanged
  - On a repository where the gate is on, an unresolved review thread opened by a non-member human does not buy a feedback lap and does not count as the human engagement that lifts the per-obstruction cap (CloseoutEngine.HasHumanEngagement). Until the owner gives the go for that thread, no skip-permissions session reads a non-member's comment text, whether that comment opened a thread or replied inside a member's or a bot's thread. Threads opened by members or by bots, Copilot's included, keep today's flow
  - Each piece of non-member feedback (one review url, or one thread id) raises exactly one needs-you item on h9k status, however many polls observe it, and dispatches no session. The item names the reviewer's login, the kind of feedback, and its link, and quotes none of the feedback's text. While the item is undecided, a pre-approved task does not merge. The owner's explicit go for that item dispatches one fix lap carrying that feedback, even when the head has moved since the feedback was observed. The owner's decline dispatches nothing and releases a review's merge hold; a declined thread stays unresolved and holds the merge, as any unresolved thread does today. Either act clears the item, and so does the feedback being withdrawn on GitHub (review dismissed, thread resolved). When member and non-member feedback arrive on the same poll, the member's lap runs carrying only member feedback, and the non-member's needs-you item is still raised rather than lost when that lap's push moves the head
  - On a repository where the gate is on, when the roster has not been computed yet, a poll neither dispatches a lap nor raises a needs-you item for human feedback, does not merge, and asks again on the next poll, which is what DecideMembershipGate's Unknown answer means; an author the provider reports as null (a deleted account) is a non-member
  - In a dispatched run, neither the prompt the daemon builds (including the thread-triage fragment that today says to read every unresolved thread) nor resolve-review-threads directs the session to read a comment a non-member wrote, unless the owner gave the go for that feedback. The session reads the body of only the comments the prompt names as members', bots', or owner-approved, leaves every other non-member thread untriaged, unreplied, and unresolved, and never files a non-member's text as an idea or a task
  - Unit tests cover a member review, a non-member review, a non-member thread, a non-member reply inside a member's thread, a Copilot thread, a mixed poll, the same non-member feedback observed on two polls (one needs-you item), the roster-unknown hold, and a private repository with the gate off; no new test creates a branch, touches git, or calls GitHub; and a test shows the owner's go dispatches exactly one fix lap carrying that feedback; tests also cover a stored review with no account id, a pre-approved task holding its merge while an item is undecided, an item rendered with none of the feedback's text, and the owner's go after the head moved
