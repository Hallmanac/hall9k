context: |-
  Observed 2026-09-22 08:4x EDT by the Mac project orchestrator (hall9k-af). Two transport notes from the Windows node arrived at 08:38 and 08:41 EDT, one marked 'FOR BRIAN, please surface in your window at once'. Nothing in the CLI could show either body in full. Verified by a challenge session on 2026-09-22 against main c0f6be5c1: the body is stored whole (MessageReceived.Body into MessageDetails.Body); h9k messages clips it with an explicit TaskListCommand.Truncate(body, 60) in MessagesCommand.cs, so widening COLUMNS does nothing; the feed line is OrchestratorFeedDescription.MessageLine, which flattens and clips the body at 160; the courier (CourierPromptBuilder) pastes feed lines verbatim and adds no truncation; h9k message handle prints only the sender's key; there is no --json, --wide, inbox file, or other read path. The window read both bodies straight from Postgres (mt_doc_messagedetails, data->>'Body') to relay them.

  Shape, ruled by Brian 2026-09-22: one task, both halves, one pull request. A read-only show command shaped like MessageHandleCommand minus the append, reusing MessageIdResolver.ResolveReceivedAsync (which already matches a fragment at either end and raises the no-match and ambiguous errors; update its doc comment, which says handle is its only caller), plus one arm in the feed description. OrchestratorFeedDescription.Of receives only the event data, not the stream id, but MessageReceived carries FromNodeId, ProjectId, and Seq, so the arm recomputes the id with no signature change. Alternatives cut: printing the full body in the table for a single unread note, a --full flag on messages, the courier carrying whole bodies (contradicts the one-line-per-item feed), a file in the project home (a second store). Project scope: the CLI has no notion of a calling window's project, so no hard guard is buildable here; mirror handle's optional --project and print the project name so a foreign id is obvious. Body: the table escapes markup after clipping and the feed goes through RelayedText.OneLine; show passes the body through ExternalText.ForTerminal (keeps line feeds and tabs, drops escape sequences, lone carriage returns, and bidi overrides) and writes raw to stdout, because AnsiConsole word-wraps at 80 columns whenever stdout is not a TTY, which is every call a window makes; raw output also removes any markup-parse risk from square brackets. Sender: a foreign node's name never replicates, so print the owner fingerprint prefix and node short id the feed and handle already print; no machine-name clause. A handoff note has an empty body by design; a mechanical kind is not filtered by the resolver, so show prints whatever handle would accept. Docs: docs/cli.md (the messages paragraph near line 606), the CLI reference skill's command list (SKILL.md near lines 409 to 418), and the message branch description ('see h9k messages to read what arrived'). No TestConsole seam exists and CLI commands are tested through RunAsync against Postgres, hence the database-free line composer for the golden. Recorded in notes/prototype-feedback.md, entry 2026-09-22 08:4x (hall9k-af).
