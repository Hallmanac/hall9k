objective: |-
  A transport note can be read in full from the CLI: h9k message show <id> prints the whole note (sender, project, kind, about, sent and received times, handled state, and the body through the terminal-safety filter, unwrapped), and the orchestrator feed's line for a received note starts with the note's short id, so a window can go from the courier's delivery to the full text without reading the database
criteria:
  - |-
    h9k message show <id> [--project <PROJECT>] (id or an unambiguous fragment, resolved by MessageIdResolver, narrowed by --project exactly as h9k message handle is) prints one received note: the sender's owner fingerprint prefix and node short id, the project's name and short id, the kind, the about-task if any, sent-at and received-at in local time, handled or unread, then the body on its own lines passed through ExternalText.ForTerminal and written to stdout without console wrapping so its line structure survives a non-TTY caller. A mechanical-kind note prints its payload the same way. It appends nothing to the note's stream and never marks it handled. Unknown and ambiguous ids fail with the resolver's own messages
  - |-
    The feed description for a received non-handoff note starts with the note's short id: '<short id> a message from <sender>: <body>', the short id being DomainId.Short of MessageStreamId.ForMessage over the event's own sender, project, and seq; the sender text and the 160-character clip are unchanged; the goldens that pin this line are re-pinned; a unit test proves the printed id equals the note's stream id for the same three values
  - |-
    h9k messages' hint column reads 'h9k message show <id> · h9k message handle <id>' for an unread note and 'handled · h9k message show <id>' for a handled one; docs/cli.md, the CLI reference skill's command list, the message branch description in CliCommandTree.cs, and MessageIdResolver's doc comment name the new command. Tests: a golden over a database-free line composer for show, covering a multi-line body with square brackets and a bidi override; the resolve path added to MessageTransportTests' existing handle round trip. No git or transport integration test
