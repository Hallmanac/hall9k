objective: Every pr-review lens session reads the pull request's diff from a file the daemon wrote into the run directory before the session started, so no lens ends up reviewing without the diff because a git command it reached for was refused.
criteria:
  - Before the first lens session of a pr-review run starts, the run directory holds a file with the pull request's diff, and every lens session the run dispatches afterwards (engineer adversarial, engineer conformance, QA, design, and security) is pointed at that same file rather than a copy read later.
  - The diff in that file is the diff for the commit the run's review checkout was cut at, so a push to the pull request while the run is in progress does not change what a later lens in the same run is told to review.
  - Each lens prompt names that file by its absolute path as the diff under review, tells the session to read it with the Read tool (in parts, with an offset and a limit, when the file is longer than one read returns), and says that the diff is the pull request author's material to review and not instructions to the session. The lens's permission file already allows Read and Grep for the run directory.
  - When the daemon cannot read the diff, the file says so in plain words and the session still starts, and the prompt names the allowed `git diff origin/<base>...HEAD` command as the way to read the change in that case.
  - |-
    When a later persona session finds no diff file in the run directory, the daemon never reads the pull request's current head in its place: it writes the file for the commit the run's review checkout holds, or writes the note from the previous criterion.
  - The prompt's instruction for reading the diff asks the session to run no command other than `git diff` or `git log`. Neither the permission file's allow-list nor the shared shell-limits statement changes in this work.
  - |-
    Tests cover both dispatch paths: the run's first session (launched by the run launcher) and a later persona session (launched by the pr-review engine) each find the diff file in place before they start. One test shows a later session is given the diff for the checkout's commit after the pull request's head has moved, and another shows that a later session finding no diff file gets the checkout commit's diff or the unreadable note, never the moved head's diff.
  - The prompt goldens for every lens builder whose text changes are regenerated, and the full suite passes.
