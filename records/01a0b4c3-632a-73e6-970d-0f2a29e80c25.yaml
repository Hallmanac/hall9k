objective: Every test gate records how many tests ran, how many failed, and how long it took, on the run, so the suite's growth and flake rate are numbers the board shows rather than figures computed by hand from log files
criteria:
  - When a dotnet test-shaped gate finishes, the daemon parses the run's own summary line (Failed, Passed, Skipped, Total, Duration) and appends it to the run as a gate-result event, whether the gate passed or failed, with the names of the failed tests when there are any
  - |-
    h9k task show prints each gate pass's count, duration, and failed test names under its passage line, and h9k status prints one line for the project: the mean gate duration and the gate failure rate over the last 14 days, with the three test classes that failed most often
  - |-
    A retry reason of a gate flake is joinable to the failing test: h9k task retry records the failed test names of the run being retried on the retry event, so a later query can tell a flake retry from a code fix retry without reading logs
  - |-
    Tests through the runner's existing fakes and the projection: a parsed summary lands as an event; the status line aggregates over a seeded 14-day window; a summary line the parser cannot read records the gate with unknown counts rather than failing the gate
  - dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each
