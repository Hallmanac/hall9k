context: |-
  Test-hygiene move 3 of 3 from the 2026-09-18 analysis (notes/decisions-2026-09-18-hall9k-fb.md): the measurement half of the test-growth budget, in the spirit of tools before tokens (the daemon does the deterministic counting; the review prompt only judges). Today the window computed these numbers by hand from 539 verify-test.log files (mean 12.3 minutes, 59 failures, top classes) and the suite grew by 878, 1,742, and 1,132 tests over the last three weeks with nothing on the board saying so. The judgment half (a review finding when a new test duplicates existing coverage) is a project prompt addendum on the agent builder, set by the window on 2026-09-18, not code. Parked unassigned until the distributed-team chain (idea 202383dc) drains (Brian, 2026-09-18).
