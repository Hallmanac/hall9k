objective: |-
  `h9k task drive <id>` (the verb Card 0 renamed from `task work`) becomes the front door: by default it claims a task interactively (or re-enters a claim the caller already holds, at any phase before the PR opens) and prints one launch line that starts a task-scoped session; that session drives the task's existing verbs on the human's word from the build through the pre-PR review loop, and the README and getting-started guide point new users to it.
criteria:
  - |-
    **The verb.** `h9k task drive <id>` keeps every option it has today and the states it accepts today, and claims through the same `ClaimInteractively` path, recording the same events; what changes is its default output (criterion 2). On a task the caller already holds interactively it re-enters at any of the run states criterion 4 names, not only Dispatched or Running. It refuses a Done task, saying iterating on an open pull request is not supported yet (Card 5 replaces that refusal), and refuses pr-review tasks as it does today.
  - |-
    **The launch line.** It prints the worktree, the branch, and one line, rendered by an extension of `LaunchTextDefaults` that takes the anchor path, settings path, opening message, and target shell: `cd` into the worktree, then `claude` with the arguments `--direct-launch` passes today (`BuildInteractiveArguments`: the run's settings file, `--name` with the claim's interactive session name, and `--dangerously-skip-permissions` only when the project's skip-permissions setting is on), plus `--append-system-prompt-file` with the absolute path of the task anchor, `--model` and `--effort` named explicitly with the same model and effort this node's build stage would give a headless run of this task, and an opening message naming the task. It does not pass the orchestrator line's `--setting-sources project` or `--strict-mcp-config`. When no effort is set anywhere on the build chain, the line omits `--effort` and says in one line that the model's own default applies, as it would to a headless run. When the run already has a registered session, the line resumes it with `--resume <session id>` in place of the opening message, keeping the anchor, settings, model, and effort arguments, and the fresh line is printed beneath it as the fallback if that conversation cannot be found. PowerShell gets its own separator and escaping as the orchestrator line does.
  - |-
    **The task anchor.** A per-run anchor, rendered from a new template under `.claude/templates/` into the run directory, carries: register first (`h9k task register-session`); read `h9k task show` before every move; never advance a phase without the human's word; the map from instruction to verb ("do the build" is build it here or `h9k task delegate`, "run review" is `h9k task deliver` then `h9k review proceed`, "fix it myself" is `h9k review fixed`); that delivering changes the session's job from builder to driver rather than ending it; that when the human says to delegate the build, the session runs `h9k task delegate` and does not build it itself; that after delivering it edits the worktree only at a verdict-to-fix park on the human's word, and while a delegated contractor builds it leaves the worktree alone until the contractor reports done; that the human's commits stay in this worktree on this node; and the project's `--writing-conventions` text, rendered into the anchor exactly as the platform pastes it into a headless session's prompt, because this session writes commits and the PR summary under the owner's login. If the project home has `recipes/task-drive.md`, the anchor tells the session to read and follow it.
  - |-
    **Levers after deliver.** `register-session` and re-entry accept an interactive claim whose run is Dispatched, Running, Verifying, UnderReview, or ReviewParked, not only Dispatched or Running. A registration on a run past Running records the session and its name and nothing else: the run's state stays where the pipeline put it (in `RunAggregate`, `RunDetails`, and `RunListItem`), and the review or fix sessions already recorded on the run stay recorded. The verdict-to-fix park text (`InteractiveBoundaryChoices`) no longer tells a human to edit a worktree the prompt told them to leave.
  - |-
    **Contractor milestones.** `h9k task delegate` accepts a call from the claim's own registered session, recognised as `deliver` recognises a self-invocation, and still refuses while any other session is attached. A build contractor started by `h9k task delegate` under a claim with a registered session gets that session's address and sends its claimed and done milestones, using the existing outbound milestone vocabulary.
  - |-
    **PR body.** `h9k task deliver` takes `--pr-summary <file>`; the file is captured as the run's PR SUMMARY artifact, so the PR body is built from it exactly as from a headless session's block. The task anchor tells the session to compose that file with the `pr-summary` skill before delivering.
  - |-
    **The paste flow stays.** `h9k task drive --print-prompt` prints today's prompt handoff exactly as the verb does before this card, for a human who pastes it into a CLI themselves; help text names both modes.
  - |-
    **The front door.** `README.md` and `docs/getting-started.md` each gain a short section on driving a task yourself with `h9k task drive`, from manual to full auto. The `h9k task` branch description mentions it. `docs/cli.md` and `docs/operations.md` ("Taking the wheel") document the verb, and `ORCHESTRATOR-WINDOW.md`'s pointer to levers "documented under both in `AGENTS.md`'s *Build / test / run* section" names the `hall9k-cli-reference` skill instead.
  - |-
    **The generator's fourth scope.** `.claude/skills/orchestrator-recipe-generator/SKILL.md` adds `recipes/task-drive.md` as a scope: in "What you write", the carry-rule list, and the canonical-block placement rule (Writing conventions and Voice), with a contract section beside the two scoped recipes. No C# reads it beyond criterion 3's existence check.
  - |-
    **Tests.** Tests cover: the launch-line rendering for bash and PowerShell (the target shell passed in, so one host renders both), fresh and resume, the resume line keeping the anchor and printing the fresh fallback; the line naming `--model` and `--effort` with the node's build-stage pair, omitting `--effort` with its notice when none is set, and passing `--dangerously-skip-permissions` only when the project allows it; the anchor rendering with and without `recipes/task-drive.md`, and carrying the project's writing conventions; the claim and re-entry state rules, including the Done refusal; `register-session`'s widened state rule, including a registration at Verifying and at UnderReview that leaves the run's state and its recorded review session unchanged; `delegate` accepting the registered session's own call and refusing a second live session; `deliver --pr-summary` producing the artifact the PR body reads; and the contractor prompt carrying the address. No test cuts a worktree, creates a branch, or touches GitHub.
