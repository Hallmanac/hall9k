objective: Effort is settable per session role on a node (h9k config set --effort-build through --effort-courier), once per project (h9k project set --effort), and once per task (h9k task revise --effort); a session's effort resolves task, then project, then the node's role value, then the node-wide --effort, then the model's own default, and h9k config show and h9k daemon status show every role's value and origin
criteria:
  - h9k config set accepts --effort-build, --effort-fix, --effort-review, --effort-review-verify, --effort-review-finalpass, --effort-synthesis, --effort-refinement, --effort-publication, and --effort-courier, each taking low, medium, high, xhigh, or default to clear; review-verify and review-finalpass fall through to review's value before anything below it, matching how their models resolve; the existing node-wide --effort keeps its meaning as the level beneath every role value
  - |-
    A project and a task each carry one optional effort: h9k project set <project> --effort <level|default> and h9k task revise <id> --effort <level|default>; a session's effort resolves in this order, the first level set wins: the task's value, then the project's value, then the node's value for the session's role (for a verify or final pass: the pass value, then review's), then the node-wide value, then unset so the model's own default decides; h9k project show and h9k task show print the value when set; the project's value is stored beside the project's model in the node-scoped project settings event and never replicates, and the task's value is stored on the task like its model and travels with the task
  - Every session the daemon launches gets its effort resolved at the dispatch site by a DaemonOptions resolver over the role, the task's value, and the project's value (with verify and final-pass variants), carried on the spawn request as a required field beside Model so no site can forget it, and written by the executor into the settings file as effortLevel; h9k task start and h9k task delegate, which write their own settings files from the CLI, resolve the build effort beside their build-model resolvers over the same chain; a session with nothing set at any level leaves the key out of the file exactly as today; the interactive role and a person's own h9k pr review lap are excluded and honor the person's user-level setting
  - The four level names and the resolution chain live in the domain as vendor-neutral values (AgentEffort and the resolve function), with the Claude Code effortLevel key known only to the Claude executor and the CLI's settings-file writer; no vendor string appears in the domain or in the stored settings, so a second executor adds one mapping and touches no resolution code
  - h9k config show prints one effort line per role beneath the node-wide line, each naming its value and origin (config file, environment, or which level it falls through to), and h9k daemon status prints the same rows for the settings a daemon started now would bind, in the same shape the per-role model lines already use
  - A test over the resolve function proves the chain with a task value winning over a project value, a project value winning over a node role value, a role value winning over the node-wide value, one role falling through to unset, and review-verify falling to review; a test over the settings-file writer proves the resolved value lands as effortLevel and an unset one leaves the key out; the existing node-wide effort tests still pass unchanged
