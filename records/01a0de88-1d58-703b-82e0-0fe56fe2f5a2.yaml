context: |-
  Brian, 2026-09-26, in the hall9k project window, after reviewing the Mac's model settings: he wants effort per role, the same shape the per-role model settings already have, plus one override at the project and one at the task, the further down the higher the priority. Walked and challenged 2026-09-26; verdict in this task's journal.md. Verified against main at a1237be0e. Today: OperatingSettings.Effort and DaemonOptions.Effort hold one node-wide value (low, medium, high, xhigh; null leaves the key out so the model's own default decides); ClaudeExecutor near line 58 writes AgentEffort.FromInput(options.Value.Effort) into every session's settings file via ClaudeSettingsFile.Build (effortLevel key, src/Hall9k.Connectors/Prompts/ClaudeSettingsFile.cs near line 100). The executor cannot resolve task or project values: AgentSpawnRequest (src/Hall9k.Daemon/Execution/IExecutor.cs) carries TaskId and no project id, and Model already arrives pre-resolved from each of the sixteen dispatch sites, which hold task.Model and project.Model; effort travels the same way. TaskStartCommand.cs near line 204 and TaskDelegateCommand.cs near line 124 write their own settings files from the CLI and resolve the build model over the OperatingSettingsReport (TaskStartCommand.ResolveBuildModelAsync near line 636); PullRequestReviewCommand.cs near line 1317 writes one for a person's own lap and is excluded. Pattern to mirror: RoleModelSettings (OperatingSettings.cs near line 332, nine nullable strings, AsPairs) bound by name to RoleModelDefaults on DaemonOptions near line 886, ModelByRole.For(role), ResolveModel near line 799, ResolveVerifyReviewModel near 813 and ResolveFinalFullPassReviewModel near 840 (task, then the pass knob, then review's chain), ConfigSetCommand's --model-build through --model-courier options near lines 93 to 132, and OperatingSettingsRendering.Rows near lines 64 to 78, whose fall-through text serves both config show and daemon status without touching SettingOrigin. Storage: a RoleEffortSettings beside RoleModelSettings; Optional<AgentEffort> Effort on ProjectSettingsChanged (node-scoped, EventScopeRegistry.cs near line 256, the same half the project's model lives in, so it never replicates and cannot collide with the team-settings ordering fix of 1629bc9d); Optional<AgentEffort> Effort on TaskRevised (project-scoped, near line 99, travels like the task's model). Scope reminder for the builder: node and project effort are local to the node that set them; a task's effort travels with the task and wins on every node. Effort per model was considered and rejected at the walk. The model chain's own reorder (project above node role) is task f8fe7435, not this one; do not change model resolution here. Placement: the Mac. Dispatched sessions must not run install, update, join, or reconcile against the live install. No em dashes in anything authored.
