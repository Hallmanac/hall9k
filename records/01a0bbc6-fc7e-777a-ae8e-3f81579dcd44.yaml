context: |-
  The platform owns the orchestrator's watching: a lesser-model watcher session that polls the daemon (transport messages, actionable log lines, parks) and forwards only actionable items to the orchestrator window, spawned from the orchestrator recipe; longer term the daemon itself notifies or kicks off an agent when something actionable lands, so no window polls. Brian, 2026-09-19: no machine-level background tasks (memory limits differ per machine); something agentic that is looking for work, on a cheap model, with the high-end orchestrator deciding. First hand-written form: recipes/watcher.md in the hall9k project home; the recipe generator should emit it.

  Piece 1 of 3 of idea 89471598 (the orchestrator feed and courier), walked with Brian 2026-09-19 18:0x EDT; his calls: refuse a second live orchestrator by default (with --replace), and put the presence line in h9k status. Why presence needs an explicit register: Claude Code's session registry cannot tell the orchestrator from discovery, refinement, or planning sessions that also run in the project home (Brian has had two or three at once), and other vendors' CLIs may have no registry at all; a process id is universal. Consumers: piece 3 (the courier) spawns only when an orchestrator is live and otherwise leaves the feed undrained; the orchestrator start-up drains the feed. Pointers: h9k orchestrator command group (CliCommandTree), the launch anchor (recipes/launch-anchor.md, generated by the orchestrator-recipe-generator skill, which must emit the register call), TaskRegisterSessionCommand.ReadClaudeSessionName for how a session name is read today, EventScopeRegistry (the new events are NodeScoped). Siblings: piece 2 the feed (independent), piece 3 the courier (stacked on the feed, blocked by this). Placement: Mac, after the fingerprint pair (f72138e1, 693ffe5d) lands.

