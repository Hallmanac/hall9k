objective: |-
  The daemon knows whether an orchestrator window is live for a project on this node: the orchestrator registers itself by session name and process at launch and deregisters at shutdown, the daemon checks the process for liveness, and h9k status names the live orchestrator
criteria:
  - h9k orchestrator register --project <name> --session <session-name> --pid <pid> --cli <claude-code|codex|...> records an OrchestratorLaunched event carrying those four facts and the time; registering the same session again is a no-op; registering a second live orchestrator for the same project on this node is refused naming the live one, unless --replace is passed, which records the previous one as shut down first
  - h9k orchestrator deregister --project <name> records an OrchestratorShutDown event; the launch anchor's start-up sequence calls register as its first step and the recipe's restart and close steps call deregister, so the audit trail exists without the operator doing anything
  - The daemon answers whether an orchestrator is live for a project from the latest registered session whose process is still alive on this node; a registered process that is gone is recorded as OrchestratorLost by the next sweep with the time; liveness is by process id so it works for any vendor's CLI
  - h9k orchestrator status --project <name> prints the live orchestrator (session name, CLI, process id, since) or 'none live' with the last shutdown or loss time; the h9k status header gains one line saying the same
  - Unit tests cover register, no-op re-register, refusal and --replace, deregister, and the lost transition through a fake process probe; a test proves the launch anchor text carries the register call; no test creates branches or touches GitHub
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder
