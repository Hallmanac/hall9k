  Platform defect captured under the dogfood rule (idea 202383dc chain). Evidence, 2026-09-18: C prime 28953e7d was retried at 10:47 right after #470 merged to main (f0e15114: the TaskHolderClaimTests skips and the invite clock fix). The resumed build session (run 01a0b4fb) found its branch on 22e0ed92, one commit behind main, wrote in its handoff.md that "dotnet test will keep failing on exactly one test, InviteCommandsTests.A_member_of_project_invite_..., until this branch is rebased past origin/main", and correctly did not rebase itself. The daemon then ran the initial verification on that stale base at 11:27 and the gate failed at 11:44 on exactly that test (1 of 6236), costing the chain another lap; the pre-push rebase that would have brought main's fix in runs only after the gates. The clean-base comparison could not exempt it because clean main passes. The window rebased the worktree's branch onto origin/main by hand at 12:2x and retried. Lineage: not a fix of a fix; the pre-push rebase order predates this week's changes. Published unassigned: it interferes with the chain (one lap lost today) but the slots are full and the chain comes first (Brian, 2026-09-18).
