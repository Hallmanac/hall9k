objective: |-
  A retried or resumed run verifies against the base branch as it is now, not as it was when the branch was cut: before the initial build and test gates run, the branch is replayed onto the current tip of its base (or, for a stacked child whose parent has merged, onto the project's base branch), so a fix already merged to main is never missing from a gate that needs it
criteria:
  - Before a resumed run's initial verification, the daemon fetches the base and replays the branch onto its current tip by the same mechanical rebase the pre-push step already uses (the recorded boundary, never merge-base); for a stacked child whose parent has merged, the target is the project's base branch and the stacked edge is treated as satisfied; a conflict routes to the existing guided fix session instead of running the gates on the stale base
  - A first-run build session is told, in its prompt, the base commit its branch stands on and that the daemon replays before verifying, so it never has to rebase itself and never reports a known-stale gate as its own failure
  - h9k task show names the base commit each verification pass ran against, and a gate that fails on a test which passes on the current base is marked as such in the failure reason rather than only in the clean-base comparison
  - |-
    Tests through the runner's existing fakes: a resumed run on a branch behind main is replayed before its gates; a stacked child with a merged parent is replayed onto the base branch; a replay conflict skips the gates and routes to the fix session
  - dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each
