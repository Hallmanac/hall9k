context: |-
  Origin: TaylorDenny, 2026-10-06 (transport note c0330015 in arx-platform, item 2; read it with h9k message show c0330015 --project arx-platform). His task 51939c4c failed outright at launch on 2026-10-03 when git fetch of the pull request ref reported "Could not resolve host: github.com". The Parallels link is flaky; the daemon's own database connection recovered on its own, but the launch needed a manual retry.

  Where it lives (line numbers from origin/main at 5fa78e34b, checked 2026-10-08):

  - src/Hall9k.Daemon/Execution/RunLauncher.cs: LaunchAsync calls worktrees.CreatePrReviewCheckoutAsync at line 309 (only PullRequestHeadMovedException is caught there) and, for a follow-up, worktrees.CheckoutExistingAsync at line 336; both sit inside the try whose catch at line 1007 passes every exception to RecordLaunchFailureAsync (line 2578). That method appends TaskFailed ("Launch failed: ...") behind the generation fence (GenerationFence.LoadFencedAsync, AllowsAsync, and an expectedVersion append that loses cleanly to a newer claim) and deletes the TaskLease. The requeue here must go through that same fence. No run stream exists at checkout time: RunDispatched starts it at line 672, after the checkout.
  - src/Hall9k.Connectors/Worktrees/GitWorktreeManager.cs: CreatePrReviewCheckoutAsync fetches refs/pull/N/head at lines 207 to 211 through RunGitAsync (line 999), which throws a bare WorktreeException carrying git's stderr. CheckoutExistingAsync's arm at lines 161 to 174 throws a bare WorktreeException embedding the failed fetch's error when the branch is not local and origin could not be read. Every other fetch in this file is best-effort (BestEffortFetchAsync, line 868) and never fails a launch. The precedent for a typed failure is BranchGoneException and PullRequestHeadMovedException; a typed subclass for "origin unreachable" thrown at these two sites lets LaunchAsync catch it by type rather than parse messages. Note that CheckoutFreshOrRetryAsync (RunLauncher.cs line 2521) already catches WorktreeException for an own-node retry branch and cuts fresh; that behaviour is unchanged.
  - How a requeue is expressed today: TaskDecider.Requeue (TaskDecider.cs line 1582) appends TaskRequeued with a RequeueReason (RequeueReason.cs; RunSupervisor.CompletePreflightAsync uses PrReviewPreflightSafe and PrReviewPreflightRetry at RunSupervisor.cs lines 355 and 453) and the caller deletes the TaskLease. Nothing today keeps a Queued task from being claimed on the next poll: DispatchEngine.ReadQueueAsync (DispatchEngine.cs line 945) reads every Queued row. The smallest carrier is an additive change: a new RequeueReason for this case and optional fields on TaskRequeued for the attempt, the not-before time, and git's error, carried on TaskAggregate (which TaskDecider.Claim decides from, TaskDecider.cs line 1518) and projected onto TaskListItem (which ReadQueueAsync filters) and TaskDetails (which h9k task show reads), with one shared predicate so ReadQueueAsync and Claim skip the row until then (the two must never disagree, the same discipline IsPlacedOnThisNode follows). TaskRequeued already replicates across the fleet (PartialReplicatedStreamRules.cs line 101), so other nodes see the same wait.
  - The bound and the backoff are DaemonOptions values beside SessionErrorRetryBackoff (DaemonOptions.cs line 528); no h9k config set key.
  - The feed line is a new arm in OrchestratorFeedDescription.cs (TaskRequeued has none today; TaskFailed is line 136) plus its OrchestratorFeedInterest entry.
  - Test precedent: tests/Hall9k.Tests/Integration/PrReviewTaskEngineTests.cs line 286 (RefusingWorktreeManager) and Integration/RunLauncherTests.cs. GitWorktreeManager runs git through Process directly, not ProcessRunner, so the stub sits at IWorktreeManager.

  Deliberately not used, and why:

  - The node-wide launch hold (LaunchHoldEngine, RunLaunchHeld, RunSupervisor.cs lines 237 to 260): it holds a run and its probe resumes the oldest held run's session, but a checkout failure happens before any run stream exists, and the hold shuts claims for every project on the node while an unreachable origin is one remote's problem.
  - An in-place retry inside the launch (the shape of ReadOwnLoginWithRetryAsync, RunLauncher.cs line 1292, three reads with a short pause; commits 984186a70 and 98a4aaeef): DispatchLoop awaits each LaunchAsync in turn (DispatchLoop.cs line 179), so a wait of minutes would stall every other dispatch and the lease sweep on the node.

  Out of scope, each with a trigger to revisit:

  - The mention follow-up launch (RunLauncher.cs lines 1157 and 1269) keeps failing as today. It runs under a sentinel claim with no lease (AutoPrReviewEngine.cs around line 2508), and a plain requeue loses the pending follow-up (the RequeueReason doc on PrReviewPreflightRetryMentionFollowUp records that exact loss). Revisit if a mention follow-up lap fails at launch on a network error.
  - A network failure in the gh read before the checkout (FetchOpenPullRequestFactsAsync, RunLauncher.cs line 2090) or in ResolveStartPointAsync on a node that never fetched its base. Revisit on a sighting.

  Smallest fix: classify git's error at the two throw sites, requeue through the fence with a not-before and an attempt count, bound it, and show it; no new engine, no new sweep.

  Notes from the challenge pair (2026-10-08). The feed line is a new arm in OrchestratorFeedDescription.cs (TaskRequeued has none today; TaskFailed is line 136) and a Transitions entry in OrchestratorFeedInterest admitted only for the new RequeueReason, through the same content gate Admits applies to PullRequestAutoMergeAttempted (OrchestratorFeedInterest.cs line 94 and the doc above Admits at line 215), so a lease expiry, a pre-flight requeue, or a release still adds no feed item. The not-before time is carried on TaskAggregate (which TaskDecider.Claim decides from, TaskDecider.cs line 1518) and projected onto TaskListItem (which ReadQueueAsync filters) and TaskDetails (which h9k task show reads), with one shared predicate, the IsPlacedOnThisNode discipline (TaskDecider.cs line 1579, DispatchEngine.cs line 1773). TaskRequeued also carries the bound in force when it was written, because the CLI cannot read DaemonOptions (TaskStartCommand.cs line 635), so h9k task show prints the bound from the event. The typed exception derives from WorktreeException, so CheckoutFreshOrRetryAsync's own-node catch (RunLauncher.cs lines 2521 to 2522) still takes it and cuts fresh exactly as today. A network requeue has the same effects on the task as a lease-expiry requeue (DispatchEngine.cs line 316); nothing beyond the new fields is preserved or cleared differently. A fleet node on an older build ignores the new optional fields and claims the task at its next poll, then fails at once on its own network error, which is no worse than today. The consecutive count resets on any return to the queue, not only on another TaskRequeued (a reopen or a retry reaches Queued with no TaskRequeued at all). Test precedent: the checkout-throwing stubs in tests/Hall9k.Tests/Integration/RunLauncherTests.cs (BranchGoneWorktreeManager at line 2263, HeadMovedWorktreeManager at line 3960). The Windows reset wording ('Connection was reset') is from commonly reported output, not observed on Taylor's node; the build confirms it.
