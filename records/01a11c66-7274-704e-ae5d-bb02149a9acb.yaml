objective: A launch whose worktree checkout cannot reach origin because of a transient network error is retried on a bounded backoff before the task is failed, so a brief outage turns a failed task into a slow one instead of a needs-you row
criteria:
  - When a launch's worktree checkout fails because git could not reach origin (the pr-review checkout's fetch of the pull request's head, or a follow-up's or another node's branch resume when this node does not hold the branch and origin could not be read) and git's error matches the named list of network failures (could not resolve host, failed to connect to, connection timed out, operation timed out, connection refused, connection reset, connection was reset, network is unreachable; matched without regard to case), the task returns to the queue with no lease held and no TaskFailed appended, and no node claims it until its backoff has passed (two minutes by default, doubling with each consecutive retry).
  - The third consecutive such failure (the bound is a daemon option defaulting to three) fails the task with a reason that names how many attempts were made and quotes git's last error. Consecutive means the count starts again at one for a task that returned to the queue for any other reason in between.
  - |-
    Every other checkout failure behaves exactly as today: a fetch git refused for a reason not on the list (such as no such ref, or authentication refused), or any other failure that reaches the launch's catch, still fails the task at once with today's 'Launch failed: ...' reason, and an own-node retry whose branch cannot be resumed still starts clean from the base.
  - While a task waits out this backoff, h9k task show says its launch is waiting to retry after a network error, with the attempt count, the bound, the earliest time the next claim may happen, and git's error, and it stops saying so once the task is claimed again; the orchestrator feed carries one line for each such retry, and a requeue for any other reason still adds no feed line.
  - |-
    Tests cover the outcome without running git or touching the network: a unit test of the classification over git error text (each listed phrase is transient in any letter case, including the exact line 'fatal: unable to access 'https://github.com/x/y.git/': Could not resolve host: github.com'; 'couldn't find remote ref' and 'Authentication failed' are not), and daemon tests over a stub IWorktreeManager whose checkout throws, showing a transient error leaves the task queued, unclaimable before its backoff, with the attempt recorded; the third consecutive one fails the task with the attempts and the error in the reason; a task that went back to the queue another way between two network failures (a requeue for another reason, a reopen, or a retry) counts the second one as attempt one; a non-transient error fails it at once.
