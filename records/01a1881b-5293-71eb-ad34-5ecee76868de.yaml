context: |-
  A Linear connector, so a project whose work and backlog live in Linear gets the same tracker integration hall9k gives Jira and GitHub issues.

  Build notes. The shapes to follow are ConnectionAddJiraCommand, WorkItemConnections (ImporterAsync and its Unusable map), JiraWorkItemProvider (ImportAsync gated, ReadAsync not), TaskLinkJiraCommand, and JiraIssueKey.FromUrl. The viewer id goes on ConnectionTrackerIdentityObserved, the name on ExternalAccountId, and the workspace address on the existing SiteUrl, so ConnectionDecider's non-Jira site rule changes and no new event is needed. Keep Linear's triage state distinguishable from other non-open states at the importer, so the idea-link card can admit it without reworking the gate. This card alone is inert until someone registers a Linear connection.

  Facts this card leans on are cited, and the unverified ones are listed, in notes/challenge-e76868de/journal.md in the project home; the discovery workspace's findings.md holds the survey.

  Out of scope: team binding, the one-tracker rule, doctor, and the branch template (the card stacked on this one), claim gate and mirror (B), PR title and closing words (C), creating issues (D), reassign (E), idea links (F), any webhook, and OAuth.

