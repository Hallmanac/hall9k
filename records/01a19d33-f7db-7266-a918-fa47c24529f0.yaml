  ```
  Title: Tell a plan's refinement session what a solution epic's other member tasks are

  Work item: [#843](https://github.com/Hallmanac/hall9k/issues/843)

  A refinement session for a draft in a solution epic now sees the tasks under the epic's copies in the other member projects registered and joined on this node. Each is listed with its id, project name, objective, and state, with done and abandoned tasks marked. The list is quoted inside a computed fence and followed, outside it, by the rules for using it. A draft in a project epic or in no epic sees nothing new, and the discovery prompt is unchanged.

  The no-quote rule exists because a revision replicates through the project's public ledger and tracker. For the same reason, a recorded dependency-failed reason now names a blocker in another project by short id and state only; a blocker in the dependent's own project reads as it does today.

  Reviewers can focus on `SolutionEpicMemberTasks.Choose` for which copies and members count, and on the new `plan-refinement.md` template fragments for the rules.
  ```
