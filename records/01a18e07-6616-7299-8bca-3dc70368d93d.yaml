context: |-
  Observed 2026-10-30. Autostart was enabled that day, and the 12:06 EDT v0.15.0 restart was the first launchd-owned start. Host gates had taken about 13 minutes under a hand-started daemon; the next four all hit the 30-minute limit, and PublishBudgetExceededException fired at 300 seconds. Gate dotnet processes showed scheduling priority 4, the same as backupd, while the plist said ProcessType Background (LaunchdDaemonAutostart.cs:151-152). Removing that key by hand and rebootstrapping moved them to 20 at 14:16 EDT, and the serialized host gates since then took 14m51s, 13m11s, and 13m09s, so the baseline is back. Priority 20 is launchd's standard band, not the 31 of a terminal session; ProcessType Interactive would give 31 and was rejected, so do not add it. The key dates from d9c0b85bd with no recorded reason, and nothing else reads it.

  Why the cure sits in LaunchdDaemonAutostart.StartAsync (:80-95): the restart hand-off runs stop, doctor, and start in the newly installed binary (DaemonRestartHandoff.cs:106-110), while h9k update and h9k install run in the old one and never touch the plist. EnableAsync cannot serve either, because it needs the observed environment. Why a reload is needed: launchd keeps the loaded definition. A job loaded and idle, reachable because stop returns early when no daemon is running (DaemonLifecycle.cs:314-338), makes bootstrap fail and falls to kickstart, which measured the old classification with a cured file on disk; only bootout then bootstrap applies it. Bootout is safe here because DaemonLifecycle.StartAsync refuses a running daemon, and Exec does not throw on the nonzero exit an unloaded job gives. Do the removal in plain C#, not plutil, so its test runs on every CI leg (LaunchdDaemonAutostartTests carries no OS gate); the launchctl sequence can be pinned as a generated command list. DaemonLifecycle.cs:128-142 is the existing shape for a repair that must not cost a start.
