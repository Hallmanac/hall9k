objective: A daemon started through launchd on macOS runs its gates and agents at launchd's standard priority, not background priority
criteria:
  - The plist `h9k daemon autostart enable` writes carries no ProcessType key, and a test pins that.
  - When `h9k daemon start` goes through autostart on a plist carrying ProcessType Background, the key is removed, every other key and value stays as it was (including the recorded EnvironmentVariables), and the job launchd then runs no longer carries that classification, including a job that was already loaded and idle, so `h9k update --restart` cures an install autostart already wrote. A test pins the removal and the reload.
  - A plist with no ProcessType Background key, including one carrying another ProcessType value, is not rewritten, and its start runs the same launchctl sequence as today. A test pins that.
  - A plist that cannot be read or rewritten does not stop the daemon starting, and the output says the cure was skipped.
