objective: Regenerating an orchestrator recipe keeps every operator-placed House rule line, so rules kept by hand survive the next regeneration instead of being restored by hand each time
criteria:
  - The orchestrator-recipe-generator skill names a fourth carried form, `House rule (<who>, <YYYY-MM-DD>):`, alongside Standing grant, Opt-out, and Tier override; every place the skill lists the carried forms names all four; and it applies to every recipe the skill writes, including idea-discovery.md and task-refinement.md. A carried line is the whole paragraph or list item that begins with the marker, up to the next blank line or list item, so a rule of two paragraphs carries two markers.
  - |-
    One carry rule covers all four forms: a regeneration carries each marked line verbatim into the same-named section of the .new file, after any canonical block in that section and outside its quote so the block stays verbatim, keeping several lines in their original order; when that section no longer exists (a renamed section counts as gone), the line goes under a closing "House rules" section. Either way the generator summary lists it, and the generator never writes one of its own.
  - None of the canonical blocks the skill tells the generator to copy verbatim contains U+2014, so a verbatim copy passes the skill's own em-dash check.
