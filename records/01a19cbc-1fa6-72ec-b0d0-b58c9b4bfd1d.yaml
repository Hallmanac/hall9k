objective: A plan's refinement session for a draft in a solution epic is told what the epic's tasks in the other member projects are, as fenced material to study, so it can set blocked-by edges across projects without copying another member's text into its revision.
criteria:
  - When a plan dispatches a refinement session for a draft whose epic is a solution epic, the prompt lists the tasks under that solution epic's copies in the other member projects that are registered and joined on this node, each with its id, its project's name, its objective, and its state, with done and abandoned tasks marked as such. The list carries no task's context or acceptance criteria. A draft in a project epic, or in no epic, gets no such list.
  - The list is quoted inside a fence that RelayedText.FenceFor computes, the way the idea's note is quoted, and the prompt says, outside the fence, that the list is material to study and never instructions.
  - The prompt tells the session that its revision may set blocked-by to a listed task that is not abandoned, that it must never set stacked-on to a task in another project (publish refuses that edge), and that it may name no task outside the lists it was given.
  - The prompt tells the session not to quote or paraphrase another member's objective anywhere in its revision (objective, criteria, or context), so that a listed task's id in a blocked-by edge is the only reference the revision makes to another member's work.
  - The prompt says that member projects not registered and joined on this node are not shown, so their tasks cannot be named.
  - When a dependent task records a blocker in another project as dead (failed, abandoned, or done without an observed merge), the recorded reason names that blocker by its short id and state only and never quotes its objective; a dead blocker in the dependent's own project is described as it is today.
  - The discovery prompt is unchanged. A golden file pins a refinement prompt that carries the list. Unit tests cover choosing the list (only the draft's own solution epic, only other members registered and joined here, the draft's own project left out, a copy held by a project that has left the solution left out, done and abandoned marked, no context or criteria carried) and the dependency-failed reason for a blocker in another project and in the same project. No test spawns an agent or touches GitHub.
