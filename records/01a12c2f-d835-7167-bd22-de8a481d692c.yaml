objective: A stacked child whose parent merged and whose run's recorded fork point the pre-push rebase already moved onto main's tip is not reopened for a no-op stack-replay lap; closeout settles the stack and treats it as an ordinary delivered pull request
criteria:
  - In the ParentMergedAligned arm of CloseoutEngine.TryReplayStackedChildAsync, when the run's recorded fork point (BaseCommit) already equals the base tip the branch sits on (the observation's boundary commit), closeout appends the retarget record (calling the provider to retarget only if the PR's base still names the parent branch) and does not reopen the task, so the run no longer reads as stacked and the pull request reaches the merge bar with no StackReplay lap, no gate run, and no lap counted
  - A child whose recorded fork point was not advanced keeps today's no-op StackReplay (the shape where a fix session rebased by hand or GitHub retargeted the PR), and a child whose branch does not contain main's tip keeps today's replay
  - The new condition is unit tested without touching git, either through StackedParentWatch's optional gitProcessRunner fake seam or by extracting it into a pure decision tested directly (as StackedCheckpointPolicy is); the existing ParentMergedAligned tests in StackedChildTests still pass; no new test creates a branch, touches git, or calls GitHub
