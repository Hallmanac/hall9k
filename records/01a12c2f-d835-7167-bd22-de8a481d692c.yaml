context: |-
  Observed 2026-10-11 on 040cd5ed (PR #728, stacked on d6c9e897, which merged as #726 at 12:29) and again at 20:57 on 0e866341 (PR #736). The child was claimed at 12:21 on its parent's branch; after the parent merged, the pre-push rebase at 13:40:52 moved it onto main's tip and moved the run's recorded fork point (h9kd.log line 24500: "this run's own recorded fork point moves to 6a3b000947"; line 25124 for edadf1f6 on 0e866341). The PR opened against main. At 13:43:18 closeout's ParentMergedAligned arm (CloseoutEngine.cs, about lines 3866 to 3986) read the observed PR base correctly (line 24521, already aimed at main), skipped the retarget write, and then dispatched its deliberate no-op StackReplay (line 24522), whose purpose is to move BaseCommit onto main's tip because the arm assumes only a dispatched run ever does. Here the pre-push rebase had already done it, so the lap was pure waste: PR #728 was MERGEABLE, CLEAN, green, and pre-approved, and the reopen held its merge for about 33 minutes of slot wait plus a host gate. The missing check is "has the fork point already moved", not which base was read. The "still names" wording in the reopen message is StackedParentWatch's detail text built from the run's recorded base (StackedParentWatch.cs, about lines 840 to 845); misleading, but only a message. Update the arm's doc comment and StackedParentVerdict.ParentMergedAligned's doc, which both claim only a dispatched run moves the fork point. Challenge verdict and code references: this task's journal.md. Walk note (Brian, 2026-10-12): this is the normal end of a stack, not a parallel task.
