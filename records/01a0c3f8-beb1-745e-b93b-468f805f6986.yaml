objective: A task, idea, or run stream whose tail replicated before its genesis and materialized a document is repaired like a headless one, records held and document, lease, and stream freed, so the held tail completes the moment its genesis lands instead of h9k task pull refusing it as partial
criteria:
  - |-
    HeadlessReplicatedStreamRepair selects every local stream whose first event carries the replication origin headers (ReplicationEventHeaders) and is not that aggregate's own genesis (AggregateGenesisEventTypes.IsGenesis), restricted to Task, Idea, Epic, and Run event types; a Project aggregate lifecycle event phantom-streamed under a foreign project id (ProjectStreamReplicationRules.IsProjectLifecycleEvent) and any stream whose first event is native are never selected. The selection does not read the projected document, so a partial stream whose document carries a project id and an added time is found. On the Windows node today this selects exactly four streams: task 13d6b371 (first event TaskReturnedToDraft, Mac origin sequence 48028, TaskListItem present with a project id) and three run streams whose first event is TokensRecorded (01a0ba6a-7f2a, 01a0b9f3-142f, 01a0ba36-b90f, RunListItem present with an empty task id and state Completed)
  - For each selected stream the repair holds every replicated event as a HeldReplicatedEventRecord rebuilt from its stamped headers and its dedupe row's project id, deletes the aggregate's documents (TaskListItem and TaskDetails, or IdeaDetails, or RunListItem and RunDetails) and its dedupe rows, and frees the stream id from mt_streams, all in one SaveChanges, exactly as the v0.10.20 repair does for a headless document; a stream where a replicated event is missing a needed header or its dedupe row is left alone and logged by id
  - |-
    A native event this node's own dispatcher appended onto the phantom (TaskDependencyCompleted, TaskClaimed, TaskRequeued, and nothing else) is dropped rather than held, with one log line naming the stream, the dropped event types, and the run id the claim named, and the TaskLease for that stream is deleted in the same SaveChanges, because DispatchEngine.MeasureLoadAsync counts a lease with no run as a live slot; a stream carrying any other native event is left alone and logged by id. The 13d6b371 shape today: native TaskDependencyCompleted and TaskClaimed at 02:17 EDT naming run 01a0c1c1-54f0-7297-ab7c-fbf2d4f39b58, for which RunLauncher.LaunchAsync returned at "task or project missing" before any run stream existed, and a TaskLease that LeaseHeartbeatService keeps alive, so the claim holds one of this node's four slots and the lease sweep never requeues it
  - After the repair EventStreamCatchUp.ClassifyLocalHoldAsync reads the stream as Absent, h9k task pull with the full id queues the ask, and when the genesis answer lands the held tail replays in origin order and the task reads its true state (Queued and placed on this node for 13d6b371, so this node's dispatcher claims it afresh with a new run); the pull refusal for a stream that is still partial says the daemon repair frees it at its next start rather than that nothing can fill it in; the peers that already hold this node's shipped TaskClaimed simply receive the fresh claim later, no repair reaches them
  - The repair stays idempotent at every daemon start, logs the count it repaired and the ids it skipped with the reason for each, and a second run right after the first repairs nothing
  - |-
    Unit tests through the seams: a partial task stream with a project-bearing document is repaired and its held records replay whole when the genesis arrives; a partial stream carrying the dispatcher's native claim events is repaired with those events dropped and its lease deleted; a partial run stream is repaired and its RunListItem removed; a whole native stream, a phantom project lifecycle stream, and a partial stream carrying an unexpected native event are untouched; a second run repairs nothing. No test touches a repository or remote. dotnet build and dotnet test pass
