context: |-
  Origin: Brian, 2026-09-21 morning, Windows project window; challenged and re-evidenced by the challenge session the same morning against origin/main at v0.10.24 (b4002efe) and this node's own store. Reference case on the Windows node (01a04de3-7a23-75c0-8a06-9314ef6ab27d): task 13d6b371 (01a0ac0b-de4e-73e0-a1a5-048213d6b371, head of a five-task chain the Mac placed here). Its stream on this node, read from mt_events: version 1 TaskReturnedToDraft (Mac origin sequence 48028, applied 2026-09-21 00:01 UTC, before v0.10.20), 2 TaskRevised, 3 TaskPublished, 4 TaskAssigned (all Mac origin), 5 TaskDependencyCompleted and 6 TaskClaimed (native, no headers, 02:17 UTC, this node's dispatcher claiming the phantom with run 01a0c1c1-54f0-7297-ab7c-fbf2d4f39b58), 7 TaskDependencyCompleted (Mac origin 48781). No stream exists for that run id: RunLauncher.LaunchAsync (src/Hall9k.Daemon/Execution/RunLauncher.cs about line 85) logged "Cannot launch run: task or project missing" and returned before StartStream. A TaskLease for the task exists with a heartbeat refreshed today (LeaseHeartbeatService refreshes every lease with this node's id), so DispatchEngine.SweepExpiredLeasesAsync never requeues it and DispatchEngine.MeasureLoadAsync (about lines 1263 to 1292, NodeLoad.LiveSlots takes leases) counts it as a live slot. The 01a0c1c1 stream the earlier hand-off named is a courier run (01a0c1c1-835e), unrelated. h9k task show reads the task as Working with an empty objective and type.

  Why the v0.10.20 repair missed it: HeadlessReplicatedStreamRepair.HeadlessStreamIdsAsync (src/Hall9k.Domain/Infrastructure/Persistence/HeadlessReplicatedStreamRepair.cs lines 83 to 101) selects by the projected document (ProjectId empty or AddedAt default), and a tail that starts at TaskReturnedToDraft or TaskAssigned materializes both fields; RepairStreamAsync (lines 104 to 189) also returns false the moment any event lacks origin headers (TryReadOrigin, lines 192 to 207), which the two native events guarantee. The same document-based tell drives the board's PartialHistoryHeld filter (TaskStatusComposer line 379, IdeaRow line 41), so the row shows.

  Store survey of this node (read-only, 2026-09-21 morning): exactly one partial task stream and three partial run streams exist (first replicated event not a genesis, excluding Project lifecycle phantoms, of which there are none here); RunDetails and RunListItem for the three runs read Completed with an empty task id. Separately, 42 HeldReplicatedEventRecords over 14 Mac-origin run streams sit in the v0.10.20 held path with no local stream (their RunDispatched was never served by the Mac's --since all answer this morning); those are 9eb5b245's held-tail ask, not this repair.

  Code map: HeadlessReplicatedStreamRepair, run from DispatchLoop.RepairHeadlessReplicatedStreamsAsync (src/Hall9k.Daemon/Dispatch/DispatchLoop.cs about line 406); AggregateGenesisEventTypes.IsGenesis (TaskAdded, IdeaCaptured, EpicAdded, RunDispatched); HeldReplicatedEventRecord keyed by origin event id; the inbox held path and deferred replay in EventReplicationInbox.ApplyAsync (about lines 563 to 588) and ApplyHeldTailAsync (about 786 to 830); the append-only guard OriginHighWaterAsync (about 848 to 882) stays as it is: free the stream, never weaken the guard. ProjectStreamReplicationRules.IsProjectLifecycleEvent names the phantom streams to exclude (a teammate's ProjectArchived under a foreign id is meant to start a stream with no genesis). TaskLease is a plain document keyed by task id. The refusal text is EventStreamCatchUp.PartiallyHeldRefusal (src/Hall9k.Cli/Commands/EventStreamCatchUp.cs lines 143 to 148).

  Assumption stated for the walk: dropping the dispatcher's own native claim events is a loss of this node's local record of a claim that never ran, judged smaller than re-holding them, which would replay a claim of a dead run after the genesis and leave the task stuck Working again with no run to conclude it. Siblings drafted the same morning: 9eb5b245 (pull completeness and the held-tail ask that finishes a freed stream without a human), 252bc5cf (fleet reconcile), 74a7cd0b (bootstrap from genesis). Build this first: neither a reconcile nor a bootstrap can complete a stream that is still applied partially. Writing conventions: no em dashes, full sentences. Testing rule (Brian, 2026-09-13): no test touches a repository or remote.
