objective: Every claude process Hall9k starts for a project runs under that project's bound Claude Code account on this node, through a node-local claude-code connection, and a missing, logged-out, or wrong account refuses the spawn instead of falling back to the default login
criteria:
  - |-
    `h9k connection add claude-code --config-dir <dir>` first checks that the directory exists, and refuses a missing one without running claude, so a mistyped path is never created. It then runs `claude auth status`, using the binary Hall9k spawns, with CLAUDE_CONFIG_DIR set to the recorded path, and reads its JSON whatever the exit code. It refuses a status that reports loggedIn false, naming `CLAUDE_CONFIG_DIR='<path>' claude`, then /login, as the fix. It also refuses a status that reports no email or org id, which is what Claude Code reports when an override credential in the environment outranks the directory's login, and names the variable the status gives as the source. Otherwise it records the observed email, org id, org name, and subscription type on a NodeScoped connection event. A unit test over a fake auth-status probe covers the missing, logged-out, override, and accepted cases, and shows that the probe is never called for a missing directory.
  - |-
    The recorded path is absolute after ~ expansion, carries no trailing separator, and is not symlink-resolved; a relative path and a filesystem root are refused. Adding the same directory again re-observes that connection instead of adding a second one, and a different directory adds a second claude-code connection. Registering claude-code connections leaves the GitHub, Jira, and Linear connection lookups choosing exactly what they chose before: none of them refuses because of a claude-code connection or returns one. Unit tests cover each case.
  - |-
    `h9k connection list` shows each claude-code connection with an id the project binding accepts, its directory, its observed email, and the number of projects bound to it.
  - |-
    `h9k project set <p> --claude-code-account <connection|default>` accepts a claude-code connection by the id `h9k connection list` prints or by its directory (normalized by the same path rule), refuses one that does not exist or is not a claude-code connection, and clears the binding with `default`. The binding is recorded on ProjectSettingsChanged only, and a unit test asserts ProjectTeamSettingsChanged.From never carries it. `h9k project show` prints the binding with the account's observed email and says it is recorded on this node only.
  - AgentSpawnRequest carries the account as a required member. ClaudeExecutor sets CLAUDE_CONFIG_DIR to the exact recorded string for a bound account and removes the variable from the child's environment for the default account, and both the Unix and the Windows process managers can remove a variable. Unit tests over the composed spawn environment show the bound value set, and an inherited CLAUDE_CONFIG_DIR removed for an unbound project.
  - Every daemon site that spawns for a run takes the run's recorded account (the run freeze criterion). Every other daemon site takes the current binding of the project its work belongs to, never the working directory, and the courier takes it from the project its own CourierRunDispatched names. The security pre-flight takes the recorded account of the run that dispatched it. Of the CLI's own spawns, `h9k task start` spawns under the account it records on the run it dispatches, `h9k task delegate` and `h9k task drive --direct-launch` use the recorded account of the run they spawn into, and `h9k orchestrator measure` uses its project's binding. A CLI spawn is checked (the pre-spawn check criterion) before it claims, cuts a worktree, or appends anything, so a refusal leaves nothing dispatched. Unit tests cover the courier's and the pre-flight's resolution.
  - Each run records the account it runs under at dispatch, on a NodeScoped event that names the connection or the default and never the path or the email. This holds for runs the daemon dispatches and for runs that `h9k task start`, `h9k task drive`, and `h9k pr review` dispatch. Every later spawn for that run (resumes, review passes, verify and final passes, fix, recovery, and the pre-flight) uses the recorded account. A run with no recorded account, because it was dispatched before this change, runs under the default account it started under. A unit test shows that a binding changed mid-run does not move a run already dispatched, while the next run dispatched uses the new binding.
  - |-
    Before every spawn for a bound project, Hall9k confirms that the directory exists and then that `claude auth status`, run with the binary and the environment the spawn would get, reports logged in as the recorded email and org id. When the check fails, no process starts and nothing falls back to the default account: a daemon spawn produces one needs-you line in `h9k status` for that connection, and a CLI spawn exits non-zero with the same text on stderr. The text names the directory and the fix for what was found. A missing directory or a logged-out account names `CLAUDE_CONFIG_DIR='<path>' claude`, then /login, in PowerShell form on Windows and quoted so that any path survives. A different account names logging back in as the recorded email, or `h9k connection add claude-code --config-dir <path>` to accept the new one. A status with no email or org id names the override variable it reports. A passing check may be reused for the same directory for at most five minutes. Unit tests over a fake probe cover a missing directory, a logged-out account, a wrong account, an override credential, and a reused pass.
  - While a bound account's check fails, that account is refused, and the daemon re-checks it on its own until a check passes, without a spawn or a person having to ask. While an account is refused, no new work starts for any project bound to it. The dispatcher claims none of their tasks, and the plan, feedback-step, and auto-pr-review engines start none of their sessions, gated in the same places that already wait on the node-wide launch hold. Work for unbound projects and for other accounts continues. A refused spawn for a run's primary session (its launch or a resume), for any session spawned for the run after it (review, verify, final, fix, stack assessment, and recovery passes, the pr-review conformance session, and the spike's review and fix sessions), or for its pre-flight is held rather than failed, and resumes on its own once a check passes. Every other refused session (the lesson picker, closeout triage, note promotion, feedback evaluators, card publication, blocker context, run-skill discovery, the courier, and plan, challenge, and feedback-check sessions) records the outcome it already records for a session that could not start, with the refusal's text as the reason. Unit tests show a refused project's queued task left unclaimed while an unbound project's task is claimed, and a refused build launch held and then resumed after the check passes.
  - Every new event that carries a claude-code directory path or an observed email, the event that records a run's account, and the events that record an account's refused state are registered NodeScoped in EventScopeRegistry, so none of them replicates to another node. A test asserts that each of them is NodeScoped, in addition to the existing tests that require every event to have an entry.
  - |-
    `h9k doctor` shows each bound connection's email, org name, and subscription type, or the problem found. It warns when its own environment (the shell a hand-started h9kd would inherit) or a bound directory's settings.json carries ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, CLAUDE_CODE_OAUTH_TOKEN, or an apiKeyHelper, and when a solution's members are bound to different accounts. Its probe reports an outcome for every case and never throws, which a unit test over a throwing fake probe shows.
  - |-
    One resolver gives a solution's account from its members: their shared account when every member agrees, and the default otherwise. It is unit-tested, and the doctor warning uses it.
  - An unbound project's spawns compose the same command line and environment as today apart from the removal of CLAUDE_CONFIG_DIR. Existing tests change only where they must supply the new required member, and their other assertions are unchanged.
  - docs/cli.md, docs/scope.md, and the repository's hall9k-cli-reference skill describe the claude-code connection, the project binding and that it stays on this node, the run freeze, and the refusal. The existing parked lines about GitHub account switching are left saying that GitHub multi-account switching remains parked, and nothing describes it as shipped.
  - No test creates a branch, touches a remote, or calls GitHub; the tests stop at fakes and the composed environment.
  - When a session under a bound account exits as a launch failure (the zero-work shape that raises the node-wide launch hold today), the daemon re-runs that account's check without the reuse window before raising anything. A failing check refuses the account (as the refusal criterion describes) and leaves the node-wide hold down; a passing check leaves today's behaviour unchanged. A unit test over a fake probe covers both.
