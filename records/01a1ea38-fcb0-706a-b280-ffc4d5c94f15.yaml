context: |-
  **Why.** An operator wants some projects on a node to bill to an alternate Claude Code subscription while the rest keep the default login. Claude Code chooses its account by the CLAUDE_CONFIG_DIR environment variable (default ~/.claude). There is no command-line flag, and Claude Code ignores the variable in project and local settings env, so the run's --settings file cannot carry it; it must be the spawned process's own environment. On macOS the login's Keychain item is keyed to a hash of the exact path string when the variable is set, and is a different item when it is unset, so Hall9k must pass exactly the string it observed, and must remove the variable (never spell out ~/.claude) for the default account. `CLAUDE_CONFIG_DIR='<dir>' claude auth status` prints JSON by default (`--json` is the default and `--text` the alternative on Claude Code 2.1.326) with loggedIn, email, orgId, orgName, subscriptionType, and configDirectory, without touching the secret. The idea's workspace journal (idea 4faa4335) holds the research summary and every ruling; the task journal holds what refinement found.

  **How `claude auth status` behaves.** It creates a directory that does not exist (with `.claude.json` and `backups/` inside) and exits 1 when logged out, so existence is checked before claude runs, and the JSON is read whatever the exit code. With an override credential in the environment (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN), it reports loggedIn true with an authMethod and source naming the override, and no email, org id, org name, or subscription type. That is why both the connection check and the spawn check refuse a status with no email or org id, and why the spawn check runs with the binary the spawn runs (HALL9K_CLAUDE_PATH, else `claude`, as ClaudeExecutor.ClaudeBinary and HeadlessLaunch resolve it) and the environment the spawn would get.

  **Binding shape.** Add a claude-code connection provider: `h9k connection add claude-code --config-dir <dir>`. Connection events are NodeScoped in src/Hall9k.Domain/Infrastructure/Persistence/EventScopeRegistry.cs and never replicate, which is required because the path exists only on this machine. Three things in the connection model need a decision for the new provider, all in src/Hall9k.Domain/Features/Connection/:

  - A connection's provider is a WorkItemProvider (src/Hall9k.Domain/Shared/ValueObjects/WorkItemProvider.cs), the same vocabulary work items use. A claude-code value must not become something the work-item paths (WorkItemConnections, the importer, tracker links) treat as a source.
  - ConnectionDecider.Register refuses a non-GitHub connection whose CredentialReference names nothing and refuses gh-cli for anything but GitHub, and requires a non-blank ExternalAccountId. A claude-code connection handles no secret, so it needs its own rule there (for example, the directory as the reference's identifier under a kind of its own). Whatever is chosen, the directory is recorded once.
  - The observed email, org, and subscription need a NodeScoped observation event, following ConnectionTrackerIdentityObserved and ConnectionGitHubIdentityObserved.

  A new value type in the flat Connection namespace (a new credential kind, for example) joins KnownNonEventValueTypesInFlatNamespaces in tests/Hall9k.Tests/Domain/EventScopeRegistryTests.cs, or that test's scan reports it as an unclassified event. Pre_flight_events_stay_node_scoped in the same file is the shape for the new NodeScoped assertions.

  Unlike Jira and Linear (WorkItemConnections refuses to choose between two), several claude-code connections may exist, one per directory. NodeBootstrap and WorkItemConnections already filter by provider in SQL, which is what keeps their choices unchanged. ConnectionListCommand prints no id column today and counts bound projects per provider in BoundProjects, so it needs both for claude-code. The project's existing ConnectionId is its GitHub connection, so the account binding is a separate node-only project setting on ProjectSettingsChanged (NodeScoped), left out of ProjectTeamSettingsChanged.From the same way Effort and OrchestratorEffort are. There is no connection remove command, and this task adds none; `default` on the project setting is the way back.

  **Path rule.** Record the absolute path after expanding ~, with any trailing separator removed and symlinks not resolved, and use that one string for the observation, every spawn, and every fix line Hall9k prints.

  **Spawns.** Every daemon spawn funnels through IExecutor.SpawnAsync(AgentSpawnRequest) (src/Hall9k.Daemon/Execution/IExecutor.cs) into ClaudeExecutor.SpawnAsync and IProcessManager.Spawn. AgentSpawnRequest.Environment and ProcessSpawnRequest.Environment are add-only, and UnixProcessManager and WindowsProcessManager only set variables. The child inherits h9kd's whole environment: under the LaunchAgent that is only the four variables DaemonEnvironment.cs passes, but a daemon started by hand inherits the starting shell, which is why the default account must remove the variable. ClaudeExecutor never learns the project and TaskId is optional, so the account is a required member that each caller resolves; making it required lets the compiler name every one of the 26 construction sites across 17 daemon files (ReviewEngine alone has seven). The courier and the pre-flight run in ~/.hall9k/runs/<id>/, so their account must come from the record: CourierRunDispatched carries ProjectId, and PrReviewPreflightDispatched carries DispatchingRunId, whose frozen account it uses. The CLI spawns claude itself through ProcessStartInfo in HeadlessLaunch (h9k task start, h9k task delegate), TaskDriveCommand's --direct-launch, and OrchestratorMeasureProbe. RunDispatched is appended outside the daemon too, in TaskStartCommand, TaskDriveCommand, and PullRequestReviewCommand, so the freeze is recorded at those sites as well. `h9k task delegate` never claims; it spawns into the interactive claim's existing run, and `h9k task drive` re-entry resumes that run, so both use the run's recorded account. `h9k task start` claims and cuts a worktree before it spawns today, and a spawn that throws there leaves the claim Dispatched (TaskPhaseComposer notes this), which is why the CLI check runs before the claim.

  **Freeze and refusal.** The account is frozen on each run at dispatch, on a NodeScoped run-stream event (RunProcessStarted and RunLaunchHeld are NodeScoped precedents on the same stream; RunDispatched is ProjectScoped and replicates, so it must not carry either the path or the email). A resumed session's transcript lives in the config directory that started it, which is one reason every later spawn for the run uses the frozen value. For the refusal, the node-wide launch hold is the nearest precedent for holding work and resuming it without a person (LaunchHoldEngine, LaunchHoldMonitor, and LaunchHoldStatus.NeedsYouLine, which StatusCommand prints). For a run, the precedent for holding instead of failing is RunLaunchHeld with RunSupervisor.ResumeLaunchHeldRunAsync (and ReviewEngine's and PrReviewEngine's own hold handling for sessions spawned after the primary). For work not yet started, it is the launch-hold gates in DispatchEngine, PlanEngine, FeedbackStepEngine, and AutoPrReviewEngine. RunLauncher's RecordLaunchNetworkRetryAsync gives a claim back before any run stream exists and fails the task once its bound is reached, so it is not the precedent for a refusal after dispatch. An exception escaping SpawnAsync in RunLauncher today goes to RecordLaunchFailureAsync and fails the launch, and each non-run site turns a spawn exception into its own could-not-start outcome, which the refusal criterion keeps for those sites. Unlike the launch hold, a refused account holds only that account's work. Never fall back to the default account.

  Accepted risk: local status can report logged in for a credential the server refuses (it reads local state). A session that then fails to authenticate, with the account's check still passing, raises the node-wide launch hold, as a broken default login does today.

  **Doctor and solutions.** DoctorCommand composes its checks in order; LinearDoctor (src/Hall9k.Cli/Diagnostics/LinearDoctor.cs) is the probe pattern to follow: an outcome enum, never throws, one remediation line per outcome. A solution has no settings store; it follows its members, one account when every member agrees and the default otherwise. The override credentials outrank a directory's login; doctor warns about them, and spawns do not strip them, since an operator may set them on purpose. A bound project's spawn check refuses while one is in effect, as above.

  **Boundaries.** Hall9k never runs /login, never reads or copies the Keychain item or .credentials.json, and never handles a token. Unbound projects behave exactly as today apart from the variable's removal, on every node including Windows. The parked account-switching lines in the skill (around line 1579) and in docs/scope.md concern GitHub accounts, not Claude Code ones. Printed paste lines, the launch anchor, and h9k task register-session belong to the task stacked on this one; leave them alone. The per-account spend report is a separate draft. Public records: examples use ~/.claude-alt and never name another project, organization, or person.
