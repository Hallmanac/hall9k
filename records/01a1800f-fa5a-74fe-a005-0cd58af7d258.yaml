objective: |-
  `h9k task work` becomes `h9k task drive` everywhere a person or an agent reads it, with no change in behavior, and `work` stays for one release as a hidden alias that says it was renamed.
criteria:
  - |-
    **The verb.** `h9k task drive` is registered with every option, example, and behavior `task work` has today; `TaskWorkCommand` becomes `TaskDriveCommand`. This card changes the name only, nothing the verb does.
  - |-
    **The alias.** `h9k task work` still runs the same command and is refused inside a dispatched session exactly as `h9k task drive` is. It is hidden from `h9k --help`, `h9k task --help`, the `hall9k-cli-reference` skill, and `docs/cli.md`, and it first writes one line to stderr: "h9k task work is renamed h9k task drive; work will be removed in a later release." Stdout and the exit code are unchanged, so scripts keep working.
  - |-
    **The text sweep.** Every live mention of the verb names `drive`. That includes CLI help and examples; error messages, refusals, and hints anywhere that point at it, including the Domain's own (`TaskDecider`) and the verb name `TaskWorkCommand` passes to `InteractiveSessionLiveness.EnsureNotAttachedElsewhere` for its `--force` hint; code comments and XML docs; the work-prompt-builder templates; the `hall9k-cli-reference` skill; `docs/cli.md`, `docs/concepts.md`, `docs/operations.md`, `docs/scope.md`; and `ORCHESTRATOR-WINDOW.md`.
  - |-
    **Left alone.** Historical records keep their wording (`backlog/`, `docs/analysis/`, the v0 decisions log). Internal and stored names stay: `WorkPromptBuilder` and its template directory, `PromptBuilderKey` "work" (it keys stored prompt addenda, so renaming it would strand them), and every event name and field.
  - |-
    **Closeout check.** `git grep -l -P "task work\b"` on the branch finds only the alias, its test, and the historical files in criterion 4; the PR lists the result.
  - |-
    **Tests.** Existing tests and golden files follow the rename. New unit tests cover the alias running the same command, its stderr line, its absence from help, and its refusal inside a dispatched session, which `DispatchedSessionTreeTests` cannot see because it walks help output.
