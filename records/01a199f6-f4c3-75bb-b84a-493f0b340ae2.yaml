context: |-
  ## Where the design lives

  The design was approved by the owner and is in `feedback-step-brief.md` in the workspace of idea 13403621, with the rulings behind it under "Rulings" in that workspace's `journal.md` (entries from 2026-11-01 12:33 to 20:54). Read the brief before starting; this context points at the code and adds what the code at the time of refinement shows. The brief's "Timing" and "Rules for the path" sections are for the orchestrator and are already met: the blocker `0a3d47e0` (plan mode, PR #833) is Done.

  The daemon makes every lifecycle move and starts every session; sessions supply judgment and nothing else. There is no new task state: a held task stays Blocked.

  ## Code to start from

  - Release today: `TaskDecider.DependencyCompleted` and `TaskAggregate.Apply(TaskDependencyCompleted)` move Blocked to Queued when the last unmet dependency clears, re-applied each sweep by `TaskDependencyResolver`. `TaskDecider.Assign` (the `h9k task queue` path) lands Queued directly when no dependency blocks. `StackedEdgeRules.Blocks` decides per edge whether a stacked parent's Delivered or true closeout is the release point. The hold has to cover all three Blocked-to-Queued doors that `TaskAggregate` names: `Apply(TaskAssigned)`, `Apply(TaskDependencyCompleted)`, and `Apply(RemoteStackedParentObserved)`. The last of these can also move a Queued task back to Blocked. The unmet-dependency set is recomputed on requeue, so it is not on its own a safe place for the hold.
  - The dependency sweep runs on every node over every Blocked task in that node's store, teammates' tasks included, so the step's start needs a fence on the task's stream and an owner-and-placement check before any session starts. A plan, by contrast, is node-scoped (`PlanStarted`).
  - Getting a held task back to Draft: `TaskDecider.ReturnToDraft` accepts Published only, so a Blocked task is taken out with `TaskDecider.Dequeue` first. `TaskAggregate.Apply(TaskUnassigned)` keeps the assignee when `KeepsAssignee` is set but clears `PlacedOnNodeId`, so the requeue must pass the earlier placement back through `Assign`'s `placedOnNodeId`. `Apply(TaskAssigned)` also replaces the assignment's owner fingerprint with the event's own value, so the requeue passes the earlier assignment's owner fingerprint as well as its placement.
  - Refinement and the single challenge: the plan engine (`Hall9k.Daemon/Plan/PlanEngine.cs`, decisions in `PlanDecider`) already carries a Draft through a refinement session, a challenge, a session that applies a publish as revised verdict, and a publish through the installed `h9k`, and it parks a draft for a person on do not publish when its rounds are spent. Its round cap is the daemon-wide `DaemonOptions.PlanRoundCap` (default 2), so reusing it here needs a cap of one for this step. Prefer reusing it over a second refinement loop.
  - Judging the verdict: the plan engine's apply purpose (`RefinementPurpose.ApplyVerdict`, prompt in `.claude/templates/agent-prompt-builder/plan-refinement.md`) applies every must and should. The ruled design has the session judge each one, so this step needs a purpose, or a resumed session (`IExecutor`'s `ResumeSessionId`, as the brief describes), that may decline one with a recorded reason. Either meets the criteria; say in the pull request which one was used and why. A decline of every must with no revision is refused by `ChallengeGate`, so that case parks as a refused publish.
  - `ChallengeGate` lets a later revision of a verdict that already passed publish unchallenged, so the step must request its own challenge rather than rely on the earlier one.
  - Republish: the step's publish passes the tracking choice the task's earlier publish recorded (`--untracked` when it was untracked) and never passes `--no-existing-item`, since the daemon searched no tracker.
  - A person's `h9k plan resume` on a parked plan grants another round. The step's park ends the step, so the step must not act on what such a resume later publishes.
  - `RefinementReport` reads only `revised`, `unchanged`, and `question`; the "should not run" outcome needs a new closing value or a stated mapping onto one of these.
  - Notes: `TaskNoteRecorded` and `Features/Tasks/Notes/`; `InjectedTaskNotes` carries the trust rule's mark for prompts. Dispatched sessions are refused `h9k task notes` (`DispatchedSessionCommandClassification`), so the check receives the notes in its prompt. The epic view covers only epic siblings, so the check reads the blockers' notes by id.
  - Roles: `AgentRole.Refinement` and `AgentRole.Challenge` exist, each with its own model and effort in the policy. The check takes a role of its own so that the brief's starting tiers (a cheap check, a high refinement tier) can be set apart in the model policy.
  - Setting precedent: the queue-first marker on `TaskReviseCommand` is the existing scheduling fact a published task can change outside the Draft-only rule of Decisions Log #34. Queue-first is let through in any live state; the override here is deliberately narrower.
  - Interactive claim: `TaskDecider.ClaimInteractively` claims a Blocked task when the caller acknowledges unmet dependencies; a held task has none, so it needs its own refusal with its own reason.

  ## Out of scope

  The goal concept (idea 75bed4cc), initiatives, loops inside a build, and a second step when a parent changes after the child has started (the stack rebase already handles the code). Whether a plan of several tasks turns the flag on by default, and whether the check also reads the blockers' pull request summaries, are left for later; notes alone are the input here.
