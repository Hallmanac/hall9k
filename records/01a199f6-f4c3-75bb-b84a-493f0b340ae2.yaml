objective: When a task is set to take the feedback step, the notes its blockers left are checked against it before it is released, and a task they affect is refined, challenged once, and queued again with the same assignee and node, or parked for a person
criteria:
  - A project setting decides whether its tasks take the feedback step, and it is off by default. A task can override the project setting either way while it is Draft, Published, or Blocked and not yet held for its feedback step, as a scheduling fact outside the readiness contract like the queue-first marker. The override is refused, with the reason, once the task is held for its feedback step, has been released to Queued, or has been claimed. The setting and the override each have a description and an example in `--help`.
  - |-
    A task that takes the feedback step stays Blocked at its release point until its feedback step has ended. Its release point is the moment it would otherwise move from Blocked to Queued: the last of its blockers reaching true closeout (for an ordinary blocker), the parent's Delivered (for the edge it is stacked on), or the pull request it is stacked on in another install being observed open or merged, whichever comes last. While it is held, neither the dispatcher nor an interactive claim (`h9k task drive` or `h9k task start`, with or without `--acknowledge-unmet-dependencies`) can claim it, and `h9k task show` and `h9k status` say that it is held for the feedback step.
  - Queueing a task that takes the feedback step when all its blockers have already cleared holds it in the same way, instead of making it Queued at once.
  - When none of the task's blockers left a note that the trust rule lets into a prompt, no session runs and the task goes to Queued as it would without the step.
  - A task with several blockers gets one check, after the last blocker clears, over the notes of all of them. A note the trust rule holds back is never placed in the check's prompt.
  - The check is one headless session whose model and effort come from the daemon's model policy under a role of its own, so the check and the refinement can be set to different tiers without a code change. It is given the task's objective, criteria, and context and the blockers' notes, and it answers whether the notes affect the task. When it answers that they do not, the task goes to Queued.
  - When the check session fails, times out, or ends without a readable answer, the task goes to Queued and the failure is recorded on the task, so a failed check never stalls the tasks behind it.
  - When the check answers that the notes affect the task, the daemon takes the task out of the queue and back to Draft, one session at the refinement tier refines it, and the daemon requests exactly one challenge of the result. No session or sweep of the daemon starts a second challenge for the same release, and a test proves it.
  - After a publish as revised verdict, a session judges each must and should change in the challenge report, applies the ones it accepts, and records in the task's journal a reason for each one it declines; the daemon then publishes the result. After a publish as written verdict, the daemon publishes the refined task as it stands. In both cases the task is queued again for the same owner, with the same owner fingerprint, assignee, and node placement it had before the step, and it reaches Queued at once because its blockers have cleared.
  - |-
    The task is parked for a person instead of being queued, and the reason is shown in `h9k task show` and `h9k status`, when any of these happens: the challenge returns do not publish; the challenge ends with no verdict; the refinement session concludes that the task should not run; the refinement's revision names anything other than the objective, criteria, or context (dependencies, stack link, type, or model); the refinement session, or the session that judges the verdict, fails, times out, or ends without a readable report; or the publish or the requeue is refused. Once a task is parked, the step is over: nothing in the daemon queues it on the step's behalf, and a person who settles the park publishes and queues it by hand.
  - |-
    Each feedback step records its outcome as an event on the task's stream, and `h9k task show` prints it. The outcomes are: released without a check, released after the check, released after a failed check, revised and queued again, parked (with the reason), and ended without acting because a person dequeued, unassigned, abandoned, or revised the task while the step ran.
  - After a feedback step has released, requeued, or parked a task, nothing starts a second step for that task. That covers the step's own requeue, a later observation of the pull request it is stacked on, a person queueing it again, and a change to its parent after it has been claimed.
  - |-
    The feedback step runs on one node only: the node the task is placed on, or, when the task has no placement, a node of the owner it is queued for. No other node, a teammate's included, starts a session for it, and a test proves that two nodes observing the same release start one check between them.
  - |-
    `docs/concepts.md`, in the task lifecycle section that describes the queue-first exception, and `docs/cli.md` describe the feedback step, its project setting and task override, and the outcomes a person can see.
