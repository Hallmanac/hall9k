objective: Every hall9k path that reads Postgres works on a node where localhost resolves to ::1 first, now that the container publishes on loopback only, so h9k doctor's GitHub check reads the registered projects instead of reporting they could not be read
criteria:
  - On a node where localhost resolves to ::1 before 127.0.0.1 and the container publishes only on 127.0.0.1 (the 359e0d7a shape), h9k doctor's GitHub section reads the registered projects; the chosen fix is either publishing the port on [::1] as well as 127.0.0.1, or connecting to 127.0.0.1 rather than localhost in the shipped connection string and every code path that builds its own, and the PR says which and why
  - |-
    Postgres is still reachable on no non-loopback interface: the compose constant, the repository docker-compose.yml, and their identity test (ContainerRuntimeProbeTests) agree, and docker port hall9k-postgres lists loopback addresses only
  - Find why the daemon and h9k project list fall through to 127.0.0.1 while the doctor's GitHub check does not, and make that check use the same connection path; a unit test pins the doctor's check to it
