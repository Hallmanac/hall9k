  Field report from Windows, 2026-09-27 14:14 EDT (transport note 4fa918ac), after v0.10.57 (#601, task 359e0d7a): on Windows localhost resolves to ::1 first and the container publishes only on IPv4 127.0.0.1, so ::1:5432 refuses. The daemon and h9k project list work (Npgsql falls through to 127.0.0.1), but h9k doctor's gh check says 'the registered projects could not be read' on every run while its Postgres section says healthy. macOS may resolve localhost the same way; check the Mac after its own move.
