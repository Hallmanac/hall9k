  ```
  Title: Make plan pursue --epic-title create a solution epic in a solution project

  Work item: [#842](https://github.com/Hallmanac/hall9k/issues/842)

  `h9k plan pursue --epic-title` used to create a plain project epic with `EpicDecider.Add`, even when the plan's project belongs to an open solution, so the other members never saw the epic. It now plans the epic through `SolutionEpicAddition.PlanAsync`, the same path `h9k epic add` uses. That writes one copy per held member, all sharing one key, and every cut draft joins this project's copy.

  The epic is planned after the second idea check, against the freshly read project, so a refusal such as a closed solution happens before anything is staged. The epic copies, drafts, idea cuts and plan event still go out in the single existing save. A project in no open solution behaves as before. The output gives the same reference and member notes that `h9k epic add` prints for a solution epic.

  The new integration tests cover the solution case, the closed-solution refusal, and the no-solution case. The help text and the docs that said the epic is always plain are updated.
  ```
