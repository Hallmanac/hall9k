objective: A Linear-tracked project's claim gate and assignee mirror work against Linear's assignee, as they do for Jira
criteria:
  - TrackerClaimGate.Gates admits a linear reference, so with --claim-gate tracker-assignee a task linked to a Linear issue is claimed on this install only while Linear shows the issue assigned to this install's viewer id; the dispatcher, h9k task drive, h9k task start, and h9k task queue all read it through that one gate. On a project with the gate off, no claim door reads Linear to decide a claim; the mirrors in the criterion below still run.
  - The identity compared is the viewer's user id that A records on the Linear connection, compared ordinally, never the name or the email. A Linear connection that carries no id answers Unreadable with the remedy naming h9k connection add linear, and makes no live viewer read. Linear's delegate field is neither read nor written.
  - |-
    Read failures map as follows, each keeping Linear's own words: a rejected key maps to Credentials and the remedy names h9k connection add linear; an HTTP 429 or an error carrying the code RATELIMITED, a 5xx, a timeout, or an unreachable host maps to Outage and waits for the next sweep; every other GraphQL error, which includes an issue that is not found or not visible, maps to Item, and its remedy defers to Linear's own words plus the moved-team relink hint A defines, never to the shared sentence that nothing on this install ends the hold. An HTTP 200 carrying an errors array is never read as an assignment.
  - h9k task queue <id> --take and h9k task assign <id> --take on a Linear issue the fresh read shows assigned to nobody write the viewer id through issueUpdate's assigneeId, read the issue back, record TrackerAssignmentWritten from that read-back, and proceed; an issue somebody else holds is refused exactly as today with nothing written (piece E changes that refusal); an issue already yours records TrackerAssignmentObserved and proceeds; the write touches no state, label, or other field. A response with success false, or an errors array, is a refused write, and its sentence keeps Linear's own words and says the key needs write permission on the issue's team.
  - Because Linear's assignee is single-valued, the Linear take follows Jira's overwrite shape and never GitHub's add-assignee shape, so a Contested verdict cannot arise from it, and a test pins the read-back comparison on the user id
  - TrackerAssignmentTake.ReleaseAsync clears a Linear issue's assignee only when the fresh read shows this install's own viewer id on it, sending assigneeId as an explicit JSON null that a test pins in the request, confirms by read-back, answers Failed when the read-back still shows this install, and answers NothingToDo for an issue held by nobody or by somebody else
  - The claim-time assign mirror (DispatchEngine.MirrorTrackerAssigneeBestEffortAsync) runs for a Linear issue on every project, and the release mirror runs at the sites it runs at today (lease expiry on a project with the gate off, h9k task abandon, and h9k task release), with the existing TaskTrackerAssignMirrorPending and TaskTrackerReleaseMirrorPending rows retrying a write that did not land on the existing backoff. Closeout leaves a Linear issue's assignee in place, as it does on every tracker once 8222011c merges, so this card adds no Linear exception to closeout. A lease expiry on a gated project, and a task moved to another node, keep skipping the release as they do for every tracker.
  - |-
    Every Jira-else-GitHub site a Linear reference reaches becomes a provider switch with a Linear arm, so a Linear reference never falls into the GitHub branch: TrackerClaimGate.Gates and CheckAsync, TrackerAssignmentTake.TakeAsync, GrantToAsync, and ReleaseAsync, TrackerClaimDecision.Tracker, ClaimRequestEngine's tracker name, and ClaimRequestWatchLoop.ApplyDeclaredTrackerIdentity, which leaves a Linear request's carried identity in place as it does for Jira. GrantToAsync moves a Linear issue from unassigned or from this install's own id to the grantee's id for the cooperative take.
  - Every sentence the gate and the take print for a Linear issue names Linear as the tracker, the identifier as the item, and the issue's web URL in the assign-yourself lever, and a claim the dispatcher refuses publishes the same TrackerClaimHold row h9k status reads today; the --take refusals in h9k task assign, the claim-gate consent text in h9k project set, the claim-gate line in the project's rendered agents document, and the CLI reference skill all name a Linear issue alongside a Jira card and a GitHub issue.
  - Every Linear call in these tests runs against recorded responses and no test reaches a live workspace; the take's read-write-read sequence and the release's request are pinned by tests that record the requests made, and a test pins ApplyDeclaredTrackerIdentity leaving a Linear request's identity untouched
