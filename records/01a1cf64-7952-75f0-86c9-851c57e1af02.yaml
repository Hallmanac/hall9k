context: |-
  Context for idea f2e984f0 (small pull requests as the pit of success), piece A. The reasoning is section 10 of the idea's discovery report, `ideas/f2e984f0-hall9k-should-make-small-pull-requests-the-pit-of-success-a/workspace/discovery.md` in the project home. Brian's 2026-11-02 rulings are in that idea's `workspace/journal.md`; his 2026-11-12 acceptance of the report's recommendations is recorded in the project home's `journal.md`. He ruled on 2026-11-02 that the fix belongs in the design phase: a large mechanical pull request is acceptable, and a large feature pull request means the design went wrong. On 2026-11-12 he accepted the report's recommendations: the Refactor and Chore task types are the mechanical exemption, hard size gates stay parked, and the split outcome is a later task.

  Where the text lives, at commit ee555e7ae:

  - `plan-discovery.md:51` is the "State the shape before any task" bullet; the closing block's task-line instruction is at line 72, and it keeps each task line a single outcome-phrased sentence (the task-line grammar is piece C).
  - `plan-refinement.md:118` is the "State the shape before any criterion" bullet in the `job` fragment, which ends "You cannot create drafts." `AgentPromptBuilder.cs:4934-4941` renders `job` for every refinement purpose except judging a verdict, which renders only `job-judge` (`plan-refinement.md:178`). `job-judge` has no "You cannot create drafts" and says "Apply an accepted change in the smallest way that settles it", so without a sentence there a judging session could accept a smaller-increment change by cutting the draft down to its first increment, and no challenge follows it (`plan-refinement.md:166`). The apply and judge purposes (lines 104 and 174) already route a must that only a person can settle to the question outcome. No split must reaches them today, because `draft-challenge.md:78` sends every shape objection to a park; this task is what makes such a must possible.
  - `draft-challenge.md:75` is the "fits one pull request" check and line 78 is the fence on reopening shape. The feedback step's challenge uses the same template (`AgentPromptBuilder.cs:4625-4627`). Both the refinement and challenge prompts already render the draft's type as a `- Type:` fact line (`plan-refinement.md:22`, `draft-challenge.md:22`), so the exemption can key off it with no new placeholder. Task types are defined in `src/Hall9k.Domain/Features/Tasks/TaskType.cs`.
  - A draft cut by `h9k plan pursue` is recorded with `TaskType.Parse(null)` (`PlanPursueCommand.cs:120`), and a blank type parses to Feature (`TaskType.cs:61`), so a mechanical draft from discovery reaches refinement typed Feature. That is why refinement's exemption follows the type its own revision sets as well as the recorded one.
  - `.claude/skills/orchestrator-recipe-generator/SKILL.md`, "The scoped session recipes' contract" (from line 911), holds the list of what both scoped recipes carry. The project home's `recipes/idea-discovery.md` and `recipes/task-refinement.md` today hold the shape rule as an operator-placed House rule line, which regeneration carries forward unchanged; they pick up the new guidance on the next regeneration, which is not part of this task.
  - `docs/cli.md:422-424` describes refinement in the plan loop, and `docs/cli.md:506` describes the discovery session ("states the shape").
  - `PromptTemplateContractTests` checks templates against `PromptContractTokens.All` (`src/Hall9k.Daemon/Review/PromptContractTokens.cs`), which among these templates' closing markers holds only the verdict marker. The discovery, task, refinement-outcome, and change markers (`DiscoveryReport.cs:46,49`, `RefinementReport.cs:24`, `ChallengeReport.cs:38`) are not guarded by it, so keep every outcome named through the template's existing placeholder and never as literal text.
  - Eight goldens render the changed sections: `build-plan-discovery`, `build-plan-discovery-earlier-work`, `build-plan-refinement`, `build-plan-refinement-apply`, `build-plan-refinement-cut-from-discovery`, `build-plan-refinement-solution-epic`, `build-challenge`, and `build-challenge-no-probe`. No golden renders `job-judge`. They are regenerated with `UPDATE_GOLDENS=1` (`AgentPromptBuilderGoldenTests.cs:692`).

  Out of scope: the discovery report's task-line grammar for order and stack edges (piece C), the daemon supplying criteria counts and the size table (piece D), the split outcome itself (piece B1), and any C# change such as a feedback signal in the challenge's facts.

  The type is Feature, not Content, because a Content task fails before its gates when its diff touches a path outside the non-executable set (`VerificationRunner.cs:320-338`), and both `.claude/templates/` (excluded by `!.claude/templates/` in `NonExecutablePathDefaults.cs`) and the golden `.txt` files fall outside it.
