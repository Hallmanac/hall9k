objective: Discovery, refinement, and challenge sessions judge a feature draft by whether it is the smallest increment that is useful on its own, so that discovery proposes increments in order with what each delivers alone and builds on, refinement names those increments when a draft should split, and the challenge asks for a smaller useful increment instead of only whether the draft fits one pull request, with drafts typed Refactor or Chore exempt.
criteria:
  - The discovery prompt (.claude/templates/agent-prompt-builder/plan-discovery.md) tells the session that the first task it proposes is the smallest increment that is useful on its own (behind a flag if needed), that the report states for each proposed task what it delivers alone and what it builds on, and that the closing block lists the task lines in that order, each still a single outcome-phrased sentence. It also tells the session that a proposed task whose work is purely mechanical, of the kind typed Refactor or Chore, is exempt from the increment rule, and that the report says so for that task.
  - The refinement prompt's "job" section (.claude/templates/agent-prompt-builder/plan-refinement.md, which renders for every purpose except judging a verdict) tells the session to judge the draft by whether it is the smallest increment useful on its own, unless the draft is typed Refactor or Chore or the session's revision sets one of those types. When the draft should split, the session still ends with the existing question outcome, and the question names the proposed increments in order, smallest useful one first, each with what it delivers alone and what it builds on. The section also says that a draft is never narrowed to one increment in a way that drops the rest of its work.
  - The refinement prompt's "job-judge" section tells a judging session that a change saying a smaller useful increment exists can be accepted only by ending with the question outcome, with the proposed increments named where that purpose already puts a question, and never by narrowing the draft's objective or criteria to one increment; declining it follows the existing rule for declining a change.
  - The challenge prompt (.claude/templates/agent-prompt-builder/draft-challenge.md) no longer asks whether the draft fits one pull request. For a draft not typed Refactor or Chore, it asks whether the draft is the smallest increment that is useful on its own and has the challenger name a smaller one that would be useful alone, or say that none exists. The check that nothing in the draft can be cut without losing behaviour stays for every type.
  - For a draft not typed Refactor or Chore, the challenge prompt lets a challenger record "a smaller useful increment exists" as a must or should change line rather than only as a park. It still tells the challenger not to reopen a recorded ruling, whether the draft stacks, or what it is blocked by, and to raise any of those once as a park.
  - The scoped session recipes' contract in .claude/skills/orchestrator-recipe-generator/SKILL.md requires both regenerated recipes (idea discovery and task refinement) to carry the same increment guidance as the discovery and refinement prompts, with the same Refactor and Chore exemption.
  - In docs/cli.md, the plan loop's description of refinement and the challenge says that both judge a feature draft by whether it is the smallest increment useful on its own, and the plan discovery session's description says that discovery proposes the smallest useful increment first, in order.
  - The prompt goldens under tests/Hall9k.Tests/Fixtures/PromptGoldens/AgentPromptBuilder that render these sections are regenerated rather than hand-edited, and `dotnet test --filter "FullyQualifiedName~AgentPromptBuilderGoldenTests|FullyQualifiedName~PromptTemplateContractTests"` passes.
  - The diff changes no C# source and no parsed outcome or marker line. Every report closing line in these templates still goes through the placeholder it uses today, and no added or changed template line contains any of the literals DISCOVERY:, TASK:, REFINEMENT:, VERDICT:, or CHANGE:.
