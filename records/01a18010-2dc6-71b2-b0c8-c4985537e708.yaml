objective: For every task, the platform shows which phases a human ran, which a delegated agent ran, which ran automatically, and which were skipped by override, and can report that across tasks over time.
criteria:
  - |-
    A fold in `TaskPassageQuery` (criterion 3) classifies each phase of a task as human, delegated, automatic, or skipped. The phases are build, gates, each review cycle, PR open, and each closeout lap. On a run whose `RunDispatched` has `IsFollowUp: true`, the work before that run's `AgentSessionCompleted` is the closeout lap, in place of build, and its gates and review cycles count as gates and review cycles. A run is human-held when its `RunDispatched` carries the self-claim sentinel (`NodeId` is `Guid.Empty`) and it is not a deliberate headless start. That means `IsDeliberateHeadlessStart` is false and its `SessionName` does not end in the build role suffix (`SessionRoleName.Build`). Every `h9k task start` dispatch has recorded that suffix since the command landed, while `h9k task work` records `interactive-claim`. Neither the sentinel alone nor `TaskClaimed.InteractiveMode` is the key, because `h9k task start` sets both on a headless build. A pr-review task is not classified, and its passage section shows no classification row. Auto-pr-review's Now speed and a reviewer's own `h9k pr review` lap both dispatch under the sentinel, and `ThroughputQuery` already excludes the type. On a human-held run, the build or closeout lap is human. It is delegated instead when the run records a `RunPhaseDelegated` before its `AgentSessionCompleted`. A delegation records no end, so the whole phase reads as delegated. A PR opened under Card 3's override is human, and each phase the override lists as skipped is skipped. Every other phase is automatic. Deliver, `ReviewBoundaryApproved`, `ReviewParkResolved`, and `ReviewHumanFixApplied` are human acts inside a phase. They do not change its class, and the row names a hand fix (for example, "review cycle 2 automatic, fixed by hand"). The row also names the hand-off points: Card 4's go on `pr resolve` and Card 5's `handback`. The laps after them are daemon dispatches and read as automatic by the rule above. So Card 5's PR-stage `drive` counts as a human closeout lap through its claim, with no event of its own.
  - |-
    **Hand-run gates come from the record.** A `VerificationPassed` or `VerificationFailed` on a human-held run (criterion 1), appended before that run's `AgentSessionCompleted`, is a gate run from `h9k task verify`. That command refuses any run that is not Dispatched or Running under a sentinel claim, and the daemon's own gates on that run start only after deliver's `AgentSessionCompleted`. Those hand-run gates take the class of the run's build phase: human, or delegated under criterion 1's delegation rule. No event gains a field, so every stream, old or new, classifies the same way with no backfill.
  - |-
    `TaskPassageQuery` computes the classification on read, beside the phase timings it already folds, rather than in a second projection. `h9k task show`'s passage section prints it as one row in plain words, grouping consecutive phases that share a class (for example: "Build and gates by hand; review cycles 1 and 2 automatic; PR opened by hand (skip to PR); closeout automatic after pr resolve").
  - |-
    `ThroughputSummary` gains the share of phases in each class (human, delegated, automatic, skipped) over the same period and merged tasks `ThroughputQuery` already reads. Each share is the period's total phase count, not an average of each task's own percentage, and it is nulled under `HasEnoughData` as the other figures are. The query also splits the shares per owner. It keys each phase to the owner who held the claim the phase ran under, by `TaskClaimed.OwnerRootFingerprint`. When that field is absent, the owner is resolved from `OwnerId` through `OwnerRootFingerprintResolver`, so one person's fleet counts as one owner. An owner's slice counts the merged tasks with at least one phase keyed to that owner, and the five-task floor applies to that count. `ThroughputPane` shows the shares in the throughput block wherever it prints today. In `h9k status` that is install-wide, for the current period. In `h9k project show` it is for the project, current beside the previous period. When more than one owner held claims in the period, it adds the viewer's own line (this node's owner root), and it never shows another owner's figures.
  - |-
    Because the classification is computed on read, it covers every existing stream with no backfill and no rebuild. A stream written before Cards 3 to 5 classifies by criterion 1's rules with those cards' events absent: it has no override, no report, and no PR-stage claim. An `h9k task start` run recorded before `IsDeliberateHeadlessStart` existed (2026-09-03 to 2026-09-08) is still told apart by its `SessionName`'s build suffix, so it reads as automatic. A task with no human-held run reads as automatic throughout, which is what it was.
  - |-
    `docs/cli.md` (the `h9k task show` and `h9k status` rows, where the passage and the throughput block are documented today), the passage and throughput paragraphs of `docs/scope.md`, and the `hall9k-cli-reference` skill describe the classification row, its four classes, and the new shares in the throughput block, including the viewer's own line.
  - |-
    **Tests.** Unit tests over event fixtures cover the following. The four classes: each phase in each class, including a delegated build under a claim with its hand-run gates, a PR opened under Card 3's override, and the phases that override skips. The claim key: an `h9k task start` run (the sentinel and `IsDeliberateHeadlessStart` true) classifies as automatic, and so does a `task verify` it ran itself; a start run from before the flag (the sentinel, the flag false, a build session name) classifies as automatic; an `h9k task work` claim (the sentinel, the flag false, an `interactive-claim` or blank session name) classifies as human; and a pr-review task under the sentinel gets no classification, whether auto-pr-review or `h9k pr review` started it. Gates: a hand-run `task verify` before `AgentSessionCompleted` classifies as human, and the daemon's gates and review cycles after it classify as automatic; `TaskVerifyCommand`'s claim and run-state guard moves into a static method, tested without a database as `TaskStartClaimTests` tests its decisions, and the test pins the refusal without a live sentinel claim and on a delivered run. Closeout laps: a PR-stage `drive` lap reads as a human closeout lap, and its gates and review cycles after deliver read as automatic; the lap after `handback` or after Card 4's go reads as automatic. Human acts: a review cycle fixed with `h9k review fixed` stays automatic, and the row names the hand fix. The `task show` row: its grouping is checked against a golden. The new shares: `ThroughputSummary`'s new shares are period totals; they are nulled under the floor, and so is an owner's slice that holds fewer than five tasks; one owner's two nodes count as one owner by root fingerprint, including a claim with no recorded fingerprint, which is resolved from `OwnerId`; both blocks show the shares, and the pane shows only the viewer's own line. Old streams: a stream with none of Cards 3 to 5's events classifies by criterion 1's rules.
