objective: |-
  Event catch-up: a node that finds a gap in a sender's sequence, or that has no history at all, asks a peer for the events it lacks and the peer answers from what it holds with origin preserved, so a returning or brand-new node reaches the same history as everyone else
criteria:
  - Gap detection per sender at receipt; the node sends an events-request envelope (since sequence N, or everything for a brand-new node) to one peer, asking the voucher first, then owner-role members, then any member, most recently moved outbox first within a rank
  - A peer answers from what it holds, forwarding others' events with origin and event id intact, paginated by the envelope cap; a brand-new node requests everything and bootstraps its project from the answer; a peer that cannot answer says so
  - A request unanswered within a per-candidate timeout (default 5 minutes, a setting) is re-sent to the next candidate with earlier requests left standing; double answers are harmless by dedupe
  - h9k status shows outstanding gaps and requests
  - Adoption (h9k task add --from-issue or --from-jira) of a ledger record whose stream is absent locally starts an events-request for that stream and reports that it is arriving, never fabricating events from the record (moved here from the ledger records task ce0c986a on 2026-09-16, since the record writer now lands before catch-up)
  - |-
    Tests through the seam with the in-memory transport: a gap is detected and filled; a new store bootstraps a project from one peer and matches its projections; a forwarded event keeps its origin; a timeout moves to the next candidate; adoption on a missing stream sends the request
  - dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each
