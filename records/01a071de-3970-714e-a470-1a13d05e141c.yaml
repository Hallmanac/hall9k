context: |-
  Origin: Brian, 2026-09-05, from the ef2fefe5 case study: a two-file skill markdown fix paid full build-and-test gates on every pipeline entry - about 12 minutes each time, at least twice on one task - while the actual work took four minutes. Gates exist to prove code still builds and tests still pass; a change with no code in it cannot alter either, so the gate run is deterministic ceremony. Design intent, per the doctrine seam (prescriptive lifecycle, permissive judgment): the lifecycle still runs verification on every delivery, but verification is allowed to conclude 'nothing here can break the build' by evidence rather than by running the build. Constraint: never guess - a path the project has not declared non-executable runs the gates. Seams: VerificationRunner (gate orchestration, already records scope facts such as test-gate scope and RanFullScope), the run stream (VerificationPassed and its scope facts), h9k task show's gate rendering. Related: the stage-composition feature (978ffa03, merged 2026-09-04) covers review stages; this task is the gates-side sibling. Smallest fix wins.
