context: |-
  The orchestrator window's effort today is a side effect of its model's default (Opus 5.5 defaults to medium); this makes it a setting (idea 5bb4df1b). Read first: this task's journal.md, which holds the challenge verdict (items 1 to 10, file and line citations against origin/main 52552e4d4) and Brian's rulings, and the idea's workspace journal.md State section.

  Mirror --orchestrator-model exactly (OperatingSettings.cs near 328, ProjectSettingsChanged.cs near 191, ProjectAggregate near 289, ProjectDetails.cs near 329, ConfigSetCommand.cs 413 to 423, ProjectSetCommand.cs near 1036, OrchestratorModel and its tests). The two re-render gates at ConfigSetCommand.cs:423 and ProjectSetCommand.cs:1036 are the silent gap: widen them for the new flag.

  Boundaries: one pull request, not stacked. The recipe generator skill draft 521ac1cc (published as #597) is separate; it makes every scoped launch line pass --effort, so a spawn never inherits this value by accident.

  For the build: run `h9k orchestrator measure` once with the key set and confirm the probe (OrchestratorMeasureProbe.cs 54 to 61, which runs on Haiku with the same settings file) still answers, or say in the pull request that it could not be run.

  For the orchestrator, not the build: whether a spawn's --effort flag outranks the settings file's effortLevel is Claude Code behavior; the first scoped spawn after the key is set settles it from its transcript's effort field, recorded in notes/prototype-feedback.md.
