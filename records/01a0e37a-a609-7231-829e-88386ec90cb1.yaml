objective: The orchestrator window's effort becomes a rendered project and node setting rather than a side effect of its model's default
criteria:
  - h9k project set and h9k config set accept --orchestrator-effort, parsed by EffortInput and stored as AgentEffort (one list of values, AgentEffort.All), with `default` clearing it; the refusal for an unknown word names the window's own chain, not the dispatch chain. The node value is OperatingSettings.OrchestratorEffort (config key orchestratorEffort), read from the config file alone with no Hall9k__ environment variable, exactly like the orchestrator model. The project value is a trailing Optional<AgentEffort> OrchestratorEffort on ProjectSettingsChanged, applied in ProjectAggregate and ProjectDetailsProjection, with present-and-Unknown clearing it; like the project's --effort, it is node-scoped and never replicates across the fleet.
  - The window's effort resolves from the project's orchestrator effort, then the node's orchestrator effort, then the model's own default. No dispatch effort (a task's, the project's --effort, a per-role effort, or the node-wide --effort) feeds it. RecipeSettingsDocument renders the resolved value as the executor's effort key (effortLevel for Claude Code) in recipes/settings.json.
  - |-
    Every path that renders recipes/settings.json today renders the resolved effort: h9k install and h9k update (InstallCommand), h9k project add and h9k project init (ProjectHomeRecipe), h9k config set, and h9k project set. Setting or clearing --orchestrator-effort re-renders the file it governs on the spot, as the model flags do. A node-level value reaches a project window at that project's next h9k project init, the same accepted behavior as the node-level orchestrator model. h9k project show and h9k config show print the value with its source.
  - With no orchestrator effort configured at either level, recipes/settings.json renders byte for byte as it does today, with no effort key, so existing projects see no change until the operator sets a value.
  - |-
    Tests: RecipeSettingsDocumentTests cover the key rendered and the key absent; resolver tests beside OrchestratorModelTests cover project over node over unset and show that every dispatch effort is ignored; ConfigSetCommandTests cover setting only that field, `default` clearing it, and an unknown word refused; a ProjectDeciderTests case covers the new event field; a show-row test sits beside ProjectOrchestratorModelRowTests.
  - docs/cli.md (sibling rows beside the --orchestrator-model rows near lines 1062 and 1486, and the two-levers paragraph near 1512 to 1520) and docs/operations.md (the config table row near 996, the orchestrator window section near 1060 to 1087 including its re-render list, and the example blocks near 882 and 1103) describe the setting and its chain, say why the dispatch efforts and the model chain's legacy project --model step are absent from it, and state that scoped sessions launched with --settings recipes/settings.json inherit it unless their launch line passes --effort.
