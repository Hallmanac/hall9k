objective: |-
  VerificationRunnerTests.Daemon_shutdown_mid_gate_leaves_GateEnded_unwritten_and_the_gate_still_recorded_active passes on a loaded host: the test cancels the daemon-shutdown token only after observing the gate start on the run, so the cancel always lands while the gate process is running instead of racing a fixed one-second timer against the spawn
criteria:
  - The test starts VerifyAsync as a task, polls RunDetails.ActiveGate (an inline projection, so a read after GateStarted's own SaveChangesAsync is exact) at a short interval until it is set or the verify task completes, then cancels the shutdown token and asserts on the task; the poll and the whole test stay under the existing two-minute hard stop, and the 30-second gate pause remains only as the bound the gate would otherwise run to
  - The sibling test Overrunning_gate_times_out_as_a_failure_not_a_hang is left alone (its timer is the runner's own VerifyGateTimeout, linked after GateStarted, so it does not share the race); the failing test's doc comment, which claims the two rely on the same one-second margin, is corrected
  - |-
    Production code is unchanged and the assertion stays as strong as today: a mid-gate shutdown cancellation propagates as OperationCanceledException, ActiveGate stays set with the gate's name, GateStarted is recorded once, and no GateEnded is appended
  - dotnet build and dotnet test pass, with no parallel copies of the suite or artificial host load run to prove it; the decision log carries one entry under this task's placeholder; no test creates branches or touches GitHub
