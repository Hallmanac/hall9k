context: |-
  Fix for the Windows token leak that remains after #862 and #866. Cause (probe 6469becc, 2026-11-12; evidence in the project home's notes/leak-manager/post-reboot-cause.md and idea 6eec0600's workspace journal): h9kd's git children keep kernel access tokens, about 4 to 6 a second, only while all three hold: a Remote Desktop session to the node is connected, the launcher is outside the focused app's process tree, and the child's console is on the visible desktop. With the session disconnected the rate is flat. Spike 0b4685d2 measured 0 kept for git, gh, sh, bash and the agent CLI only when the root process sits on a private desktop with its own visible console (its tF arm and start-mode matrix); a windowless or hidden console on a private desktop still kept tokens (tA arm 0, including git to git-core rows). Its findings are not on main: read docs/spikes/h9kd-detached-console/FINDINGS.md on branch origin/task/0b4685d2-find-whether-hall9k-can-stop-t (commit b67fd73d). Design: change only WindowsDaemonLaunch.Create (src/Hall9k.Cli/DaemonControl/WindowsDaemonLaunch.cs, CreateProcessW at about line 258, StartupInfo Desktop field at about 339 to 343), reached from DaemonLifecycle.StartDetached and DaemonAutostartLaunchCommand.RunUntilExitAsync; no child start site is rewritten. If this fails criterion 2, the fallback is a new visible console per child on the private desktop, not lpDesktop on an inherited console. Known open risks, not in scope: a child showing UI on the private desktop waits unseen; CreateNoWindow children (WindowsProcessManager.cs:26) each draw on that desktop's heap.
