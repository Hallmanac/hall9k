objective: On Windows, h9kd starts every child process on a private desktop of its own, so a connected Remote Desktop session no longer makes h9kd's git children leak kernel access tokens
criteria:
  - |-
    On Windows, h9kd runs on a desktop of its own in WinSta0 that is created for it and never switched to: WindowsDaemonLaunch.Create, which both h9k daemon start and the logon autostart task use, creates the desktop and starts h9kd on it through STARTUPINFO.lpDesktop with a new console whose window is visible on that desktop (CREATE_NEW_CONSOLE in place of CREATE_NO_WINDOW), so every process h9kd starts inherits both. macOS and Linux behaviour is unchanged.
  - On this node, with a Remote Desktop session to it connected, a kernel pool trace of at least 30 seconds under h9kd's normal load, taken with docs/spikes/windows-token-leak-origin/analysis/toke-nostacks.wprp and attributed with the TokeTrace tool in the same folder, shows 0 tokens never freed for every process in h9kd's tree; and the node-wide live token count read with the node's toke-count.ps1 rises by under 0.5 a second over one hour with the session still connected (node-wide, so a miss is read against the per-tree trace).
  - A headless agent session and a verification gate started by h9kd on this node complete with their output captured as before, no window from either appears on the visible desktop, and h9k daemon status, h9k daemon stop and the logon autostart task still find and stop h9kd.
  - With Git Credential Manager as the configured credential helper and no stored credential, a git call h9kd makes to a remote it holds no token for ends with a failure within two minutes whose message names the credential helper, and leaves no process it started running.
  - No operating system or user setting is changed to achieve this.
