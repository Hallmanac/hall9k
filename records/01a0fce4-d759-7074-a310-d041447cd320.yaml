objective: A GitHub comment that mentions this install's login on a pull request this same login authored starts a short answer lap that drafts a reply, never a full independent review of the owner's own pull request.
criteria:
  - When a comment mentioning this install's login sits on a pull request whose author is that same login, and no live pr-review task **of this owner** covers it, auto pr-review mints a pr-review task whose automatic run is the bounded mention answer lap (`MentionFollowUpPromptBuilder` with no prior report), not the two-lens review. The no-backfill cutoff, the setting, the membership gate on the comment's author, the hourly mint cap, the fleet mint hold, the launch hold, and the spend budget all apply exactly as they do to any mention mint today. Every dispatch of that task, including a retry and the one after a skipped or deferred launch, is the answer lap or nothing; it never runs the two-lens review.
  - The minted task's platform-authored objective, its park line, `h9k task show`, and the answer lap's prompt say it answers `<author>`'s comment on the owner's own pull request. None says "Review pull request", and no mention follow-up prompt with no readable prior report says a review already happened. Its acceptance criterion is that the drafted reply is walked with walk-pr-review-findings and posted only on the owner's go.
  - A mention on a pull request someone else wrote, and a mention on a pull request an own live pr-review task already covers (a build task whose pull request this is never counts), behave exactly as they do today (full-review mint, and attach plus the existing follow-up gates).
  - |-
    `ObservedReviewMention` and the daemon's "observed a mention" log line record the answer-only mint as its own outcome, so `h9k status` and the log show which shape ran.
  - |-
    Unit tests over the decision, with no database, no branch, and no GitHub: own pull request leads to the answer-only mint; someone else's pull request leads to today's mint; an own covering task leads to today's attach. The pull request's author is matched to this install's login case-insensitively, the comparison the self-author filter (TryBuildMatch) already uses, with no new `gh` call.
  - |-
    `docs/operations.md`'s mention rows say that a mention on your own pull request gets an answer lap, never a review of your own work, and why: the review-request trigger can never reach the author, and the author already holds the context the 2f079bcd ruling wanted the review to supply.
