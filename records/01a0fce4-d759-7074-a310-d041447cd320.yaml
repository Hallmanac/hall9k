context: |-
  Read the mentioning comment before anything is claimed: who wrote it, who it tags, and whether it asks anything of this install's owner. Decide from that whether a claim and a task run are needed at all. A full run that analyzes the whole pull request just to read one comment is the wrong default. Motivating case: arx-platform#2166 / bc7d2572 on 2026-10-01, where Brian's reply tagging @taylor-dennison woke his own review task and ran a follow-up that found nothing.

  Motivating case: AgelessRx/arx-platform#2166, authored by Hallmanac and built by hall9k task
  01a0eb4f. At 2026-10-01 11:49 EDT taylor-dennison asked "@Hallmanac just curious what the
  motivating factor is here?". The mention minted pr-review task bc7d2572, whose full two-lens review
  of Brian's own pull request recorded $6.33 across three sessions in order to answer one question.
  The narrow follow-up lap that later ran on the same task recorded $0.19.

  Where it lives (origin/main e03c7d7e6):
  - `AutoPrReviewEngine.DecideMentionAsync` (around 2058) and `CreateFromMentionAsync` (around 2450)
    decide and mint. `PullRequestMentionSearch.Author` already carries the pull request's author
    login and account id, read in the same GraphQL call, so no new `gh` call is needed.
  - `RunLauncher.LaunchPrReviewMentionFollowUpAsync` (around 990) already accepts a null
    `priorReviewRunId` and builds the prompt with no prior report. The pending-follow-up branch
    around 163-180 is the existing route from a requeued pr-review task into that lap.
  - `TaskDecider.AwaitsPrReviewMentionFollowUp` / `ClaimForMentionFollowUp` assume a prior report or
    follow-through. A freshly minted answer-only task has neither, so the build decides how the first
    dispatch reaches the answer lap (for example, a field on the mint's
    `PullRequestReviewMentionObserved` that the pr-review dispatch reads). It must keep the model
    pre-flight over the diff in front of the checkout, exactly as today.
  - Check how the mention-followup template's opening reads with no prior report ("a review that
    already happened" would be false here).

  Scope boundaries: do not change the owner-scoped lookup. That is 5f6b4783, and this card is
  blocked on it. Do not change which login the record names. That is 9c12bed2. No model call before
  the claim (parked in the discovery report with a trigger). Idea 5fc064ac (the reviewer denied a
  Write of mention-answer.md and a Read of the voice explainer) may bear on this lap's draft quality.
  Read its state before building.

  Cut 2026-10-02 from idea f894d344 after Brian's discussion of daemon versus agent judgment (notes/discussion-daemon-vs-agent-2026-10-02.md): rules first, no model call before the claim. Full discovery report: notes/discovery-f894d344-2026-10-01/report.md in the project home.

