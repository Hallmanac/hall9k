objective: A brand-new node's first sync of a project it joins brings every team-scoped stream whole from its genesis, so a new member never sees, or has hidden from them, a headless tail for work that predates any peer's replication switch-on point
criteria:
  - |-
    EventCatchUpResponder answers a bootstrap request (ForOriginNodeId, ForStreamId, and SinceGlobalSequence all null) the way it answers an explicit ask: the switch-on bound is not applied (the one branch at EventCatchUpResponder.cs about line 105 widens from IsExplicitAsk to include the bootstrap shape), and every project-scoped, non-private, fleet-eligible event the answering node holds is served from the start of its own log, own-origin and already-replicated alike, with true origin preserved; a gap-fill request keeps the switch-on bound it has today, and the private, own-history, and foreign-fleet exclusions are unchanged
  - The bootstrap answer covers every project-scoped aggregate the node holds (tasks, runs, ideas, epics, and any newer type the classification registry names), which the responder's scope filter already gives (about line 127 filters on EventScope.ProjectScoped, not on stream kind); a test proves a requester with no local history that receives a task and its run projects a task reading Done
  - The answer rides the existing 200-event / 250 KB envelopes with no cap on envelope count, ordered by the answering node's own global sequence so each native genesis lands before its tail; a test proves a record that still arrives tail-first in the same answer is held by the v0.10.20 path and replays when its genesis lands later in that answer, so a whole-project bootstrap leaves no partial stream behind
  - |-
    The Decisions Log entry under this task's placeholder states that a brand-new node's bootstrap is now served from below the switch-on point, superseding entry #236's "history is inert until somebody asks" for that one automatic shape, and names what still keeps the bound (a gap-fill)
  - |-
    Unit tests through the seams: a responder given a bootstrap request serves events below its switch-on sequence while a gap-fill request still does not; a private idea is not served; a requester with no local history receives genesis-first history for a task and its run and projects a whole task reading Done. No test touches a repository or remote. dotnet build and dotnet test pass
