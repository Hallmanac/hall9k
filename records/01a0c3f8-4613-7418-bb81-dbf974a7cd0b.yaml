context: |-
  Origin: Brian, 2026-09-21 morning, Windows project window, after a two-direction pull test showed a brand-new node only ever receives history from each peer's replication switch-on point; challenged and re-evidenced by the challenge session the same morning against origin/main at v0.10.24 (b4002efe). Team members join arx-platform this week.

  What the code says today: EventCatchUpResponder.AnswerAsync (src/Hall9k.Connectors/Replication/EventCatchUpResponder.cs) applies the switch-on bound unless EventsRequestRecord.IsExplicitAsk (ForStreamId or SinceGlobalSequence set, EventReplicationCodec.cs line 127), so a bootstrap, which sets neither, is bounded (lines 105 to 115); everything else this task needs is already there: the scope filter serves every ProjectScoped type (line 127), private items and the requester's own history are excluded (lines 144 to 165), fleet-scoped items go only to a same-owner requester (lines 173 to 180), and the answer is ordered by the answering node's global sequence (line 88), which is why a genesis precedes its tail. The bootstrap shape is built by EventCatchUpCoordinator.RequestBootstrapAsync (about line 143) and minted by MessageSweepEngine.AdvanceCatchUpAsync when HasAnyLocalHistoryAsync was false at the start of the tick (about lines 252 and 426 to 442); it is sent to one ranked candidate at a time (voucher first) and EventReplicationInbox closes it on the first envelope from that candidate that applies anything (about lines 361 to 365), so the answering candidate's own completeness is what 252bc5cf guarantees, not this task. Receiver side: EventReplicationInbox.ApplyAsync with the held-record path (about lines 563 to 588) and ApplyHeldTailAsync (about 786 to 830).

  Sizes measured on the Windows node's store (2026-09-21 morning): arx-platform 2,612 task, run, and idea events, about 2.7 MB, about 14 envelopes, so a member invited from Windows gets it in one small push; hall9k 32,923 events, about 35 MB, about 165 envelopes, one time per new node. The Mac holds three arx-platform replicated records, so a member invited from the Mac gets nothing useful for arx-platform until 252bc5cf has run or the invite comes from Windows. Every member's sweep downloads a node-addressed answer and drops it on the audience check, so a bootstrap costs each existing member one read of that size too.

  Status counts (a bootstrap in progress with envelopes applied so far, and complete) are deliberately not this task's: an answer has no completion signal today, and 252bc5cf adds the terminal envelope and the status wording for both shapes, so the two drafts do not both edit StatusCommand. Two things "whole" cannot mean: an event whose type the answering build no longer knows is skipped silently by the responder (about line 122), and a stream the answering node itself holds only the tail of is served as a tail, which the v0.10.20 path holds on the new node; see 9eb5b245's context for the 14 run streams observed this morning.

  Related: 805f6986 (repair frees partial streams that still carry a document), 9eb5b245 (pull completeness and the held-tail ask), 252bc5cf (fleet reconcile; independent of this task in code, shares only the Decisions Log, whose tail-append conflict the mechanical rebase resolves per entry #250). Writing conventions: no em dashes, full sentences. Testing rule (Brian, 2026-09-13): no test touches a repository or remote.
