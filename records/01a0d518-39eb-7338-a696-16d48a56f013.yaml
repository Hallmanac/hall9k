context: |-
  Evidence gathered 2026-09-24 on this Windows node (Claude Code 2.1.282, model claude-opus-5-5[1m]): two plain claude -p runs with effortLevel high in ~/.claude/settings.json recorded effort medium in their transcripts; three runs whose --settings file carried effortLevel high, modelSettings.<model>.effortLevel high, or env CLAUDE_CODE_EFFORT_LEVEL high all recorded effort high, as did --effort high. So the daemon's generated settings file (Hall9k.Connectors/Prompts/ClaudeSettingsFile.cs, Build) is the one place the level can be carried, and Hall9k.Daemon/Execution/ClaudeExecutor.cs Arguments already passes that file. Follow the DaemonOptions.DefaultModel pattern (Decisions Log #33) for the knob. One node-wide level; per-role effort is out of scope. Prefer effortLevel in the file over the env variable, which hard-locks and cannot be lowered by a session. No em dashes in anything authored
