objective: A dispatched session runs at the effort level the node configures, so a model whose own default is medium (Claude Opus 5.5) builds, fixes and reviews at high when the operator asks for high
criteria:
  - h9k config set --effort <low|medium|high|xhigh|max> stores the level in config.json under hall9k; h9k config show and h9k daemon status print it with its origin the way default-model is printed; the word default clears it; any other value is rejected with the five accepted names
  - When the level is set, ClaudeSettingsFile.Build writes effortLevel with that value into every dispatched session's settings file (build, fix, review, verify, final pass, synthesis, publication, courier, pr-review alike); when it is not set the key is absent and the file is byte-for-byte what it is today, so existing ClaudeSettingsFileTests still pass unchanged
  - A running daemon binds the level at startup like every other DaemonOptions value; h9k config set --effort prints the same restart note default-model prints
  - |-
    The docs page that lists h9k config set's model knobs gains the effort knob beside them, with one sentence saying why it exists: a headless session ignores the owner's user-level effortLevel and honors the --settings file, and Claude Opus 5.5 defaults to medium where earlier Opus models defaulted to high
