context: |-
  A Linear connector, so a project whose work and backlog live in Linear gets the same tracker integration hall9k gives Jira and GitHub issues

  Discovery workspace (research notes, gathered files, and prototypes from before this was a task; may be empty):
  /Users/brianhallmanac/.hall9k/projects/hall9k/ideas/5d12221a-a-linear-connector-so-a-project-whose-work-and-backlog-live/workspace

  The challenge verdict in the project home's notes/challenge-c75fb837/journal.md holds the file and line evidence behind each criterion, including the full list of sentences that state the old rule. Ruling 4 of 2026-10-29 in the workspace journal.md is why this card changes the "never takes an item from another person" clause of Decisions Log #143, for gated projects and attended runs only.

  The replaced person's identity and name travel on a ProjectScoped event, signed and not encrypted, to every project member. That is deliberate: the ruling asks for who was replaced.

  The attended check catches Claude Code sessions and every session hall9k spawns. Another vendor's CLI whose shell tool holds a pty is not caught until that vendor has an environment marker; say so in the pull request.

  Parked, do not build here: an offer at h9k task drive and h9k task start; h9k task take --force reassigning after a confirm (trigger: an absent holder's node never clears the item); the event in the orchestrator feed.

  Unverified, and no criterion leans on them: whether every Jira install lets a member reassign, and whether a restricted Linear key or a guest may. A refusal is quoted either way.
