  ```
  Title: Keep the logon task's run level across `h9k daemon autostart enable` and add `--run-level`

  Work item: [#848](https://github.com/Hallmanac/hall9k/issues/848)

  Re-running `h9k daemon autostart enable` on Windows used to register the logon task at `LeastPrivilege` every time, which silently undid an operator's elevated task. It now keeps the existing task's level, registers `LeastPrivilege` when there is no task, and changes the level only when `--run-level highest|limited` says so.

  Any registration at `HighestAvailable`, whether kept or asked for, is refused before `schtasks` runs when the shell is not elevated, and the message names both ways forward. Elevation and the existing task's level are read behind seams, so the choice is covered on both CI legs without a Windows shell. The docs describe the kept level, the option, and the starts that do not go through the task.

  One reviewer note: `WindowsDaemonAutostart` gains its own `EnableAsync` overload that takes the level and returns it, rather than widening `IDaemonAutostart`, so launchd and the deferred implementation stay untouched.
  ```
