objective: A member can lay hold of a draft or a Published task without dispatching it, every surface that asks whose a task is reads that hold, and TaskAssigned keeps its current meaning on the wire
criteria:
  - Two new ProjectScoped events, TaskAssigneeSet and TaskAssigneeCleared, carry the assignee's owner id and root fingerprint, plus who set it and when.
  - Every event that sets or clears AssignedOwnerId today (TaskAdded on a legacy stream, TaskAssigned, a cooperative grant, a forced takeover, TaskUnassigned, TaskInteractiveClaimUnassigned, PrReviewPreflightParked) sets or clears the assignee identically, so every pre-change stream projects the owner it projects today. A replay test over pre-change streams, including an Owner-role override unassign and a forced takeover, asserts that the assignee's id and fingerprint equal AssignedOwnerId's at every version. Whenever AssignedOwnerId is set, the assignee equals it.
  - The aggregate and both projections keep the assignee separate from AssignedOwnerId. AssignedOwnerId keeps meaning "queued for", so dispatch, JiraWriteRetryEngine, and CloseoutEngine behave exactly as before. The tests that pin those paths pass unchanged.
  - TaskOwnerFactsReader, TaskListItemOwnerFacts (From and NeedsCreator), and every branch of EventReplicationInbox.EvaluateTaskActVerdict that reads AssignedOwnerFingerprint as the owner (about lines 2068, 2091-2096, 2134-2136, 2152-2158) read the new assignee, so the CLI guard, the board, the orchestrator feed, auto-pr-review coverage, and the receive gate give one answer. A gate test shows a non-creator assignee's TaskRevised on an assigned draft is applied and the creator's is refused. The board row and h9k task show show the assignee on a Draft or Published task, for example 'Assigned to Ryan · not queued'.
  - |-
    h9k task assign <id> on a Draft records the assignee and leaves the task a Draft. h9k task unassign <id> on a Draft, or on a Published task that is not queued, clears it. The dispatcher never sees either: a test asserts that an assigned Draft is not claimable.
  - |-
    The CLI rules: the root TaskOwnerRule permits on a task (its assignee, or with none, its creator) may assign a Draft, or a Published task that is not queued, to any member, itself included (a hand-off). A Member who is not that root may assign only itself, and only to a Published task with no assignee. On a Queued or later task a hand-off refuses and names h9k task unassign. Any other refusal can be overridden by an Owner-role member passing --holder with --reason, through TaskOwnerGuard.AuthorizeAsync. Assigning another member to a Fleet-scoped draft refuses and names h9k task share. Tests cover an assignee handing off (accepted), a creator handing off an unassigned draft (accepted), a Member self-assigning a teammate's unassigned draft (refused), a non-owner Member naming someone else (refused), and a hand-off on a Queued task (refused).
  - TaskActClassificationRegistry classifies both new events, and EventReplicationInbox judges them by criterion 6's rule rather than copying TaskAssigned's targetsOwnRoot rule, so a hand-off from the current assignee is applied on every peer. TaskAssigneeCleared is allowed only from the current assignee or an Owner-role override. Gate tests (pure, against EvaluateTaskActVerdict) cover a hand-off from the assignee (applied), a Member taking a teammate's draft (refused), naming another root as a non-owner (refused), and a revise from an assignee who is not the creator (applied).
  - Every auto-pr-review mint records the assignee, including the membership-gate parked mint that writes no TaskAssigned today (AutoPrReviewEngine.cs:1381, :2682).
  - h9k task start, h9k task work, and h9k task publish --assign on a task whose assignee is another owner refuse and append nothing (TaskStartCommand.cs about line 319, TaskWorkCommand.cs about line 643, TaskPublishCommand.cs about line 140).
  - The lifecycle projection backfill rebuilds any TaskListItem or TaskDetails document that lacks the new key, and a test asserts that a pre-change document gains it.
  - |-
    A replication test asserts that a node receiving a TaskAssigneeSet of a type it does not know skips it and keeps applying later events, and that re-delivery after the type is known is refused once the stream holds a later event from the same origin. The PR description states that such a node keeps the creator fallback for that task, and the rollout rule this implies: every node of every member updates before anyone assigns or hands off to another member.
