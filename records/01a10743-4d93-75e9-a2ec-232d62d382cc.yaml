context: |-
  Card C1 of idea 8d0b724b (ideas/8d0b724b-*/workspace/draft-task.md, report.md, and the rulings in workspace/journal.md). C1 is additive: it records who holds a task (the assignee) at any stage, separate from the go signal, and changes no existing dispatch behavior; h9k task assign on a Published task still dispatches as today. Card C2 (stacked on this) makes queue the go signal and stops assign dispatching; do not do any of C2's verb flip or documentation sweep here. Vocabulary: call the new field the assignee. "Holder" already means the ledger lock, and "claim" means the node lease; reuse neither for it (the --holder flag on the Owner-role override keeps its existing meaning). The readers that must stay on AssignedOwnerId (queued for) are dispatch, CloseoutEngine, JiraWriteRetryEngine, RemoteStackedParentSweep, TaskDelegateCommand, TaskTakeCommand, RunLauncher, and PullRequestReviewDuplicateRule.IsRival; they stay right only because criterion 2 keeps the two fields equal whenever AssignedOwnerId is set. The cell B pair 5 challenge (verdict-opus.md and verdict-fable.md in this task's directory) confirmed every cited line on origin/main at fdf9c01ab and found the three unnamed readers now in criterion 4. A repair for a lagging node that skipped TaskAssigneeSet is out of scope (criterion 11 pins the behavior only). Governing decisions: wire shape option 2 (new TaskAssigneeSet and TaskAssigneeCleared events; TaskAssigned stays the go on the wire, its naming trap documented in its doc comment; recorded in the idea journal 2026-10-03), 30338b96 (verbs name board columns), 8a5822cc (a requested reviewer's pr-review task is theirs alone; Owner-role override still applies), e495334c (creating a task never assigns its creator), 4e29c5fb (C1 ships as a patch), the 2026-10-01 cross-owner acts ruling. Brian 2026-10-04: the current assignee may hand the task to another member directly; a request-and-approve hand-off is a separate parked idea (c19e644a). Card A (0a35c9b9) merged as #686 and touches AutoPrReviewEngine.cs near ConcludeWithdrawnAsync; rebase onto it. Tests: no branches, git, or GitHub; gate rules are pure unit tests against EvaluateTaskActVerdict; the Postgres fixture is needed for projections, replay, the dispatcher query, mints (with the scripted-gh ProcessRunner), backfill, and replication. Keep OwnerScopedCoverage's empty-root behavior. If the build overruns one session, the clean seam is model, readers, gate, and mint (criteria 1 to 4, 7, 8, 10, 11) before the CLI verbs (5, 6, 9).
