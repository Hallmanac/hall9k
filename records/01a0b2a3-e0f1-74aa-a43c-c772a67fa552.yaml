  EVIDENCE ONLY, held by the window; do not publish without Brian's word. Bite: f8e6dd8f run 01a0b172 gate at 2026-09-17 23:39 EDT failed this one test of 6083; the assertion shows ClaimEligibleAsync returned a ClaimedWork for a TaskId the test never seeded (verify-test.log in that run). Cause verified in the worktree wt-f8e6dd8f-c6599ef1: NodeBootstrap.EnsureAsync (src/Hall9k.Domain/Infrastructure/Bootstrap/NodeBootstrap.cs:46) takes the first OwnerDetails row, so NewIsolatedNodeAsync mints a fresh node but the same owner; DispatchEngine's claim query filters by AssignedOwnerId only (DispatchEngine.cs:935) and stops at the node's capacity, so a sibling test's leftover Queued task (several tests in the class leave theirs Queued on purpose) can take the slot. The test class is new on f8e6dd8f's branch (A3b, idea 202383dc), so if that branch is still open the fix belongs on it; if it has merged, this is a follow-up. Different mechanism from #455/#465 (process-wide statics). Retried once at 23:50 with no code change (notes/decisions-2026-09-17-hall9k-0a.md).
