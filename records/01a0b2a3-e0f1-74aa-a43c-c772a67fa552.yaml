objective: |-
  TaskHolderClaimTests cannot claim a sibling test's leftover task: each test's claim pass sees only the task it seeded, so the empty-holder test passes regardless of test order or what an earlier test left Queued
criteria:
  - NodeBootstrap.EnsureAsync's first-owner lookup no longer makes every NewIsolatedNodeAsync node in one class database share one owner, or TaskHolderClaimTests seeds each test's task under an owner private to that test; either way a claim pass in one test can never return another test's task
  - The tests that deliberately leave their task Queued (write failure, fetch failure, gated projects) leave nothing a later test's engine can claim
  - An_empty_holder_claims_and_the_run_launches_only_after_the_ledger_write_lands asserts on the one ClaimedWork for its own task and passes across the full suite with the gates running in parallel
  - dotnet build and dotnet test pass
