objective: |-
  The release workflow survives a duplicate run for one tag: a concurrency group per ref serializes runs, and the publish step skips creation when a published release for the tag already exists, so a second run for the same tag ends green and leaves the release and its four assets untouched instead of failing on 'a release with the same tag name already exists'
criteria:
  - .github/workflows/release.yml declares a top-level concurrency group keyed by the workflow and the ref with cancel-in-progress false, so two runs for one tag run one after the other
  - The Create release step first asks gh release view for the tag; when a published release exists (isDraft false) the step prints that it is skipping and ends with exit 0 without touching the release or its assets; otherwise it creates the release exactly as today. Either way the release carries the same four assets (checksums.txt, linux-x64 tar.gz, osx-arm64 tar.gz, win-x64 zip) with their original ids and digests
  - No change to the build matrix, the asset names, the checksums step, or the tag pattern; the workflow file is the only file touched
