context: |-
  Evidence (Mac, hall9k-3f, 2026-09-23 11:06 EDT, while running the macOS half of 9d30a92a's criterion 1 with the card's recipe): the scratch run's own stdout printed 'On PATH: /Users/brianhallmanac/.local/bin/h9k -> /private/tmp/.../scratchpad/home42/bin/h9k', so the v0.10.45 h9k running under HALL9K_HOME=<scratch> retargeted the operator's real PATH link at the scratch bin. When the scratch tree was deleted the link dangled and every h9k call in the orchestrator window failed with 'command not found' until the live h9k update --restart to v0.10.45 at 11:36 EDT re-pointed it. Windows hit the same class on its side (the install prepends its bin directory to HKCU Environment\Path) and recorded it as lesson 5082d6bc in the project home's lessons.md; this task fixes both halves.

  Where the code is (main at cf39b90ba, v0.10.46): InstallCommand.FinishAsync (line 180, bool linkOntoPath = true; the gate goes at line 324 ahead of the OperatingSystem.IsWindows() switch, whose two arms are EnsureOnWindowsPath at line 328 and LinkOntoPath at line 332 with the PATH and user-profile reads at lines 334 and 335); LinkOntoPath at line 1941 and EnsureOnWindowsPath at line 783 have no other production caller, FinishAsync's only callers are InstallCommand.ExecuteAsync line 145 and UpdateCommand.RunAsync line 186, and every test caller passes linkOntoPath: false (UpdateCommandTests lines 25 to 33 record why: an early test wiped the real PATH). PlatformPaths.Home (src/Hall9k.Domain/Infrastructure/Storage/PlatformPaths.cs line 21) resolves HomeOverrideForTests (an AsyncLocal), then HALL9K_HOME, then <UserProfile>/.hall9k; the link target is always <home>/bin/h9k because DaemonRuntime.BinDirectory is RunPaths.Root/bin and RunPaths.Root is PlatformPaths.Home (RunPaths.cs line 25). The bootstrap scripts hand off to h9k install --from-release and link nothing; DaemonRestartHandoff spawns only daemon stop and daemon start; UninstallCommand (lines 591 and 651) removes only a link resolving to exactly <home>/bin/h9k and only its own bin directory from the registry PATH, so it is already safe and stays unchanged. Comparison shape: Path.GetFullPath both sides, trailing separator trimmed, OrdinalIgnoreCase on Windows and Ordinal elsewhere; a relative HALL9K_HOME resolves against the working directory like every other reader; a symlinked default home reads as redirected and the message covers it. Message text names the path neutrally, since under a permanent relocation the binary is not scratch: 'PATH link skipped: the home is redirected to X; call X/bin/h9k directly, or add X/bin to your PATH if this relocation is permanent'. Fold-in only if already in the file: scripts/install.ps1 line 141 prints 'Done. Open a new terminal so h9k resolves on your PATH' unconditionally, false after a skip; install.sh already branches on command -v h9k. Do not add a --no-link-path flag (parked until a real operator relocates permanently). Walked with Brian 2026-09-24 and challenged by a headless session the same afternoon (verdict in this task's journal.md); Brian accepted the verdict's criteria and calls.

  Notes to the orchestrator, not for the build session to act on: at closeout, lesson 5082d6bc's first clause (snapshot and restore the Windows user PATH around a scratch run) is superseded by this fix and its second clause (a real h9kd against the scratch store is a real daemon) stands; record that in lessons.md. The scratch recipe in 9d30a92a's record and the decisions note of 2026-09-23 stay as history.
