objective: An install or update run under a redirected HALL9K_HOME leaves the operator's real h9k link on the PATH untouched, so an isolated scratch install (the reproduction recipe every stale-schema task uses) never hijacks the live h9k command
criteria:
  - When the resolved platform home is not the default (<UserProfile>/.hall9k, compared as full paths with the trailing separator ignored and case ignored on Windows; HALL9K_HOME naming exactly the default is not a redirect), h9k install (--repo and --from-release alike) and h9k update neither create nor retarget an h9k link in any PATH directory, /opt/homebrew/bin, /usr/local/bin, or ~/.local/bin, and on Windows neither read nor write HKCU\Environment\Path; instead they print one line saying the PATH link was skipped because the home is redirected, naming <home>/bin/h9k (the bin directory on Windows), and saying to add it to PATH by hand if the relocation is permanent.
  - The decision is one question on PlatformPaths (is the home redirected), computed from the same resolution Home uses so the test-only override counts, and asked once in InstallCommand.FinishAsync ahead of the operating-system switch so the symlink branch and the registry branch both sit under it; LinkOntoPath, EnsureOnWindowsPath, and UninstallCommand are unchanged.
  - A default-home install links exactly as today (retarget in place, never clobber a real file, fall back to ~/.local/bin, prepend on Windows), covered by the existing tests. FinishAsync takes the PATH value and the profile directory as optional parameters defaulting to today's environment reads; one new test under the scoped test home calls FinishAsync with linking on, an empty PATH, and a temporary profile, and proves the skip line is printed and no link exists under that profile, so a regression can only ever write inside the temporary directory; a second, pure test covers the comparison for the exact default, a trailing separator, a relative path, and case on Windows. No test sets a process environment variable or touches the registry; the CI Windows leg is what executes the registry side of the gate.
  - docs/operations.md gains a sentence or short paragraph beneath the HALL9K_HOME row of its environment table saying that a redirected home relocates everything on disk and skips the PATH link, so a scratch run under it never touches the live h9k, and that a permanently relocated install adds its bin directory to PATH by hand; no other document changes.
