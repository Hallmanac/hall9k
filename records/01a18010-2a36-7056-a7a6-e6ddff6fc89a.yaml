objective: |-
  `h9k task drive` on a task whose pull request is open (Done, CloseoutParked, or a reopened lap that has not started) reopens it into an interactive claim on the PR branch, closeout stands down to merge and close detection while the claim is held, and delivering returns it to closeout through the ordinary follow-up pipeline.
criteria:
  - |-
    **The reopen.** A new decider path records a manual `TaskReopened` and an interactive `TaskClaimed` in one append, keeping the follow-up branch and the existing PR. It is allowed from Done with an open PR, from a CloseoutParked run, and from a reopened Queued or Blocked lap whose run has not started. It refuses while a headless follow-up session is live, naming the session. From a reopened Queued or Blocked lap the existing reopen stands: only the interactive claim is recorded, and the lap's kind, threads, and read scope carry into the session.
  - |-
    **The worktree.** The claim gets its worktree through `GitWorktreeManager.CheckoutExistingAsync` on the task's `FollowUpBranch`, exactly as a headless follow-up lap does. It reuses the retained worktree or recreates it; it fast-forwards a clean tree that is behind origin; it keeps a tree that is ahead of origin or holds uncommitted work; and it resets a clean tree to origin only when origin holds a tip the branch never held. After the checkout, `drive` compares the tree with origin and says in one line when it left the tree behind origin or reset it.
  - |-
    **Closeout stands down.** For a task in an interactive claim whose PR is open, closeout watches the claim with a state-only check (`InspectStateAsync`, one read per sweep, as the orphan sweep does) and nothing else: no lap, no auto-merge. The PR's earlier run is not superseded while the claim is held. A merge on GitHub records the merge on the claim's own run and completes that run and the task in one transaction (`completeClaimedTaskHere`, as `ReviewEngine` does), which ends the claim, and the PR's earlier run is retired in the same sweep. It leaves the worktree and branch in place while the session is live or the tree holds uncommitted work, and the feed line names the path. A close without merge is recorded and shown, and the claim stays.
  - |-
    **The follow-up anchor.** The task anchor's follow-up variant names the PR, its unresolved threads within the task's review read scope (rendered from the same fragments as `AgentPromptBuilder.AppendReviewReadScope`; the reopen records the scope as `h9k pr resolve` does, through `CarriedReadScopeAsync`), the last closeout observation, Card 4's triage report if one exists, and the project's commit style (from `AppendCommitStyleRules`, as `BuildFollowUp` states it). It offers `absorb-review-fixes` under the narrative style and runs it only on the user's word. It says commits belong in this worktree, and that a push to the branch from another clone makes deliver's push guard (`PullRequestOpener.PushBranchAsync`) refuse.
  - |-
    **Deliver.** Delivering runs the ordinary follow-up pipeline: the claim's run is recorded with `IsFollowUp: true`, and deliver pushes through the opener's ancestor-or-reflog guard (`ForceWithLeasePusher`) rather than the bare lease in `InteractiveWorktreeGit.PushAsync`, refusing with the reason when origin holds a tip the branch never held. `ForceWithLeasePusher` moves from `Hall9k.Daemon` into `Hall9k.Connectors` as a public class, so `PullRequestOpener`, `CloseoutEngine`, `SpikeEngine`, and `deliver` all call the same guard. Deliver passes the task's recorded pushed tip (`LastPushedBranch` and `LastPushedBranchTip`) as the opener does, and records `TaskBranchPushed` after its push, so the guard's recorded-tip check covers the interactive push too. Gates and the review loop follow (parking at each boundary under the flag), then the opener adopts the open PR (`PullRequestUpdated`), the task returns to Done, and closeout resumes under Card 4's rules. Because the push lands on the open pull request before gates and review, the anchor and docs say so. On a PR-stage claim, deliver refuses when the branch holds nothing beyond the PR's pushed tip, naming `release`.
  - |-
    **Exits.** `release` on such a claim returns the task to Done with its PR, and the PR's earlier run is again the task's current run, so closeout's ordinary watch resumes. It refuses when the branch holds commits beyond the PR's pushed tip, naming `deliver` and `handback`. It clears the flag by default (`--keep-interactive` keeps it), and `--unassign` refuses. `handback` records a manual reopen into a headless follow-up lap on the PR branch through the existing resume-branch flow, so a headless run pushes the claim's commits and takes the full review. It clears the flag by default, and `--first` and `--now` apply as today.
  - |-
    **The old refusals go.** `ClaimAndCutAsync`'s blanket `FollowUpBranch` refusal (with its `h9k pr resolve` hint) and Card 1's Done refusal are removed. A task with a follow-up branch now meets only criterion 1's allowed states and its live-session refusal. That refusal existed because the follow-up prompt fragments live in `Hall9k.Daemon`, which the CLI cannot reference. So the fragments criterion 4 renders (`AppendReviewReadScope` and `AppendCommitStyleRules`, with their templates) move out of `AgentPromptBuilder` into `Hall9k.Connectors` beside `WorkPromptBuilder`, and the daemon's follow-up prompts and the CLI's follow-up anchor call the same code. The moved fragments call the Connectors copies of the shared-history and owner-voice rules rather than bringing second copies. `h9k task start` keeps its own `FollowUpBranch` refusal, because a deliberate kick-off still cannot take a follow-up, and its hint names `h9k task drive <id>` beside `h9k pr resolve <id>`. Card 4's report rows also name `h9k task drive <id>` beside the go lever each one names.
  - |-
    `docs/operations.md`, `docs/cli.md`, and the `hall9k-cli-reference` skill document iterating on an open pull request: `drive` on a PR-stage task, closeout standing down to merge and close detection, deliver's return to Done, and the two exits (`release` back to Done, `handback` into a headless lap).
  - |-
    **Tests.** Unit tests, with fakes for git and GitHub (no test creates a branch or touches GitHub), cover the following. The decider's allowed and refused states, including the live headless session refusal, and that from a reopened Queued or Blocked lap it records only the claim and carries over the lap's kind, threads, and read scope. That `drive` chooses `CheckoutExistingAsync` on `FollowUpBranch` for a PR-stage claim and prints the one-line notice when the tree was left behind origin or reset; the checkout's own behavior stays covered by `GitWorktreeManagerTests`. That closeout under the claim leaves the PR's earlier run unsuperseded and runs only the state check; that a merge completes the claim's run and the task in one transaction and retires the earlier run; that it keeps the worktree and branch while the session is live or the tree is dirty; and that a close is recorded while the claim stays. A golden for the follow-up anchor, with threads limited to the read scope and the commit style rendered through the fragments now shared with the daemon; the existing `AgentPromptBuilder` follow-up goldens pass unchanged after the move. That deliver records `IsFollowUp: true`, passes the recorded tip to the moved guard, surfaces the guard's refusal with its reason, records `TaskBranchPushed` after a push, refuses on a PR-stage claim with nothing beyond the pushed tip, and returns the task to Done; the guard's own refusal cases stay in `ForceWithLeasePusherTests`, which move with the class. That `release` returns the task to Done with the PR's run current again, refuses past the pushed tip, clears the flag by default and keeps it with `--keep-interactive`, and refuses `--unassign`. That `handback` queues a headless follow-up lap on the PR branch and clears the flag by default. That `drive` on a `FollowUpBranch` task is no longer refused, and the hint in `task start`'s refusal names `drive`.
