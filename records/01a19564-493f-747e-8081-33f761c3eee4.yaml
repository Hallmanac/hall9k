context: |-
  ## Why

  Read `ideas/13403621-named-agent-files-claude-code-s-claude-agents-as-a-bridge-be/workspace/task-notes-brief.md` under the project home, section Task 2 closely, and the Rulings in `journal.md` beside it. Those rulings are decided: do not reopen them. Then read task 4d34dd17's criteria and context, which this task rests on and does not redesign.

  ## Shape

  One task and one pull request, the second of two. It is blocked by 4d34dd17 and not stacked, because that task is useful on merge and this one touches closeout rather than the notes path. Splitting the citation from the step would ship a field nothing writes, so it stays one pull request. Search, a by-hand promotion verb, a shadow mode, and a recovery sweep are out of scope.

  ## Settled decisions, with reasons

  - Start the step from one call in `CloseoutEngine.CompleteCloseoutAsync`, placed after `TellTheCardAsync` and before the kept-worktree and preserved-workspace early returns, and run it in the background, as `CloseoutTriageSessions` runs a triage. Every merged closeout path goes through that method. Inline is wrong: `PollOnceAsync` runs in `DispatchLoop` and `PullRequestMonitor`, so a wait there holds the watch. The job reads the task fresh and stands down when the task is not Done or `CurrentRunId` is not the merged run.
  - No dispatch event and no recovery sweep. A step takes about three seconds, so a hard kill losing one is rare and cheap. A sweep would need a true-closeout query, a node guard, and a retroactive batch on first start. A daemon stop is treated as a kill: the job records nothing and the notes read as undecided. `CloseoutTriageSessions` is not a hosted service, so the host never waits for it, and a record written during shutdown would race process exit. `CourierEngine`'s shutdown record works only because it runs inside a hosted loop. `Dispose` cancels the job and terminates the session on a best-effort basis, as it does for a triage.
  - Run the session in `RunPaths.GlobalDirectory(sessionId)`, as `CourierEngine` does, and not in the run directory as `LessonPicker` does. `HomeEntryWriter.Write` moves the whole task directory into `tasks/_archive/` within one render sweep of the merge (`CloseoutEngine.ComposeHandoffAsync` says so), `SessionResultWaiter.WaitAsync` holds a fixed stream path, so a session started there can lose its stream. On Windows a live working directory may also make the move fail; that part was not tested.
  - Follow the picker's model rule: `ResolveCourierModel(project.Model)` and `ResolveEffort(AgentRole.Courier, taskEffort: null, project.Effort)`. No new role and no knob, for the reasons the picker's challenge gave. A real session on that triple took about 3 seconds, reported zero tools and one turn, kept the two durable notes of six in the exact line format, dropped the note that told it to keep everything, and answered `NONE` on a set of task-local notes.
  - The ceiling is one lesson per task, a constant. Today's rate is 18 lessons in October, and about six lessons fit a prompt. Archived task directories suggest roughly 2.5 tasks closing a day (36 touched in 14 days, a rough measure), so a ceiling of two could turn the newest-first window over in about a day. A dropped note stays recoverable and a session is already told that a lasting claim belongs in `h9k learn`, so the cost of a low ceiling is small. Of 38 runs that recorded lessons, 32 recorded one.
  - The claim cap is 800 characters, a constant, near the 75th percentile of today's lessons (787). A claim over it is dropped rather than cut, because a cut claim is unreadable forever.
  - The citation is one note id, not a list, for example `Guid? PromotedFromNote`. One kept note makes one lesson, so the type states that nothing is merged. The task comes from `Provenance.TaskId`, which the decider requires, so the id always resolves. The name must not contain `DistilledFrom`, and the daemon must not call `RecordDistilled`: `LearningDistillTests.No_daemon_code_path_authors_a_distillation` sweeps the daemon's source for both.
  - The record sits on the task stream, as `LessonPickRecorded` does, and is held on `TaskDetails` the same way. It carries ids and closed vocabularies only, so a render of it cannot pass session prose on. The claim lives only in the lesson. Put the event in `Hall9k.Domain.Features.Tasks.Events`, because `FamilyOf` reads the namespace and an unknown family on a Task stream is refused for good. Keep it `Conditional`, not `MemberSafe` like the note: a forged record would burn the task's one record and suppress its step. Append it unfenced, like the lesson pick: a note landing during the step must not cost the lesson. At most one record per task comes from a `_running` entry keyed by task id, taken before the session starts, plus the check of `TaskDetails` before the append.
  - `Conditional` still replicates after the holder is released, because the verdict also accepts the sender's root as the assignee and the assignee stays on a closed task (`EventReplicationInbox.EvaluateTaskActVerdict`). An owner-role sender always applies.
  - Every task that reaches a merge is Team: publishing sets it (`TaskAggregate.Apply(TaskPublished)`), narrowing a Team task is refused (`TaskDecider.SetScope`), and a claim needs Queued or Blocked. So a lesson, which `ReplicationProjectResolver` always resolves to Team, never reaches further than its note did, and no scope check is needed. If a task narrower than Team can ever merge, this needs a check.
  - Add no setting. The brief makes a lesson live at once, the ceiling bounds the damage, and a person retires a bad lesson. An off switch stays additive.
  - Do not show the session the project's lessons to catch duplicates. That would cost the picker's 17,000 to 20,000 tokens per closeout, and distillation already handles duplicates.
  - Do not add a text check, for the reason 4d34dd17 gives. A build session can already write the same claim with `h9k learn`, so this path adds no new exposure.

  ## Where the code is (verified at 6b18a7db8)

  - The shape to copy: `src/Hall9k.Daemon/Execution/LessonPicker.cs` for the attempt, wait, terminate, and record flow, `LessonPickerPromptBuilder.cs` for the fenced prompt, `src/Hall9k.Domain/Features/Learning/LessonPickAnswer.cs` for a pure answer reader, and `LessonPickOutcome.cs` for a closed vocabulary with `SpawnedSession`. The background pattern is `src/Hall9k.Daemon/Closeout/CloseoutTriageSessions.cs` (`_running`, `_stopping`, `WhenIdleAsync`), wired as an optional constructor parameter of `CloseoutEngine` beside `triageSessions`.
  - Closeout: `CompleteCloseoutAsync` at `CloseoutEngine.cs:2594`, its callers at 659, 800, 1118, and 1889, and through `ReconstructAndCompleteAsync` at `RunLauncher.cs:1617` and `ReviewEngine.cs:1670`.
  - Spawn: `AgentSpawnRequest` with `UntrustedWorkingDirectory: true`, `MaxTurns: 1`, `NoTools: true`, and `TaskId`. Add a `SessionRoleName` constant. The courier's spawn is at `CourierEngine.cs:358`. Pass `ExecutorMode.Subscription`, as `CourierEngine` and `RunLauncher` do, not the run's own mode, which is blank on a reconstructed run. Offer each note under its eight-character short id and read it the way `LessonPickAnswer` does, so a short id that names two offered notes is ignored and counted.
  - Tokens: `result.ToTokensRecorded(runId, now, model)` onto the merged run. `RunDetails.Apply(IEvent<TokensRecorded>)` adds regardless of state, so a completed run accepts it. The session count is the pattern match at `TaskPassageQuery.cs:72`. Append to the merged run's stream, never to the session id: a `TokensRecorded` on a stream no run opened mints a phantom run. No run on this node has an event after `RunCompleted` today, so add a test that the run stays Completed and its totals include the step.
  - Lessons: `LearningDecider`, `LearningRecorded`, `LearningAggregate`, and both write sites in `LearningDetailsProjection` (`Create` and the `Apply` beside it). `LearningShowCommand.cs:60` is where the citation prints. Stamp with `EventRecordingNode.StampAtAppend` as `LearnCommand.RunAsync` does, because the projection is Inline and an unstamped lesson reads as `AgentOnUnobservedNode` and never reaches a prompt.
  - Trust: `LessonProvenanceMark.Of` and `ReachesAPrompt`, through whatever read 4d34dd17 ships, with a `LocalFleetReader` read only when a note is replicated. Test with a replicated note from a Member-role sender. 4d34dd17 classifies notes `MemberSafe`, so such a note is on the stream and the trust rule alone keeps it out of the step.
  - Registries: `EventScopeRegistry` and `TaskActClassificationRegistry` each have a test that fails without the new type. `OrchestratorFeedInterest` admits by listed type, so leave the new type out.
  - Options: `LessonPickerTimeout` at `DaemonOptions.cs:795`. Templates: add one beside `lesson-picker.md`, with `KEEP` and `NONE` declared once where `PromptContractTokens` can see them.

  ## Work in flight

  ee441155 and 3e3c9f7f both touch `TaskDetails.cs`, and neither touches `src/Hall9k.Daemon/Closeout` or the Learning feature, so expect trivial merges. Re-check line numbers against main before starting, and re-read 4d34dd17 as merged for the names of its note id, its list on `TaskDetails`, and its read.

  ## Constraints

  Events stay additive so older streams replay. Keep the answer reader, the ceiling, and the offer selection pure, so each is provable without a store. Tests never create branches or touch GitHub. The closing path's test uses a fake executor that never answers.
