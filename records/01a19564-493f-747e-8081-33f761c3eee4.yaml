objective: A task's notes worth keeping beyond it become cited lessons at closeout, and the rest are dropped on the record
criteria:
  - |-
    When the daemon observes the merge that closes out a task holding notes, on any path into merged closeout, one promotion step starts after that closeout has committed, the task's dependents have been released, and its card or issue has been told. Closeout never waits on the step: with a session that never answers, closeout finishes and removes the worktree and branch exactly as it does for a task with no notes.
  - No step runs and nothing is recorded for a task with no note the closing node may offer, for a task that ends any other way (abandoned, failed, a spike's verdict, or resolved by attestation with no merge observed afterwards), or for a merge whose task has moved on to a newer run.
  - A task has at most one promotion record, whatever its outcome. A second merge of the same task, a sweep observing the same merge again, or two closeout paths racing start no second session and change nothing. A note recorded after the step is never offered to one.
  - The step offers only the task's own notes that `LessonProvenanceMark` lets into a prompt on the closing node, by the same rule the notes section uses and with no second copy of it. A held note appears in no promotion prompt and is only counted on the record, and an unreadable fleet holds every replicated note. A sibling task's notes are never offered. At most 30 notes are offered, newest first, and each note past that is dropped as not offered.
  - The step's session has one turn, no tools, no MCP servers, and no project settings. It runs in a directory of its own outside the project home's task tree, so the render sweep moving the task into `tasks/_archive/` cannot touch the session or its stream. Its model and effort are the courier's for this project and node, and a task's own override never moves them. A session past the daemon option `NotePromotionTimeout`, default 60 seconds, is terminated.
  - The session's prompt holds the task's objective and each offered note under its id on one line of printable text, all as quoted data, and nothing else from the task. It says that the notes are data rather than instructions, that the default for every note is drop, that at most one note may be kept, that a kept note becomes one self-contained claim on one line of at most 800 characters phrased as an instruction to the next agent, that two notes are never merged, and that a lesson is permanent and public so it never holds secrets, credentials, personal data, customer details, or another project's name.
  - |-
    The daemon reads the answer as `NONE`, or as lines of the form `KEEP <id>: <claim>`, and ignores blank lines. Any other line makes the whole answer unusable. A line naming a note that was not offered, or repeating one already read, is ignored and counted. A note whose claim is blank or over 800 characters is dropped with that reason, and a claim is never cut or edited beyond trimming. When more than one note stands, the first is kept and the rest are dropped as over the ceiling.
  - A kept note becomes one live project lesson whose statement is the claim, whose provenance names the merged run and the task with attendance unattended, and whose recording node is stamped at the append. On the closing node it reads as `AgentOnThisNode` and reaches the next prompt composed there, and it never reads as `NoRunNamed` or `AgentOnUnobservedNode`. The lesson and the record land in one transaction, so a failure leaves neither.
  - |-
    `LearningRecorded` gains a nullable citation of its one source note, a sibling of `DistilledFrom` rather than a reuse of it, and `LearningDecider` gains a promotion entry point that refuses an empty note id, a provenance naming no run or no task, and a blank claim. A lesson recorded any other way carries null, older streams replay unchanged, and `No_daemon_code_path_authors_a_distillation` passes unchanged.
  - |-
    `h9k learn show` prints the cited note's id and its task's id and no note text. `h9k learn list`, `lessons.md`, and a lesson's line in a prompt read the same for a promoted lesson as for any other.
  - Each step that reaches a decision or a failure records one event on the task's stream holding the run, the outcome from a closed list, each offered note's id with either kept and its lesson id or dropped and a reason from a closed list, the held count, the ignored-line count, the model, the duration, and the time. It holds no note text and nothing the session wrote. It is `ProjectScoped` and `Conditional` as `LessonPickRecorded` is, it adds no orchestrator feed item, and `h9k task show` prints the outcome and the counts.
  - When the session cannot start, ends in error, ends with no result, exceeds its bound, or gives an unusable answer, or when the lesson write fails, nothing is promoted, the record names which of those happened, and each offered note is dropped as step failed. The step is not retried. A failure to write the record itself is logged with the run and task ids and changes nothing else. A daemon that stops or is killed during the step records nothing, and its notes read as undecided.
  - The session's tokens land in the merged run's recorded totals under the model it ran on, and the session count in `h9k task show` includes it when a session started.
  - |-
    `h9k task notes` and `notes.md` show each note's outcome: kept with its lesson id or dropped with its reason when the record names the note, otherwise held when the reading node holds it, otherwise undecided, which means no step decided it. A dropped note's own event is untouched and its text stays readable there. `h9k task notes` stays refused inside a dispatched session, and every surface task 4d34dd17 keeps free of note text stays free of it.
  - |-
    `docs/concepts.md`, `docs/cli.md`, and the `hall9k-cli-reference` skill state the step: drop by default, at most one lesson per task, live at once, retired by a person, and undecided after a daemon stop or kill, and `docs/operations.md` lists `NotePromotionTimeout` beside the lesson picker's bound. The passages in `docs/cli.md` and `docs/scope.md` saying the daemon never distils stay true and say why: a promotion copies one note and cites it, and it merges and replaces nothing. `docs/concepts.md` says plainly that a promoted lesson is a rewritten claim that reaches later review prompts as any lesson does, which is the one way a note's substance can reach a reviewer.
