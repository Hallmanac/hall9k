objective: While a task's interactive flag is on, closeout reports what it finds on the pull request (review threads triaged by a read-only session, failing checks and conflicts stated plainly) and changes nothing on the branch or in the thread until the human says go, and a pre-approved merge waits for the human.
criteria:
  - |-
    **Hold the laps.** For a task with the flag on, `CloseoutEngine.InspectAndActAsync` dispatches none of the laps it would otherwise dispatch (review feedback, changes requested, failing checks, rebase, stack replay) and makes no write to the branch or the pull request: no mechanical rebase and no stacked retarget. Everything else it does today still runs: merge and close detection, `ExternalReviewObserved`, the membership gate and its non-member evaluator, advisory-thread recording, re-requesting an errored Copilot review, the countersign re-request after a fix lap, and the parks for a stacked parent that died or merged elsewhere.
  - |-
    **Triage.** When unresolved threads would have bought a lap, closeout dispatches one read-only triage session (on the read-only evaluator pattern in `FeedbackEvaluators`) that applies `resolve-review-threads`' triage step, classifies each thread as fix, decline, or route with its reasoning, writes a report to the run directory, and posts and files nothing (a route says where the finding belongs rather than running `h9k idea add`). It runs once per distinct set of outstanding threads, not once per poll. It inherits the pattern's guarantees: the dispatch is recorded, with the report's path, before the session spawns; a per-task lifetime cap applies (past it, the needs-you row says no triage ran); thread text is fenced as data; non-member threads go through the membership gate first, as today; and only the disposition counts reach the stream and the row, while the report's prose stays in its file.
  - |-
    **Report.** Failing checks, conflicts, changes-requested reviews, and a stacked parent that moved or merged are reported deterministically, with no session. A new run event records a report only when what it reports changes (a check newly failing or cleared, a conflict or a changes-requested review appearing or cleared, a parent moving), never once per poll. `h9k status` and `h9k task show` show a needs-you row naming the report and the go lever matching what it reports: `h9k pr resolve <id>` for threads, `--checks` for failing checks, `--rebase` for a conflict, and `h9k task revise <id> --clear-interactive-mode` for a changes-requested review or a stacked parent, because no `pr resolve` form dispatches those laps and the next poll then dispatches them as today. Each lever hands the task back to automation, and a headless lap then does the work. Card 5 adds `h9k task drive <id>` to the row.
  - |-
    **The go.** `h9k pr resolve` on such a task, in any of its forms (plain, `--checks`, `--rebase`), clears the interactive flag, recorded as `h9k task revise --clear-interactive-mode` records it and in the same append as the reopen, and then dispatches the lap as today, so the follow-up run and closeout behave fully automatically, a pre-approved merge included (Brian, 2026-10-13 and 2026-10-23). The first lap dispatched after the flag clears carries the latest triage report in its prompt when one exists, fenced as data, so the session does not re-triage from nothing.
  - |-
    **The merge hold.** A pre-approved task with the flag on does not auto-merge; closeout shows a needs-you row ("pre-approved; end iteration with `h9k task revise --clear-interactive-mode`, or merge it yourself on GitHub"). With the flag cleared, pre-approval behaves exactly as today.
  - |-
    **Unchanged without the flag.** A task without the flag behaves exactly as today on every path. A task already Done with the flag on when this ships gets the new behavior with no special case: every lever these rows name clears the flag (each `pr resolve` form does, and the others are `h9k task revise <id> --clear-interactive-mode`), so the way back to today's closeout is always on the row. The PR description says that such tasks change behavior at upgrade.
  - |-
    `docs/concepts.md`, `docs/operations.md`, `docs/cli.md` (where `h9k pr resolve` is documented), and the `hall9k-cli-reference` skill describe analysis-only closeout, the merge hold, and that `pr resolve` hands a driven task back to automation.
  - |-
    **Tests.** Tests added to the existing `CloseoutEngineTests` class (its Postgres fixture and faked inspector, so no new container-backed class), none of which creates a git repository or a branch, cover: each lap held under the flag and taken without it, including the stacked retarget and replay; triage dispatched once per thread set; each report event and its row naming the matching lever (the `pr resolve` form, or the clear lever for a changes-requested review or a stacked parent); several polls of an unchanged report writing one event; the merge hold under each pre-approval mode; a restart with the triage dispatch already recorded starting no second session, and a task past the cap getting the no-triage row; and the stream and the row carrying the triage counts but none of the report's prose. Further tests cover `pr resolve` in each form recording the flag clear in the same append as the reopen, the first lap after the flag clears carrying the report, and a golden for the triage prompt.
