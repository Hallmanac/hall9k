  The interactive flag (`TaskAggregate.InteractiveModeEnabled`) is set by every `h9k task work` claim and by every direct `h9k task start` (TaskStartCommand.cs:97-103), so a task a human kicked off headless with `task start` also gets analysis-only closeout and the merge hold. That follows the ruling that this behavior is keyed on the flag; correct the stale doc comment on `InteractiveModeEnabled` that says `task start` sets it only on request. Closeout reads no flag today. The triage session copies `FeedbackEvaluators` (its dispatch-before-spawn event, lifetime cap beside `DaemonOptions.NonMemberFeedbackEvaluatorCap`, pr-review permission file with one write path, and recommendation-only recording).
