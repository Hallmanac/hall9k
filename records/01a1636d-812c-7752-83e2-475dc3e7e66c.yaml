objective: The pr-summary skill asks for a short before-and-after scenario in the description of any pull request that changes behavior someone will notice
criteria:
  - |-
    In `.claude/skills/pr-summary/SKILL.md`, "How it should read" gains one rule: when a pull request changes behavior a user or operator will notice, the body includes a before-and-after scenario of two to four lines with no heading of its own, placed right after the orientation sentence. It is either a Before line and an After line, or a short acted-out sequence with a concrete actor (you, the operator, a reviewer) rather than an invented name.
  - The rule is triggered by the visible behavior change, not by the size of the diff. It says that a documentation-only change, a refactor, a test-only change, or a change whose effect no user or operator would notice skips the scenario. "How long it should be" says the scenario counts against the same proportionality budget, so on a small change it stands in for the second orientation sentence rather than adding lines.
  - A new short worked example, beside the existing ones, shows a behavior change with its scenario. The existing small-change (documentation-only) example and the larger bad-then-good pair are unchanged. The new example follows the skill's own Keep out list (it cites no hall9k task, run, idea, or decision id) and the project's writing conventions (no em dashes).
  - The bug rule's existing text (reproduction steps, one bullet each, the consequence after the list) is unchanged. The new rule says that for a bug fix the reproduction serves as the Before, with one After sentence following the consequence, so the skill never asks a bug fix for both a reproduction and a separate scenario.
