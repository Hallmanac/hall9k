  Brian, 2026-10-22: PR descriptions should be very human-readable and give an example scenario, maybe before and after. Today the skill covers human-readability and bug reproductions only. Example for c9f06a01: Before, h9k learn distill gave you a task that ran gates for 14 minutes and failed at opening a PR. After, it gives you a research spike that records its findings and ends cleanly. The owner's voice skill (my-voice) was set the same morning and already favors scenarios; this rule makes it independent of a voice skill.
