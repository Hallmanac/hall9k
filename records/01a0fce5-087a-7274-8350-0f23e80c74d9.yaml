context: |-
  Read the mentioning comment before anything is claimed: who wrote it, who it tags, and whether it asks anything of this install's owner. Decide from that whether a claim and a task run are needed at all. A full run that analyzes the whole pull request just to read one comment is the wrong default. Motivating case: arx-platform#2166 / bc7d2572 on 2026-10-01, where Brian's reply tagging @taylor-dennison woke his own review task and ran a follow-up that found nothing.

  Brian, 2026-10-02 (f894d344 discovery question 1): the three follow-up laps on 2026-09-29 (AgelessRx/arx-platform #2170, #2172, #2174, Taylor answering Brian's reviews, $5.28 recorded) were not useful as runs; what was useful was knowing what Taylor had replied. So this card keeps a view of the reply and drops the run. Brian chose option A: the reply's own opening lines, no model call. Option B, a short summary written by a tool-less model call, is a possible follow-on only if Brian asks for it; do not build it here. Where it lives: AutoPrReviewEngine.AttachMentionAsync and its dispatch gates (around 2241-2380 at e03c7d7e6); PullRequestMentionSearch.Author already carries the author's login and account id. Blocked on 5f6b4783, which owner-scopes the same attach lookup; cut from a main that has it. Sibling card 447cd320 changes the mint branch, not attach, and can run in parallel with this one. Discovery report: notes/discovery-f894d344-2026-10-01/report.md in the project home.

  Discovery workspace (research notes, gathered files, and prototypes from before this was a task; may be empty):
