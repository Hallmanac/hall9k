context: |-
  ## Why

  With some projects bound to an alternate Claude Code account, the operator wants each subscription's usage visible on its own. The account binding, the per-run freeze, and the claude-code connection all shipped with the dependency (now Done), so this task only reads what is already recorded.

  ## What the code has (at d87a1dfd7)

  - `src/Hall9k.Domain/Features/Run/PeriodSpend.cs` sums `TokensRecorded`, `PublicationTokensRecorded`, `CourierTokensRecorded`, `PlanTokensRecorded`, and `PurgedSpendRecord` since the period start, grouped by model only. The dispatcher, the plan engine, auto-pr-review, and four CLI commands all read it, so leave it unchanged and compute the split in a separate read that only `h9k config show` calls. `TokensRecorded.Id` is the run id at every place it is recorded, so the data-only read already has what the join needs.
  - `src/Hall9k.Cli/Commands/SpendPressure.cs` shapes the lines; `ByModelLines` is shared by `h9k status` and `h9k config show` (`ConfigShowCommand.SpendLinesAsync`). The account lines belong to `config show` only.
  - `RunClaudeCodeAccountRecorded` (`src/Hall9k.Domain/Features/Run/Events/`) is node-scoped and rides the run stream; `ConnectionId` null means the default login. `RunDetails.ClaudeCodeAccountRecorded` and `ClaudeCodeConnectionId` project it, and `ClaudeCodeAccountBinding.ForRun` reads them. Join a run's `TokensRecorded` to its own stream's record; a run with no record on this node is unattributed, not defaulted (`ForRun` treats it as the default login for spawning, which is right for spawning and wrong for reporting).
  - `ConnectionDetails.ClaudeCodeEmail` and `ClaudeCodeAccount.For(...).Describe()` give the label. A directory printed to this node's own terminal is fine; it must never reach an event.

  ## What lands in unattributed, and why

  - `TokensRecorded` is project-scoped and replicates, so the period total already includes teammates' runs. Their freeze record is node-scoped and never arrives here, so their runs are unattributed. So are this node's runs dispatched before the freeze existed.
  - Sessions outside a run (plan refinement and discovery, challenges, card publication, feedback steps, couriers) do spawn under an account, but none of their token events records which. Recording that is a separate follow-up and is deliberately not in this task.
  - A few sessions on a run stream (lesson picking, blocker context, note promotion) spawn under the project's current binding rather than the frozen one. Counting them toward the run's frozen account is the accepted approximation; they differ only after a mid-run rebind.

  Public records: never name another project, organization, or person.
