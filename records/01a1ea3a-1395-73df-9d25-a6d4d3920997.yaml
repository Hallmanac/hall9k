objective: h9k config show splits the period's recorded spend by the Claude Code account each run on this node was frozen on, so each subscription's run usage can be read on its own, with everything it cannot attribute shown as one unattributed line
criteria:
  - |-
    `h9k config show` prints, beneath the existing spend summary and by-model lines, one line per Claude Code account with spend this period: the default login and each claude-code connection, each named by `ClaudeCodeAccount.Describe()` (the default login as "the default Claude Code login", and a connection as its observed email followed by its directory). It always prints one unattributed line, even when that line is zero, and the account lines plus the unattributed line add up to the summary's total.
  - Every input token a run recorded on its own stream, counted the way the summary counts it (fresh input plus cache reads plus cache writes), counts toward the account that run recorded at dispatch, even when its project has been rebound since. Spend from a run with no account record on this node, and all spend recorded outside a run (plan, card publication, challenge, feedback, and courier sessions, and purged-project records), counts as unattributed, and the output says in words what the unattributed line holds.
  - |-
    `PeriodSpend`'s total and by-model breakdown are unchanged, and so is every surface that reads them: the summary and by-model lines of `h9k config show`, `h9k status`, `h9k project show`, the plan launch gate, and the spend gates in the dispatcher, the plan engine, and auto-pr-review. The account split is computed only when `h9k config show` runs, never inside the read those gates share.
  - |-
    The change only reads: it adds no event type and no field to an existing event, so no directory, email, or connection id reaches a replicating event.
  - Tests over recorded events cover runs frozen on two different claude-code connections, a run frozen on the default login, a run with no account record, and spend recorded outside a run, and assert each account line, the unattributed line, and that they sum to the total.
  - The docs that describe `h9k config show`'s spend lines (docs/getting-started.md and the spend paragraph in docs/scope.md) say the account split exists and what the unattributed line holds.
  - No test creates a branch, touches a remote, or calls GitHub.
