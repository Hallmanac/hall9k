objective: |-
  Decisions and lessons are event-sourced platform data: Decision and Learning aggregates with their own streams, stable ids that serve as citation keys, recorded provenance, and one CLI path for humans and agents to record, list, show, supersede, and retire them
criteria:
  - |-
    Two aggregates with their own streams, Decision and Learning, each with a stable id that is the citation key, a scope (project, or owner for cross-project habits), the statement, and recorded provenance: who recorded it, from which run and task if any, whether a human was attending, and for a decision the origin incident and what it supersedes; provenance is observed, never inferred, and a lesson typed from a shell carries explicit nulls for run and task
  - |-
    One CLI path for both callers: h9k decide "<statement>" and h9k learn "<statement>" record the event and print the id; each has list, show, and a terminal verb (supersede for a decision, retire for a lesson), both appending with a required reason and never deleting; the bare positional form always writes and never reads
  - A decision or lesson scoped to a project is a project-scoped event in the stamping classification registry so M2a replication carries it; an owner-scoped lesson stays home; a decision recorded from inside a run is refused unless the run is human-attended (agents record lessons, humans record decisions)
  - Listing is a cheap indexed query over a projection row per record (scope, scope id, status, recorded-at); show renders provenance and, for a decision, what it superseded and what superseded it
  - Tests through the seams cover record, list, show, supersede, retire, the refused agent decision, and the provenance nulls; dotnet build and dotnet test pass; the help tree teaches what a good statement looks like (one claim, imperative, self-contained) with an example
