context: |-
  Decisions, decision-log entries, and run-earned lessons are recorded as event-store events through the daemon or the CLI, under an aggregate discovery decides, and PLAN.md section 16, AGENTS.md, and any similar markdown become projections of those events rather than hand-edited sources. Brian's ruling 2026-09-16 during the Decisions Log discussion: the log is carrying binding decisions, lessons, and a per-task change diary in one 1 MB file whose sequential numbers (cited 1,283 times across 421 files) force a renumberer, a placeholder value object, a guard test, and a tail conflict on every stacked replay; backlog 55 (the learnings loop) already designs lessons as a Learning stream with prompt injection, retirement, and distillation, and IDEA-learning-capture is its canonical shape; this idea extends the same rule to decisions and makes the markdown a projection. Supersedes the freeze-and-per-file proposal, 7af7204a (#418, unassigned), and 2fa45efc, which fold into its discovery. Walk after the distributed-team chain drains.

  Piece 1 of 5, the store. Idea d805fd8b (decisions and lessons as events, markdown as projections), walked with Brian 2026-09-16 15:4x to 16:2x; the walk journal in the idea's workspace holds his statements and rulings. Build after the distributed-team chain (idea 202383dc) is solidified: these events must ride M2a's replication. Inputs: backlog/55-learnings-loop.md and backlog/IDEA-learning-capture.md (the Learning stream design; reconcile their quarantine disagreement in favour of live-at-once with provenance marks), PLAN.md section 16 (234 entries, sequential numbers cited 1,283 times across 421 files), ProjectHomeRenderLoop (the existing projection pattern), the event classification registry from the stamping task. Writing conventions: no em dashes, full sentences. Testing rule (Brian, 2026-09-13): no test touches a repository or remote.

