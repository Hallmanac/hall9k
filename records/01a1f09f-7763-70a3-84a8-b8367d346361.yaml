objective: Make the Claude Code account probe work with an npm install on Windows, and have binding a project to an account say what it bound and what to do next
criteria:
  - On Windows, the account probe in src/Hall9k.Connectors/ClaudeCode/ClaudeAuthStatusProbe.cs starts an npm-installed claude.cmd as well as claude.exe, either by running through cmd.exe /c or by resolving the name against the PATHEXT extensions before starting it (the rule DaemonEnvironment.ResolvesAsGiven applies, with .COM;.EXE;.BAT;.CMD when PATHEXT is unset). A .ps1 script is never chosen, because it cannot be started this way. The resolution lives in Hall9k.Connectors or Hall9k.Domain, because the daemon runs the same probe and neither it nor the probe can reach Hall9k.Cli. A HALL9K_CLAUDE_PATH override is still honored, and off Windows the probe starts exactly what it starts today. With this, h9k connection add claude-code and later account checks no longer refuse with "'claude auth status' could not run" on an npm install.
  - A unit test covers how the probe's command is resolved or wrapped on Windows, at least for a PATH holding only claude.cmd and for one holding claude.exe beside claude.cmd. It starts no real Claude Code process, and it runs on every operating system the suite runs on rather than only on Windows, because the resolution takes the operating system, PATH, PATHEXT, and file existence as inputs.
  - h9k project set <project> --claude-code-account <connection> prints, after its existing confirmation, a consequence line that names the bound account the way ClaudeCodeAccount.Describe does (its recorded email and directory, or "an unobserved account" and the directory when no email is recorded). The line says that work dispatched from now on runs under that account while runs already dispatched keep the account they were dispatched under, that Claude Code windows already open keep their old login until they are relaunched from a freshly printed line, and that the orchestrator recipe should be regenerated because its spawn lines carry the account.
  - h9k project set <project> --claude-code-account default prints, after its existing confirmation, a consequence line saying the project is back on the default Claude Code login. It says that work dispatched from now on runs under the default login while runs already dispatched keep the account they were dispatched under, that windows already open keep the bound login until they are relaunched from a freshly printed line, and that the orchestrator recipe should be regenerated.
  - |-
    docs/scope.md no longer says the h9k task drive launch line does not set the account (it does since #888).
