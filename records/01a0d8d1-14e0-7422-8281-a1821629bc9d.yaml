objective: A node that joins an existing project by invite receives the project's pre-switch-on membership and team-settings history on its first catch-up, so h9k project show and h9k status read it as joined instead of 'not joined yet' forever
criteria:
  - |-
    Root cause is written into the fix's own commit and the pull request description: the Project aggregate's team-facing events are merged onto the receiver's own local Project stream, where the ordinary outbox lands post-switch-on events first and the catch-up answer serves the older head afterward, so the per-origin high-water guard in EventReplicationInbox, keyed on that receiver-local stream, refuses the head as out of order on every reconcile and nothing can repair it
  - The origin high-water refusal in EventReplicationInbox no longer applies to events ProjectStreamReplicationRules.IsProjectAggregateStreamEvent names; it applies unchanged to every other stream, a new test proves the guard still refuses an out-of-order record on a Task stream, and a duplicate of an already-applied origin event id is still dropped for those events by the existing idempotency check
  - |-
    For exactly those events, every reader gives the same answer whatever order they sit in the stream: in the ProjectDetails projection a member vouch or removal is last-writer per fingerprint by the event's own stamp, so a removal stamped later than a vouch wins even when the vouch arrives second; a team-settings change is applied per changed field only when that field's ChangedAt is not older than the one already applied; a prompt-addendum or run-skill change is applied only when its own stamp is not older than the one already applied; and ReviewDriveSetting and AutoPrReviewSetting, which the daemon reads off the stream, read the newest-stamped team value whatever order the events sit in the stream; so a pre-switch-on head arriving after a newer tail never overwrites a newer value
  - |-
    A two-store test reproduces the issue's shape: origin A holds a MemberVouched and a ProjectTeamSettingsChanged before its switch-on point and another ProjectTeamSettingsChanged after it; receiver B takes the ordinary post-switch-on flush first, then the bootstrap catch-up answer (the path a fresh join runs). The test fails on the current tip and passes with the fix, and proves B's ProjectDetails.Members holds the vouched member, its team settings match A's newest, ProjectJoinStatus.NotJoined reads false, and the log carries no out-of-order refusal for those events
  - A node already stuck in this state on v0.10.50 is repaired by one explicit h9k project reconcile <project> after updating, with nothing else typed; proven by the same two-store test starting from a store that already holds the refused tail and no head, whose reconcile record is already complete, and taking the by-hand reconcile's answer
