context: |-
  Filed by Brian from his Windows ARM64 Parallels VM (node B, the third node of his fleet, joined by h9k node invite on 2026-09-25) against v0.10.50, the Mac (node A, 01a00d41) as the origin. The issue body is authoritative for the evidence: the receiver's h9kd.log refuses origin sequences 42995 (member_vouched, 2026-09-20 22:18), 42998 and 43459 (project_team_settings_changed) on every catch-up answer because sequence 63884 (project_team_settings_changed, 2026-09-25 00:22, post-switch-on, delivered by the ordinary outbox first) already sits on the receiver's own local Project stream. Verified against main at a1237be0e by the orchestrator: EventReplicationInbox rewrites effectiveStreamId to the receiver's project id for ProjectStreamReplicationRules.IsProjectAggregateStreamEvent (ProjectTeamSettingsChanged, MemberVouched, MemberRemoved, ProjectPromptAddendumSet, ProjectPromptAddendumRemoved, ProjectRunSkillRecorded; src/Hall9k.Domain/Features/Replication/ProjectStreamReplicationRules.cs) near line 672; the per-origin high-water guard (OriginHighWaterAsync, applied near line 827) is keyed on that effective stream id, so for these merged events it compares the sender's sequences across two delivery paths (the ordinary post-switch-on outbox and the bootstrap or explicit-ask catch-up answer, which lifts the switch-on exclusion in EventCatchUpResponder near line 138) and refuses the older head forever. The guard's own reason (a replayed TaskAdded resetting state) is about shared-id streams (Task, Idea, Epic, Run) and does not apply here. Ordering clocks: MemberVouched carries IssuedAt and ProjectTeamSettingsChanged carries ChangedAt (their event records), but ProjectDetails.Apply for both (near lines 432 and 581) compares nothing today, the last event applied wins; so criterion 3 is a real change, ordering each field by the event's own time (ChangedAt per changed field for settings, IssuedAt per fingerprint for membership), never by append order. Smallest fix: exempt IsProjectAggregateStreamEvent events from the origin high-water refusal, keep the guard for every other stream, and make the projection order-tolerant for exactly those events. The issue's second suggestion (NotJoined falling back to the ledger's members ref after a successful join) is a separate, smaller improvement; decide at the walk whether it rides along or gets its own draft. Only the display is affected today (ProjectJoinStatus.NotJoined is read by ProjectShowCommand and StatusCommand, nothing else); dispatch is unaffected. Two-store harnesses: tests/Hall9k.Tests/Integration/EventReplicationTests.cs, EventCatchUpTests.cs, FleetReconcileTests.cs, HeadlessReplicatedStreamRepairTests.cs. Repro is on the issue (steps 1 to 5). Unplaced; placement is Brian's call. Dispatched sessions must not run install, update, join, or reconcile against the live install. No em dashes in anything authored.
