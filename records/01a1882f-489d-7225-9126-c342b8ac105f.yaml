objective: |-
  A solution groups one-repo projects: h9k solution add, show, list, link, unlink, rename and close, with the solution carried as a membership team setting on every member project, exactly one solution per project, and a cross-project board.
criteria:
  - |-
    h9k solution add <name> --project <p> (repeatable) mints a solution key (a 26-character ULID) and writes a SolutionMembership into each named project's team settings in that one command: the solution's key and name, its state (open or closed) with a close reason, and every member by project key with its project name and repository URL. The name follows the rules a project name follows (unique on this node, case-insensitive), and every solution command resolves <name> by name or key prefix. There is no separate Solution stream: the membership on the members is the solution.
  - The membership is one more optional team field, set through ProjectDecider.ChangeSettings and carried by ProjectTeamSettingsChanged.From, and every solution command appends the team companion the way h9k project set does, so it replicates with no new replication path, no new stream, and no change to EventReplicationInbox; the existing callers of ChangeSettings compile unchanged. A node that receives a membership for any member knows the whole solution from it, with nothing further to record.
  - |-
    A project belongs to at most one open solution, enforced in ProjectDecider.ChangeSettings: writing a membership with a different key onto a project whose current membership is open is refused, naming the solution it is in and pointing at h9k solution unlink. A closed membership does not hold the project. The setting is a single value in storage.
  - h9k solution add and link refuse a project with no recorded project key (naming h9k project join, or h9k project assign-key for the genesis owner) and a project with no recorded repository URL. Link, unlink, rename and close rewrite the membership on every member in one command, and refuse, naming the members, when any member is not registered and joined on this node.
  - h9k solution add and link warn and ask for confirmation when the new member's repository owner or organization differs from every existing member's; --yes answers it, and a session that cannot prompt refuses without --yes.
  - h9k solution rename and h9k solution close --reason are explicit human acts; close marks the membership closed with its reason on every member. Nothing closes a solution automatically, including every member being archived.
  - h9k solution show <name> composes the solution's board across members grouped by project, reusing TaskStatusComposer, TaskRollup and the project show task table, every row a task id plus a plain description; it lists members this node has not joined by name and repository URL, and shows a closed solution's reason.
  - h9k solution list exists, h9k project show gains a Solution row, and task list and epic list accept --solution, resolved to the member projects known on this node.
  - Every new command and option carries help that teaches the ladder solution, project, epic, task, and every refusal quotes the rule it enforces. The commands that write are refused to dispatched sessions and show and list are read-only there, in DispatchedSessionCommandClassification.
  - Unit tests cover the membership's validation, the one-solution refusal, the team companion carrying the membership, a replicated membership landing on a second store's project through the existing in-memory replication tests, the missing-key and not-held-here refusals, the owner-mismatch decision, and board composition; no test creates a branch or touches GitHub.
  - docs/scope.md, docs/concepts.md, docs/cli.md and the hall9k-cli-reference skill describe the solution concept and its commands.
