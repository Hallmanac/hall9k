context: |-
  Discovery for idea f8212260 is in the idea's workspace: findings.md (the design, the name, the hard-to-reverse choices) and journal.md (Brian's rulings on 2026-10-29); the challenge's evidence is notes/challenge-b8ac105f/journal.md in the project home. Model the membership on ContextLinks: a named record, replace-the-whole-record semantics on ProjectTeamSettingsChanged, a repeatable flag. Members are named by project key (the 26-character ULID from the ledger genesis, identical across nodes), never by local project id. The challenge of 2026-10-29, accepted by Brian, dropped the node-scoped SolutionAggregate the findings first described: nothing on main mints a local stream from a received event, and a node-scoped close would never reach the other nodes, so the membership itself carries the name, state and close reason. The one-solution rule exists for a security reason Brian gave: a project in two solutions would put each solution's member names and repository URLs in front of the other solution's teammates. Two nodes linking one project into different solutions at the same moment resolve as last write wins on replication; that is parked until it first happens. This piece changes nothing in dispatch, delivery, review, closeout or the gh layer. It is the base of a stack: solution epics stack on it, the solution window and onboarding are blocked by it, and the solution home in the window card is named after the solution's name.
