context: |-
  Captured 2026-09-19 23:4x EDT by the Mac project window during the first persona hand-off; re-evidenced by the challenge session of 2026-09-21 against origin/main at v0.10.24 (b4002efe). The original incident: Windows queued a broadcast events-request for ec35ceca's stream at 13:40 (request 01a0bac1-7338-710e-b039-917cd6dec816); the Mac, on v0.10.0, answered events-unavailable at 13:41; Windows re-ran h9k task add --from-issue 447 at 23:36 and was told the old request was still on its way. What the challenge session found: main already closes a broadcast request on a decline (EventCatchUpInbox.ReadFromAsync, Candidates.Count 0 arm, landed in 717c5805 on 2026-09-19 15:40, shipped in v0.10.5), so the 23:36 refusal was the pre-v0.10.5 request document standing outstanding because the decline had been read by the older inbox that only handled candidate declines. The remaining gaps are the ones the criteria name: only the last reason string is kept and no node id or time, h9k status shows outstanding requests only (StatusCommand.WriteEventCatchUpRequestsAsync about line 488), TaskPullCommand lines 149 to 151 still say a broadcast never closes, and nothing clears a stale pre-v0.10.5 request but hand surgery. Added 2026-09-21 08:5x EDT by the Windows project window on Brian's word, from a two-direction pull test: the Mac pulled 3727884f (01a0afff-b9e1-74a1-b84a-2b213727884f, Windows-origin, Done here) and it landed in about 2.5 minutes as Delivered with laps 0 and sessions 0 because the answer carried the task stream and not its run streams. The same morning Windows pulled d05e141c (Mac-origin, tail held here since 02:06 under the v0.10.20 path) and it landed whole and Done because this node already held its run events from the ordinary flush. Code map: EventCatchUpCoordinator.RequestStreamBroadcastAsync (about line 183, the AnsweredAt null and not Exhausted guard) and RequestGapFillAsync (about line 100, the reMintCooldown shape to reuse); EventCatchUpInbox.ReadFromAsync (declines); EventCatchUpResponder.AnswerAsync (about lines 70 to 78 bound the scan to the one stream, so serving a task's runs adds a RunListItem lookup by TaskId and widens that bound); EventReplicationInbox.ApplyAsync holds records at about lines 563 to 588 and ApplyHeldTailAsync replays them; HeldReplicatedEventRecord (add the attempt count and given-up mark there); MessageSweepEngine.AdvanceCatchUpAsync (about line 420) is the mint point for the held-tail ask; TaskDecider.Assign about line 1186 and TaskDependencyGraph.Missing for the dependency check; EventStreamCatchUp for the shared wording. Open question the challenge session could not settle from this node: why the Mac's --since all answer carried the tails of 14 run streams (PullRequestMerged, RunHandoffRecorded, RunCompleted at Mac origin sequences 7009 to 21085) but not their RunDispatched. The responder resolves ownership per stream, so a split within a stream cannot come from scope or project resolution; the likely cause is that those old runs' genesis events carry a retired event type name the current build's EventScopeRegistry does not know, which EventCatchUpResponder.AnswerAsync skips silently (the InvalidOperationException catch at about line 122). Check on the Mac: the event types at version 1 of streams 01a04805-1444-709c-a6ff-ef82a80cd7a3 and 01a07d6b-d481-7304-97ea-bdb5229f6a91. If that is the cause, the held-tail ask's stop-after-three-attempts rule is what keeps those 14 streams from being asked for forever, and "whole" in 252bc5cf and 74a7cd0b cannot include events of a type the answering build no longer knows. Split recommendation for the walk: this draft carries two shapes of work, pull completeness (criteria 2 to 5) and automatic completion (criteria 1 and 6); if split, the held-tail ask goes right after 805f6986 because together they finish 13d6b371 without a human. Siblings drafted the same morning: 805f6986 (repair frees partial streams that still carry a document; build first), 74a7cd0b (bootstrap serves from genesis), 252bc5cf (fleet reconcile). Writing conventions: no em dashes, full sentences. Testing rule (Brian, 2026-09-13): no test touches a repository or remote. Split 2026-09-21 09:2x EDT on Brian ruling after the challenge session: this task keeps pull completeness (dependencies, run streams, re-ask, short id); the decline bookkeeping and the automatic held-tail ask moved to the sibling task named automatic completion of held tails, drafted the same minute.
