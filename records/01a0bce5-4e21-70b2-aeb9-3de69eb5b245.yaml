objective: |-
  A pull brings a task whole story with it: its run streams and its missing dependencies come along on their own, a closed request is re-askable and --again clears a stale one, and the short id and project resolve, so a task pulled from a peer reads its true state and is never refused for a dependency the platform could have fetched
criteria:
  - h9k task pull <id> (and the --from-issue path that queues the same request) queues a fresh request whenever the most recent request for that stream is closed, answered or declined, and reports that it re-asked; when one is genuinely still outstanding it says so, and --again closes that outstanding request as superseded and queues a fresh one, which is the only way to clear a request minted before v0.10.5 (request 01a0bac1 of 2026-09-19 is that shape); TaskPullCommand's closing line no longer says a broadcast stays outstanding until an answer applies, since a decline closes it
  - h9k task pull accepts the task's short id when the ledger's task record resolves it, and defaults --project when the node has exactly one project whose ledger names the task; the refusal texts for both stay when neither holds
  - |-
    Dependencies: TaskDecider.Assign refuses an assignment whose BlockedBy names a task this node holds no document for (TaskDecider.cs about line 1186, "depends on N task(s) the platform does not know"); when a pulled or adopted task lands with blocked-by or stacked-on ids whose streams this node does not hold, the platform queues one stream request per missing dependency on its own (recursively, bounded to the same project, deduplicated as in the second criterion) and says so in the pull's own output and on h9k status, so h9k task assign is never refused for a dependency the platform could have fetched
  - |-
    Run streams: EventCatchUpResponder answers a ForStreamId request for a task with that task's run streams as well (every RunListItem whose TaskId matches, each whole and genesis first, in the answering node's own sequence order), so a pulled task whose runs finished reads Done rather than Delivered forever; h9k task pull also accepts a run stream id explicitly. Observed 2026-09-21: the Mac pulled 3727884f and it landed Delivered with laps 0 and sessions 0 because the answer carried the task stream alone
  - |-
    Unit tests cover: re-ask after a closed request and --again over an outstanding one; short id and project resolution; the dependency auto-pull refusing nothing the platform can fetch; the responder serving a task runs with the task. No test creates branches or touches GitHub or a repository
  - dotnet build and dotnet test pass; the decision log carries one entry under this task placeholder
