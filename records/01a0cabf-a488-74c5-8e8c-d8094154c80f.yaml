objective: |-
  The install and build no longer warn about GHSA-vmw2-qwm8-x84c, GHSA-q939-rpr3-3284, or GHSA-mggc-4xg6-vcxf: Marten moves to 8.38.1 with WolverineFx and WolverineFx.Marten to 5.41.0, and Testcontainers.PostgreSql to 4.15.0, all within their current major versions
criteria:
  - The four PackageVersion lines in Directory.Packages.props read Marten 8.38.1, WolverineFx 5.41.0, WolverineFx.Marten 5.41.0 and Testcontainers.PostgreSql 4.15.0, and no other PackageVersion line changes (transitive versions move with them under CentralPackageTransitivePinningEnabled and are not constrained). A forced restore prints no NU1903 or NU1904 for GHSA-vmw2-qwm8-x84c, GHSA-q939-rpr3-3284 or GHSA-mggc-4xg6-vcxf, and dotnet list Hall9k.slnx package --vulnerable --include-transitive names only Marten for GHSA-rfx3-98h7-v3xp.
  - |-
    dotnet build and the full dotnet test pass. Source changes are limited to what the new packages force: the StreamState ambiguity introduced by JasperFx.Events 1.36 is resolved by one global using alias (a Using item with Alias in the csproj) in each affected project (Cli, Connectors, Daemon, Tests) rather than per-file edits, and FakeEvent<T> implements the Tags and AddTag members IEvent gained. Anything further the session finds necessary is named in the PR description with the upstream change that forced it.
  - |-
    The PR description names the schema delta Marten 8.38.1 applies to a database created by 8.17.0 (the mt_upsert_* function bodies, mt_jsonb_patch, the two new mt_jsonb_* functions) and states the verified upgrade path: h9k doctor --yes and the daemon's EventStoreSchemaGuard bring it current, and until one of them runs the CLI refuses with the stale-schema doctor message. EventStoreSchemaGuardTests and DatabaseDoctorTests pass unchanged. No operator step is added beyond the daemon restart install already performs; docs/operations.md gains one sentence saying a CLI call between the binary swap and the daemon restart fails once with the doctor's message.
  - Directory.Build.props carries a NuGetAuditSuppress item for https://github.com/advisories/GHSA-rfx3-98h7-v3xp with a comment stating the reason (the three LINQ sinks were fixed in Marten 8.37.4, the two tenant DDL sinks do not exist on the 8.0 branch, hall9k has no tenancy and serializes with System.Text.Json) and naming task 29b0ca1a as the one that removes it. A forced restore then prints no NU19xx warning at all, while dotnet list package --vulnerable still lists the advisory.
