context: |-
  Origin: a colleague installing h9k with h9k install --repo saw four NuGet audit warnings during dotnet publish (2026-09-22). This task is the in-major cut; the Marten 9 upgrade (29b0ca1a, stacked on this task) clears the last advisory and removes the suppression this task adds.

  Verified by a challenge session on 2026-09-22 against origin/main 7acdadfc5 (full verdict in the task's journal.md in the project home): the bump does not compile as pinned because JasperFx.Events 1.36.2 adds its own StreamState, ambiguous with Marten.Events.StreamState in 42 src files and 7 test files (every FetchStreamStateAsync fence); one global using alias per csproj is the verified five-file fix. IEvent gained Tags, AddTag<TTag>() and AddTag(EventTag), so tests/Hall9k.Tests/Fakes/FakeEvent.cs needs those members. Weasel moves 8.4.2 to 8.15.1 and rewrites every mt_upsert_<doc> function body, drops and recreates mt_jsonb_patch, and adds mt_jsonb_append_key_value and mt_jsonb_remove_key; a database created by 8.17.0 opened by the bumped CLI under CreateOnly refuses reads until h9k doctor --yes or a daemon start runs EventStoreSchemaGuard, after which reads and writes work. Wolverine 5.9.2 to 5.41.0 left the eight wolverine_* tables byte-identical under a daemon-shaped host. Testcontainers 4.15.0 resolves SSH.NET 2026.0.0 with nothing pinning lower; hall9k uses only PostgreSqlBuilder with a random host port. No Marten advisory sink is reachable in src (no full-text search calls, no dictionary indexer or ContainsKey inside a Where, no tenancy, System.Text.Json).

  Brian's rulings (2026-09-22): suppress the residual GHSA-rfx3 warning as criterion 4 states; use the four project-level aliases; leave the four generated providers already missing on main alone (Marten 9 deletes the whole folder); leave TASK-MODEL.md and SLICE-1.md as historical slice records; rollout is the next patch tag, with the seconds-long refusal window covered by the operations sentence in criterion 3, not a new mechanism.

  Verification note: the audit report needs nuget.org, which the build worktree and both CI legs reach inside dotnet build. Commit shape: pins plus the forced compile fixes in one commit, or chore pins then fix compile; either is fine. The PR description carries a short security section: the three advisories cleared, the residual one and why it is suppressed. Memory for the tests: one more Testcontainers database is fine, one more container is not (the cap is an OOM guard). No git or daemon integration tests.
