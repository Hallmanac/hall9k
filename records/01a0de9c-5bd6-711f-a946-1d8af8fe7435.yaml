objective: |-
  A session's model resolves in the same order as its effort: the task's value, then the project's value, then the node's value for the session's role, then the platform default; the project's single model now overrides the node's per-role table instead of sitting beneath it
criteria:
  - AgentModel.Resolve, the one seat of the order, resolves the task's value, then the project's value, then the node's role value, then the platform default, with its parameters reordered to read that way and every caller (DaemonOptions.ResolveModel, ResolveCourierModel, and the CLI's TaskStartCommand.ResolveBuildModelAsync shared by task delegate) passing named arguments so the daemon and a CLI-launched session agree; the verify and final-pass resolvers check the task, then the project, then their own pass knob, then review's chain, so a project's model beats the pass knobs too; the existing chain tests (ValueObjectTests, ModelPolicyTests including the courier assertions) flip to the new order and a test proves a project value now beats a node role value and a pass knob
  - |-
    Everything that states the order to an operator says the new one: the resolvers' doc comments, the config show and daemon status fall-through text in OperatingSettingsRendering (an unset role now falls to the platform default alone, the courier to its Sonnet floor) and its rendering tests, the help strings on task add and project set that describe the chain, and docs/getting-started.md, docs/operations.md, and docs/cli.md where they describe it; the pull request description names the flip and its reason, which is to match the effort chain of task 6fe2f5a2
