context: |-
  Brian, 2026-09-26, in the hall9k project window, ruled at the walk of 6fe2f5a2 (per-role effort) that the override order is task over project over node, the further down the higher the priority, and that the model chain should read the same. Walked and challenged 2026-09-26; verdict in this task's journal.md. Brian's ruling on the pass knobs, 13:0x EDT: option (a), the project's model beats the review-verify and final-pass knobs too, so a project model is a blanket statement with no hidden holes. Verified against main at a1237be0e (unchanged by v0.10.51 in these files). The order is coded once: AgentModel.Resolve (src/Hall9k.Domain/Shared/ValueObjects/AgentModel.cs near line 108), positional (task, role, project, platform) with role and project both AgentModel?, so a swap compiles silently; callers are DaemonOptions.ResolveModel near line 799 and ResolveCourierModel near line 877 (positional) and TaskStartCommand.ResolveBuildModelAsync near line 636 (named arguments, shared by TaskDelegateCommand near line 448). ResolveVerifyReviewModel near line 813 and ResolveFinalFullPassReviewModel near line 840 check the task, then their own node knob, then delegate to ResolveModel(Review); under (a) they check task, project, knob, then review's chain. After the flip a project's --model also beats --model-courier above the Sonnet floor; consequence for the context: a project model chosen for builds drags the deliberately cheap courier up over a node's cheaper courier choice; no fleet project sets one today. Text pinned by tests: OperatingSettingsRendering.FallthroughDescription near lines 206 to 217 and OperatingSettingsRenderingTests near line 127. Docs stating the order: docs/getting-started.md near line 243, docs/operations.md near lines 1046 and 1084, docs/cli.md near lines 1059 and 1507; docs/concepts.md states no order. Help strings: TaskAddCommand.cs near line 249, ProjectSetCommand.cs near line 161. ProjectSettingsChanged (the only carrier of a project's model) is node-scoped, so a project model never travels; only the node's own operator sets it. Decisions Log #33 lives in the decision store as 9afdb968; it is NOT the build session's to amend (decision 13f11af2): note to the orchestrator, record the amendment at closeout (h9k decide, superseding or citing 9afdb968). Not stacked on 6fe2f5a2: different functions, no shared hunk. Dispatched sessions must not run install, update, join, or reconcile against the live install. No em dashes in anything authored.
