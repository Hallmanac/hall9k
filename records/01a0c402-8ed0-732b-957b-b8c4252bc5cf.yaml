objective: The nodes of one owner fleet reconcile a project's whole history with each other on their own, in both directions and from genesis, so any fleet node holds everything the others hold and can answer a new member's bootstrap in full
criteria:
  - |-
    One trigger, not three: on every sweep of an eligible project, for each fleet peer the ledger's nodes ref names for this owner (TrustedOwner.FleetNodeIds through GitLedgerChainReader) that has no reconcile record for (peer, project) on this node, the coordinator queues one project-history request for everything, using the existing explicit shape (SinceGlobalSequence 0, so EventCatchUpResponder lifts the switch-on bound with no responder change) but addressed to that peer alone (MessageAudience.Node) and never broadcast to the project; this one rule covers a node newly vouched into the fleet, a project registered on a fleet node later, and a project's first switch-on
  - The answering peer, on reading a project-history request from a fleet sibling, queues the reverse ask back if it has no reconcile record for (requester, project), writing its own record before queuing, so both directions complete without a human typing --since all and two nodes never loop
  - |-
    The reconcile is recorded per (peer node, project): asked at, first answer at, envelopes and records applied, complete at. Complete is a fact, not a guess: the responder queues one terminal envelope after the last batch of an answer (a new MessageKind such as EventsAnswerComplete carrying the request id and the envelope count, which an older build skips as an unknown kind), and the requester marks the record complete only on reading it; a reconcile with no completion after MessageRetention (48 hours, the outbox squash window that can prune an unread answer) is re-asked once and then reported; h9k project reconcile <project> queues it again by hand for every fleet peer; h9k status shows each reconcile in progress or complete with its counts
  - The answer serves from the start of the answering node's log, own-origin and already-replicated alike with true origin preserved, and includes fleet-scoped drafts and ideas as well as team-scoped items, which EventCatchUpResponder already does for a requester whose owner root matches (lines 144 to 180 on origin/main), while a private item is never served; a peer holding nothing for the project answers events-unavailable and the record says so. This criterion is proven by tests against the existing responder, not by new responder code
  - The answer applies idempotently over streams already held; after it lands, streams this node holds only as HeldReplicatedEventRecords (a tail whose genesis the answer did not carry) are counted on the reconcile record and shown on the status line as held tail-only, pointing at the held-tail ask of 9eb5b245, never silently skipped
  - |-
    A brand-new fleet node's automatic bootstrap and its reconcile with the same peer do not both fetch the whole project: while a bootstrap addressed to that peer is outstanding the reconcile for that peer waits, and a bootstrap completed from a fleet peer writes that peer's reconcile record
  - |-
    The Decisions Log entry under this task's placeholder states that a fleet sibling's reconcile is the second automatic shape served from below the switch-on point, superseding entry #236's "history is inert until somebody asks" for it, and names what still keeps the bound (a gap-fill)
  - |-
    Unit tests through the seams: a fleet peer with no record gets one reconcile per project and a second sweep queues none; the answering peer queues the reverse ask once and never a third; the terminal envelope marks the record complete and its counts; a request from a node outside the fleet queues no reverse ask; a private idea is not served; held tail-only streams are counted; the bootstrap and the reconcile do not both run. No test touches a repository or remote. dotnet build and dotnet test pass
