context: |-
  Origin: Brian, 2026-09-21 morning, Windows project window; challenged and re-evidenced by the challenge session the same morning against origin/main at v0.10.24 (b4002efe). His statement: the Mac holds almost none of arx-platform history while the Windows node holds all of it; a team member invited from either node must receive the whole project, so the nodes of a fleet must be fully synchronized with each other, including history from before any replication switch-on point. Why the bootstrap alone is not enough: EventCatchUpCoordinator ranks one answerer (voucher, then owner-role members, then any member, RankCandidates lines 29 to 68), sends the bootstrap to that one node (SendCurrentCandidateAsync, MessageAudience.Node), and EventReplicationInbox closes the request on the first envelope from that candidate that applies anything (about lines 361 to 365), so a voucher with thin history satisfies the new node with thin history. The invariant this task creates: every node in an owner fleet holds every fleet- and team-scoped event of each project it registers, so any one of them is a sufficient answerer.

  Measured on the Windows node's store (2026-09-21 morning, task, run, and idea streams by project): hall9k 32,923 events, about 35 MB on the wire, about 165 envelopes at the 200-event or 250 KB caps; arx-platform 2,612 events, about 2.7 MB, about 14 envelopes; bioage-calc 48 events, one envelope. The Mac holds three arx-platform replicated records here, so the direction that matters this week (Windows answering the Mac for arx-platform) is small. The hall9k direction toward Windows was already done by hand this morning (h9k project pull hall9k --since all, 27,666 records applied in the 12:00 UTC hour, idempotently), so an automatic reconcile would repeat those 165 envelopes once unless the walk decides that a completed hand pull also writes the record.

  Transport facts that shape the criteria: MessageOutbox.FlushAsync lands every pending envelope in one commit (GitLedgerMessageTransport about line 89), so a whole-project answer is one push of the whole size; every project member's sweep reads every seq above its cursor on that ref and checks the audience only after decoding (EventReplicationInbox line 250), so every member downloads a node-addressed answer even though only the requester applies it; the outbox squash keeps 48 hours (DaemonOptions.MessageRetention), so an answer a requester's daemon does not read within that window is gone and the request, already closed on its first envelope, is never re-asked today. Answers are ordered by the answering node's own global sequence (EventCatchUpResponder line 88), which puts each genesis before its tail for native streams and preserves arrival order for replicated ones; anything still tail-first is held and replayed by the v0.10.20 path. Nothing side-effecting fires when replicated events apply: the inbox appends facts through inline projections only, DispatchEngine.ReadQueueAsync claims a Queued task only when its assignment fingerprint matches this owner and its placement names this node or none (about lines 992 to 1000), and there are no async projections or subscriptions reacting to events.

  Two limits the walk should hear: a switch-on record is per node (NodeAggregate.ReplicationSwitchOnSequence), not per project, so "when replication first switches on for a project" has no event of its own, which is why the single sweep-time trigger replaces the three; and "whole" cannot include an event whose type the answering build no longer knows, since EventCatchUpResponder skips it silently (the InvalidOperationException catch at about line 122), which is the likely reason the Mac served 14 run tails without their RunDispatched this morning (see 9eb5b245's context).

  Reuse: RequestProjectHistoryBroadcastAsync (about line 227; its outstanding guard is per project and must become per peer for this shape) and BroadcastAsync (about line 259; a Node-addressed variant is needed), ProjectPullCommand, EventCatchUpInbox.ReadFromAsync (about line 110, where the reverse ask is queued), MessageSweepEngine.AdvanceCatchUpAsync (about line 420, the mint point), EventCatchUpRequest (a new reconcile record document beside it), StatusCommand.WriteEventCatchUpRequestsAsync (about line 488). Siblings: 805f6986 (build first: a reconcile cannot complete a stream still applied partially), 74a7cd0b (bootstrap from genesis; small, independent, no shared file but the Decisions Log), 9eb5b245 (the held-tail ask this task's counts point at). Writing conventions: no em dashes, full sentences. Testing rule (Brian, 2026-09-13): no test touches a repository or remote.
