objective: An adopted issue's title reaches the agent inside the outside-text fence, never above it as if it were an instruction
criteria:
  - WorkItemContext renders an adopted GitHub or Jira item's title inside the same non-instruction fence as its body, and nothing the item's author wrote appears outside that fence
  - WorkItemContext.CarriesQuotedDescription still answers true for an agent context composed before this change (the old title line above the old framing sentence), so a task adopted earlier keeps the data-only rule in its work, QA, and design review prompts
  - A unit test with an issue title that reads as an instruction shows it rendered inside the fence and absent from everything before the fence; the hand-written old-format contexts in the design and QA review tests stay as they are
