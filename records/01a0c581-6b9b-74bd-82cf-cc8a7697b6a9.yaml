context: |-
  Origin: Mac project window fact note 716 (2026-09-21 13:18 UTC) for the Windows challenge session, plus Windows evidence: after h9k project pull hall9k --since all the Windows node held 42 HeldReplicatedEventRecords over 14 Mac-origin run streams whose first event never arrived; the v0.10.27 held-tail ask (c3bdb62e, #547, Decisions Log #259) asked three times per stream, every ask was answered tail-only (42 requests, 42 answered, 0 declined), and every record is now marked given up. The challenge session of 2026-09-21 evening confirmed the cause and corrected the draft; what follows is what the builder needs.

  Build from origin/main at v0.10.31 or later. The project's repo/dev checkout was at v0.10.19 on 2026-09-21 and does not contain c3bdb62e (#547) or 805f6986 (#535). Refer to code by name, not line number.

  Cause, confirmed in code: EventScopeRegistry classifies RunRecordReconstructed NodeScoped. Both EventReplicationOutbox.QueuePendingAsync (the ordinary flush) and EventCatchUpResponder.AnswerAsync skip any candidate whose scope is not ProjectScoped, so a run stream that began with a reconstruction ships as a tail on the live path and on every catch-up answer alike; the fix cannot live in the responder alone. AggregateGenesisEventTypes.IsGenesis names RunDispatched only, so EventReplicationInbox.ApplyAsync holds the tail (HeldReplicatedEventRecord) and nothing ever carries the genesis. Two places already treat the reconstruction as a genesis ahead of the code: the responder's own doc on ResolveRequestedStreamIdsAsync (RunDispatched, or RunRecordReconstructed) and EventStreamCatchUp.ClassifyLocalHoldAsync in the CLI (RunWhole). PartialReplicatedStreamRules.IsPartialStreamHead reads IsGenesis, so it gains the new genesis with no change. ReplicationEventTypeCatalog resolves wire type names from EventScopeRegistry.KnownEventTypes across all scopes, so a receiver already decodes RunRecordReconstructed; nothing to add there.

  The event (Hall9k.Domain.Features.Run.Events.RunRecordReconstructed) carries Id, TaskId, NodeId, OwnerId, PullRequestUrl, PullRequestNumber and ReconstructedAt, minted by CloseoutEngine.ReconstructAndCompleteAsync and by RunLauncher's declined-dispatch path. It has no worktree, run directory, session or process id, so the earlier redaction option was moot; RunDispatched, which already travels, carries WorktreePath and RunDirectory today. RunAggregate.Apply, RunDetailsProjection.Create and RunListItemProjection.Create already handle it as a stream start (RunListItem.IsReconstructed true).

  Why reclassify rather than a surrogate: the inbox dedupes by origin event id (ReplicatedEventRecord) and orders per origin node by origin sequence (EventReplicationInbox.OriginHighWaterAsync); the real event under its real id and sequence satisfies both, a surrogate would have to borrow them to be safe, and a surrogate emitted only by the responder leaves the live flush shipping tail-first anyway.

  Give-up mechanics: EventCatchUpCoordinator.RequestHeldTailStreamsAsync queries only records with CatchUpGivenUp false, and HeldTailStreams.GivenUpStreamIdsAsync excludes a stream with any given-up record even when a fresh record arrives. Nothing today clears CatchUpGivenUp; h9k task pull does not touch it. The fleet reconcile (252bc5cf, #542, Decisions Log #262) asks each pair once and applied nothing from 203 envelopes on 2026-09-21, and the outbox flush never re-ships events below its position, so after the fix the held-tail ask is the only automatic lever, and only if the give-up is lifted. The receiver cannot know the peer's build; recording the build version at give-up (the same read CliVersion.Current makes through AssemblyInformationalVersion) and treating an older-build give-up as askable gives "asked again on a newer build" without that knowledge. Sweep timing: the settle window is MessageIdlePollMaxSeconds (45 s), the re-mint cooldown is EventCatchUpRequestTimeout (5 min), and MaxHeldTailAsksPerSweep is 10, so 14 streams take two sweeps to ask and the ledger round trip decides the rest.

  Live facts on Windows (Postgres: docker exec hall9k-postgres psql -U postgres -d hall9k): 42 held rows, 14 streams, types PullRequestMerged, RunHandoffRecorded, RunCompleted, all originNodeId the Mac (01a00d41-5b80-753d-a3f1-070b25e490e4), catchUpAttempts 3, catchUpGivenUp true, last ask 2026-09-21 19:54Z. No RunListItem exists for any of the 14 stream ids; each is the currentRunId of a Done task: 01a02f9b-bfd3, 01a01181-cce1, 01a01181-d2ff, 01a0126d-552e, 01a01543-3d94, 01a01543-3f9c, 01a047fb-00b1, 01a03fc6-d0e6, 01a0713e-1971, 01a07201-d4c4, 01a074e8-0219, 01a07347-1efe, 01a07325-05d0, 01a078e9-853c (d9b2ddc2, PR #285, run 01a08288-d941-7109-8686-484c877731eb). Windows run streams by first event: 201 run_dispatched, 1 run_record_reconstructed (01a0c0c8, task 0569c229, PR #520, minted 2026-09-20 21:46Z). The Mac has 15 reconstructed-first against 933 dispatched-first. Windows answered the Mac's pulls for 01a0c0c8 five times on 2026-09-21 (22:20Z to 23:23Z), each tail-only, so the Mac holds that tail and will give up the same way; criterion 3 covers the mirror.

  Presentation note, not this task's: TaskStatusComposer.State maps a Done task with a pull request and no run document to Delivered (Closed() reads the run), and TaskPhaseComposer prints "PR #N open, no run record is watching it". That is the Decisions Log #34 honesty rule reading an absent run as a merge not observed. The 14 read Done once their runs reach Completed with PullRequestMergedAt, so this task needs no composer change; the general shape (a Done task whose run never arrived reads as an open pull request) is a separate card.

  Tests to extend rather than duplicate: EventScopeRegistryTests, EventCatchUpTests (A_held_tail_earns_one_ask_a_sweep_and_stops_after_three_attempts, An_answer_that_carries_a_tail_before_its_genesis_is_held_and_replayed_in_the_same_read), EventCatchUpHeldTailPlanTests, HeadlessReplicatedStreamRepairTests. Writing conventions: no em dashes, full sentences. Testing rule (Brian, 2026-09-13): no test touches a repository or remote.
