objective: |-
  A run stream whose first event is a reconstruction rather than a dispatch completes on a peer: RunRecordReconstructed travels project-scoped as the run's own genesis, and a held tail this node gave up on under an older build is asked for again once the build changes, so the 14 Mac-origin runs held on Windows and the Windows-origin run held on the Mac complete with no human running a pull
criteria:
  - RunRecordReconstructed is classified ProjectScoped in EventScopeRegistry, with the registry's own run-events paragraph extended to say why (a reconstruction is a fact about the work, which run exists for which task and pull request; the event carries no worktree, run directory, session or process id, so nothing is redacted), and AggregateGenesisEventTypes.IsGenesis accepts it as the Run aggregate's second genesis. Both the ordinary outbox flush (EventReplicationOutbox.QueuePendingAsync) and the catch-up responder (EventCatchUpResponder.AnswerAsync) then serve a reconstructed-first run stream genesis first, under the event's own origin event id and origin sequence, and the receiving inbox starts the stream from it and replays the held tail in origin order. No surrogate genesis is emitted; a surrogate under a fresh id would apply twice on a second answer, and one under a fabricated sequence would be refused by, or would itself refuse, the tail at the inbox's origin high-water guard
  - A held tail that reached the three-ask stop becomes askable again, automatically and bounded, once this node runs a build newer than the one it gave up on. HeldReplicatedEventRecord records the build version the give-up was marked on (existing given-up rows carry none and count as older); the held-tail sweep's given-up query and HeldTailStreams.GivenUpStreamIdsAsync treat a record given up on an older build as not given up and reset its attempts, so the stream earns three fresh asks on the new build and gives up again if the fleet still cannot serve it. A recorded one-time reset at daemon start is an acceptable alternative. The fix must not rely on the fleet reconcile or the ordinary flush, since neither re-ships history below the outbox position, and must not require h9k task pull or h9k project pull
  - |-
    Observed on the live pair after both nodes run the fix, with no human-run pull. On Windows, all 14 held Mac-origin run streams (origin sequences 7009 to 21085, first held 2026-09-21 12:42Z, every record at three attempts and given up) complete within one hour of the second node's restart; their 14 tasks (d9b2ddc2 and siblings, listed in the context) read Done in h9k task show; mt_doc_heldreplicatedeventrecord holds no row for them; and h9k status no longer prints the catch-up holds line for them. On the Mac, run 01a0c0c8-fdc7-730e-9504-aede6b2194db completes and task 0569c229 reads Done. A stream a node had already applied headless is a partial stream and is the startup repair's job (805f6986, Decisions Log #263), after which this task's ask completes it
  - A run stream beginning with RunDispatched is served and applied exactly as today. A replicated copy of a reconstruction raises no actionable orchestrator feed item on the receiving node (OrchestratorFeedInterest lists RunRecordReconstructed as Actionable and OrchestratorFeedReader applies no origin filter; a peer's own daemon rebuilt nothing, and 14 replays landing at once must not page the Windows window)
  - Unit tests through the seams, none touching a repository or remote. EventScopeRegistry classifies RunRecordReconstructed ProjectScoped and IsGenesis accepts it; the responder serves a reconstructed-first run stream genesis first and the outbox flush queues it genesis first; a two-store test in the EventCatchUpTests shape lands a reconstructed-first stream whole on a store with no prior history, tail after genesis, and RunListItem for it reads Completed; PlanHeldTailAsks or its callers treat a record given up on an older build as askable and one given up on the current build as stopped (EventCatchUpHeldTailPlanTests); a dispatched-first stream is unchanged; the feed does not admit a replicated reconstruction as actionable. dotnet build and dotnet test pass
