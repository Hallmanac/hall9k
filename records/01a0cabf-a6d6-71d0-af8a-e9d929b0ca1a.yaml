objective: |-
  No vulnerable package remains in the solution's audit: the event store moves to Marten 9.39.0 (the security release of 2026-09-22) with WolverineFx and WolverineFx.Marten 6.39.1, runtime code generation and the committed generated providers are gone, and an existing install's Marten and Wolverine schema is brought current by its own daemon restart with no operator step
criteria:
  - Directory.Packages.props pins Marten 9.39.0, WolverineFx 6.39.1 and WolverineFx.Marten 6.39.1; the NuGetAuditSuppress item 4154c80f added to Directory.Build.props is removed; with the Testcontainers pin from 4154c80f present, dotnet list Hall9k.slnx package --vulnerable --include-transitive names no package and a forced restore prints no NU19xx warning.
  - dotnet build and dotnet test pass with no source under src/Hall9k.Cli/Internal/Generated in the tree (the directory is deleted and ignored), no GeneratedCodeMode, SourceCodeWritingEnabled or GeneratedCodeOutputPath anywhere in src, and no h9k command printing a 'Generated code to' line; CliEventStorageGeneratedCodeTests is gone with the file it read; the NJsonSchema pin is removed if the build no longer needs it, otherwise its comment says why it stays.
  - Every SingleStreamProjection subclass in Hall9k.Domain is partial, and a store built through ConfigureHall9k opens and writes every registered projection inline in one test (no InvalidProjectionException from a missing source-generated dispatcher).
  - ConfigureHall9k calls RestoreV8Defaults() with a comment naming the five defaults it holds (append mode Rich, bigint events, identity map for aggregates, advanced async tracking, Npgsql logging) and saying that opting into Quick append is a separate later task; EventOriginStampingTests and the twenty expected-version fence sites pass unchanged.
  - |-
    The daemon host starts on Wolverine 6: opts.CodeGeneration.TypeLoadMode = TypeLoadMode.Static (no WolverineFx.RuntimeCompilation reference, since the daemon has no handlers), and IntegrateWithWolverine sets AutoCreate.CreateOrUpdate for the message tables; one test boots the daemon's exact Marten and Wolverine wiring against a database that started as the committed 8.17 dump and writes an event through the DI session.
  - A schema-only pg_dump of a Marten 8.17 hall9k store (the one supplied with this task, no credentials, public schema only) is committed under tests/Hall9k.Tests/Fixtures/; a test loads it into a fresh database on the suite's shared container (one more database, never one more container), runs EventStoreSchemaGuard.EnsureCurrentAsync, asserts a second CreateMigrationAsync reports None, then opens a CreateOnly store and performs a read and a fenced append.
  - docs/operations.md states what the upgrade changes (twenty mt_doc_* mt_version columns to bigint, the rewritten mt_quick_append_events, mt_jsonb_patch and mt_safe_unaccent functions, mt_streams gaining compacted_version and losing snapshot columns, mt_events gaining bdata, mt_event_progression's new columns, the Wolverine envelope tables), that a daemon restart is the whole upgrade, that a CLI call between the binary swap and the restart fails once with the doctor's message, and that rolling back to a pre-upgrade tag requires restoring a pre-upgrade pg_dump; the PR description lists every source change with the Marten 9 migration-guide section that forced it.
