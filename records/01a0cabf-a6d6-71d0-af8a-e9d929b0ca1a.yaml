context: |-
  Origin: the last of four NuGet audit warnings a colleague saw at install (2026-09-22): GHSA-rfx3-98h7-v3xp on Marten 8.x, which only Marten 9 clears. Marten 9.39.0 (released 2026-09-22) also fixes GHSA-q4xm-rhx9-xjm4 and GHSA-frqq-p5g3-8jq5, both critical, affecting 9.13.0 to 9.38.0. Stacked on 4154c80f (the in-major bump), whose Testcontainers pin criterion 1 relies on and whose StreamState aliases and FakeEvent members this branch inherits.

  Verified by a challenge session on 2026-09-22 against origin/main 7acdadfc (full verdict in the task's journal.md in the project home; artifacts in its workspace/: h9k-marten9-source-changes.patch, the complete 36-file mechanical patch at the new pins; h9k-marten9-probe-tests.cs; h9k-817-schema.sql, the schema-only dump to commit as the fixture; h9k-marten9-migration.sql and h9k-marten9-migration-v8defaults.sql, the SQL the guard applies). Findings a build session must not rediscover the hard way: (1) Wolverine 6 moved runtime codegen to the opt-in WolverineFx.RuntimeCompilation package and refuses to start in TypeLoadMode.Dynamic without it; Static mode boots cleanly because the daemon has no handlers, and drops the Microsoft.CodeAnalysis DLLs from the install. (2) EventStoreSchemaGuard builds a plain DocumentStore and migrates Marten's objects only; Wolverine's envelope tables inherit CreateOnly and throw SchemaMigrationException at daemon start unless IntegrateWithWolverine(x => x.AutoCreate = AutoCreate.CreateOrUpdate) is set (AutoBuildMessageStorageOnStartup does not help; the Marten integration overrides it). (3) After the migration the previous tag's binary cannot open the store and its doctor cannot repair it; rollback is a pre-upgrade pg_dump restore, which the fleet takes before this tag lands. (4) Compile surface beyond the pins: StreamState moved to JasperFx.Events; ExistingStreamIdCollisionException is ambiguous between JasperFx.Events and Marten.Exceptions (alias to Marten's); FakeEvent<T> implements Tags and AddTag; the 24 committed generated providers fail to compile; CliStore loses using JasperFx.CodeGeneration, the three knobs and GeneratedCodePath. Nothing else broke (no custom IStorageOperation, IAggregateGrouper, IInlineProjection, compiled queries). (5) Under Quick append, headers from EventOriginStampingListener still land and fenced appends after FetchStreamStateAsync work, but Brian ruled Rich via RestoreV8Defaults() for this security upgrade; Quick is a later task. (6) The bigint migration is emitted by the guard: verified against the live 8.17 dump, second diff None. Aggregates are not partial (self-aggregating types via AggregateStreamAsync need no partial). References to the generated folder outside it: the NJsonSchema comment in Directory.Packages.props, CliEventStorageGeneratedCodeTests, doc comments in PostgresFixture.cs, ToolDoctor.cs line 31 and CliStore.cs, docs/operations.md line 235, a comment in .github/workflows/release.yml line 51.

  Suggested commit sequence: delete Internal/Generated and the codegen knobs; pins plus every compile fix; projections partial; daemon Wolverine changes; fixture and tests; docs. The task's decision entry records: append mode kept Rich and why; Wolverine Static with no handlers; Wolverine tables migrate at daemon start; rollback is by restore.

  Note to the orchestrator (not an instruction to this session; decision 13f11af2): draft 07ff4c03 (commit generated providers mechanically) is superseded by this task and is retired at closeout by the orchestrator. Two follow-ons are parked as ideas 6d158542 (remove Wolverine from the daemon) and dc1622cb (doctor diffs the Wolverine tables), not this task. No git or daemon integration tests; the container cap is an OOM guard.
