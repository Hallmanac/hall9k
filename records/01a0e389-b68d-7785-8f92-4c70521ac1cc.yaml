objective: The orchestrator-recipe-generator skill writes the model-and-effort operating rule and the resume-based spawn mechanics into every project's orchestrator recipe
criteria:
  - |-
    Project-mode recipes carry a canonical model-and-effort block, copied verbatim into every generated orchestrator recipe the way *Talking to the operator* is. The block states the window's routine-only scope: reading the board, relaying, merges and calls under standing grants, cutting a task from a clear gap report, and rulings that need a line or two. Work that needs cross-file reading, a test run, a design weighing, or a walk is offered once as a spawned headless session, and the operator's answer stands, including keeping it inline. The operator can override any model or effort choice. The node-mode recipe is unchanged.
  - |-
    The block states the per-spawn rule by tier: a mechanical tier (probes, scripted checks, sweep grooming, lookups), a deep-reading tier (idea discovery, refinement, design walks, challenges, and deep-reading dispute preparation), and a hardest-reasoning tier (cross-product architecture, or a second opinion on a doubted answer). One default table maps each tier to an agent CLI, an exact model id, and an effort: today claude-code with claude-sonnet-5 at high, claude-opus-5-5[1m] at high, and claude-fable-5-1[1m] at high (Fable's own default). Rendered lines use exact ids, never a tier alias. A project's dated Tier override line replaces one tier's triple, or one kind of spawn's, for that project. A tier naming a CLI with no computed launch shape is listed in the generator's summary and not rendered. The recipe never states the window's own model or effort, which belong to --orchestrator-model and draft 6ec90cb1. Daemon-dispatched runs, including the future daemon refinement role, are out of scope.
  - |-
    The hardest-reasoning tier is propose-and-confirm by default: the window proposes it in one line with the reason and launches on the operator's yes. A project whose recipe carries a Standing grant line for it may launch it unasked, and every such launch is reported to the operator at once as a call under a standing grant and recorded in the registry.
  - |-
    Dispute parks are prepared by reading depth by default: a claim checkable in a line or two is checked in the window; one needing cross-file reading, a test run, or a design weighing goes to a deep-reading-tier spawn that writes a recommended ruling. Who applies a ruling follows the delegation the operator granted that project; with none, every ruling goes to the operator with the prepared evidence. A project opts out of the split with a dated Opt-out line.
  - Every scoped line the recipe writes (launch, step-in, and fresh-start fallback) passes --model and --effort explicitly, single-quotes the model id, and uses ; rather than && where the operator's shell is PowerShell, as LaunchTextDefaults does. The launch adds -n (lowercase letters, digits, and hyphens only) and a --session-id the window generates in its own tool shell, and runs as the window's own backgrounded call that notifies it when the session ends (not claude --bg). The window never resumes a spawned session. The scoped recipes' contract (idea discovery and task refinement) states that a headless session needing the operator writes the question into its journal and ends its turn.
  - After a spawn ends, the window gives the operator a step-in line carrying exactly the working directory, --strict-mcp-config, --setting-sources project, --settings, --dangerously-skip-permissions, --model, --effort, --append-system-prompt-file, and --resume <id>, and never -p, -n, --session-id, or an opening message. The registry records model, effort, session id, step-in line, and fresh-start fallback per spawn. Because claude --help does not state how --model, --effort, and --settings behave on --resume, the recipe asks the window to check the first step-in after adoption against its transcript's model and effort fields and to record the result in notes/prototype-feedback.md.
  - |-
    The skill defines three recipe-body line forms: `Standing grant (<who>, <YYYY-MM-DD>):`, `Opt-out (<who>, <YYYY-MM-DD>):`, and `Tier override (<who>, <YYYY-MM-DD>):`. *Never invent a standing rule* and *Standing rules* gain one carve-out: lines of those forms, placed by the operator, are carried forward, and the generator never writes a new one. Regenerating any existing recipe carries every such line into the .new verbatim and lists them in the generator's summary.
  - The build never runs the skill against a registered project home. The pull request description quotes each new or changed SKILL.md passage beside the criterion it satisfies, adds a hand-rendered excerpt of the hall9k result written outside any project home, and gives the generated recipe's before and after word count per the skill's leanness rule. Acceptance proper is the first post-merge regeneration by the hall9k window, walked through the launch anchor's .new step.
