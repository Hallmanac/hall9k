objective: Each task's prompts carry the project lessons most relevant to that task, chosen once by a small session before its first build, instead of only the newest ones
criteria:
  - With the lesson-picker setting at shadow or on, the first time the daemon composes a fresh build prompt for a task with no pick record, one picker session runs before that prompt is written. It is limited to one turn, has no tools available, and its prompt holds the task's objective, criteria, and context plus the offered lessons and both caps, and asks for ids most relevant first.
  - |-
    The lessons offered to the picker are exactly those the composing node's provenance rule lets into a prompt, before either cap applies: a lesson held back from a prompt today appears in no picker prompt, and a lesson the caps alone would hold back is offered.
  - The daemon reads the picker's answer as lesson ids only. An id that resolves to no offered lesson, or repeats one already read, is dropped and counted, and an answer holding anything other than ids is unusable.
  - The picked set keeps the picker's order and never exceeds the existing lesson-count or character cap. A lesson that does not fit whole is left out whole, and the next picked lesson is still tried.
  - The build still dispatches on today's newest-first selection, with the outcome on the record, when the picker session cannot start, ends in error, ends with no result, exceeds its bound, gives an unusable answer, or leaves no id standing. The bound is a daemon option defaulting to 30 seconds, and a session past it is terminated.
  - A task has at most one pick record, whatever its outcome. A retry, follow-up, or review lap of a task that has one spawns no picker session, a follow-up of a task that has none stays on newest-first without one, and spike and pr-review tasks never run the picker. When the caps would hold back no eligible lesson, no picker session runs and nothing is recorded.
  - Each pick is one event on the task's stream recording the mode (shadow or on), the outcome from a closed list, the picked lesson ids, the lesson ids newest-first would have carried at that moment, the eligible count, the dropped-id count, the model, and how long the session took. It holds nothing the session wrote verbatim, it adds no orchestrator feed item, and `h9k task show` prints all of those fields.
  - The picker session's tokens land in the run's recorded token totals under the model it ran on, and the session count in `h9k task show` includes it.
  - With the setting at on and a record made under on with a picked outcome, build, follow-up, fix, rebase, and gate-repair prompts and conformance review passes carry the picked set, while adversarial and Verify review passes carry newest-first.
  - |-
    Every composition checks the recorded set against what the composing node may carry at that moment: a lesson since retired or held back on provenance drops out, and if none remain the prompt carries newest-first.
  - A section carrying a picked set says its lessons were chosen for this task rather than newest first, states how many eligible lessons it does not carry, and names `h9k learn list`, and its counts reconcile with the eligible and active totals the section already reports.
  - In shadow the pick runs and is recorded, and every prompt is byte-identical to the prompt composed with the setting off from the same task and lesson store. At off no picker session runs and no event is written. A set picked under shadow never reaches a prompt after the setting changes to on, and changing the setting away from on stops a recorded set reaching prompts from the next composition.
  - |-
    `h9k config set --lesson-picker` accepts off, shadow, and on, refuses anything else by naming the three, and takes effect at the next prompt composition with no daemon restart. With nothing configured the value is shadow, an unrecognized hand-edited value behaves as shadow, and `h9k config show` prints the value in force and where it came from. The setting and shadow behaviour are documented everywhere `--lesson-prompt-max-lessons` is documented today.
  - The picker resolves its model and effort exactly as the courier does for that project and node, no new concrete model id is compiled in, and a task's own model or effort override does not move it. `--model-courier` and `--effort-courier` say in their help and documentation that they also move the picker.
  - |-
    `h9k task start`, `h9k task delegate`, and `h9k task drive` spawn no picker session, and compose with a recorded pick under the same rules the daemon follows, or newest-first when there is none.
  - The no-tools argument is the last one on the picker's command line, and a test on both CI legs spawns through the real process manager with a stand-in for the claude binary and observes that argument arriving with its empty value.
