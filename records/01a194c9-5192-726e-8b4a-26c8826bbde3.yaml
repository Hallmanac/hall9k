context: |-
  Shape: one task, one pull request, no stacking, no dependencies, no epic. A setting carries the work from shadow to live, so no second task is needed, and no piece of it is useful alone.

  Read the brief first: /Users/brianhallmanac/.hall9k/projects/hall9k/ideas/13403621-named-agent-files-claude-code-s-claude-agents-as-a-bridge-be/workspace/lesson-picker-brief.md. It holds the problem, the measurements, the six behaviours, and the scenario. Its Going live section is not this task's work: this task ships the default at shadow and changes no node's setting. The brief's Out of scope list binds.

  Seams, checked against main at ef0ee52f9. Each choice below was settled at refinement, with its reason.

  Where the pick lands. `RunLauncher.LaunchAsync` is awaited inside the dispatch loop (`DispatchLoop.cs:179`), so the picker's wait holds every other claim on the node; that is why the bound is 30 seconds and not synthesis's five minutes. Lessons load at `RunLauncher.cs:376`, before the run directory and run stream exist. The pick goes after the run stream's first save, in the same position `blockerContext.AssembleAsync` documents, and the lesson load moves below it so every prompt branch still reads once. Shadow takes the same wait, so its record shows the timing live will have.

  The session. `BlockerContextAssembler` is the nearest shape, closer than `FeedbackEvaluators`: a synchronous wait, a re-read of the stream on expiry (`TryReadAlreadyPresentResultAsync`), and `ToTokensRecorded` on the run stream. The picker writes no file; its answer is `AgentResult.Summary`. `AgentSpawnRequest` cannot express "no tools" today, so add that and have `ClaudeExecutor.Arguments` emit `--tools ""`, which `claude --help` documents as disabling all tools. Pass `SkipPermissions: false`; the session has nothing to permit. Emit `--tools ""` last in `ClaudeExecutor.Arguments`, after `--setting-sources user`: `--tools` is variadic, so its position decides what a lost value does. Pass `UntrustedWorkingDirectory: true` and `MaxTurns: 1`, and use the run directory as the working directory. Add a `SessionRoleName` for it. Compose the prompt the way `FeedbackEvaluatorPromptBuilder` does: a template under `.claude/templates/agent-prompt-builder/`, with task text and lesson text going through `RelayedText`.

  The answer. Tokens split on whitespace or commas, each an eight-character short id as `InjectedLesson.ShortId` prints it. Strict on purpose: a chatty answer reads as unusable, and shadow will show whether that is rare. The template states both caps and asks for ids most relevant first.

  One read. `LessonPromptFeed` stays the only entry point. The picked path skips a lesson that does not fit; the existing stop at `InjectedLessons.cs:170` stays for newest-first. Correct the doc comment at `ReviewEngine.cs:8469`: a picked set does not gain a lesson recorded during the run, and adversarial still does. Split `LessonInjection.Compose` so the eligible list and the capped selection share one predicate; a second copy of it is the drift the feed exists to prevent. The feed needs a way to return the uncapped eligible list and a way to take a recorded pick. Its callers are `RunLauncher.cs:1795`, `ReviewEngine.cs:8482` (reached from lines 2179, 2264, 2537, 2547, 4982, and 5541), `TaskStartCommand.cs:183`, `TaskDelegateCommand.cs:525`, and `TaskDriveCommand.cs:339`. All three CLI sites already hold `taskDetails`, so reading a recorded pick there is one argument; the CLI cannot spawn, since the picker belongs to the daemon. The lens rule sits at the ReviewEngine call sites: 2179 picks by its `lens`, 2264 is the Verify pass, which stands in for the adversarial track, so it stays newest-first.

  The record. The event goes on the task stream, appended in its own session, and reaches composers through a new `TaskDetails` field (inline projection). The task stream rather than the run stream, because the set must follow the task across runs and nodes. Classify it in `EventScopeRegistry`, and as Conditional in `TaskActClassificationRegistry`, like `CloseoutTriageRecorded`. Count it in `TaskPassageQuery.IsSessionDispatch` when a session spawned; the passage already reads the task stream. The closed outcome list is picked, start-failed, session-error, no-result, timed-out, unusable-answer, and empty-pick; leave it out of `OrchestratorFeedInterest`, which is silent by default. An older peer skips an event type it does not know (`EventReplicationInbox`), so a mixed-version fleet is safe.

  The section. `recorded-lessons.md` says "newest first" in `lead` and "the newest that fit" in `truncation`, and both would be false for a picked set, so a picked set needs its own wording. The newest-first path stays byte-identical, which is what keeps the golden fixtures untouched.

  The role. There is no new role. Resolve the model with `ResolveCourierModel(project.Model)` and the effort with `ResolveEffort(AgentRole.Courier, null, project.Effort)`, so the cheap-tier choice stays in one place. `SessionRoleName` still gains an entry, since a session name is not a role. There is no tier type in the code; the courier role is the policy's cheap tier.

  The setting. It follows `LessonPromptMaxLessons`: an `OperatingSettings` field read fresh at composition, because the CLI cannot reach `DaemonOptions`, added to `onlyImmediateEffectSettingsChanged` in `ConfigSetCommand`, with a closed-vocabulary value object per TASK-MODEL.md section 8.
