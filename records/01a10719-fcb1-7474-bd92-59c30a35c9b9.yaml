  Card A of idea 8d0b724b (ideas/8d0b724b-*/workspace/draft-task.md and report.md); it rewrites the routed draft ba251d5e, whose verbatim review finding (ConcludeWithdrawnAsync recalls or abandons another owner's replicated review task) is the scenario behind criterion 2. Line references were confirmed on origin/main at fdf9c01ab by the cell B pair 3 challenge (verdict-opus.md and verdict-fable.md in this task's directory); re-confirm them. Use the existing owner test OwnerScopedCoverage.IsOwn (the one mention attach uses) and TaskOwnerGuard rather than inventing a new check; do not call TaskOwnerRule with an empty root, which matches nothing. Leave OwnerScopedCoverage's empty-root exception alone: a solo install that never ran h9k project join has an empty root permanently, and its own reviews must keep counting as its own (OwnerScopedCoverageTests pins this). Tests may use the existing Postgres fixture (PrReviewTaskEngineTests) with a faked review-assignments surface; no branches, git, or GitHub. Governing decisions: 8a5822cc (a requested reviewer's pr-review task is theirs alone) and the cross-owner acts ruling of 2026-10-01.
