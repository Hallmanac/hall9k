objective: No automatic sweep and no h9k pr review invocation appends an event to a review task that TaskOwnerRule says belongs to another owner
criteria:
  - ConcludeWithdrawnAsync (AutoPrReviewEngine.cs, about line 1654) concludes only tasks whose AutoPrReviewAssigneeLogin equals this install's login, compared case-insensitively, and that OwnerScopedCoverage.IsOwn reports as this owner's; a task this node cannot attribute to an owner is left untouched.
  - |-
    A test (the engine's existing Postgres fixture with a faked review-assignments surface; no git or GitHub) reproduces the original scenario: Brian and Ryan are both requested, Ryan's replicated task is on Brian's node, and Brian is removed. It asserts that Ryan's task gains neither PullRequestReviewAssignmentRecalled nor TaskAbandoned, and that Brian's own task is still recalled.
  - h9k pr review attaches to this owner's own live task for the pull request when one exists, even when a teammate's is newer. When every live task belongs to another owner, it refuses before any attach, claim, or lap event, names that owner by label through TaskOwnerGuard with the same wording as the other guarded commands, and appends nothing to that task in any state (Published, Queued, parked with a report, or awaiting follow-through). A test covers both the prefer-own and the refuse cases.
  - The existing tests for each touched path still pass unchanged.
