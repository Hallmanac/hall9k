context: |-
  The feed courier on this Windows node never delivered until 2026-11-01: every courier reported the registered window unreachable and ListAgents showed no peers, so each project retried about once a minute and spent its 500-a-day spawn cap by about 05:45 local. Root cause (idea 6f838a3b workspace/journal.md, mechanism corrected by the challenge in this task's workspace/challenge.md): h9kd ran non-elevated while every interactive Claude window runs elevated. An elevated Claude window creates its named pipe with the elevated token's default DACL, owned by Administrators, with full access for Administrators and SYSTEM and read-only for Everyone, and no integrity label. A non-elevated daemon's filtered token holds Administrators as deny-only, so the courier it spawns cannot open the pipe, and Claude Code's ListAgents silently drops any peer it cannot open. An elevated daemon's courier has Administrators enabled and the user SID, so it matches a non-elevated window's pipe DACL; hence the one-direction block. The node was fixed by hand by raising the daemon to elevated (logon task RunLevel Highest); Brian's rule is to keep the windows and the daemon at the same level, whichever way.

  Measured on this node from a non-elevated process (challenge probes): OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION), OpenProcessToken(TOKEN_QUERY), and GetTokenInformation(TokenElevation) all succeed against elevated processes of the same user, and .NET Process.StartTime is readable too. So a same-user window's elevation is always readable, and "unknown" means another account or something exotic. Do not copy the guess in `OrchestratorProcessTableProbe.cs` (lines 33-36) that an elevated process's start time cannot be read.

  Builds after 93dca1b2 (courier failure backoff and streak) and f60a00b7 (autostart enable keeps the run level), both plain blocked-by edges, not stacked. 93dca1b2 adds the `CourierFailureStreak` document, `ApplyStreakHousekeepingAsync` in `CourierEngine.TickAsync` (after the manual-drain check, before the feed scan), the state branches of `CourierStatusLine.State`, and `src/Hall9k.Cli/Diagnostics/CourierDoctor.cs`. f60a00b7 adds `h9k daemon autostart enable --run-level` and a small current-process elevation check behind a seam. Read both with `h9k task show` and build on what shipped. This task generalizes that check into one elevation reader for any pid and points f60a00b7's check at it. It changes none of 93dca1b2's numbers, resets, or wording.

  Where the code is (origin/main d83eb53a, plus 93dca1b2's branch for its files):
  - `src/Hall9k.Daemon/Courier/CourierEngine.cs`, `TickAsync`: the cheap checks precede the feed scan. Only `SpawnAsync` increments `CourierDaySpawnCounter`, so a block spends no cap by construction. `_reportedNoAdapter` is the once-per-episode idiom.
  - `src/Hall9k.Domain/Features/Courier/CourierGate.cs` and `CourierSpawnDecision.cs`: a new decision value, not an overloaded one.
  - `src/Hall9k.Domain/Features/Orchestrator/OrchestratorProcessTableProbe.cs` and `IOrchestratorProcessProbe.cs`: the elevation reader lives beside them in Hall9k.Domain behind its own interface, because the CLI and the daemon both ask. It is GetTokenInformation(TokenElevation) after OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION) and OpenProcessToken(TOKEN_QUERY), and the first P/Invoke in Hall9k.Domain (Cli and Daemon have their own Windows interop files to follow for style).
  - `src/Hall9k.Cli/Orchestrator/CourierStatusLine.cs` with `src/Hall9k.Cli/Commands/StatusCommand.cs` (which prints `OrchestratorPresenceLine.Describe` and then the courier line), and `src/Hall9k.Cli/Commands/OrchestratorStatusCommand.cs`.
  - `src/Hall9k.Cli/DaemonControl/DaemonProcess.cs` (`Probe()`, pid plus start time, Decisions Log #2) and `IDaemonAutostart.IsEnabled`. `h9k daemon start` routes through the logon task only when autostart is registered (`DaemonLifecycle.cs`, `startThroughAutostart`); otherwise h9kd inherits the shell's elevation.
  - `src/Hall9k.Cli/Commands/OrchestratorRegisterCommand.cs`: `--pid` is the window being registered.
  - Tests: `tests/Hall9k.Tests/Domain/CourierGateTests.cs` and 93dca1b2's courier tests. CI runs ubuntu-latest and windows-latest only.

  Placement: build on this Windows node (Brian places it). A build session runs under the daemon, which is elevated here, so it cannot see the non-elevated-daemon case directly. For a manual check, a non-elevated process comes from `explorer.exe <script.cmd>` started from an elevated shell (the script runs with the filtered token), or from a one-off non-elevated scheduled task as the discovery session used (created, run, deleted). `runas /trustlevel:0x20000` does not de-elevate on this Windows 11 build.
