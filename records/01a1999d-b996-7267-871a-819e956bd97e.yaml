objective: On Windows, the daemon does not spawn a feed courier into an elevated orchestrator window it cannot reach because the daemon is not elevated, and it says so wherever the operator looks
criteria:
  - On Windows, on each courier sweep tick for a project whose registered window is live, the daemon checks whether the window's process (the presence pid) is elevated (TokenElevation) while the daemon itself is not. The daemon's own elevation is read once at start; a window's is read once per process (pid plus start time) and cached, since a token's elevation never changes for the life of the process. When the window is elevated and the daemon is not, the tick spawns no courier, spends none of the day cap, and does not pay the feed scan. Every other combination (both elevated, neither, or an elevated daemon with a non-elevated window) proceeds exactly as after 93dca1b2
  - The check runs after the liveness, stranded-run adoption, already-running, and manual-drain checks and before 93dca1b2's streak housekeeping (ApplyStreakHousekeepingAsync) and the feed scan. So a blocked tick neither counts toward the failure streak, resets it, pulls it in after a restart, nor moves its next-attempt time; any reset or pull-in it would have made happens on the first unblocked tick. The check runs whether or not feed items are waiting
  - When either token cannot be read (another account's process, say), the tick proceeds as after 93dca1b2 and 93dca1b2's backoff contains any failures. Every surface below then says that level is unknown, never guessing it
  - |-
    The block is logged once per episode, an episode being one window process (pid plus start time) blocked by this daemon process; it is held in memory, the _reportedNoAdapter idiom. A new window at the same mismatch is a new episode and logs again; a daemon restart logs a still-blocked window once more; the entry is removed when a tick finds the window no longer blocked or no longer live. The line names the project, the window's session name and pid, and the fixes: with autostart registered, run h9k daemon autostart enable --run-level highest from an elevated shell, then h9k daemon stop and h9k daemon start; with no autostart, stop the daemon and run h9k daemon start from an elevated shell; or open the window without elevation. The daemon's line gives the two daemon fixes as alternatives, since the daemon cannot see whether autostart is registered
  - |-
    The CLI computes the same verdict live with the same reader, the registered presence's pid and start time against the running daemon from DaemonProcess.Probe(); no verdict is stored. While the project's window is live and blocked, the courier line on h9k status reads: courier: blocked, the window is elevated and the daemon is not. In 93dca1b2's CourierStatusLine precedence it is a branch after in flight and before day cap spent and failing, and appends the streak count like the other winners. h9k orchestrator status, which prints no courier line, appends the same fact after OrchestratorPresenceLine.Describe in OrchestratorStatusCommand itself, never inside the shared composer, so h9k status shows it once. With no daemon running, neither surface shows a block. The CLI surfaces pick the fix branch from IDaemonAutostart.IsEnabled
  - On Windows, h9k doctor's courier section (added by 93dca1b2, skipped under --no-configure) gives each listed project's window as elevated, not elevated, or unknown beside the daemon's, and warns for a blocked window with the same fixes. A project warned for a block is not warned again for its undrained hour. With no daemon running it says so and skips the comparison. On macOS and Linux the section shows no elevation
  - h9k orchestrator register on Windows still registers but warns when the window it registers (its --pid) is elevated and the running daemon is not, with the same fixes. It says nothing when that is not the case, when no daemon is running, or when either level is unknown
  - |-
    docs/concepts.md (The feed courier) explains the elevation rule: an elevated window's pipe grants write access only to Administrators and SYSTEM, a non-elevated daemon holds Administrators as deny-only and so cannot open it, and an elevated daemon can open a non-elevated window's pipe. docs/cli.md describes the blocked text on h9k status and h9k orchestrator status, the doctor lines, and the register warning
  - Tests cover the gate decision for all four elevation combinations and for an unreadable token on either side; the check's position, proved by a blocked first tick after a restart that leaves the streak's next-attempt time and a new window's reset to the first unblocked tick; the per-process elevation cache; one log line per episode, again for a new window at the same mismatch, and again after recovery and recurrence; the blocked status text and its precedence; no double print on h9k status; the fix branch chosen by autostart; and the doctor and register lines, including unknown. The elevation reader is behind a seam, faked in these tests so they run on both CI legs, plus one Windows-only test that reads the test process's own elevation and asserts only that a value was read (the windows-latest runner is elevated). macOS and Linux behaviour is unchanged
