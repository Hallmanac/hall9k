context: |-
  Why: idea 6f838a3b (`ideas/6f838a3b-the-feed-courier-on-this-windows-node-has-never-delivered-ev/workspace/journal.md`). On this Windows node the daemon ran non-elevated while every Claude window ran elevated, so the feed courier, which inherits the daemon's elevation, could never open a window's named pipe and never delivered. Brian keeps his windows elevated, so on 2026-11-01 at 19:14 EST he raised the logon task \Hall9k\h9kd to RunLevel Highest by hand (Set-ScheduledTask) and restarted the daemon; it has delivered since. When autostart is registered, every `h9k daemon start` without `--binary` goes through that task (schtasks /Run), so the task's level is the daemon's level. Today one `h9k daemon autostart enable` silently undoes the fix, because the registration hardcodes LeastPrivilege. Cut from draft 956bd97e, which builds after this task and names `--run-level highest` in its fix text.

  Why keep-existing rather than following the shell: Windows operators often open admin terminals by habit, and a level that followed the shell would quietly make every dispatched agent, which already runs with --dangerously-skip-permissions, an administrator. Keeping the existing level fixes the reported bug and keeps today's conservative default for a first enable (challenge in 956bd97e's workspace/challenge.md, finding f60a00b7-1).

  Where the code is (origin/main d83eb53a):
  - `src/Hall9k.Cli/DaemonControl/WindowsDaemonAutostart.cs`: `TaskXmlContent` hardcodes `<RunLevel>LeastPrivilege</RunLevel>`. The Task Scheduler XML values are `LeastPrivilege` and `HighestAvailable`; PowerShell's `Limited` and `Highest` are the same two levels under other names. `EnableAsync` registers with `schtasks /Create /XML ... /F`. `IsEnabled` is `QueryExists()` (schtasks /Query exit code). `IsLoadedAsync` and `StateQueryCommand` show the Get-ScheduledTask pattern. A missing task makes Get-ScheduledTask throw a long CIM exception, which is why absence is read from IsEnabled instead. A non-elevated shell reading a Highest task's Principal.RunLevel was measured to work on this node.
  - `src/Hall9k.Cli/DaemonControl/DaemonLifecycle.cs`: `startThroughAutostart` and the `--binary` bypass.
  - `src/Hall9k.Cli/DaemonControl/IDaemonAutostart.cs`: `EnableAsync` is the cross-platform seam; `LaunchdDaemonAutostart` and `DeferredDaemonAutostart` implement it too.
  - `src/Hall9k.Cli/Commands/DaemonAutostartEnableCommand.cs`: options, success and refusal output. Follow the repo's CLI standards: a `[Description]` that teaches, and an example.
  - `tests/Hall9k.Tests/Cli/WindowsDaemonAutostartTests.cs` already calls `TaskXmlContent` on every CI leg (ubuntu-latest and windows-latest).
  - Elevation: read GetTokenInformation(TokenElevation) on the current process's own token, behind a seam, rather than WindowsPrincipal against the Administrators role. 956bd97e later generalizes this into one reader for any pid in Hall9k.Domain and points this check at it; keep this one small.

  Placement: build on this Windows node (Brian places it). No dependency.
