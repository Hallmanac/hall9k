objective: On Windows, h9k daemon autostart enable keeps the logon task's run level across a re-enable instead of silently resetting it to LeastPrivilege, and raises or lowers it only when asked
criteria:
  - |-
    On Windows, h9k daemon autostart enable keeps the existing \Hall9k\h9kd task's run level when one is registered, and registers LeastPrivilege when none is, whatever the shell's elevation. A new option, --run-level highest|limited, is the only way to change the level: highest registers HighestAvailable, limited registers LeastPrivilege. The success line names the level registered, as elevated or not elevated, and says every daemon start that goes through the task (logon, and h9k daemon start without --binary) runs at that level
  - |-
    Any registration at HighestAvailable, whether kept from the existing task or asked for with --run-level highest, is refused before schtasks runs when the shell is not elevated. The refusal names the level and both ways forward: re-run from an elevated shell, or pass --run-level limited to lower it on purpose. Elevation is the current process's own TokenElevation, read behind a seam
  - An absent task is IsEnabled false (the existing schtasks /Query exit-code route); only an existing task's level is read, through (Get-ScheduledTask -TaskPath '\Hall9k\' -TaskName h9kd).Principal.RunLevel.ToString(), the unlocalized route IsLoadedAsync uses for State, never schtasks display text or an exception message. An existing task whose read fails or returns neither Highest nor Limited counts as unreadable, and enable then requires an explicit --run-level and says why
  - On macOS, and wherever autostart is unsupported, --run-level is refused with a message that it applies only to Windows; enable without it behaves exactly as today
  - |-
    docs/INSTALL.md's Windows daemon section and docs/cli.md's daemon autostart rows describe the kept level, the option, the refusal, the two starts that do not go through the task (h9k daemon start --binary, and any start with autostart not registered, which inherit the shell's elevation), that --run-level highest makes the daemon and every agent it dispatches run as an administrator, and that the operator's Claude windows and the daemon must be at the same elevation for the feed courier to reach a window. docs/getting-started.md's re-run advice (the Decisions Log #222 paragraph) says that a re-run keeps the level, and that on an elevated task it must be run from an elevated shell
  - Tests cover the task XML at each run level (the rest of TaskXmlContent unchanged), the level chosen for every combination of existing task (absent, Highest, Limited, unreadable), --run-level (none, highest, limited), and shell elevation, each refusal's wording, and the non-Windows refusal. The shell's elevation and the existing level are read behind seams so these run on both CI legs. No test or doc line states schtasks' own behaviour for a non-elevated HighestAvailable registration as measured
