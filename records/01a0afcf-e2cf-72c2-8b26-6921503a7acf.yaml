objective: |-
  A project's prompt addenda live on the ledger: one short markdown file per prompt builder that the daemon appends after the shipped prompt's rules section on every member's node, so a team adds project-specific guidance to any review or work prompt once, without replacing or referencing platform prose, and no platform version ever overwrites it
criteria:
  - An addendum is one markdown file per prompt builder (work, review lap, QA review, design review, and the rest) in the ledger's hall9k ref namespace, written through the daemon by h9k project prompt-addendum set <builder> --file <path> (show, list, remove alongside), recorded by the daemon as a project-scoped event (classified in the EventScopeRegistry so replication carries it to every member's node once the distributed-team chain ships) with who and when, and only then written to the ledger by the daemon; each set replaces the whole file, so an addendum is edited, shortened, or rewritten freely at any time and 'additive' describes only how it joins the prompt, never its own history; no agent writes the ledger directly
  - Every prompt builder appends the project's addendum for it, when one exists, after its rules section under a fixed heading naming it as the project's own guidance, exactly the way the writing-conventions setting is pasted today; platform prose is never replaced, and the addendum never references template fragments, so a platform version change cannot make it stale
  - |-
    The daemon materializes addenda locally on every ledger fetch and the loader reads them from that copy; an addendum over a size cap is not refused outright: set stops with the cap, the size, and a suggestion to tighten, and h9k project prompt-addendum set --over-cap "<why>" accepts it anyway with the reason recorded on the event, so the cap is a judgment call with an escape hatch and never a blocker; the prompt builder's log names an over-cap addendum whenever it appends one
  - |-
    Tests through the seam with a fake ledger: a builder with an addendum renders it under the heading after the rules; a builder without one renders unchanged (golden); set, show, list, remove round-trip and a second set replaces the first; an over-cap set stops with the cap named and succeeds with --over-cap and its reason on the event
  - |-
    dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each, the log recording that project prompt customization is additive by design (Brian, 2026-09-17: flexibility with guardrails, no fragment overrides)
