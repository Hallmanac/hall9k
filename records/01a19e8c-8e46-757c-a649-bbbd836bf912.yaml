  ```
  Title: feat: hold a task for a feedback step that checks what its blockers learned

  Work item: [#851](https://github.com/Hallmanac/hall9k/issues/851)

  This adds the feedback step: when a task takes it, the notes its blockers left are checked against it before it is released, and a task they affect is refined, challenged once, and queued again for the same owner and node, or parked for a person. It is off by default per project, with a per-task override, and the commits go in order from the record, to the model policy, to the plan loop, to the daemon, to the CLI, to docs.

  I went ahead and reused the plan engine for the refine, challenge, and publish stretch instead of writing a second loop. It runs with a cap of one challenge round, and a plan like that can request one challenge ever, so no path can start a second. For judging a publish as revised verdict I added a new refinement purpose rather than resuming the refinement session. The reason is that it goes through the same dispatch, timeout, and failure handling as every other session, and it only differs in its prompt and in what the plan does with the outcome.

  A few calls a reviewer might want to push back on:

  - A task with no blockers is never held, since there are no notes for a check to read.
  - When the step parks a task, it also ends its plan, so a later `h9k plan resume` is refused and a person settles the park by hand. I read "the step must not act on what a resume publishes" as removing that possibility rather than ignoring it.
  - The check's model and effort come from its own role and floor, and neither a project's `--model` nor the node's default model moves them, so the check stays cheap while the refinement can be set higher.
  - With no placement, two nodes of one owner that have not yet replicated could each begin a step. The fence covers placed tasks and nodes that share a store, but not that gap.
  ```
