objective: A daemon restart that adopts a run in the middle of a verification gate ends that gate's orphaned process tree and re-runs the gate instead of racing it, the restart path waits for a live gate before stopping, and a gate start that fails to record never leaves an unrecorded tree behind
criteria:
  - At startup, a run adopted in Verifying or UnderReview whose RunDetails.ActiveGate names a process still alive by pid and start time has that tree ended with ProcessManagerBase.TerminateTree (snapshot-and-recheck), the pids logged, and GateEnded appended, before the pipeline resumes and re-runs the gate from the start; a stale ActiveGate whose process is gone is left to the resumed pipeline
  - An IOException opening the verify log at gate start is returned as an infrastructure failure of that gate naming the recorded gate process, spends the gate's existing single retry (PendingGateRetry), and never re-enters through the stranded-pipeline sweep
  - |-
    h9k daemon stop warns by name of any run on this node whose ActiveGate names a live process, under a Working run or a Delivered task's follow-up alike, and proceeds; h9k update --restart and h9k install --restart, in the shared restart path before the stop, wait for such gates with a total deadline of the verify gate limit, re-querying each poll, then stop; the flag --now overrides the wait and restarts at once (Brian, 2026-09-20: wait, flag as override); a store the CLI cannot reach prints that the check was skipped and proceeds
  - The GateStarted append at gate start is wrapped so that any failure to record it kills the just-started process tree before rethrowing, so no unrecorded gate process outlives the method
  - Unit tests cover adoption over a recorded live gate and over a stale record through FakeProcessManager, the verify-log failure path, the stop warning, the bounded wait with a gate ending and another starting inside it, and the --now override; no test creates branches, touches GitHub, or spawns a real gate
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder; docs/concepts.md's adoption paragraph says a gate the old daemon left running is ended, never raced
