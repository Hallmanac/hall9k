context: |-
  Captured 2026-09-19 15:5x EDT by the Mac project window from the Windows node window's report over the transport. Incident, verbatim in substance: h9k update --restart to v0.10.2 on Windows at 15:44:41 EDT landed two minutes into a56cf16e's test gate (the daemon's own dotnet test); catch-up adopted the run, but the orphaned test process tree still held verify-test.log locked, and the resumed pipeline crashed on it every 5 seconds until the operator killed the orphan tree by hand at 15:46 EDT; the gate then re-ran from the start under the new daemon. On the Mac the same restart at 15:24 avoided it only because the node window checked the log for a running gate first. Brian's rule of the day: only the daemon's own in-flight action blocks a restart, live agent sessions are adopted; a running gate IS the daemon's own action, and the platform should protect itself rather than rely on an operator reading the log. Pointers: RunSupervisor.AdoptOrphansAsync (adopts on alive-or-result; RunResultFile), VerificationRunner (gate spawn and verify-*.log handling), the daemon stop path in the CLI. Windows-specific note: the lock was a Windows file-share lock; on macOS the same orphan would race the log rather than lock it, so the fix must be cross-platform. Lineage: a gap in restart adoption (the #372 and adoption work), not a fix of a fix.
