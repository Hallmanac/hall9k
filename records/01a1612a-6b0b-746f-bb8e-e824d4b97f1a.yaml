context: |-
  Brian 2026-10-21: hall9k must not advertise itself on Jira cards (the description marker is visible at the foot of every created card). Discovery: ideas/c868c526-*/workspace/summary.md, task B. Challenge verdict in this task's journal.md. SubmitAsync mints a new RequestedAt on every submit (JiraWriteCoordinator.cs:119-121), so the window anchors on the first create request recorded on the task, a field derived on replay (the aggregate keeps no create history today, TaskAggregate.cs:61-82, cleared at :2745). Use a relative JQL time bound (created >= -Nm) because date literals read in the profile's timezone; match on creator, not reporter (reporter is settable through fields, JiraWritePayload.cs:125-126); read summary from the search answer and page to at least 100 (the cap is 10 today, JiraWriteExecutor.cs:116). The new search, its relative time bound, and summary-in-search-results are all unverified against a live tenant; carry the same first-live-run caution the executor's current search/jql call carries (JiraWriteExecutor.cs:78-88). Parallel with sibling task A (1ce26244): both may touch the cli-reference SKILL.md and JiraWriteRetryEngine.cs in different hunks. Out of scope: removing markers already on cards (Brian declined); recording the key from a create whose read-back failed (parked: it contradicts JiraWriteSucceeded's read-back contract and is not needed once the window is anchored on the first request).
