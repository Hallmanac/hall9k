objective: A Jira create writes the composed description unchanged, and crash-window dedup finds an already-created card without a hall9k marker on it
criteria:
  - A Jira create sends the composed description exactly as composed, with nothing appended; a blank composed description is sent blank (removes the hall9k-task:<uuid> marker, src/Hall9k.Connectors/WorkItems/JiraWriteExecutor.cs:103, :242, :757).
  - Before every create, hall9k looks on the target board for a card that the connection's own login created (Jira's creator field) no earlier than five minutes before the first create request ever recorded on this task, whose summary equals the composed summary exactly, and adopts the earliest such card instead of creating; a create resubmitted after an earlier attempt failed therefore finds the card that attempt made (replaces FindByMarkerAsync, JiraWriteExecutor.cs:138, called from JiraWriteCoordinator.cs:342).
  - A matching card already linked to another hall9k task is never adopted.
  - |-
    The search's time bound does not depend on the timezone set on the Jira profile, and the search reads the whole window: ten or more of the login's other cards on the board inside it do not by themselves make a create refuse.
  - An unreadable search answer or candidate entry, or a window holding more cards than one search reads (at least 100), refuses rather than creates, with a message naming the board, the summary, and the earliest time to look from. Every operator-facing message that today says the marker search will find the card (JiraWriteCoordinator.cs:277, :346; JiraWriteExecutor.cs:438, :813, :825; src/Hall9k.Daemon/JiraWrites/JiraWriteRetryEngine.cs:353) describes the new search instead.
  - |-
    Unit tests over fake Jira responses cover: no match creates; a match adopts; a second create request on the same task adopts the card the first attempt made; a same-summary card created before the anchor minus five minutes is not adopted; a match linked to another task is not adopted; a window over the cap refuses; the create request's description equals the composed one. The hall9k-cli-reference skill's marker paragraph (SKILL.md:1205-1209) is rewritten to match.
