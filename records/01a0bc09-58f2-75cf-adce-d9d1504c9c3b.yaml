objective: When a project's orchestrator feed has items and an orchestrator is live, the daemon spawns a short-lived cheap-model courier that delivers them to the orchestrator session and exits, so no orchestrator window ever polls
criteria:
  - A courier role joins the model-by-role policy (h9k config set --model-courier <model>, default claude-sonnet-5, with the same node-default and project-override shape as the build and review roles); a courier runs as a run with no task, recorded on the store with its model, tokens, and outcome, and counted in h9k status's spend line
  - |-
    The daemon spawns a courier for a project only when all four hold: the feed has undrained items, an orchestrator is live (piece 1), no courier for that project is running, and the batching wait has elapsed; the wait is zero after ten quiet minutes and grows with recent activity up to the project's --courier-max-wait (default 60 seconds); a park, a dispute, daemon trouble, or a message from a person dispatches at once regardless of the wait; a per-day spawn cap (default 500 per project) guards a storm and logs when hit
  - |-
    The courier's prompt is small, no recipe and no AGENTS.md: the feed items as the drain prints them, the orchestrator's session name and CLI from the presence record, and the delivery instruction; it delivers one message grouped by task to the orchestrator session, marks the feed drained up to the last item delivered, and exits; if delivery fails the cursor stays and the daemon retries after the wait; delivery is an adapter (cross-session message on Claude Code now, other CLIs later), and with no fitting adapter the feed stays undrained and the log says so
  - h9k status shows a courier in flight and the last delivery time; a manual h9k orchestrator feed --drain still works and the courier never runs while a manual drain holds its short lease
  - Unit tests cover every spawn condition, the wait growth and the urgent override, the day cap, delivery success advancing the cursor and failure leaving it, and the prompt as a golden; no test spawns a real agent, creates a branch, or touches GitHub
  - dotnet build and dotnet test pass; the decision log carries one entry; docs/concepts.md describes presence, feed, and courier together; the orchestrator-recipe-generator skill stops emitting poll crons and the watcher recipe once this ships
