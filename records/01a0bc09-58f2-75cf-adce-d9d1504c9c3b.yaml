context: |-
  The platform owns the orchestrator's watching: a lesser-model watcher session that polls the daemon (transport messages, actionable log lines, parks) and forwards only actionable items to the orchestrator window, spawned from the orchestrator recipe; longer term the daemon itself notifies or kicks off an agent when something actionable lands, so no window polls. Brian, 2026-09-19: no machine-level background tasks (memory limits differ per machine); something agentic that is looking for work, on a cheap model, with the high-end orchestrator deciding. First hand-written form: recipes/watcher.md in the hall9k project home; the recipe generator should emit it.

  Piece 3 of 3 of idea 89471598 (the orchestrator feed and courier), walked with Brian 2026-09-19 19:4x EDT; his calls: maximum wait 60 seconds by default and configurable per project, the quieter the feed the shorter the wait down to immediate; day cap 500. Stacked on piece 2 (the feed, 37b5ec69: it drains through it and builds on its code), blocked by piece 1 (presence, 579dcd44: it must never spawn without a live orchestrator). Why a courier and not a watcher: nothing runs between events, so an idle project costs nothing; the courier carries no recipe so a spawn is a few thousand tokens, not the orchestrator's 25,000-token turn one. The run-with-no-task seam is shared with the voice build-skill draft (e74d7351). Retires when shipped: recipes/watcher.md (the Sonnet watcher in a screen session, today's stopgap), the orchestrator window's poll crons, notes/waiters/sweep.sh's log parsing. Pointers: DispatchEngine and RunLauncher (spawn path), ClaudeExecutor (the Claude Code adapter; the cross-session address comes from the presence record), the model policy resolver (add the role), DaemonOptions (the wait ceiling, the quiet threshold, the day cap), the h9k orchestrator command group. Placement: Mac, after the fingerprint pair and pieces 1 and 2.

