context: |-
  The mention path claims and launches on a task without asking whose task it is. AutoPrReviewEngine.AttachMentionAsync finds the covering task by the pull request's external reference alone (AutoPrReviewEngine.cs:2067-2076). Its gates (2241-2380) never look at the assignee or owner root. TaskDecider.ClaimForMentionFollowUp (TaskDecider.cs:2280) documents that it does no owner identity check. The v0.11.3 owner-root rule (TaskOwnerRule, 5bacf6fa1/95e7e900b/baef0c975) is applied only in CLI commands, never in the daemon. The receive gate (EventReplicationInbox.EvaluateTaskActVerdict, v0.11.0) protects only the receiving ledger and always lets an Owner-role sender's act through, so it cannot stop a teammate's node from claiming and launching on its own machine.

  Shape to weigh: apply the same TaskOwnerRule the CLI uses at the attach and claim seam. A teammate's mention that lands on another owner's task should be recorded (or routed to that teammate as their own item) without a claim. The Owner-role pass-through never covers a daemon-originated claim on another owner's task: Brian ruled this at the walk (2026-10-02), following his 2026-10-01 cross-owner ruling that an Owner-role override happens only on an explicit human ask with a reason.

  ## Motivating case: AgelessRx/arx-platform#2166, pr-review task bc7d2572 (2026-10-01 EDT)

  - bc7d2572 is Brian's (Hallmanac) pr-review task for #2166, scope Team, assigned to Brian Hall. It had been parked merge-ready since about noon.
  - 11:49 Taylor Dennison (taylor-dennison) asked a question on the PR.
  - 17:21:23 Brian replied as Hallmanac, mentioning @taylor-dennison (issue comment 5940862269). The comment answered Taylor; nothing in it was for Brian.
  - 17:23 feed: "bc7d2572 claimed by TaylorDenny as a deliberate kick-off; a run is starting". Taylor's install had a real mention of its own login, found Brian's replicated task by external reference with no owner filter, and claimed it through TaskDecider.ClaimForMentionFollowUp. That claim carries the empty node id, so the feed (OrchestratorFeedDescription.cs:124-125) labelled it a deliberate kick-off. That label is wrong.
  - 17:26 feed: "bc7d2572 claimed by node ef6ab27d". The order here is inferred from the code: Taylor's safe pre-flight requeued the task with PendingMentionFollowUpAfterPreflight (RunSupervisor.cs:352-357), still assigned to Brian. Brian's dispatcher claimed it and took the pending-follow-up branch (RunLauncher.cs:163-180).
  - 17:27 parked with a mention-followup addendum, run 01a0f95c-a4cc-7362-a7c8-bfd6ba613d3a, reading "Tagged by Hallmanac". The session found no question for Brian and drafted nothing.

  Evidence comes from a code trace at v0.11.3 (e03c7d7e6). Mention match and self-author filter: src/Hall9k.Connectors/WorkItems/GitHubReviewAssignments.cs:439-440, 482-484. Attach: src/Hall9k.Daemon/AutoPrReview/AutoPrReviewEngine.cs:2058-2409, with the covering-task lookup at 2067-2076. Receive gate: src/Hall9k.Connectors/Replication/EventReplicationInbox.cs:2013, Owner-role pass-through around 2045-2048.


  ## Added 2026-10-02 (Brian, f894d344 discovery questions 2 and 3)

  Criterion four is the discovery's decision-order step 3 (notes/discovery-f894d344-2026-10-01/report.md in the project home): for #2166 it gives Taylor a row reading that Hallmanac mentioned taylor-dennison, and gives Brian's board nothing. Criterion five folds in the request-side sibling, a code-reading finding with no observed incident: scope.md says a teammate's review of the same pull request is a different owner's work and is never touched. Both lookups should share one owner-scoped helper rather than two copies of the rule.



  ## Challenge applied 2026-10-02

  Verdict in this task's journal.md (challenge 7aae9fee). Criteria 1, 2, and 5 replaced with the verdict's text. Brian ruled criterion 4's lever out: the existing levers (h9k task add --from-pr refusing at TaskAddCommand.cs:1041 and 1167, h9k pr review attaching at PullRequestReviewCommand.cs:301) are owner-blind in this case, so the row offers none rather than widening this fix to those guards.
