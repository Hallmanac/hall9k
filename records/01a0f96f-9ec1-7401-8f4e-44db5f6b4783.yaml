objective: A mention seen by a teammate's install never claims or launches on a task assigned to another owner
criteria:
  - |-
    A mention follow-up is claimed or dispatched only on a task that is this owner's by the rule the CLI task commands apply (TaskOwnerRule: holder, else assignee, else creator). A task this node cannot attribute to a known owner counts as another owner's. This holds on every path that attaches a mention, including the canonical re-check inside the mention mint (AutoPrReviewEngine.cs around 2469)
  - |-
    Unit tests over the covering-task decision, with no database, no branch, and no GitHub, reproduce the #2166 case: a mention of this install's login on a pull request whose only live pr-review task is another owner's decides the teammate row, with no claim and no event on that task. When both an own and a teammate's live task cover the pull request, the decision attaches to the own task whichever is newer
  - A daemon-originated mention claim on another owner's task is refused even when this install's owner holds the Owner role; the Owner-role override stays a human act with a stated reason (h9k task abandon --holder --reason and its siblings), and this ruling is recorded in the decisions log (Brian, 2026-10-02)
  - |-
    A mention on a pull request whose only covering task belongs to another owner is recorded with its own outcome. It is shown to this owner as a needs-you mention row (ComposeMentionRow, ahead of its informational teammate-covered branch) naming who mentioned which login on which pull request, with a link to the comment, and offering no by-hand lever: the row's text says the pull request is a teammate's review and the reply happens on GitHub. The mention is never appended to the teammate's task stream, never claimed, and never minted (Brian, 2026-10-02: no lever, the smaller change)
  - On the review-request side, no covering-task check (the fast path around 897, the canonical dedup around 1190, and the re-mint guard around 1222) counts another owner's task; both sides use one owner-scoped helper. A unit test shows a request to this owner on a pull request a teammate's live review covers decides mint
