  Observed on the Mac 2026-09-27 14:23 EDT during the Postgres move (notes/decisions-2026-09-27-hall9k-6b.md): with the daemon stopped by hand, h9k update --restart installed 0.10.57 and exited without running the doctor or starting the daemon; the compose file kept its 0.0.0.0 binding until h9k doctor --yes was run by hand, then h9k daemon start. Brian's goal (2026-09-27): an ARX teammate's only step is h9k update. Related: 608be11f (doctor waits for readiness), 2f9bc330 (localhost ::1), 2ba2ac07 (password migration on the same path). Update itself runs the old binary's FinishAsync; only the --restart handoff runs new code, so the fix lives in the handoff.
