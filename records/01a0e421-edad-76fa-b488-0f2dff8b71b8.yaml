objective: h9k update --restart hands off to the newly installed binary's doctor and ends with the daemon running whether or not a daemon was running when the update began, so a teammate's one command applies the Postgres loopback recreate and password migration without a manual doctor or daemon start
criteria:
  - |-
    h9k update --restart on a node whose daemon is already stopped runs the same handoff as on a node with a running daemon: the new binary's h9k doctor --yes path (the 359e0d7a compose rewrite and guarded recreate, and the 2ba2ac07 migration once it ships), then starts the daemon; the run ends with h9k daemon status reporting it running on the new version
  - h9k update without --restart, on any node, ends by printing the exact command that completes the migration (the --restart form), never silently leaving the running container on the old binding
  - A unit test over update's generated handoff sequence covers both starting states (daemon running, daemon stopped) and pins that the doctor step and the daemon start are in both; no real install, container, or daemon
