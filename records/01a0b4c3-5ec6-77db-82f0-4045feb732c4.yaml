context: |-
  Test-hygiene move 1 of 3 from the 2026-09-18 analysis (notes/decisions-2026-09-18-hall9k-fb.md). Origin: three clock-shaped gate failures in one week, the last being the InviteCommandsTests time bomb (#469): the test class fixed Now = 2026-09-15 12:00Z, seeded an invite expiring 72 hours later, and ProjectJoinCommand compared it against DateTimeOffset.UtcNow, so every gate on every branch failed from 08:00 EDT on 2026-09-18. TimeProvider is already used in 69 files under src/; this finishes the job. Land at a lull: the sweep touches many files and will conflict with any open chain branch, so it is held unassigned until the distributed-team chain (idea 202383dc) drains (Brian, 2026-09-18: distributed teams stay the priority). Smallest shape: mechanical substitution, no behavior change, no new abstractions beyond TimeProvider itself.
