objective: |-
  No product code path a test can reach reads the wall clock directly: every DateTimeOffset.UtcNow and DateTime.UtcNow in src/ goes through an injected TimeProvider, so a test's fixed clock can never collide with the real date again
criteria:
  - Every one of the 311 direct wall-clock reads in src/ (DateTimeOffset.UtcNow, DateTime.UtcNow, DateTimeOffset.Now, DateTime.Now) is replaced by a TimeProvider the type already receives or now receives through its constructor, with TimeProvider.System registered once at composition root; behavior is unchanged
  - Test fixtures that fix a clock (the static Now fields in InviteCommandsTests, MessageTransportTests, InviteDeciderTests, and every other test class with one) hand a FakeTimeProvider set to that same instant into the code under test, so the fixed date is the only clock the test ever sees
  - A guard test fails the build the moment a file under src/ names the real clock directly, with the one-line allowlist for the composition root, so the sweep cannot regress
  - dotnet build and dotnet test pass; the decision log carries one entry recording that product code reads time only through TimeProvider (Brian, 2026-09-18)
