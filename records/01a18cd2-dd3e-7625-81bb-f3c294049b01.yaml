context: |-
  Pre-flight events are classified project-scoped (`EventScopeRegistry.cs:409-416`) so that a fleet sibling reclaiming a task could read the verdict, but `PrReviewPreflightDispatched` was never added to `AggregateGenesisEventTypes.IsGenesis`, so every receiver has held them since v0.11.0 (`EventReplicationInbox.cs:1376`) and no node has ever read another node's verdict. The held-tail sweep then asks the fleet for a record it already has. Observed on one node on v0.14.0: 335 streams held in one team project, 4,155 asks, 12,994 declines, and about 1,000 fresh asks at each upgrade, because an upgrade clears every give-up (`EventCatchUpCoordinator.cs:500-522`).

  This change ratifies what has shipped. Classify the four events NodeScoped, the same shape as the courier's events (`EventScopeRegistry.cs:394-396`). The outbox, `EventCatchUpResponder` and `EventReplicationInbox.ApplyAsync` (`:799`) already act on that classification, so no new check is needed and the pre-flight gate in `RunLauncher` does not change. `TaskRequeued` and `PrReviewPreflightParked` stay on the task stream and keep travelling.

  Clear held pre-flight records at the top of `RequestHeldTailStreamsAsync`, ahead of the give-up reset, so the upgrade never mints the burst. `HeldReplicatedEventRecord` has no type column, so use one delete keyed on the event type inside `RecordJson` rather than reading full documents every sweep (commit 1e4c9a82c removed that cost). Nothing is lost: each origin keeps its own log and no reader needs a peer's copy.

  Remove what this leaves unreachable: the pre-flight branch in `ReplicationProjectResolver`, `ReplicationStreamFamily.PrReviewPreflight`, and its `FamilyOf` arm. Rewrite the comments that say verdicts travel or that nodes share a database (`EventScopeRegistry.cs:398-422`, `RunLauncher.cs:2235-2241`).

  During rollout a peer on v0.14.0 keeps sending these events; a fixed node refuses each with a warning at `:799` and holds nothing, which is expected. Tests fit the existing setup: `EventCatchUpTests` (`InMemoryMessageTransport`, `FakeLedger`) and `RunLauncherTests`. Describe this pull request as the behaviour change above.
