objective: |-
  A pull-request review pre-flight stays on the node that ran it: its events do not replicate, a node neither applies nor holds one from a peer, and the records already held leave the held table on their own with no catch-up traffic.
criteria:
  - A node that runs a pre-flight puts none of its dispatched, completed, abandoned or reclaimed events in its outbox, and a catch-up request for that stream is answered as nothing held here.
  - |-
    A pre-flight event of any of those four types delivered by a peer is neither applied nor held, on a node that has never seen the stream and on the node that dispatched it: that node's pre-flight document is unchanged and the held table gains no row.
  - On a build with this fix, the first sweep of a project removes every held pre-flight record and mints no catch-up ask for one, and `h9k status` no longer counts those streams as held or given up. A held record of any other event type is untouched, with its ask count and give-up mark intact.
  - A node claiming a pr-review task whose only verdict was reached on another node runs its own pre-flight before any checkout, for an ordinary review dispatch and for a mention follow-up.
  - A test fails if a `ReplicationStreamFamily` value has no stream-starting event named in `AggregateGenesisEventTypes` and is not on an explicit exemption list.
