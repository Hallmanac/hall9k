  ```
  Title: Add h9k plan, a daemon-driven path from draft to Published

  Work item: [#822](https://github.com/Hallmanac/hall9k/issues/822)

  This adds `h9k plan`, which hands one or more drafts of a project to the daemon on the node where you ran it. The daemon refines each draft in a headless session, has it challenged with the same request, session and verdict as `h9k task challenge`, applies what the verdict accepts, and publishes the drafts with the behavior of `h9k task publish --no-queue`. When it can't finish it parks and names the draft and the reason, and `h9k plan resume`, or publishing or abandoning the draft by hand, answers it.

  A plan isn't a run. It lives on a stream of its own, every one of its events is node-scoped so nothing about it leaves the node, and it creates no run, lease, branch, or worktree. It also holds no prose from a draft or a session, only ids, phases, rounds, and closed outcomes. What does travel is the task's own record: a refinement session's dispatch and outcome go on the task's stream the same way a challenge's do.

  A few things worth a look as you read:

  - The daemon never writes a task through a session. It runs the installed `h9k` as a child process for the revise that applies a session's revision and for each publish, because the file parser and the tracker and ledger work live in the CLI and the daemon doesn't reference it. That way the gate, the tracker item, and the ledger record happen exactly as they do by hand.
  - A revision is applied only if nobody else changed the draft after dispatch, and one that names a model is refused. The draft-changed check reads a new flag on the task that tracks a revision of anything the prompt carries, since the stream version moves for events that change nothing about the draft.
  - A plan's refinement sessions take no slot against the node's or the project's run ceiling, because a plan has no run or lease to count. A node runs one at a time on a loop of its own, and none starts while the launch hold stands, the spend budget is spent, or the project's max parallel tasks is 0.
  - The round cap of two is a daemon option with no node, project, or task setting, so only a resume or a new plan grants more.
  - `plan start` refuses a draft whose context still quotes an adopted item or says its idea's workspace holds a tracker item, since refinement would otherwise rewrite a stranger's words into the task's own context.

  If you want to try it, start a plan on a draft in a project that runs agents with skip-permissions, then `h9k plan show <plan>`. Does that cover what you were hoping to see here?
  ```
