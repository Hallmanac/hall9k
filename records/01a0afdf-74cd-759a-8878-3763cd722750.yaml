objective: The designer persona's review reads a pull request for user experience, conformance to the proposed design, motion, CSS practice, accessibility, look and feel, and the design system, drives the running product through browser automation when the project's design-review-drive setting is on (the default), and ends with the offer to run the branch locally for the reviewer
criteria:
  - The persona registry gains designer, mapped to a design review prompt shipped as its own template directory under .claude/templates with the review-lap fragment layout, loaded through PromptTemplates and golden-tested; with the project's design-review-drive setting on (default on; h9k project set --design-review-drive on|off, printed by project show, sharing piece 2's mechanism) and a run skill on the ledger, the session launches the product on the worktree on an ephemeral port it reports and tears down, drives the changed user-facing flows through browser automation, and the report cites each screenshot beside the finding it supports in a Driven section; with the setting off or no run skill, the review is code-and-design-file only and the report says so
  - |-
    The report has one section per lens in a fixed order: user experience, conformance to the proposed design, motion (transitions and animations), CSS practice, accessibility, look and feel, design system; a lens that does not apply to the change says so in one line rather than being omitted
  - The proposed design is a Figma link, an image set, or a prototype named on the linked task or issue or in the pull request body; when none is named the conformance lens reports 'no reference supplied' as its finding and judges nothing against imagination
  - The session looks for a design system in the repository (tokens, a component library, a documented system) and names what it found or that there is none; design-system findings cite the token or component they concern
  - When the session drives the product, the accessibility lens runs an automated audit on each walked screen and reports its results beside its own judgment; when it does not drive, the lens reads the markup and marks its findings static
  - The report ends with the offer to run the branch locally so the reviewer can walk it in person, present whenever the project has a run skill on the ledger, whether or not the session drove the product itself; the offer is a question in the report, never an action
  - |-
    Tests: the registry maps designer to the prompt; the prompt is golden-tested; a fake diff with no user-facing change yields not-applicable lenses; no reference yields the conformance finding; the setting off yields a static report; the setting on with a run skill yields the Driven section and screenshots; the offer is present with a run skill and absent without
  - dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each, the log recording the two drive settings and their defaults (qa off, design on; Brian, 2026-09-17)
