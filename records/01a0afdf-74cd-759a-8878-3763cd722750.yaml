context: |-
  Review personas: extend the pr-review task into QA review and design review, chosen by the assignee's declared persona(s). Today anyone assigned a pull request gets the engineer's PR review (code, logic, functionality). A QA persona gets a QA review: compliance and functionality through the lens of blast radius (what changed, what adjacent behavior to regression-test, what new automated end-to-end tests are owed), mostly by running the end-to-end suite locally, with the ability to launch the application locally to confirm as needed. A designer persona gets a design review: user experience, conformance to the proposed design (Figma or a working prototype), transitions and animations, CSS best practice, accessibility, look and feel, and compliance with the project's design system if one exists, again with the ability to launch the product locally and use the feature. A team member declares zero, one, or several personas (engineer, QA, designer); no persona means the plain PR review; several personas mean every matching review runs on that assignment. All reviews for one pull request share the one worktree and branch the pr-review task already creates, but run separate agents with persona-specific prompts and criteria.

  Idea b9b09779 (review personas), piece 3 of 6: the design persona. Walked with Brian 2026-09-17 (criterion 1 singly, amended with the design-review-drive setting default on; 2 to 7 in a batch; the in-person offer made explicit at his ask). Stacked on piece 1 ec35ceca beside piece 2 b1b20c23. Rulings in the idea's workspace/journal.md. Code seams: the persona registry, the QA piece's drive mechanism and run-skill precondition, browser automation available to sessions (Chrome tooling), PromptTemplates. Published unassigned on Brian's word.

