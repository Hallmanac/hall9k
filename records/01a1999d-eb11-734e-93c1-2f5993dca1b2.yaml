objective: Repeated feed courier failures back off and are visible, instead of quietly spending the day's spawn cap
criteria:
  - |-
    After n consecutive failed couriers for a project, the wait before the next one is min(base x 2^(n-1), ceiling): base is the project's courier max wait but never less than 60 seconds, and the ceiling is a new daemon option beside CourierDaySpawnCap, defaulting to 30 minutes and never less than base. At the defaults the waits are 1, 2, 4, 8, 16, then 30 minutes, so a project that never delivers spends about 50 couriers a day rather than the 500 cap. A courier max wait of 0 no longer lets a failing project respawn on every ten-second sweep tick. Every failure counts, whatever its reason
  - The failure streak resets to zero on a delivered courier, and on an orchestrator registration for the project whose LaunchedAt is newer than the streak's last failure. A register from the same pid with the same session name and CLI appends nothing (OrchestratorPresenceDecider's AlreadyRegistered) and does not reset it; a register that changes the session name or CLI, a new window, or a --replace appends a new launch and does reset it, because the delivery address changed
  - A courier the daemon itself ended (stopped at shutdown, or adopted as stranded after a crash) neither counts toward the streak nor resets it, but it does rewrite the streak's next-attempt time to its own completion time plus the current step (base when the streak is zero) and changes nothing else, so the gate never spawns at once after one
  - The first time the sweep ticks a project after the daemon starts, the streak's next-attempt time is pulled in to no later than that tick plus base, with the count unchanged. A restart that fixed the cause is confirmed within about a minute, and a crash loop still gets at most one courier per restart
  - |-
    An urgent feed item no failed courier in the current streak has carried (its feed sequence is above the highest sequence the streak's couriers carried) gets one early attempt at any step of the backoff, once at least base has passed since the project's last courier completed. That attempt does not reset the doubling: if it fails, the next wait is the next step up, and the item gets no second bypass. A burst of urgent items spawns at most one courier per base interval. With no streak running, urgent items bypass the wait exactly as today
  - The streak is a per-project document in the daemon's database, in the CourierDaySpawnCounter idiom, written by CourierEngine.RecordOutcomeAsync in the same session as the run's completion, and deleted by ProjectPurgeEngine beside CourierDaySpawnCounter. It holds the count, when the streak started, when the last failure was, the last failure reason, the highest feed sequence carried, and the earliest time the next courier may spawn, so a daemon restart or h9k update --restart does not lose it and the CLI never needs the daemon's options to describe it
  - |-
    While a streak is running and the project's presence is registered, its courier line on h9k status reads, for example: courier: failing, 14 in a row since 20:01, next try in 12m, last: hall9k-9f is not reachable. Once the next-attempt time has passed it says next try at the next sweep, never a zero or negative duration. The reason is the text after COURIER-OUTCOME: failed - when the session gave one, otherwise one of: no reason given; timed out after 3m; ended without an outcome line; daemon error: <exception message>. It has newlines collapsed to spaces and is truncated to 120 characters with an ellipsis; the run's own Outcome field is unchanged. When the states overlap, in flight wins, then day cap spent, then failing, and the winner appends the streak count (for example: in flight (dispatched 20s ago), 14 failed in a row)
  - While a project's day cap has held back a courier today (CourierDaySpawnCounter.CapHitLogged for today's UTC date), its courier line on h9k status says the day cap is spent and gives the local time the day rolls (00:00 UTC); h9k doctor reports the same until then
  - h9k doctor gains a courier section, run after the database check passes and skipped under --no-configure like the release check, listing every project with an orchestrator window registered on this node. It warns on a failure streak of 5 or more in a row (with the status line's reason), on a spent day cap, or on a feed item left undrained for more than an hour while the project's window is live and was registered at least an hour ago; a project already warned for its streak is not warned again for the undrained hour. The feed read passes CliVersion.Current, as h9k orchestrator feed does. A healthy or quiet project gets one ok line; with no registered window the section says so in one line
  - docs/concepts.md (The feed courier), docs/cli.md (the courier part of h9k status, h9k doctor), and docs/operations.md's courier option table describe the backoff, its resets, the restart pull-in, the urgent early attempt, and the new status and doctor lines. The table gains the ceiling option with its default and that it is set by environment or config file, not h9k config set, and the day cap row says it is now the last-resort guard behind the backoff
  - |-
    Tests cover: the backoff sequence at the defaults, at a courier max wait of 0, and at one above 30 minutes; each reset path, including that an unchanged same-pid register does not reset and a renamed one does; a shutdown-ended courier followed at once by a tick not spawning; the restart pull-in; the urgent early attempt, that the item gets no second bypass, and that two urgent items ten seconds apart during a streak spawn one courier; the two existing failure guards surviving in the new shape (an urgent item already carried by a failed courier waits, and a failed project never rides the quiet ramp to zero); the streak surviving a fresh CourierEngine over the same store; purge deleting the streak; the reason extraction for each failure shape including truncation; and the status line's states and precedence and the doctor text
