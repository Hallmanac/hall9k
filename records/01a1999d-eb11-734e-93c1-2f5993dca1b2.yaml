context: |-
  Why: idea 6f838a3b (`ideas/6f838a3b-*/workspace/journal.md`). On this Windows node every courier failed for days because the daemon and the windows ran at different elevation, and each project respawned one about every minute until its 500-a-day cap was spent around 05:45 local, at roughly 0.09 USD each, with nothing visible beyond "never delivered". That cause was fixed by hand on 2026-11-01 (daemon raised to elevated, then restarted; the first delivery landed a minute later) and is detected by the separate draft 956bd97e. This task is the general safety net for any cause of repeated failure, on every node. It builds first and depends on nothing.

  Where the code is today (origin/main at v0.16.0-78):
  - `src/Hall9k.Domain/Features/Courier/CourierGate.cs`: `Decide` takes a single `lastCourierFailed` bool; after a failure the wait is `maxWait` flat and the urgent bypass is off entirely. Its comments explain the two runaways those guards close (urgent respawn every tick, and the quiet ramp falling to zero), pinned today by `tests/Hall9k.Tests/Domain/CourierGateTests.cs`; both must stay closed. The streak replaces the bool as the gate's input.
  - `src/Hall9k.Daemon/Courier/CourierEngine.cs`: `TickAsync` derives `lastCourierFailed` from the newest `CourierRunDetails` and builds the deliverable set (`read.DrainableThroughSequence` is the sequence a courier carries). `RecordOutcomeAsync` is where every outcome is written. The stranded-run adoption in `TickAsync` (which already patches its local copy so the gate sees the completion) and `RecordShutdownOutcomeAsync` are the daemon-ended paths; the catch-all in `SpawnAsync` is the "daemon error" path.
  - `src/Hall9k.Daemon/Courier/CourierDeliveryOutcome.cs`: `Parse` keeps the whole session summary in `Outcome`; nothing extracts the reason after `CourierPromptBuilder.FailedMarkerPrefix` yet.
  - `src/Hall9k.Domain/Features/Courier/CourierDaySpawnCounter.cs`: the per-project local document idiom the streak follows, and `CapHitLogged`. `src/Hall9k.Daemon/Purge/ProjectPurgeEngine.cs` deletes that idiom's documents by hand.
  - `src/Hall9k.Daemon/DaemonOptions.cs`: `CourierSweepPollInterval` 10 s, `CourierDaySpawnCap` 500, `CourierTimeout` 3 min. `ProjectAggregate.DefaultCourierMaxWaitSeconds` is 60, and `ProjectDecider` allows 0.
  - `src/Hall9k.Domain/Features/Orchestrator/OrchestratorPresenceDetails.cs` (`LaunchedAt`) and `OrchestratorPresenceDecider.Register` (the same-pid branch).
  - `src/Hall9k.Domain/Features/Orchestrator/OrchestratorFeedItem.cs`: `Sequence`, `At`, `IsUrgent`.
  - `src/Hall9k.Cli/Orchestrator/CourierStatusLine.cs` and `StatusCommand.WriteOrchestratorLineAsync`, which lists every presence on this node, registered or not. `h9k orchestrator status` prints no courier line today, and this task does not add one.
  - `src/Hall9k.Cli/Commands/DoctorCommand.cs` and `src/Hall9k.Cli/Diagnostics/*Doctor.cs`: add a `CourierDoctor` in that pattern, after `DatabaseDoctor`. `h9k update --restart` and `h9k install --restart` run doctor with `--no-configure` while the daemon is stopped. The feed read is `OrchestratorFeedReader.ReadUndrainedAsync`, as `OrchestratorFeedCommand` calls it.

  956bd97e later adds a "blocked by elevation" gate decision and status text in the same files. Keep the status line's states (in flight, day cap spent, failing) as separate branches of one composer, so a further state lands as one more branch.
