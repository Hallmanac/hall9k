objective: A session's own gate checklist names each scoped gate's path set, so an agent does not run a gate its branch's diff cannot reach
criteria:
  - |-
    At each site that lists a project's gates for the session itself to run (the build's recompose checklist and the delegated contractor's two gate lists, all through WorkPromptBuilder.AppendGateLines; the rebase-family verification checklist and the review-fix self-check, both through AgentPromptBuilder.AppendGateLine), an ordinary gate that has a path set (VerifyCommand.IsPathScoped) prints its command, then that path set as configured, then one rule: run it only when this branch's changes against its base, committed or not, touch a path the set matches, where a ! entry excludes and wins over any other entry; when unsure whether a path matches, run it; otherwise leave it to the daemon's own verification. The new wording lives in .claude/templates fragments, not in C# strings.
  - A host-coupled gate prints exactly today's line whether or not it has a path set. An ordinary gate with no path set or an empty one, every unaccepted-gate-set line, the platform-settings reminder's timeout list, the QA review's checks section (QaReviewPromptBuilder), and the review lens's list of gates that already passed (AgentPromptBuilder.AppendReviewGateStatus) print exactly today's text even when a gate has a path set. Every existing prompt golden file under tests/Hall9k.Tests/Fixtures/PromptGoldens passes unchanged.
  - Unit tests over the composed prompts show, at each of the five run sites named in the first criterion, that a scoped ordinary gate prints its path set and the rule, that an unscoped gate's line is unchanged, and that a gate both host-coupled and scoped prints the host-coupled line alone; and they show the review lens's passed-gates list and the QA review's checks section each printing a scoped gate without its path set or the rule. No new test creates a branch or a commit, starts a container, or touches git.
