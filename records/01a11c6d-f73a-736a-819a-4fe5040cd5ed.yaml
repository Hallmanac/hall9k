context: |-
  Let a verify gate be scoped to a path set, so a diff confined to one part of a split repo (arx-platform's customer-portal React app) runs only the gates that can observe it, instead of every gate on every lap (TaylorDenny, arx#2218: about 30 minutes of .NET gates for a one-line .ts doc comment). This task carries that path set into the gate lists a session's own prompt tells it to run, so the agent also skips its own in-session MSBuild on a front-end lap.

  Stacked on d6c9e897, which adds VerifyCommand's optional path set and the daemon's run-or-skip decision. The daemon's own verification stays the authority: an agent that misreads the rule and runs a gate anyway only spends time, and one that skips wrongly is still caught by the daemon's gate. The rule deliberately judges this branch's changes against its base branch, committed or not, rather than against the stacked fork point and without dropping non-executable paths the way the daemon does. That set is a superset of the daemon's, and the rule tells an agent unsure of a glob to run the gate, so an agent following it runs a gate at least as often as the daemon would; the one exception is a confident misreading of a glob, which the daemon's own gate still catches. "Committed or not" matters at the review-fix self-check, whose own fixes are still uncommitted when it runs its tests. The rule's fragment also carries a one-line glob legend: a glob ending in / matches everything under that directory from the repository root; one with no / matches a file name at any depth; otherwise ** crosses directories and * does not. Discovery: notes/taylor-observations-2026-10-08/discovery-8cc3396d/summary.md in the project home. Origin: transport message b21c6dce item 1.

  Pointers on main (verified at 5fa78e34b):
  - src/Hall9k.Connectors/Prompts/WorkPromptBuilder.cs: AppendGateLines (about line 905), called by the recompose checklist (about line 837) and the delegated contractor's two gate lists (about lines 1185 and 1198). Its fragments are .claude/templates/work-prompt-builder/gate-line.md (line, host-coupled-line, unaccepted). AppendPlatformSettingsReminderRule (about line 1488) builds the timeout list, which stays as it is.
  - src/Hall9k.Daemon/Execution/AgentPromptBuilder.cs: AppendGateLine (about line 1308) is the one shared helper with three callers: AppendRebaseVerificationRule (about line 1275, fragments in .claude/templates/agent-prompt-builder/rebase.md), AppendReviewFixSelfCheckPhaseRules (about line 4234, review-fix-self-check.md), and AppendReviewGateStatus (about line 3644, review-gate-status.md). The first two are run lists. The third tells a review lens which gates "already ran and passed", so a run rule there would be wrong: the passed-gates caller must not get the rule (how the run callers get it is the builder's choice). AppendGateLine's existing two lines are inline C# strings, not template fragments; leave them inline and byte-identical, and put only the new scope wording in a fragment.
  - src/Hall9k.Daemon/Execution/QaReviewPromptBuilder.cs stays as it is: AppendGateLine (about line 265), called from the checks section (about line 216); fragments tests-gate-line and tests-gate-host-coupled-line in .claude/templates/qa-review-prompt-builder/checks.md.
  - Goldens that pin today's lines: tests/Hall9k.Tests/Connectors/WorkPromptBuilderGoldenTests.cs, tests/Hall9k.Tests/Daemon/AgentPromptBuilderGoldenTests.cs (build-rebase, build-rebase-host-coupled, build-review-fix, build-review-fix-host-coupled, build-review-adversarial among others), and tests/Hall9k.Tests/Daemon/QaReviewPromptTests.cs (qa-review-driving, qa-review-no-drive), all under tests/Hall9k.Tests/Fixtures/PromptGoldens. The unit tests in AgentPromptBuilderTests, WorkPromptBuilderTests, and QaReviewPromptTests are the places for the new cases.

  Why a host-coupled gate's line ignores its path set: the session never runs that gate itself, and its one exception, a single touched test class scoped by name, already cannot fire on a diff that touches no test class.

  Out of scope: the generated project-home AGENTS.md "Build / test / run" list (ProjectAgentsDocument.cs about line 350), the QA session's settings allowlist (ClaudeSettingsFile.cs about line 440), telling a review lens which gates a pass skipped by path scope (the prompt builder reads configuration, not the last pass's results), local h9k task verify parity, the QA review's checks section, where the gates are a starting point for an end-to-end run the session scopes to its own map, the daemon has already verified, and a path-skipped gate has no honest end-to-end marker (park), the review lens's gates-already-answer-criterion fragment going stale for a path-skipped gate (park, with the passed-gates staleness), and anything d6c9e897 owns. Line numbers above drifted since 5fa78e34b; re-find them on the branch.
