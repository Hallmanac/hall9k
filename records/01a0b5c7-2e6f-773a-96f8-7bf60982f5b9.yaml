context: |-
  Platform defect captured under the dogfood rule. Evidence, 2026-09-18: a DNS failure on this Mac from 13:03 to about 13:25 made every git call fail with "Could not resolve host: github.com". The network recovered at 13:25 (git from a shell resolved github.com at 13:26 and six of six times at 14:2x for both bare repos; dig answered 140.82.114.3 through 8.8.8.8), but the daemon (pid 12449, started 08:23, build 0.9.1-422, no proxy variables in its environment, the same /opt/homebrew/bin/git) kept failing every call until it was stopped and started at 14:26:56, after which the first tick succeeded. Between 13:25 and 14:26 the log carried 271 warn lines in the 13:00 hour and 101 in the 14:00 hour, all "Could not resolve host", from the trust chain reader, the prompt-addenda materializer, the ledger fetch, and the holder release, and nothing at error level; the board showed nothing. While it lasted no ledger claim could land (claims fail closed), no push or message flush could happen, and 609bd344's final pass ran without a fresh origin/main at 13:53. The mechanism by which the process state went stale is not known; the fix asked for here is detection, visibility, and a named lever, since the recovery itself is one restart. Published unassigned in the fixes lane behind the distributed-team chain (Brian, 2026-09-18).
