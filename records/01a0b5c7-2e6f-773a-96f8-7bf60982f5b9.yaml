objective: A daemon whose every GitHub call has failed for ten minutes says so once at error level and on the board, and recovers on its own when a fresh process can resolve the host, instead of warning every tick for an hour while claims, pushes, and messages silently stop
criteria:
  - The daemon keeps one node-wide count of consecutive failed origin operations (ledger fetch, ls-remote, push, gh) and the time of the last success; when the count has been rising for ten minutes it logs one error-level line naming the host, the first failure time, and the count, and h9k status prints a matching needs-you line until the next success clears it
  - Before declaring the outage the daemon probes the host from a freshly spawned git process with a clean environment; if that probe succeeds while the daemon's own operations keep failing, the error line says the fault is the daemon's own process state and names h9k daemon stop and start as the lever, so an operator or an orchestrator does not have to diagnose it by hand
  - |-
    Per-tick warnings for the same outage are collapsed: one line at onset, one when the count crosses each of 10, 100, and 1000, and one line at recovery giving the total duration and count
  - |-
    Tests through the existing fakes: ten minutes of failures raises the error and the status line; a successful probe beside failing operations produces the process-state wording; recovery clears the status line and logs once
  - dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each
