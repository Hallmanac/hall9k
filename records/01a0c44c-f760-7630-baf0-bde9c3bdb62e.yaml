objective: |-
  A stream this node holds only the tail of completes on its own: a held tail with no genesis mints its own bounded stream ask at the sweep, and every decline is recorded by node and time and shown on the status line, so no human has to run h9k task pull for work the fleet already holds
criteria:
  - |-
    Decline bookkeeping: an events-unavailable answer to a broadcast request is recorded on the EventCatchUpRequest as a list of (declining node id, time, reason), not only the last DeclinedReason string kept today; the request still closes on the decline exactly as main does since v0.10.5 (EventCatchUpInbox.ReadFromAsync, the Candidates.Count 0 arm, about lines 131 to 153); h9k status lists a request closed by decline within the last 24 hours as declined by <node> at <time>, beside the outstanding ones it lists today
  - |-
    Held-tail ask: at each sweep, for each stream that has HeldReplicatedEventRecords older than one sweep interval and no local stream, the coordinator mints one broadcast stream request, deduplicated against an outstanding one, at most ten new asks per sweep, with a cooldown after a decline or after an answer that landed without the genesis (the same shape as RequestGapFillAsync's reMintCooldown) and a stop after three attempts recorded on the held records; h9k status shows N streams held tail-only and M given up, so a held tail completes without a human and a bootstrap that briefly holds hundreds of records never mints hundreds of asks. Evidence: this node holds 42 held records over 14 Mac-origin run streams (origin sequences 7009 to 21085) since the 12:35 EDT --since all pull, tails served without their RunDispatched
  - |-
    Unit tests cover: the decline list and the status wording; the held-tail ask dedupe, per-sweep cap, cooldown, and stop; a bootstrap in progress whose held records replay within the same read mints no ask. No test creates branches or touches GitHub or a repository
  - dotnet build and dotnet test pass; the decision log carries one entry under this task placeholder
