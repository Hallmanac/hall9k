  ```
  Title: Explain a refused autostart enable over an elevated logon task

  Work item: [#855](https://github.com/Hallmanac/hall9k/issues/855)

  When `h9k daemon autostart enable` fails at `schtasks /Create` while the existing logon task runs at Highest and the shell is not elevated, the refusal now adds one sentence: changing the task needs an elevated shell, and `enable --run-level limited` from one lowers it. The condition comes from the task's run level and the shell's elevation, not from the localized `schtasks` text, and the level is read on this path even when `--run-level` was given. Every other `schtasks` failure keeps its current wording.

  To make the failure path testable off Windows, the `schtasks /Create` step moved into its own method behind an optional runner passed to the internal constructor. `docs/INSTALL.md` gets a short note on the new sentence.
  ```
