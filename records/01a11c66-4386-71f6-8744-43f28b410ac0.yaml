objective: A review lap running behind the push guard can read every inline review thread on the pull request it is reviewing, through a read-only h9k command, and its briefing names that command instead of sending it to reads that do not return threads
criteria:
  - A new command, h9k pr threads <number-or-url>, registered under h9k pr and taking the pull request and --project the same way h9k pr review does, reads the pull request's review threads through GitHubReviewThreads.ReadAsync under the project's own GitHub account, as h9k pr review's reads do, and prints every review thread that read returns. For each thread it prints the location as path:line, whether the thread is resolved, and who opened it, then every comment it read, verbatim, with its author's login; a thread or comment whose author GitHub did not report is labelled as having no reported author rather than attributed to anyone. Text from the pull request passes through ExternalText.ForTerminal before it is printed, and when stdout is not a terminal, as it never is for an agent session, no comment's own lines are rewrapped and square brackets in a comment print as themselves. The command writes nothing to GitHub and appends nothing to the task store.
  - The command's output never presents a capped read as complete. When the thread page was capped (ReviewConversation.ThreadsTruncated), it says the pull request carries more review threads than the 100 one read returns and that the rest are not shown. When a thread's comments were capped (ReviewThread.UnreadCommentCount above zero), it says, on that thread, how many of its newest comments are not shown. A pull request with no review threads prints a sentence saying it has none.
  - |-
    h9k pr threads is classified ReadOnly in DispatchedSessionCommandClassification, and docs/cli.md and the hall9k-cli-reference skill list it beside h9k pr review. The push guard needs no change for it: ReviewLapDeniedTools, ReviewLapGuardFile, and every other list in ClaudeSettingsFile are unchanged, so gh api stays denied exactly as it is today.
  - The review lap briefing, ordinary and scoped, names the exact command that reads inline review threads, h9k pr threads with this pull request's owner/repo#number and --project with the lap's own project, and says gh pr view and gh pr diff do not return them. The scoped lap's two cap notices (a capped thread page, and a thread with comments past the cap) no longer send the session to gh pr view --comments or to reading the thread on GitHub; they say the overflow is past what any read in the lap returns and that the reviewer can read it on the pull request's page.
  - Tests cover the command and the briefing without running gh or git. A unit test renders the command's output from a fixture conversation (a fake process runner or a ReviewConversation value) holding a resolved thread, an unresolved thread, a thread and a comment with no reported author, a capped thread page, a thread with unread comments, and a comment longer than 80 columns that contains line breaks and square brackets. It checks each is printed as the first two criteria state, and that the long comment comes out unchanged on the path a non-terminal stdout takes. DispatchedSessionTreeTests passes with the new command classified. The review lap prompt goldens show the h9k pr threads line, with --project, in an ordinary and a scoped briefing, and the two reworded cap notices.
