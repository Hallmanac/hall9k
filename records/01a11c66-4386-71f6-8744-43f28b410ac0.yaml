context: |-
  Origin: TaylorDenny, arx-platform#2201, 2026-10-06 (transport note 5b401477, item 2; item 1 is draft 18bac64a). Inside a review lap's worktree the push guard denies gh api wholesale, which is right as a write gate, but gh pr view and gh pr diff do not return inline review comments, so the lap had no route to the threads it was asked to rule on. It said so and fell back to the owner's review body, which happened to restate every open point. Verified on hall9k #336 (2026-10-08): gh pr view --comments prints Copilot's review summary but none of the 16 inline comments' text.

  Which session this is. The failure is the attended review lap that h9k pr review hands to the reviewer (PullRequestReviewCommand.cs WriteLapSettingsAsync at line 1380 and PrintHandoff at line 1394). Its guard is deny-only: ClaudeSettingsFile.BuildForReviewLap (line 200) and ReviewLapGuardFile.Content (ReviewLapGuardFile.cs line 73) carry ReviewLapDeniedTools (ClaudeSettingsFile.cs line 305, gh api at line 332) and no allow list, so an h9k command is not refused there and needs no settings change. The headless pr-review sessions (BuildForPrReview, PrReviewAllowedTools at line 495, defaultMode dontAsk) are a different session, which Taylor did not report; they are not in this task.

  Where it lives (origin/main at 5fa78e34b). The read: src/Hall9k.Connectors/WorkItems/GitHubReviewThreads.cs, ReadAsync at line 307 (one GraphQL call run as h9k's own child process, which the lap's Bash deny does not see), with ReviewThread.Location() at line 46, UnreadCommentCount at line 67, ReviewThreadComment.AuthorLogin null where GitHub reported no author (line 15), ThreadsTruncated on ReviewConversation (line 156), and the 100-thread and 100-comment caps at lines 249 and 258. The scoped lap already calls it that way at PullRequestReviewCommand.cs line 1117, from project.RepositoryPath. Registration: src/Hall9k.Cli/Infrastructure/CliCommandTree.cs, the pr branch at line 548. Classification: src/Hall9k.Cli/Infrastructure/DispatchedSessionCommandClassification.cs, the pr entries at lines 172 to 178. Terminal-safe printing: ExternalText.ForTerminal (src/Hall9k.Cli/Infrastructure/ExternalText.cs), as PrintHandoff uses it at line 1446. The briefing: .claude/templates/review-lap-prompt-builder/rules.md, the never-post-github fragment at line 11 (shared by ordinary and scoped laps, loaded by ReviewLapPromptBuilder.AppendRulesSection at line 641), which today ends "The reads (gh pr view, gh pr diff, gh pr checks, gh issue view) are all yours"; and since-my-review.md, the page-truncated fragment at line 13 (which points at gh pr view --comments) and the unread-comment-notice fragment at line 43 ("Read the thread on GitHub"). Docs: docs/cli.md, the Pull-request review section at line 384; the skill's review lap section around line 1614.

  Why the cap notices change rather than point at the new command: h9k pr threads reads through the same capped query, so it cannot show what the scoped packet could not. The reviewer's browser is the honest remaining route. Paginating past the caps is not in this task (trigger: a lap meets a pull request with more than 100 threads, or a thread with more than 100 comments).

  Not in this task: no allow entry in PrReviewAllowedTools, and no change to the deny list. The ClaudeSettingsFile doc lines saying every lap read goes through gh pr view and gh pr diff (lines 269 and 366) stay as written; they are doc comments only.

  Note to the orchestrator: with no ClaudeSettingsFile.cs edit, this task no longer shares a file with c4ee5f06. It does share since-my-review.md and the since-my-review goldens with 18bac64a (whose context already notes this, not stacked); whichever merges second rebases.

  Notes from the challenge pair (2026-10-08). Printing: MessageShowCommand.cs lines 78 to 86 writes through Console.Out from a pure Lines(...) function rather than through AnsiConsole, because Spectre rewraps at 80 columns whenever stdout is not a TTY and parses square brackets as markup; this command's only real reader is an agent's Bash call, which is never a TTY. PrintHandoff at line 1446 is the model for ExternalText.ForTerminal only, not for the writer. Account and project: h9k pr review reads gh through new ProjectScopedGitHubRunner(store).Runner (PullRequestReviewCommand.cs line 102), which pins gh to the project's own account; its project resolution is the private ResolveProjectAsync at line 243, which the new command needs to share rather than copy, and it refuses on a multi-project node without --project, which is why the briefing line carries --project. It must not copy RunAsync's NodeBootstrap.EnsureAsync (line 136) or anything else that writes. Locations: ClaudeSettingsFile.cs and ReviewLapGuardFile.cs are in src/Hall9k.Connectors/Prompts/; the skill is .claude/skills/hall9k-cli-reference/SKILL.md (review lap section at about line 1613). The never-post-github fragment is loaded with PromptTemplates.Load today (ReviewLapPromptBuilder.cs line 650) and needs Fragment(...) with tokens to name the pull request and project, the way page-truncated is rendered at lines 439 to 441. All five review-lap goldens change because rules.md is shared; only the since-my-review ones overlap with 18bac64a.
