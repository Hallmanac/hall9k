  ```
  Title: feat: promote a merged task's best note to a lesson at closeout

  Work item: [#827](https://github.com/Hallmanac/hall9k/issues/827)

  When the daemon observes the merge that closes a task out and the task holds a note this node may put in a prompt, a small background session now decides whether one of those notes is worth keeping beyond the task. It starts after closeout has committed, released the dependents and told the card, and closeout never waits on it, so the worktree and branch go away exactly as they do for a task with no notes.

  The session gets one turn, no tools and no project settings, and runs in its own directory under the platform home so the render sweep moving the task into `tasks/_archive/` can't touch its stream. It runs on the courier's model and effort. The default for every note is drop, at most one claim of 800 characters is kept (a longer one is dropped, never cut), and the lesson and the record land in one transaction. The lesson is live at once, so a person retires a bad one with `h9k learn retire`.

  - `LearningRecorded` gains a nullable `PromotedFromNote`, a sibling of `DistilledFrom` rather than a reuse of it, and `LearningDecider.RecordPromoted` refuses an empty note id, a provenance without a run and task, and a blank claim. Older streams replay unchanged.
  - `NotePromotionRecorded` is a project-scoped, conditional event on the task's stream that holds only ids, counts and closed vocabularies. `h9k task show` prints the outcome and counts, `h9k learn show` prints the cited note's id and its task's id, and `h9k task notes` and `notes.md` label each note as kept, dropped with its reason, held, or undecided.
  - A failed step promotes nothing, is recorded with its reason, and is not retried. A daemon that stops or is killed mid-step records nothing, and the notes read as undecided. `NotePromotionTimeout` (60 seconds) bounds the session.

  One thing to look at: a promoted lesson is a rewritten claim that reaches later prompts like any other lesson, including review prompts. That is the one way a note's substance can reach a reviewer, and the docs say so plainly.

  Summary of what I did:

  - **Verification:**
    - The gate command passed (10,068 tests).
    - Under the single-class rule I also ran `CloseoutEngineTests` (175 passed) and my new integration class (20 passed) against Docker.
    - I did not run the daemon's full host gate.
  - **Self-review:**
    - Round one found one real defect: a stale merge observed first could have used up the step the current run was owed. The dedupe is now taken only once a session is about to start, and a `Start` after `Dispose` no longer throws.
    - Round two, on that fix only, found nothing.
    - I did not run a real `claude` session, because that costs money and the brief already records one. The answer protocol is covered by the fake-executor tests instead.
  - **Assumptions:**
    - Pr-review tasks stand down as well as spikes, matching the notes feed.
    - A held-only task records nothing, per the criteria.
    - A task override of effort isn't tested, because `TaskDecider.Add` has no effort parameter; model override is.
    - Docs say "NONE alone" is the only form of that answer, so `NONE` beside a `KEEP` line is unusable.
  - **Open question:** none that blocks.
  ```
