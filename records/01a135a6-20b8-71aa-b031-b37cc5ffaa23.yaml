objective: Each node's daemon checks for a newer hall9k release every six hours by default and tells its person through the orchestrator feed, h9k status, and h9k doctor, on a once-a-day reminder cadence, never updating anything itself
criteria:
  - A new daemon background loop runs the shared release lookup about one minute after the node identity is ready, then once per interval. The interval is a durable per-node setting, h9k config set --release-check-interval-hours <n> (whole hours, minimum 1, default 6), shown by h9k config show, read fresh from the config file at each tick the way release-channel is (OperatingSettings), and listed among ConfigSetCommand's immediate-effect settings so it needs no daemon restart.
  - |-
    When a check finds a release newer than DaemonVersion.Current (by BuildVersionOrdering.IsOlderThan), the daemon decides whether to notify: it notifies when that release differs from the last one it notified about, or when the node is still behind and at least 24 hours have passed since its last notice (so a reminder lands on the first check past 24 hours). A newer release resets the clock and is notified at the next check regardless of the 24 hours. Once the node runs the newest release, nothing more is notified. Each notice (first or reminder) appends one node-scoped event to the node's own stream carrying the tag, its published time, the observation time, the running version, and whether it is a reminder; NodeDetails carries the last notified tag and when. A restart neither repeats a notice nor resets the clock.
  - The new event is NodeScoped in EventScopeRegistry and never replicates to another node.
  - |-
    A failed lookup (gh missing, signed out, failing, timed out, or unparseable output, or an unsupported platform) appends nothing and pages nobody. It logs one warning per failure episode, not one per check, and the episode resets after a success. The two non-failure outcomes, NotYetComplete (a release still uploading its assets) and NoRelease, are 'nothing new this check': they append nothing and log no warning.
  - |-
    The orchestrator feed admits each notice event in the Actionable band (OrchestratorFeedInterest), not on the urgent list (OrchestratorFeedUrgency), for every project the node reads, scoped to the reading project by a new arm of OrchestratorFeedReader.ScopeOfAsync. A notice is admitted only while its tag is still newer than the reader's own running version, which the caller passes into the read on OrchestratorFeedViewer: the courier (CourierEngine) passes DaemonVersion.Current and h9k orchestrator feed passes CliVersion.Current, never the event's own recorded running version. The gate applies to both ReadUndrainedAsync and ReadSinceAsync, so a window that drains after the update, or a first drain over old history, is never told to install what it already runs.
  - |-
    OrchestratorFeedDescription renders a notice as one plain line naming the new version, the running version, and the update command, worded as information: 'hall9k 0.13.1 is available (this node runs 0.13.0); h9k update --restart installs it', and a reminder reads 'is still available'. The line carries no imperative verb addressed to the reader (no 'run', no 'you should').
  - h9k status prints one line near the launch-hold line, read from NodeDetails with no network call (finding this node the way LaunchHoldStatus.ReadAsync does), every time it runs while the recorded tag is newer than CliVersion.Current by BuildVersionOrdering.IsOlderThan (no daily limit on this line), and not otherwise. It names h9k update --restart when DaemonProcess.ProbeBootStatus reports anything but NotRunning (a Starting daemon counts as running), and plain h9k update when it reports NotRunning. The line is worded as information, like the feed line.
  - |-
    h9k doctor runs the lookup live and compares against CliVersion.Current by BuildVersionOrdering.IsOlderThan, reporting one of three results: current (NotYetComplete reads as current, with a note that the newer tag is still publishing); a newer release is available (naming h9k update --restart when a daemon is running on this node, plain h9k update when none is, because a stopped daemon is deliberate on some nodes); or could not check, with the reason (an unsupported platform included).
  - Nothing in this card runs h9k update, installs, or restarts anything; the daemon and every surface only inform.
  - |-
    Tests, with the lookup faked and nothing touching GitHub or git, cover: the interval setting's six-hour default, its floor, and that changing it changes the cadence (the loop takes a TimeProvider, so no real delay); the notice cadence as a pure decision function (first notice at the next check, reminder only on the first check past 24 hours while behind, a newer release resetting the clock, updating ending it, a simulated restart neither repeating nor resetting); the newer-than gate including a local git-describe build past the tag; NotYetComplete and NoRelease appending nothing and warning nothing; feed admission, its band, and its reader-version gate for both callers' versions; the scope arm, through a small pure function the new ScopeOfAsync arm calls before any session use, so it is unit-tested; the description's first and reminder wording and the absence of an imperative verb; the status line, composed through a pure function, showing and hiding and naming its two update commands; and doctor's three outcomes and two update commands. Everything is a unit test except where an existing Postgres test of the feed must be extended, which the PR names.
