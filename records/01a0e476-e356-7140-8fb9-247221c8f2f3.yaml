context: |-
  The second of two stacked pull requests split from b7d8222e on its challenge verdict (tasks/b7d8222e-*/journal.md, points 3 to 6), accepted by Brian 2026-09-27 under his standing instruction to go with the recommendations, and revised the same day on this task's own challenge verdict (tasks/21c8f2f3-*/journal.md). b7d8222e builds the label projection, the project-keyed resolver, and the feed, courier, and message surfaces; this task applies the same resolver to the remaining person-facing surfaces. Stacked on b7d8222e because every change here calls that task's resolver, which does not exist on main until it merges. Resolve other members through that resolver only; do not add a second lookup. This machine's own owner keeps the local OwnerDetails name it resolves to today, so the local-owner lookup stays; only its fallback for other members moves to the resolver.

  The surfaces, by grep at origin/main 9a2e67df1. Holder and assignee: PublishedFacts.cs:66-74 (the "held by node X (owner <who>)" fact) and OwnerDisplay at :84-94, TaskStatusComposer.cs:397-406, and h9k task show's AssigneeMarkupAsync (TaskShowCommand.cs:2560-2600), which resolve through a local OwnerDetails map (TaskStatusComposer.cs:182) that knows only this machine's owner. AssigneeMarkupAsync has two "known by fingerprint only" branches (:2596-2599): the no-local-record branch is the ordinary foreign case the label improves, and the mismatch branch is an owner-root-rewrite alarm that stays verbatim.

  Taken over and granted to: TaskShowCommand.cs:528-530 prints TakenOverByOwnerId as a short id, and :586-591 prints LastGrantedToOwnerId the same way. Both are local Owner Guids on TaskDetails (TaskDetails.cs:392 and :406), and Owner events never replicate, so neither resolves for another member. The facts that do resolve are on the events: TaskHolderTakenOver carries NewHolderNodeId and NewHolderOwnerRootFingerprint, and TaskHolderReleased carries GrantedToNodeId and GrantedToOwnerFingerprint. The build mirrors one of each pair onto TaskDetails (a new nullable field, so a row projected before the change falls back to the short id unless the build also backfills it) and resolves the label from that.

  Node-id lines: StatusCommand.cs:1007, :1009, :1051 (cooperative take, the first rows of the distributed-team table at operations.md:1462-1463); EventCatchUpPane.cs:61-62, :76, :101 (the ToNodeId arm at :62 is a fleet reconcile, always this owner's own node, so the own-owner rule leaves it unlabelled); TaskShowCommand.cs:515, :526, :552; TaskTakeCommand.cs:368, :747 (the tracker-identity warning naming the holder node), :761, :765, :877 (which prefers the local MachineName, so only its id fallback gains a label); TaskGrantCommand.cs:104; TaskRefuseCommand.cs:87; LearningShowCommand.cs:102. Every one of these has a project in hand (TaskDetails and TaskListItem via ProjectId, EventCatchUpRequest.ProjectId). Learnings are the exception: LearningDetails has Scope and ScopeId (LearningDetails.cs:24-26), not a ProjectId, so only a project-scoped learning resolves. The reconcile-peer line (StatusCommand.cs:695; operations.md:1468) only ever names a node of this owner's own fleet, so it gains nothing.

  Left alone. The ignored-sender lines (StatusCommand.cs:543 and :573; operations.md:1467) are alarms: an otherwise vouched sender whose envelope failed verification or carried a mismatched project key would print a real member's name beside traffic that likely came from someone forging that node, so they join the trust list. h9k project join's "already has an owner" line (ProjectJoinCommand.cs:818-822, ResolveOwnerDisplayAsync at :866-873) stays as it prints today: at join time the label projection does not yet hold the project, and the members ledger it reads there is deliberately unverified raw content (:836-845). Not person-facing: WorkPromptBuilder.cs:210, TaskDecider.cs:1604, AutoPrReviewEngine.cs:58. Trust-bearing: OwnerShowCommand.cs:46 and :100, StatusCommand.cs:337, :341, :543, :573, :784, ProjectMemberRemoveCommand.cs:57-141, NodeInviteCommand.cs:94, NodeVouchCommand.cs:154-156 and :178, NodeRevokeCommand.cs:146-148 and :164, TaskTakeCommand.cs:166, ProjectJoinCommand.cs:818-822, and ProjectMembersCommand's columns.

  Boundaries. A criterion never drives the lifecycle of another task (decision 13f11af2). Dispatched sessions must not run install, update, join, or reconcile against the live install. No em dashes in anything authored.
