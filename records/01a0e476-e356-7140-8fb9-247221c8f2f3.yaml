objective: h9k status, the task commands, h9k learning show, and the catch-up lines name another member with the same label the feed and messages use
criteria:
  - In h9k task status and h9k task show, the holder (the "(owner <who>)" slot of "held by node X (owner <who>)", whose node half gets no second label) and the assignee show the member's label (display name, else declared login, else short fingerprint) for a member other than this machine's owner, while this machine's owner keeps the local name shown today. h9k task show keeps the short fingerprint beside the label. h9k task show's "Taken over" line and its "Take granted ... to owner" line name the taking member and the granted member by label instead of a short local owner id; a task whose takeover or grant was projected before this change may keep today's short id. Tests cover a foreign assignee with a display name, one with neither a name nor a login, and a takeover by another member that shows that member's label.
  - The lines that name a node by id keep the id and append the owning member's label in parentheses, exactly as the feed does after b7d8222e. These are h9k status's cooperative-take lines in both directions and its catch-up lines (asking and declined by); h9k task show's handoff-note author, taken-over "from", and pending take request; h9k task take's output naming another node; h9k task grant's and h9k task refuse's output; the catch-up gap line; and h9k learning show's recorder for a learning scoped to a project. A node of this machine's own owner, a node the label projection does not know, and the recorder of a learning with any other scope show the id alone. h9k status's reconcile-peer line is unchanged. Tests cover one catch-up line with and without a known member and one cooperative-take status line naming this owner's own node.
  - Trust-bearing output prints exactly what it prints today, with no label substituted for or added to a fingerprint or node id. That covers h9k project members, h9k owner show, this node's own identity lines, the unverifiable-write line and the ignored-sender lines in h9k status, the unverified-writes block, h9k node vouch, h9k node revoke, h9k project member remove, the node-not-enrolled errors of h9k node invite, vouch, and revoke, h9k task take's ledger-override verdict, h9k project join's "already has an owner" line, and h9k task show's assignee warning for a declared owner id that resolves locally to someone whose root fingerprint does not match (the label replaces only the plain fallback for an owner this node has no local record of). The reviewer confirms none of these changes in the diff.
  - docs/operations.md's distributed-team table of status lines shows the appended label on the lines this task changes, with the ignored-sender row left as it reads today, and the sentence in docs/concepts.md's membership section that lists where the display name appears also names h9k status, the task commands, and h9k learning show. No doc test or grep guard is required.
