objective: |-
  No test in the suite can observe process-global state another test set: the container-gate wait notice never reaches a captured Console.Error, the tool doctor under test never reads the machine's real platform config or database, and every capture of console, environment, current directory, or config path is scoped per test, so the full suite passes with two gates running in parallel on a memory-bound machine
criteria:
  - The cross-process container-gate wait notice (Waiting on cross-process container gate ... max concurrent) is written through a channel a test cannot capture with Console.SetError (the xUnit diagnostic sink, ITestOutputHelper of the waiting fixture, or a dedicated trace source), never to the process-wide Console.Error
  - Every test that captures Console.Error or Console.Out does so through a scoped per-test writer other tests' output cannot enter; a helper in the test project replaces the raw Console.SetError and Console.SetOut pattern and TrackerAssignmentTests uses it; a sweep of the suite finds and converts every other raw use
  - The tool doctor takes its platform config path and database connection from an injected source the test controls; no code path under test falls back to the process environment or the user's home directory; ToolDoctorTests' unreachable-database and malformed-config cases run against that source and a test proves that with the real config present the doctor under test still reports the unreachable case
  - A sweep of the test project names every remaining process-wide mutation (Environment.SetEnvironmentVariable, Directory.SetCurrentDirectory, static caches, config path statics) and either scopes it per test or moves the test to a serial collection with the reason in a comment; the decision log entry lists what was found
  - |-
    A test proves the two original shapes: a simulated gate wait emitted while a capturing test runs leaves the capturing test's buffer empty; the doctor with the real config present still reports the unreachable case
  - The full suite passes run in parallel; the container cap of 4 is not changed (it is an OOM guard); dotnet build and dotnet test pass; the decision log carries one entry
