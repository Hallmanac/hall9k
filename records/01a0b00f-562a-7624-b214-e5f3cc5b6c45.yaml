context: |-
  Cut 2026-09-17 12:0x EDT in the hall9k project window on Brian's placement: build this on Windows so the Mac stays on the distributed-team chain, as one task for the pattern rather than two patches. It folds the Mac's two held drafts, which stay as evidence and are not to be published: e6349a90 (run 01a0ad80, 2026-09-17 03:25 EDT, TrackerAssignmentTests.Assign_records_what_the_tracker_showed_when_the_gate_passes(github) failed because its captured Console.Error held the harness's 'Waiting on cross-process container gate /tmp/hall9k-postgres-container-gate (127s elapsed, 4 max concurrent)' notice from another test while a second full gate ran in parallel; the same tip passed the suite alone) and 0abfedb7 (run 01a0af3c, 2026-09-17 11:15 EDT, ToolDoctorTests.An_unreachable_configured_database_reports_gh_as_unconfirmed_rather_than_silently_skipped failed because the doctor connected to the real local Postgres and printed live 'merged without Copilot review' rows despite the test's unreachable configuration; one failure of 6089). Both cost the chain a retry and a full gate. Related but different: Windows's own #453 (RunLauncherTests teardown of git-init'd temp roots, Windows-only); build this after #453 merges to avoid touching test support twice at once. Lineage: the container cap of 2026-09-08 and the doctor's config resolution; not a fix of a fix. Testing rule (Brian, 2026-09-13): no test touches the project's repository or any remote.
