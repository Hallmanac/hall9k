context: |-
  What kind of task this is. This is a research spike, not a build task: it ends with a findings
  document and no build or test gate, and the platform opens no pull request for it. Recording and
  retiring lessons with `h9k learn` is this spike's work and is not the code a research spike is told
  not to write, so do both freely. Name this task on every lesson you record by adding
  `--task 01a1d0e0-beeb-7790-a22a-8a310fe36d3d` to the `h9k learn` command: it is what credits the lesson to this run, and
  without it the lesson lands marked as recorded with no run named, which reads to the next session
  as though a person might have typed it. Put the account of the inventory inside the findings document's
  "What was observed" section: every lesson in the inventory below appears there as merged into a
  named new lesson, retired with its reason, left alone, or not reached, or the section says no merge
  was warranted.

  Why this task exists: every dispatched session on this project carries a bounded section of its
  active lessons, and the section has two caps (a lesson count and a character budget). Past those
  caps the oldest lessons stop reaching prompts at all. Retirement is the cheap control and it is
  already available to every run; distillation is the other one, and it is deliberately a task a
  human authors and publishes rather than something the daemon decides to do on its own judgment.
  Nothing in this platform distils automatically, and nothing should: merging two claims into one is
  a judgment about meaning, and a wrong merge is worse than two lessons that overlap.

  What "merge and cite only" rules out, concretely. You are not here to improve the wording of a
  lesson that stands on its own. You are not here to record what you think this project should have
  learned. You are not here to generalise three specific observations into one abstract principle
  that none of them actually established, which is the failure mode this instruction exists to
  prevent: the abstraction reads better, survives every review, and is not something anybody
  observed. If two lessons say the same thing in different words, merge them and cite both. If three
  lessons are three faces of one rule that all three genuinely support, merge them and cite all
  three. Otherwise leave them alone.

  How to read a lesson before you touch it. `h9k learn show <id>` gives you its provenance: which
  run and task recorded it, if any, which node it was recorded on, and whether it reaches prompts
  at all. Read "recorded with no run named" as exactly that and no further: a person typing at a
  shell records it, and so does an agent that skipped `--task`, and nothing on the record separates
  the two. A lesson recorded by an agent on another node is rendered in `lessons.md` and held
  out of prompts pending the security review in idea 7e403b80, so merging one INTO a lesson that
  does reach prompts
  would route its claim around that hold. Do not do that: treat a held-out lesson as read-only for
  this task, name it in your summary, and leave it.

  The live inventory is `h9k learn list --project hall9k`, which is what you should actually work
  from. The snapshot below was taken when this task was authored, so treat it as orientation rather
  than as the set: lessons can be recorded and retired between then and now.

  Snapshot taken 2026-11-12 17:49:12Z: 62 active in hall9k, newest first, the first 40 shown.

  - [c6b973d8] Integration test classes are not in the gate's filtered run; run touched ones by name.
  - [8b9da79a] The test project runs the CLI command tree in process and in parallel, so a test that sets an environment variable a command reads (even through EnvironmentVariableScope) changes what every concurrently running class's command sees. Give the command a flow-scoped AsyncLocal read instead, like PlanHandoffEnvironment.OverrideForTests or PlatformPaths.HomeOverrideForTests.
  - [126c498f] A host gate killed at the 30-minute timeout with no failing test is not proof of a hang: this suite's passing host runs took 20 to 22 minutes on 2026-11-12, so concurrent suites from other projects holding Postgres container permits can push it past the ceiling. Compare the run's earlier host durations in ~/.hall9k/h9kd.log and run the touched integration classes by name before changing code.
  - [c24dacdd] `PlanDecider.AfterRefinement` has an optional `draftType`. When it's null, a split parks as Question, so any new caller that wants splits offered must pass the draft's type.
  - [fc5e9fa3] A test server that answers 401 to a git call sends git to the owner's credential helper, which on this node can open a GUI prompt and hang the call for the full 120 second deadline. Local-server tests should refuse with 403 and no WWW-Authenticate header.
  - [d7d77c9f] A pr-review launch writes `review.diff` under the platform home when the project has no home, so any test class that dispatches a pr-review needs a `ScopedTestHome` field.
  - [27284efd] A test that launches a pr-review run through RunLauncher, for a project registered with no home, writes review.diff under PlatformPaths.Home/runs/<run-id>, which is the real ~/.hall9k unless the class opens a ScopedTestHome. RunLauncherTests, PrReviewTaskEngineTests and AutoPrReviewMentionEngineTests now do. Give any new class that dispatches a pr-review the same field, and check with find ~/.hall9k -name review.diff -newer <marker>.
  - [40cccbc6] Do not use `cat > file` in the Bash tool without a heredoc or stdin; it blocks on stdin.
  - [29e8ecb5] The leak test passes vacuously unless the launcher is first on PATH. To measure before and after by hand, run `dotnet test` with `PATH="/c/Program Files/Git/cmd:$PATH"`, from an elevated shell.
  - [f9641254] Every save that ends a feedback step must call `_holder.StageRelease(session, ...)` before `SaveChangesAsync`. That row is what gives the ledger holder back if the daemon stops before `ReleaseAsync` runs.
  - [803a3696] CourierFailureStreak with Count 0 is a deliberate state (a daemon-ended courier's hold); never treat a streak document's existence as failing, use CourierFailureStreak.IsRunning.
  - [f87fbeec] A new record under `Hall9k.Domain.Features` that is never appended to a stream must be added to the exemption list in `EventScopeRegistryTests`, or the full gate fails on "every event type has a scope classification".
  - [e96bfae2] `WindowsDaemonAutostart` has an internal constructor taking `IProcessElevation` and `IScheduledTaskInspector`; tests use fakes through it, and `ResolveRunLevelAsync` is the testable entry point for the level choice.
  - [13f88430] A replicated event is told apart from a locally appended one by the `ReplicationEventHeaders.OriginNodeId` header, which only the replication inbox sets. `EventOriginStampingListener` uses a different header key, so a local append never carries it.
  - [5df1f026] To seed a solution in a test, claim a root on `_me.OwnerId` with `OwnerRootClaimed`, register each project by events (`ProjectRegistered`, `ProjectKeyAssigned`, `MemberVouched`), then write the membership with `SolutionWriter.AppendAsync`. The plain `ProjectDetails` document the fixture stores has no project key, so `SolutionDecider.MemberOf` refuses it.
  - [259cd02f] A route reply that names the idea it filed must describe the idea in words, never cite its hall9k idea id: replies post under the owner's login, and the id (c993a734 in this run's thread reply) reads as a hall9k internal. Draft the reply body before running h9k pr reply and grep it for the id you just got back.
  - [1322a60c] When checking a claim against a real pr-review stream, search <project>/tasks/_archive/*/runs as well as tasks/*/runs: an archived task's streams move there, so 'not on this node' is false until both are searched. Word-wars task 030d9136's streams, cited as unavailable by two sessions of run a87bd65f, were in _archive and confirm git ls-files and git show denied under dontAsk on 2.1.296.
  - [9f379109] Do not assume Claude Code's built-in read-only git allowance applies in a Hall9k worktree: its bare-repo gate (isCurrentDirectoryBareGitRepo, read from the 2.1.316 binary) treats a .git file's gitdir target as plantable unless a path segment is exactly .git, and a dispatched worktree points at repo/<name>.git/worktrees/wt-*, so read-only git with no allow rule falls through to a prompt and dontAsk refuses it. Observed in production on 2.1.296: word-wars pr-review run 01a12858 had git ls-files, git ls-tree and git show all denied while git diff and git log, which had prefix rules, ran. Check a claim about what runs with no rule against a real pr-review stream.jsonl under the project's tasks/*/runs, not against a plain clone, where the .git segment makes the gate pass.
  - [b6508c3f] Deleting or retiring machinery leaves residue that neither the compiler nor the gate's failure list shows, so check by hand. (1) Removing a field from a persisted event can collapse an aggregate property whose only job was to distinguish that field's case into an exact duplicate of its sibling: deleting RunRebasedOntoBase.DecisionsLogRenumbered left RunAggregate.PreFinalPassRebaseAwaitingGateFromRealRebase set and cleared at precisely the same three sites as PreFinalPassRebaseAwaitingGate, so it had to go too and ReviewEngine.EligibleForSettlingGateRepair reads the one flag now; the build is silent about it, so diff the assignment sites by hand. (2) A test whose setup only the deleted lever could produce cannot be salvaged by swapping the seed, so check whether the scenario is still reachable at all: ReviewEngine's composition-none gate runs only when PreFinalPassRebaseAwaitingGate is raised, and once the renumbering-only no-op was deleted only a real rebase raises it, so every gate failure that arm can observe is repair-eligible by construction and the non-repair-eligible fail-hard test written for it asserted an unreachable outcome; reshape it to the arm's remaining reachable exit (the spent repair cap that parks) rather than weakening an assertion or deleting the coverage. (3) When a commit retires a contract, the tests that encoded it go stale two ways at once: the ones asserting the old outcome fail loudly, and the ones asserting a skip start passing on the new decline instead of on the skip they exist to prove, so grep every test sharing the retired contract's fixture, not just the names in the gate's failure list. (4) A task that deletes platform machinery must grep LegacyKnowledgeImportDecider.RetiredOnImport before it finishes: those strings are the supersede reasons the legacy import records into the decision store, they are rendered into decisions.md and read by every session, and the #162 entry asserted in present tense that the numbering guard still failed the build, which went false the moment the machinery was deleted, and two tests pin the wording, so the source string and both assertions move together.
  - [dae54da5] When a production gate starts keying off state that a test's seed never created, every seed path that exercises the gate must append the matching precondition, or existing tests start failing on the new check. Two observed cases. (1) A test helper that appends ProjectSettingsChanged/ProjectTeamSettingsChanged with non-empty VerifyCommands and then exercises DispatchEngine.ClaimEligibleAsync or VerificationRunner.VerifyAsync/VerifyForSettlingAsync must also append a matching ProjectGateSetAccepted for that same list in the same seed (GateSetAcceptance.Decide holds otherwise); VerificationRunnerTests.SeedAsync, SpikeEngineTests.SeedClaimedSpikeAsync and six sites in ReviewEngineTests.cs all needed this, and a grep for 'verifyCommands: Optional<IReadOnlyList' across tests/ combined with checking whether the same test file calls VerifyAsync/ClaimEligibleAsync is the fast way to find every site. (2) A daemon sweep engine test that seeds a node via NodeBootstrapSeed.NewNodeAsync gets no OwnerDetails.RootFingerprint at all, since bootstrap never claims one; any new owner-role gate keyed off OwnerRootFingerprintResolver.ResolveAsync (like PromptAddendaSweepEngine.PushAsync's own gate) needs the test's own seed step to append OwnerDecider.ClaimRoot for that owner and build a matching FakeLedgerChainReader TrustChain (an Owner-role ProjectMember at that fingerprint), the same pattern MessageSweepEngineTests already uses, or every existing push-path test silently starts failing its own Owner-role check.
  - [367cf312] A host-gate timeout or overrun is not by itself a test failure, so read its cause before changing code. Three causes have been observed. (1) Permit wait: a 30-minute timeout whose only evidence is stale permit-N.lock.holder sidecars, where a touched Docker-backed class that ran 13 to 38 seconds of test time took 450 to 578 seconds wall clock waiting for permits in /tmp/hall9k-postgres-container-gate held by other sessions; run each touched class by name, compare its reported Duration with its wall time, and do not change code when every touched class passes and the delay is permit wait. (2) A silent Windows hang: a timeout whose verify-host.log goes silent right after TaskHolderClaimTests's own Skip block, with its per-run gate-wait-host directory empty, is not CrossProcessContainerGate permit contention, because TaskHolderClaimTests's PostgresFixture is never constructed when every one of its tests is Skip-attributed (dotnet test --filter on that class alone finishes in 26ms with zero container start); the silence is a different Postgres-backed class's Testcontainers container start hanging past its 5-minute ContainerStartTimeout without the CancellationToken unblocking it and without throwing the DockerApiException/Testcontainers marker GateInfrastructureFailureClassifier looks for, so it reads as a bare 30-minute timeout with nothing to classify; it reproduced twice with the identical symptom while every individually-scoped class the diff touched passed in seconds, which rules the diff out as the cause. (3) Mac sleep: a gate's wall-clock span includes lid-closed sleep while the gate timer counts awake time only, so check pmset -g log before calling a gate overrun or killing its process by PID.
  - [5d6ea40a] A pr-review task's agent context is built by AutoPrReviewEngine.ComposePrReviewContext on both mint paths (CreateOneAsync, CreateFromMentionAsync), not WorkItemContext.Compose, so a pull request's attacker-authored title on a public repository sits inside the same fence as the body rather than on WorkItemContext.Compose's own unfenced title line; leave WorkItemContext.Compose itself untouched for every other import type (h9k task add --from-pr, --from-issue, --from-jira) since those are human-confirmed before an agent ever sees them. Whatever composes a pr-review task's context must also keep WorkItemContext.CarriesQuotedDescription true, because AgentPromptBuilder's adopted-external-item, QaReviewPromptBuilder's basis-is-data and DesignReviewPromptBuilder's context-is-data rules key on WorkItemContext's exact NonInstructionFraming sentence: a composer that quotes stranger text with different framing prose silently drops those platform-authored data-only rules, so reuse the sentence or widen the detector, and pin it with a test.
  - [06f9a4a4] After true completion stopped clearing the tracker assignee, Decisions Log #223 still says CloseoutEngine.MirrorTrackerReleaseBestEffortAsync clears it at the third holder-release site; that clause is superseded (a finished item keeps its assignee), so do not restore the closeout mirror on the strength of #223, and a human should record a superseding decision.
  - [68511fa1] To tell who held a run, read RunDispatched alone: NodeId == Guid.Empty AND !IsDeliberateHeadlessStart AND a SessionName that does not end in the build role suffix (h9k task start sets both the sentinel and TaskClaimed.InteractiveMode on a headless build, so neither is the key), and TaskPassageQuery.IsHumanHeld is that one rule; a hand-off point (h9k pr resolve, h9k task handback) is found by the TaskReopened with Automatic false or the TaskHandedBack that precedes a non-human run's TaskClaimed, since a PR-stage h9k task drive also appends a non-automatic TaskReopened and is told apart only by the sentinel claim after it.
  - [a7bd02fb] A closeout test that reads TriageExecutor.Requests right after PollOnceAsync races the background Task.Run CloseoutTriageSessions starts, so wait for the spawn (or WhenIdleAsync when the executor is not HoldOpen) before asserting; the race passes in isolation and can fail deterministically once the class runs in order.
  - [148b5f54] When a prompt template moves between package directories under .claude/templates (here commit-style.md and review-read-scope.md from agent-prompt-builder to work-prompt-builder), an operator's installed override of the old path is orphaned silently, so say so in the handoff; and a pure-string refusal helper (like TaskReleaseCommand.PastPushedTipRefusal) is how a command's store-backed refusals get a unit test without a database.
  - [54d51af9] To resume the conversation a person's own session registered, read RunDetails.RegisteredInteractiveClaudeSessionId, never InteractiveClaudeSessionId: the latter moves with every InteractiveSessionStarted, so a contractor h9k task delegate dispatches overwrites it and a resume would land in the contractor's conversation.
  - [32ac0791] A shell-command safety check that unescapes quoting and then matches a refused term (GitReadOnlyGuardRoutes.UnescapeShellQuoting, over raw PreToolUse command text) must reassemble whole shell words the way bash does, not judge each quote or escape in isolation, and even then it still misses expansions that create or split words after quote removal. Reassembly means joining every adjacent unquoted, '...', "...", and $'...' piece between runs of unquoted whitespace into one word, decoding $'...' ANSI-C escapes (bash turns $'\x75' into a literal character before it runs the command), and only then checking whether the whole word starts with the refused term; checking each span alone let --out'put'=<path>, git diff '--output=/tmp/my file.txt', --outp$'ut=/tmp/my file.txt', and --outp$'\x75't=<path> through, and $'/etc/passwd' reassembles into a literal absolute path. Brace expansion (git diff {/dev/null,~/.config/gh/hosts.yml} reads the file; git diff -{-output=/tmp/x,-stat} writes it) and unquoted $IFS word splitting (git diff --output${IFS}/tmp/x) still bypass a reassembling guard, so refuse any git diff/log command whose text contains an unquoted '{...,...}' or a '$' expansion outside a fully single-quoted word, or better, allowlist the argument shapes a lens needs instead of denylisting spellings one at a time. Any future unescape-then-match check on command text should be built this way from the start rather than adding one quote form at a time.
  - [88f9f51a] To name the node an owner-act request or hold actually lives on, use TrustedOwner.ResolveRootActingNodeId (K0's node first, which h9k project members marks (root)), not RootNodeDescription.Of: the latter names the newest rotation's holder (marked (root key)), so after any succession rotation the two point at different nodes.
  - [be3bdfbc] When scrubbing an incident's identifiers from the tree, search for its bare pull-request numbers too, not only the names: test method names (Replaying_<number>_...) and FluentAssertions because-strings ("...on PR #<number>") carry incident numbers that a name-pattern grep never matches.
  - [a175d0d8] When renaming fixture names across tests, a stand-in must sort the same way as the name it replaces (project lines are ordered by name, so a test that expects the stand-in first fails if it sorts after hall9k) and must not contain a word a test asserts is absent from rendered text (a login containing 'review' broke a NotContain('review') check); the default no-Docker gate does not run the RequiresDocker integration classes, so run each touched one scoped by name with a FullyQualifiedName filter.
  - [48418886] A background task that appends to a task stream with no expected version races closeout polls and sibling background tasks over the same stream, and Marten throws EventStreamUnexpectedMaxEventIdException for the loser, so reload the aggregate and retry a bounded number of times instead of dropping the write; and a test double that records spawn requests from concurrent sessions needs a lock around its List, or an add is silently lost and a one-per-key assertion flakes.
  - [7c1c956b] An owner's go on a GitHub comment pinned only by its node id does not pin its text: review comments and review bodies stay editable forever, and a session told to read 'comment X by id' reads whatever X says now. Pin an approval to what the owner saw by carrying a copy of the body (as the admitted-review path does) or by recording lastEditedAt / a body hash at hold time and refusing the read when it changed.
  - [63ae102d] A unit test of ClaudeExecutor's spawned command must not assert it starts with the literal "claude": other tests in the same process set HALL9K_CLAUDE_PATH, so the binary part is a fake-claude.sh path whenever they overlap; assert on a stable flag such as ' -p --output-format stream-json ' or on the wrapper prefix instead.
  - [6cc71858] A CLI command that prints untrusted multi-line text (a PR comment body, an issue body) beneath its own structural header lines (Comment N by <login>:, Status:, Thread N:) must fence each body with RelayedText.Fenced(RelayedText.Printable(body)), the way ReviewLapPromptBuilder.Fenced does; folding only the one-line fields to OneLine still lets the body print forged header rows that misattribute text to another login or fake a thread status.
  - [cf41e5c6] When a change widens who the replication receive gate refuses for a Conditional task act (e.g. reading the assignee instead of the creator for TaskPublished/TaskRevised), check that every CLI command appending that act runs TaskOwnerGuard first: h9k task publish and h9k task revise carry no owner guard at all, so a Member-role sender the gate now refuses still appends locally and its own node forks from every peer (the drop is permanent when origin == sender).
  - [2377a581] An acceptance criterion asking for the whole host suite's own before/after timing, measured with the host gate's own command, cannot be satisfied from inside a dispatched build session: AGENTS.md's working rules forbid running dotnet test with no filter (the host gate's own full command) from here, with the sole exception being a single touched test class scoped by name. When a card's acceptance criteria and AGENTS.md's own working rules point in different directions on how something must be measured, AGENTS.md wins: report the touched-class timing you can measure directly, and state plainly in the PR that the full-suite number needs the daemon's own host gate run rather than fabricating or extrapolating it as though it were measured.
  - [6ab6853e] A pre-flight-style gate that reads attacker-controllable content through two separate CLI calls to the same external tool (gh pr diff --name-only then gh pr diff, or any read-twice-and-compare pattern) cannot be made race-free by rereading and retrying around it, because the tool's own response never says which underlying commit/state it actually read; the only race-free fix is to pin the read to an explicit, named identifier in the request itself (e.g. GitHub's compare API with an explicit base...head, rather than gh pr diff's implicit 'whatever the PR's head currently is'). Found in RunLauncher.DispatchPrReviewPreflightAsync (independent pre-PR review, cycle 5, adversarial lens).
  - [8be8b68c] A background monitor that can end without reaching a real verdict (timeout, budget exhaustion, launch failure, a dead process at restart) must mark its own row with a distinct terminal marker, not merely leave its own completion field null — a gate that reads null-completion alone as still in flight, or a sweep that re-processes an incomplete row without excluding one already handled, loops forever with no fresh attempt ever dispatched again.
  - [57835971] A gh subcommand's own minimum version (when it first shipped, e.g. gh attestation verify at 2.49.0) is not the same floor as the flags a caller actually passes to it (--source-ref/--signer-workflow needed 2.68.0, cli/cli#10308); a too-old-gh detector matching only the wording for an unrecognized subcommand ('unknown command') misses a gh new enough for the subcommand but too old for a flag, which fails with 'unknown flag' instead — match both wordings and quote the flag-driven floor, not the subcommand's first-shipped version, in messages/help/docs.
