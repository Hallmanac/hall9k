objective: Distil hall9k's 62 active lessons into fewer, better ones, merging and citing only
criteria:
  - Every lesson you record here is a merge of lessons already on record, records with --distilled-from citing each one it merged (h9k learn "<the merged claim>" --distilled-from <id> --distilled-from <id> --task 01a1d0e0-beeb-7790-a22a-8a310fe36d3d), and says nothing its sources do not say. The daemon refuses a distilled lesson whose citations resolve to nothing, but a plain h9k learn with no --distilled-from is not refused, so citing every source is your discipline here, not a guarantee the platform enforces for you.
  - |-
    You record nothing this project has not already learned. If reading the inventory gives you a genuinely new insight, that is not this task's output: say so in your final summary and let a human decide.
  - |-
    Each lesson you merged away, or absorbed, is retired explicitly, citing the survivor: h9k learn retire <id> --reason "Absorbed into <the surviving id>". A narrower lesson whose whole claim an existing lesson already states may be retired into that existing lesson with no new lesson recorded. Merging does not retire anything on its own.
  - A lesson that says one thing nothing else says is left exactly as it is. The goal is fewer lessons that are each worth a prompt's line, not the smallest possible number.
  - |-
    A lesson whose h9k learn show output says it does not reach prompts is held out: treat it as read-only, cite it in no merge, and name it in the summary. A lesson recorded on the owner's own fleet that h9k learn show says does reach prompts is an ordinary lesson for this task.
  - |-
    The inventory is the live list read at session start with h9k learn list --project hall9k --limit 500, accounted for by id. Every lesson in it appears in the findings document's What was observed section under exactly one of these headings: merged into <new id>; absorbed into existing <id>; retired as wrong or obsolete, with its reason; left alone; held out; not reached.
  - |-
    Keep the prompt budget in mind when merging: a recorded lesson is the newest, so it goes first in the injected section, and the section stops at the first lesson over its character budget (about 4,000 characters, roughly the newest 13 lessons today). A long merged lesson displaces recent ones, so a merge that is longer than its sources together is not worth recording.
