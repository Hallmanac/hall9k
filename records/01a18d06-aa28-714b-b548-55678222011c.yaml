context: |-
  Brian's ruling of 2026-10-30, made while walking the Linear claim card (07854c85): hall9k should not take a person off an item because the work finished. This narrows idea 202383dc's A3b criterion 5 ('on every holder change the tracker assignee is set to match') for true completion only. The ledger holder is still released at closeout; only the mirror onto the tracker stops. Today's clear only ever removes this install's own identity, through TrackerAssignmentTake.ReleaseAsync.

  Why the sweep tests Done rather than the merge: a task reads Done from the moment its pull request opens, and the merge lives on the run. Done is deliberate. It also stops a stale row from clearing the assignee while a pull request is open, and any node can read it. The known cost is that a failed clear from h9k task release on a Done task is dropped rather than retried. The direct h9k task release call on a Done task still clears, because the open-pull-request window is its normal use and an explicit release is a give-back.

  For tests, a Jira reference with no registered connection makes the release fail without any network call and leaves the pending row, so a row's AttemptCount shows whether a retry ran. PlacedElsewhereHolderReleaseTests is a live class with the right engine shape. Leave the TaskHolderClaimTests test bodies alone, since 76912727 rewrites that class.

