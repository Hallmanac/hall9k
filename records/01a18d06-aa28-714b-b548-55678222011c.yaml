objective: A finished task leaves its tracker assignee in place, so a done Jira card or GitHub issue keeps showing who did the work
criteria:
  - |-
    True completion no longer clears the tracker assignee on any tracker: CloseoutEngine's call to MirrorTrackerReleaseBestEffortAsync, that method, its StorePendingTrackerReleaseMirrorAsync helper, and the _trackerAssignmentTake field are removed, so a finished Jira card or GitHub issue keeps showing who it was assigned to on every route into CompleteCloseoutAsync; closeout's release of the ledger holder, its merge notice, and the close-linked-issue rule are unchanged
  - SweepPendingTrackerMirrorsAsync drops a TaskTrackerReleaseMirrorPending row without calling the tracker when the row's task is Done, on whichever node holds the row, including a node that no longer holds the task, so a retry left from an earlier lease expiry or from a closeout before this change cannot clear the assignee of a delivered or finished task; a test pins the row gone and no release attempted
  - |-
    h9k task abandon and h9k task release keep clearing this install's own identity on every project, and lease expiry keeps clearing it on a project with the claim gate off, exactly as they do today: those three call sites are unchanged in the diff, and a test pins that a TaskTrackerReleaseMirrorPending row for a task that is not Done, one Queued and one Abandoned, is still retried through TrackerAssignmentTake.ReleaseAsync
  - |-
    Tests pin closeout making no assignee read or write for a Jira reference and for a GitHub reference: the assertions in A_merge_with_a_github_reference_comments_the_issue_and_says_nothing_to_jira, A_jira_that_refuses_the_comment_does_not_undo_the_closeout, and A_write_already_outstanding_queues_the_merge_comment_instead_of_losing_it that expect the mirror's read now expect no such call; every new test uses the existing fake tracker seams and sits in a class that runs in the test gate (not TaskHolderClaimTests, whose tests are all skipped), and no test touches GitHub or creates a branch
  - |-
    Every sentence that states the old rule states the new one: the assignee follows a claim and a give-back (h9k task abandon, h9k task release, and lease expiry on a gate-off project), and a finished item keeps it, so on a gated project a different install's later claim on that item is held until a person reassigns it in the tracker. This covers the sentence in docs/scope.md that releasing a task leaves the tracker assignment where it is, which is replaced; the claim gate section of docs/cli.md, which gains the rule and whose "never takes an assignment off one" is scoped to the take; the release-mirror paragraph of the hall9k-cli-reference skill; and the doc comments on TrackerAssignmentTake.ReleaseAsync, DispatchEngine's lease-expiry release and claim mirror, TaskTrackerReleaseMirrorPending, and TaskHolderClaimTests' lease-expiry test
