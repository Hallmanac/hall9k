objective: A mention follow-up always launches answering the comment its claim belongs to, never a mention observed after that claim, proven first by a test that reproduces the race and fixed only if it does
criteria:
  - |-
    A test in the existing RunLauncher test harness (tests/Hall9k.Tests/Integration/RunLauncherTests.cs, which already seeds a PrReviewPreflightSafeMentionFollowUp requeue) drives this sequence: a member's comment earns a mention follow-up on an existing pr-review task, that follow-up's pre-flight requeues the task, a non-member's comment tagging the same login is then observed on the task, and the task is claimed and launched. It asserts that the session's prompt contains the member's comment and none of the non-member's. A second case asserts the same when the pre-flight parked unsafe and the task was queued again afterward.
  - If that test fails on main, the fix makes it pass and the pull request description quotes the assertion's failure as observed on main. No mention follow-up launch answers a comment other than the one its claim belongs to. A further test shows that when that comment cannot be identified, nothing launches and the task records why, rather than answering the task's latest observed mention. The existing mention tests in RunLauncherTests and AutoPrReviewMentionEngineTests pass unchanged.
  - If that test passes on main, the pull request adds it as a regression guard, changes no production code, and its description states the race does not reproduce and why, naming the code path that prevents it
  - No new test touches git or calls GitHub
