context: |-
  Security item from idea fd736bba (workspace notes.md, exposure finding 3; challenge verdict in this task's journal). TaskAggregate.Apply(PullRequestReviewMentionObserved) (src/Hall9k.Domain/Features/Tasks/TaskAggregate.cs about 2468-2483) overwrites LatestMention* for every observed mention, and AttachMentionAsync (src/Hall9k.Daemon/AutoPrReview/AutoPrReviewEngine.cs about 2339-2416) appends that event before its comment-author membership gate. RunLauncher.LaunchAsync's mint addendum (about 760-786) and its answer-only branch (about 175-212) already read the stored ObservedReviewMention row. A follow-up whose pre-flight requeued it (PendingMentionFollowUpAfterPreflight without AnswersMentionOnly) has no such row lookup and always reads LatestMention* (about 203-212). That branch is the suspected hole, and the parked-unsafe pre-flight (Apply(PrReviewPreflightParked)) reaches it too. The answer-only branch also matches an Attached row only when its comment id equals LatestMentionCommentId (about 199-202), so a later mention can make a member's attached follow-up answer the wrong member comment; pinning by claim rather than by latest fixes both. PullRequestReviewDuplicateConvergence re-appending carried mentions (about 145-204) also moves LatestMention* and is covered by the same outcome, not a second hole. The follow-up session runs without skip-permissions and never posts (RunLauncher.cs about 1229-1250), so the harm is getting around the comment-author gate and drafting the owner's reply to a stranger. Reproduce before fixing: no speculative fix. Out of scope: the walker's display fallback in TaskShowCommand.cs about 287-340 (read by the owner, who sees the author), a launch-time membership re-check (needs the author account id stored; separate draft, Brian 2026-10-11), and idea f894d344. Independent of task a1af8b15. Note to the window, not a criterion: Brian ruled 2026-10-11 that lifting the interaction limit (task C) no longer waits on this task, only on a1af8b15.
