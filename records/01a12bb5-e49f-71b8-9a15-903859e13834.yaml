objective: The repository carries the approved Apache-2.0 LICENSE and NOTICE at its root, and every release archive bundles LICENSE, NOTICE, and a generated THIRD-PARTY-NOTICES.txt, with CI's workflow token limited to read
criteria:
  - LICENSE and NOTICE at the repository root are byte-identical to /Users/brianhallmanac/.hall9k/projects/hall9k/ideas/fd736bba-ready-the-public-hall9k-repo-for-outside-contributors-apache/workspace/drafts/LICENSE and /Users/brianhallmanac/.hall9k/projects/hall9k/ideas/fd736bba-ready-the-public-hall9k-repo-for-outside-contributors-apache/workspace/drafts/NOTICE
  - release.yml places LICENSE, NOTICE, and THIRD-PARTY-NOTICES.txt at the top level of every archive it builds (each tar.gz and each zip), before the archive step
  - THIRD-PARTY-NOTICES.txt is generated at release time by a script committed in the repository that a contributor can also run locally against a publish output; it lists every package library in the published h9k.deps.json and h9kd.deps.json and the bundled Microsoft.NETCore.App and Microsoft.AspNetCore.App runtimes, each with its version and its license as an SPDX id, and the script fails the release when a listed package's license cannot be determined
  - For each entry, the archive carries the full license text (the package's own license file where it ships one, otherwise the standard text for its SPDX id) with the copyright line the package declares, plus the contents of every THIRD-PARTY-NOTICES file shipped inside those packages and runtime packs; a URL alone does not meet this
  - |-
    ci.yml declares top-level permissions: contents: read, and both CI legs still pass
