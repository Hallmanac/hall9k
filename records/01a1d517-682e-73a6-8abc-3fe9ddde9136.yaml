objective: A draft authored by h9k learn distill states how the platform really treats citations, held-out lessons and retirement, and requires a per-lesson account a reviewer can check, so its challenge stops finding the same template defects each time
criteria:
  - The criteria `h9k learn distill` authors say that a plain `h9k learn` with no `--distilled-from` is recorded without refusal, so citing every source is the session's own discipline, and no sentence in `.claude/templates/learn-distill/task.md` says the platform prevents a merge from being recorded without its citations.
  - |-
    The authored criteria, the authored exit criterion and the authored context each name the inventory as the active list read at session start with `h9k learn list --project <the project's name> --limit 500` for a project scope, or `h9k learn list --owner --limit 500` for the owner scope. The criteria and the exit criterion require the findings document's "What was observed" section to name every lesson in that inventory by id under exactly one of six headings: merged into <new id>; absorbed into existing <id>; retired as wrong or obsolete, with its reason; left alone; held out; not reached.
  - The authored exit criterion and the authored context both require that per-lesson account even when no merge was warranted, and neither offers a statement that no merge was warranted as an alternative to it.
  - The authored criteria and context treat a lesson as held out (read-only, cited in no merge, named in the findings under "held out") exactly when the "In prompts" line of `h9k learn show <id>` says no, and say that a lesson recorded on another node of the owner's own fleet whose "In prompts" line says yes is an ordinary lesson for the task. The context no longer says that a lesson an agent recorded on another node is held out of prompts without that fleet exception.
  - |-
    The authored criteria allow a lesson to be retired into an existing live lesson that already states its whole claim, with no new lesson recorded, and allow a lesson to be retired as wrong or obsolete only when its retirement reason names evidence at the checkout's commit: a file and line, or the absence of a named file or symbol.
  - The authored criteria state that every claim in a merged lesson appears in at least one lesson it cites, and that a merge longer than its sources together is not recorded, because a recorded merge becomes the newest lesson and displaces recent ones from the injected prompt section.
  - Every `h9k learn` record command shown in the authored criteria and exit criterion carries `--task` with the authored task's own id, as the command in the authored context already does.
  - |-
    The sentence in the rendered `lessons.md` that says which lessons are held out of prompts says that a lesson recorded on another node of the owner's own fleet reaches prompts, and names the held-out kinds: recorded on a node outside the owner's fleet, replicated from a node outside the owner's fleet (each also when the fleet cannot be read), recorded on a node nobody recorded, and recorded with no provenance. A test over `LessonsDocumentRenderer.Render` asserts that the rendered document says a lesson from another node of the owner's own fleet reaches prompts.
  - |-
    `docs/scope.md`, `docs/cli.md` and `.claude/skills/hall9k-cli-reference/SKILL.md` no longer contain the phrase "the citation half is enforced": each says the decider refuses a distilled lesson whose citations resolve to nothing, repeat, or name the lesson itself, and that a plain `h9k learn` with no `--distilled-from` is recorded without any. The held-out paragraphs in `docs/scope.md` (the "Three marks" paragraph) and in that skill say that a lesson from another node of the owner's own fleet reaches prompts. The class summary of `LearningDistillCommand` no longer says the citation contract holds whatever the template says.
  - |-
    `LearningDistillTests` asserts, over the task `LearningDistillCommand.Author` produces for both a project scope and the owner scope, that the six headings and that scope's `--limit 500` inventory command appear in the criteria and the exit criterion, that the command also appears in the context, and that no part of the authored task (criteria, exit criterion or context) contains "no way to record a merge without the citations", "or it says no merge was warranted" or "or the section says no merge was warranted". Its existing assertions on the old wording are updated to the new wording, and the class passes.
