context: |-
  ## Where the replacement text comes from

  The challenge of the earlier distillation draft 9c5caf8c found these defects in the shipped template, not in that draft; the distillation before it (0fe36d3d) carried the same defects and was fixed by hand. The report is `/Users/brianhallmanac/.hall9k/runs/01a1d1f9-680f-7475-b4ed-e35643a92bef/challenge-report.md`. Its section "Proposed criteria, if a person republishes this once new lessons have accrued" holds eight criteria; use them as the replacement for the five `criterion-*` keys in `.claude/templates/learn-distill/task.md`, with three changes. `<this task's id>` becomes `{{TaskId}}`. `--project hall9k` becomes `{{ListArguments}}`, so the command reads `h9k learn list {{ListArguments}} --limit 500`. Its criterion 6 keys the held-out rule on the "In prompts" line of `h9k learn show <id>` saying no, because the printed line is padded (`In prompts    yes`, `src/Hall9k.Cli/Commands/LearningShowCommand.cs:146-149`) and a literal "In prompts no" never appears.

  Do not use that report's proposed exit criterion: it names no heading, no command and no task id. The `exit-criterion` key is this text:

  > The findings document's "What was observed" section names by id every lesson in the active list read at session start with `h9k learn list {{ListArguments}} --limit 500`, each under exactly one of these headings: merged into <new id>; absorbed into existing <id>; retired as wrong or obsolete, with its reason; left alone; held out; not reached. It gives that account even when no merge was warranted. Every lesson this run recorded carries `--distilled-from` and `--task {{TaskId}}` and cites no held-out lesson, and every lesson merged or absorbed away is retired citing its survivor.

  The exit criterion is the only sentence the spike's review grades (`src/Hall9k.Daemon/Execution/AgentPromptBuilder.cs:256-258`), which is why it carries the headings and the command itself rather than pointing at the criteria.

  The `context` key needs three passages rewritten to match. The account paragraph (`task.md:22-25`) loses "or the section says no merge was warranted" and names the six headings. The held-out paragraph (`task.md:44-52`) keys on the "In prompts" line and states the fleet exception. The live-inventory sentence (`task.md:54-55`) gains `--limit 500`, since the plain command shows 20 of 57 here. The same report's "False or misleading" items 1 and 2 give the evidence for the citation and held-out corrections.

  ## The code change the template needs

  Today only the `objective` and `context` keys receive substitutions. `LearningDistillCommand.Criteria()` and `ExitCriterion()` load their keys with no values (`src/Hall9k.Cli/Commands/LearningDistillCommand.cs:181,194-201`), and an unknown placeholder is left as written (`src/Hall9k.Domain/Infrastructure/Storage/PromptTemplates.cs:52-60`), so a `{{TaskId}}` or `{{ListArguments}}` in a criterion would reach the draft unreplaced. Both need the task id and the list arguments (built at `LearningDistillCommand.cs:217`) passed in from `Author` (`:158-178`), and `Criteria()` needs the new keys listed. The tests call `Criteria()` directly (`tests/Hall9k.Tests/Cli/LearningDistillTests.cs:45,82,125`) and will need the new signature.

  ## Facts the corrections rest on, at commit fa6b3970c

  - A call with no `--distilled-from` goes to `LearningDecider.Record`, not `RecordDistilled`, so the empty-citation refusal never fires from the CLI (`src/Hall9k.Cli/Commands/LearnCommand.cs:123-127`; `src/Hall9k.Domain/Features/Learning/LearningDecider.cs:52-58,61-80`).
  - `AgentOnFleetNode` reaches prompts (`src/Hall9k.Domain/Features/Learning/LessonProvenanceMark.cs:63,146`). `AgentOnAnotherNode` (a node outside the fleet, or fleet unknown, `:66-73`), `AgentOnUnobservedNode`, `ReplicatedFromOutsideFleet` and `Unknown` are held (`:82,93,97`), and `HeldFromPrompts` (`:111-112`) lists them. If the renderer's held-out kinds are generated from those labels rather than written as prose, note that `AgentOnAnotherNode`'s label ("recorded by an agent run on another node") carries no fleet qualifier and would read as the claim this task removes.
  - `h9k learn show` prints the "In prompts" yes or no line (`src/Hall9k.Cli/Commands/LearningShowCommand.cs:144-150`).
  - `h9k learn list` shows 20 by default (`src/Hall9k.Cli/Commands/LearningListCommand.cs:23,69`), and its footer says how many were held back (`:75-77`).
  - The injected section is newest first and ends at the first lesson that does not fit (`src/Hall9k.Domain/Features/Learning/InjectedLessons.cs:243-253`).
  - The renderer's held-out sentence is `src/Hall9k.Domain/Features/Learning/LessonsDocumentRenderer.cs:63-69`. `docs/concepts.md:115-121` and `docs/cli.md:180-188` already describe the fleet rule correctly and can serve as wording.
  - The sentences calling the citation enforced are `docs/scope.md:613-615`, `docs/cli.md:195-199` and `.claude/skills/hall9k-cli-reference/SKILL.md:917-918`. The held-out paragraphs with no fleet exception are `docs/scope.md:594-601` and `SKILL.md:895-899`. The class summary's overstatement is `LearningDistillCommand.cs:40-42`.
  - The assertions on the old wording are `LearningDistillTests.cs:50,52,55-58,109,179-180`. No prompt golden carries this template's text.

  ## Why the type is Bugfix and not Content

  The template tells sessions false things about the platform, and the fix touches compiled code and tests. A Content task fails before its gates when its diff touches any path outside the project's non-executable set, which here is `*.md`, `docs/`, `.claude/skills/` and `assets/**` (`src/Hall9k.Daemon/Execution/VerificationRunner.cs:319-333`). A template-only change would instead skip the gates entirely (`:293-303`) while the existing assertions above fail on main.

  ## Out of scope

  Lesson caps, the picker, and scoping a distillation to lessons recorded since the last one (a separate idea if wanted). The 500 limit is a fixed bound for the inventory read; it is not a new setting.
