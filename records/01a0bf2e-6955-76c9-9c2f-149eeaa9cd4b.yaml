objective: Every Postgres-backed test class builds its Marten DocumentStore once and shares it across its tests, so the per-test store build stops costing about half a second per method and the host gate's longest class shortens with it
criteria:
  - Every test class holding a PostgresFixture builds its DocumentStore once, as a lazily initialized per-class field, and shares it across its tests; no test builds its own store
  - |-
    No test's isolation depended on a fresh store: the full suite passes unchanged with the shared store, and any test that fails under sharing is fixed by seeding its own ids rather than by keeping a private store
  - The pull request description quotes the host gate's wall-clock from the daemon log for the branch's final full pass against the most recent final pass on main before it on the same node, with no artificial load
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder; no test creates branches or touches GitHub
