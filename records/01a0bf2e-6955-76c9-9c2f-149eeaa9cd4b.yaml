context: |-
  Logged 2026-09-20 with Brian from the walk of draft 98484f36 (the Hall9kHome seam), on the headless challenge session's recommendation (verdict in tasks/98484f36-*/journal.md, finding 4, win 1 of notes/test-suite-runtime-analysis-2026-09-08.md). Unstacked on purpose: it touches the same classes as the seam but different lines, and the two are independent; either order works, and running this one first shortens every host gate the seam's own pull request has to pass. Isolation between tests comes from the fresh DomainId values every seed helper generates, not from a fresh store, so sharing the store per class changes nothing observable. Shape: the per-test NewStore call becomes a lazily initialized per-class field on each class holding a PostgresFixture (62 classes at drafting). Expected: four to six minutes off today's serial host gate, and about a minute and a half off the ReviewEngineTests floor after the seam lands. Memory never-stress-the-host-to-chase-a-flake applies: no parallel copies of the suite to produce numbers.
