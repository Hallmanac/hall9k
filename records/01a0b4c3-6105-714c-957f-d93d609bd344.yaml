objective: Host-coupled tests run in their own gate once per task, never in parallel with another run's copy, so the ordinary test gate on every review lap is free of tests that touch git, the process table, the toolchain, or Docker
criteria:
  - A project can declare a test gate as host-coupled with a dotnet test filter (h9k project set --verify-gate-filter or the equivalent shape the verify-gate setting already has), and hall9k's own configuration puts the RequiresDocker and PublishesBinary traits and the Hall9kHome, RealProcessSpawn, and PublishesBinary collections behind that gate while the ordinary gate excludes them
  - The verification runner runs a host-coupled gate at a run's first verification and at its final full pass only, and skips it on the intermediate review-cycle passes, recording the skip on the run so h9k task show says which passes ran it
  - |-
    At most one host-coupled gate runs on a node at a time: a second run wanting one waits for the first to finish, and the wait is recorded and shown as the run's phase rather than counted as a failure
  - |-
    Tests through the runner's existing fakes: the filter splits the two gates, an intermediate pass skips the host-coupled gate, the final pass runs it, two concurrent runs serialize on it
  - dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each
