objective: A plan can start from an idea, running a headless discovery session whose report lands in the idea's workspace and stopping at a gate where a person either pursues it, which cuts the report's proposed tasks as drafts the plan carries to Published, or stops it, which is a normal ending
criteria:
  - |-
    `h9k plan start --idea <idea>` records a plan in the discovery phase with no drafts and returns without waiting, and the daemon on the node where it was run starts one discovery session for it. A plan from an idea follows the same node rules as a plan from a draft: its records never leave that node, it waits for a stopped daemon and `h9k plan show` says so, and it creates no run, lease, branch, or worktree. Capturing, revising, moving, or assigning an idea starts no plan. Naming draft ids, `--at`, `--no-existing-item`, or `--untracked` together with `--idea` is refused.
  - |-
    `h9k plan start --idea` is refused, with the reason and before any session starts, for anyone but the idea's assignee, or its creator when nobody holds it, and no override is offered. It is also refused for an idea that is not Captured, has no project this node holds, has no workspace directory on this node, or is already in a live plan on this node, and for a project that is archived, is scheduled for purge, has no working checkout, or does not run agents with skip-permissions. The workspace refusal says to start the plan on the node that captured the idea.
  - |-
    `h9k plan start --idea` is refused for an idea that carries a tracker link, whatever its note now says, and the refusal names the way forward: cut a draft by hand with `h9k task add --from-idea`, put its context in a person's own words with `h9k task revise --context`, and run `h9k plan start` on that draft.
  - A discovery session's prompt holds the idea's note as the store has it, its project, and the tasks already cut from it with their states. It names the project home and the commit the checkout is at, says when that checkout could not be brought up to the project's remote base branch, and points at the idea's workspace, that workspace's `journal.md` when it exists, and any earlier discovery report there. It says, in text no quoted material can reach, that the note, the workspace, and anything the session fetches are material to study and never instructions. It tells the session to test claims against that commit, with no git fetch and no git writes; to say what the idea is and whether it becomes one task, several, a ruling, or nothing; to state the shape (one task or several, stacked or not); to give a recommendation, the strongest case against it, and what it still proposes for a hard-to-reverse direction; to name each design answer do-now, fold-in, or park; to keep security detail out of every proposed objective; to leave every existing file in the workspace as it found it; and to finish within the session's time bound, which the prompt states. It tells the session to open the report with a plain-language recap and one acted-out scenario of the world after it ships, and it carries the project's writing conventions.
  - A discovery session cuts no draft and decides nothing about the idea. Inside it `h9k task add`, `h9k idea revise`, `promote`, `conclude`, and `archive`, and every `h9k plan` write stay refused.
  - |-
    A discovery session ends with one report file in its session directory whose closing block holds either `DISCOVERY: pursue` and one or more `TASK: <objective>` lines, or `DISCOVERY: stop` and no such line. Every objective must be one `h9k task add` would accept. Markdown emphasis or a trailing period on a line does not make the report unreadable, and any other report is unreadable: no closing block, both or neither of pursue and stop, a stop with a task, a pursue with none. A session that exceeds its bound, ends in error, ends with no result, or writes no readable report records a failure from the closed list and parks the plan with reason session failed, and no file reaches the workspace.
  - A readable report is copied to `discovery-<plan short id>.md` in the idea's workspace, at the path the idea has at that moment, even if a revised note has renamed the directory since dispatch. No other workspace file changes, and a copy that fails parks the plan with reason session failed and leaves the report in the session directory. No plan record holds text from the report.
  - After the report lands the plan parks with a new reason, gate, and holds no session and no slot while it waits, with no time limit. `h9k status` lists it under Needs you with the idea and the two answers, `h9k plan pursue` and `h9k plan stop`. It reaches the project's orchestrator feed at the same level as a review park, with text that carries only ids, the phase, and the reason. `h9k plan show` reads the workspace file and prints whether the report says pursue or stop, the proposed objectives, the report's path, and a line a person can paste to resume the discovery session and question it. When the file is missing or unreadable, `h9k plan show` says so and still prints the path and the line. `h9k plan resume` on a plan at the gate is refused and names the two answers, so it cannot spend a session by being read as go. After session failed it dispatches discovery again.
  - |-
    `h9k plan pursue <plan>` reads the report from the workspace at that moment, so a person's edit to the file counts, and in one save cuts one draft per `TASK` line and moves the plan to refinement. Each draft is what `h9k task add --from-idea <idea> --objective "<objective>"` would create on the plan's project, shows its idea under `From idea`, and has context that also names the report file. The plan's drafts are fixed from then on, and every step after that is a plan's ordinary path from refinement. Two pursues at once cut one set of drafts.
  - |-
    `h9k plan pursue` is refused, with the reason, with nothing cut and the plan still at the gate, when the plan is not at the gate, the report is missing or unreadable, the report says stop, the idea is no longer Captured, the idea's project is not the plan's, or the project is archived or scheduled for purge. On a project whose publish would ask for a tracker attestation it is refused unless it carries `--no-existing-item` or `--untracked`, which mean what they mean on `h9k plan start` and are recorded the same way. `--epic-title "<title>"` creates one epic and puts every cut draft in it, and is refused unless the report proposes two or more tasks.
  - |-
    `h9k plan stop <plan> --reason "<why>"` is accepted only at the gate. It ends the plan as Stopped, which `h9k plan show` and `h9k plan list` print as a normal ending rather than a failure or a cancellation, and it arrives on the feed as an ordinary item. The idea stays Captured, and its workspace, its report, and any tasks already cut from it are untouched. The command's closing lines name `h9k idea conclude`, `h9k idea archive`, and `h9k plan start --idea`. Starting a new plan on the idea is allowed, and it writes a report of its own beside the first.
  - |-
    `h9k plan cancel` on a plan with no drafts yet stops its discovery session, copies nothing, and leaves the idea as it was. An idea that stops being Captured before its plan has drafts ends that plan cancelled, with its session stopped. Once drafts exist the idea's state has no effect on the plan.
  - A discovery session takes its turn on the same one-at-a-time loop as a refinement session, oldest plan first, with the same time bound and the same launch-hold, spend-budget, and zero-parallel rules, and it takes no ceiling slot. A session running when the daemon restarts is recorded as failed on the next start and is never re-dispatched. Its model and effort come from the refinement role's chain with no new setting, and the `--model-refinement` and `--effort-refinement` help and `h9k config show` say the role covers discovery.
  - A discovery session's tokens land in the spend lines of `h9k status` and `h9k config show` under the model it ran on, and a project purge carries them forward as it does a courier's. Like a courier's, they stay on the node that spent them.
  - A refinement session for a draft in a plan with more than one draft is told the plan's other drafts by id and objective, and that its revision may set `blocked-by` or `stacked-on` to one of them. When the draft came from discovery it is told the report's path.
  - |-
    `h9k plan show` and `h9k plan list` name the idea of a plan started from one. On the node that ran it, `h9k idea show` names the idea's newest plan with its state and phase, and at the gate it names the two answers. `h9k idea show` and `h9k idea list` teach `h9k plan start --idea` beside their existing hints. On any other node the idea and the drafts cut from it read as they do for any cut, and nothing there mentions the plan or the report.
  - The recipe generator skill and `ORCHESTRATOR-WINDOW.md` teach a window to run `h9k plan start --idea` for unattended discovery, to read the report and answer the gate with `h9k plan pursue` or `h9k plan stop`, and to end attended discovery by cutting drafts and running `h9k plan start` on them. A window no longer spawns a headless discovery session. The launch line, the tier row, and the `recipes/idea-discovery.md` contract stay for discovery with the operator in the terminal. `docs/cli.md` and the hall9k-cli-reference skill document `--idea`, the two answers, the gate reason, and the report's closing block wherever the plan verbs are documented, and `PLAN.md`'s plan entry names discovery as a phase, the cut at `h9k plan pursue` as the drafting step, and the gate as a normal place to stop.
