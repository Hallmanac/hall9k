context: |-
  Shape: one of four tasks in epic 5e451233, section B2 of the brief, one pull request. Blocked by 0a3d47e0 (B1) and not stacked on it, because each is useful on merge. That is already ruled. Priority: fold-in.

  Why and what was decided: `ideas/13403621-named-agent-files-claude-code-s-claude-agents-as-a-bridge-be/workspace/plan-work-brief.md`, section B2, and the Rulings in `journal.md` beside it. The reasoning for every choice here is `notes/refine-80f1460d/journal.md`. All of these are in the project home.

  This task rests on B1. Use its plan stream, its loop, its park list, its session recovery, and its verbs as they merged, and read their names from the code rather than from this text. Where B1 says discovery and drafting are not offered, or that a plan names its drafts at start, this task replaces that. `--epic-title` belongs to this task and sits on `h9k plan pursue`; B1 has no epic flag. If B1 merged with one draft per plan, the whole-plan park and the end-of-plan publish land here too: build them and say so in your handoff. B1's rules over every draft must not fire on a plan with no drafts yet. A discovery park names the idea, since it has no draft, and its feed event carries the project id and the idea id.

  The stream. `PlanStarted` gains an idea id and may name no drafts. A pursue appends one event naming the cut drafts and the attestation. Every plan event, including discovery's dispatch and outcome, stays NodeScoped, because a discovery session has no task to carry them and the report they would point at is a local file. The plan stream's version is the fence that makes two pursues cut once.

  The start refusals. Ask `IdeaOwnerGuard.MayActAsync` and refuse in this command's own words, because `AuthorizeAsync`'s message offers `--holder` (`TaskOwnerOverride.cs:42`). Test the workspace with `IsNativeForm` and then `Directory.Exists` on `IdeaPaths.WorkspaceDirectory`, and never create it.

  The session. Add a discovery branch to B1's engine, with `AgentPromptBuilder.BuildPlanDiscovery` over a template in `.claude/templates`, pinned as a golden and carrying the project's writing conventions. The prompt's rules come from the House rule lines of `recipes/idea-discovery.md`, so a project with no recipe gets them too. The spawn request names no task, as the courier's does, and the dispatched-run variable is still stamped, so the refusals in `DispatchedSessionCommandClassification` apply. It runs as B1 runs a refinement, a background job the sweep does not await. Fence the note with `RelayedText.FenceFor`, as `WorkItemContext.Compose` does. The resume line is a `cd` to the checkout and `claude --resume <session id>`, using the id the daemon passed to `--session-id`, shaped like `LaunchTextDefaults.TaskDriveLine`, with no `--dangerously-skip-permissions`. `h9k plan show` prints the report's text through `ExternalText`. Read the report the way A1 reads its own. The daemon, not the session, copies it into the workspace because the sweep renames an idea's directory when its note's slug changes, which `IdeaPaths.ResolveDirectory` tracks at read time, and because the copy happens only for a readable report. Attended discovery can rewrite the workspace's `journal.md`, which is a person's record and can hold rulings, so an unattended session never does.

  The cut. `h9k plan pursue` is a CLI verb that cuts in process and needs no daemon child. `IdeaPromoteCommand` is the precedent: `IdeaDecider.CutTask` and `TaskDecider.Add` with `StartStream` and `Append` in one save, using `IdeaPromoteCommand.AgentContext` for the context. Keep the purge refusal and `RequireCaptured` read fresh before the save. `--epic-title` is `EpicDecider.Add` and `StartStream` in the same save, one plain epic, with its id passed to `TaskDecider.Add`; a solution epic stays with `h9k epic add`. Ring the plan loop's doorbell as `h9k plan start` does. Linked ideas never arrive here, so none of `LinkedIdeaCut` is involved. Add the new verbs to `DispatchedSessionCommandClassification` as Refused.

  The linked-idea refusal. Test `IdeaAggregate.WorkItemReference`, not the note. Such an idea keeps `tracker-item.md` in its workspace, its first cut adopts the item afresh whatever the note says (`LinkedIdeaCut.ResolveAsync`), and no verb removes a link. So a refusal keyed on the note would pass an idea whose drafts B1 then refuses: every cut from a linked idea carries either the quote or the workspace notice. Refusing at start matches B1's reason for adopted drafts: nobody reads the text once walks are gone. The framing in the prompt is for what remains, such as a file a person dropped in the workspace.

  Spend. Add a NodeScoped token event on the plan stream, following `CourierTokensRecorded`, and read it in `PeriodSpend.ReadAsync`, and add the plan ids to `spendBearingStreamIds` in `ProjectPurgeEngine`. `PublicationTokensRecorded` cannot serve: it is ProjectScoped and rides a task's stream.

  Not in this task: carrying an idea's workspace between nodes, a drafting session, `h9k plan add` or any way to add a draft to a live plan, a task list chosen by flag at the gate (edit the report), a third gate answer for another look (stop and start a new plan), a time limit on the gate, an attestation for linked ideas, plan records that travel, a new role or model setting, a separate time bound, and any change to how attended discovery runs. No plan concludes or archives an idea. Task notes, Ralph loops, agent files, multi-vendor, and the coordination layer are out of scope. No test spawns a real agent, creates a branch, or touches GitHub.

  Note to the orchestrator (decision 13f11af2), not to the build session: after this merges, regenerate the project recipes and adopt them, and start unattended discovery with `h9k plan start --idea` rather than a spawned session. The idea stays open; concluding it is the orchestrator's act.
