context: |-
  Evidence, 2026-09-27, as corrected by this card's challenge (verdict in the project home notes/ci-hang-2026-09-27/journal.md): two ubuntu build-test runs hung in the Docker-dependent Test step and were cancelled (runs 36354992628 and 36364607175, attempt 1; read with gh run view <id> --repo Hallmanac/hall9k --attempt 1 --log). Both logs show a Testcontainers lifecycle stalled mid pg_isready polling while the whole assembly stopped starting classes; PostgresFixture's 5-minute StartAsync cancellation never fired. The logs cannot pin the hung test: normal verbosity prints results, not starts, and classes run in parallel. The DatabaseDoctor.cs:736 'retrying for up to 0s' line is a bystander (DatabaseDoctorOtherErrorRetryTests, fake runner, 300 ms formatted as 0s). Seven green main pushes and ten green PR runs the same day, so it is intermittent. A workflow-only change needs no new tests; never reproduce by loading the host. Gate-limit-stays-at-thirty covers the daemon gate, not this. Note to the orchestrator: the root-cause fix is cut at closeout from the first blame artifact, not in advance.
