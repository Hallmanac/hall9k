criteria:
  - On a hang, the ubuntu Test step fails within about ten minutes, and the run's failure artifacts name the tests that were in flight, with their stacks (dotnet test --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini, with the TestResults blame output uploaded only on failure, short retention).
  - |-
    Both Test steps carry timeout-minutes: 20 at step level (today's slowest green ubuntu Test step took 7m17s), so a hang the blame collector misses still fails in bounded time.
  - The pull request states what the two hung runs' logs do and do not establish, so nobody later fixes the doctor retry path from this card.
