objective: Text the platform itself posts to a Jira card, GitHub issue, or pull request names no product, CLI, task id, project, or AI agent, and every agent composing such text is told the same
criteria:
  - |-
    The closeout merge note on a Jira card or GitHub issue reads exactly 'The pull request for this work has merged: <url>'. It is followed by 'The issue was closed alongside it.' only when closeout closed the issue. It names no product, task id, or project, and a queued Jira replay posts the same text (MergeComment, src/Hall9k.Daemon/Closeout/CloseoutEngine.cs:2911; replay at src/Hall9k.Daemon/JiraWrites/JiraWriteRetryEngine.cs:429).
  - When the PR body is cut, the note appended reads exactly '[Truncated at 30000 characters.]' and names no command, file, run, or task id (src/Hall9k.Daemon/Execution/PullRequestBody.cs:213).
  - The PR body fallback heading reads '## Summary', not '## Agent summary' (src/Hall9k.Daemon/Execution/PullRequestBody.cs:313).
  - |-
    Every prompt that asks an agent to compose text posted under the owner's login carries one fixed platform rule: such text never presents the work as done by hall9k or an AI agent, never cites a hall9k task, run, idea, or decision id, and names hall9k or h9k only when the change itself is about them. It is carried by WorkPromptBuilder.AppendWritingConventions (src/Hall9k.Connectors/Prompts/WorkPromptBuilder.cs:1083), by the card-audience rule in .claude/templates/agent-prompt-builder/card-publication.md, and by the Keep out list in .claude/skills/pr-summary/SKILL.md:217. It is not part of the project-editable writing conventions, so a project that sets its own still gets it.
  - A unit test renders the merge note (closed and not closed), the PR body fallback and truncated bodies, the held-reply push line, and the review-body prefix, all with inputs that contain neither word. It fails if any output contains 'hall9k' or 'h9k', case-insensitively.
