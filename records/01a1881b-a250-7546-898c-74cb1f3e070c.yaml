context: |-
  A Linear connector, so a project whose work and backlog live in Linear gets the same tracker integration hall9k gives Jira and GitHub issues

  Discovery workspace (research notes, gathered files, and prototypes from before this was a task; may be empty):
  /Users/brianhallmanac/.hall9k/projects/hall9k/ideas/5d12221a-a-linear-connector-so-a-project-whose-work-and-backlog-live/workspace

  Why the guard is separate: a Linear identifier has the same shape as a Jira key, and PullRequestBodyTests.cs pins "Fixes PROJ-1" surviving as written, so the Linear rule must not enter RelayedText.WithoutClosingKeywords, whose callers know no project. PullRequestOpener.CreateArgumentsAsync is the one place hall9k writes pull request text. It is static and has no project, so resolve what the guard needs in CreatePullRequestAsync, beside SourceUrlAsync and with the same contract (a failure costs the guard's precision and never the pull request), and pass the project down from OpenAsync. That path runs only on a fresh create, so a follow-up lap makes no Linear call. "The project's tracker is Linear" is card A2's one predicate. The text guard widens it with a check of the task's own reference; the scan and doctor have no task and use the predicate alone. One helper reads team keys for both the scan and the opener, with one rule for paging, timeouts, and failure.

  Order matters. In the body the guard runs after composition, because that composition's bounds are measured before defusal on purpose (PullRequestBody.BoundedBlock). In the title it runs inside PullRequestBody.Title: fold to a printable line, drop, insert, run the GitHub closing-keyword rule (idempotent), place the key, cut. Dropping after the key doubles a key, and dropping after the GitHub rule can leave a live Fixes #12.

  Why it inserts a word rather than wrapping: the research in the discovery workspace's linear-magic-word-research.md found that Linear acts on a whole phrase inside a code span or a fence, while a backtick between the word and the identifier stops it. Linear's published matcher requires only whitespace or a colon between the two, so the guard breaks adjacency on the raw text and does not depend on whether Linear reads code. Do not reuse IsInside: skipping text already in code is the gap. The inserted word must not be issue, because linear issue is a closing phrase. Take the shapes from that matcher (linear-release, src/extractors.ts): an identifier is \w{1,7}-[0-9]{1,9}(?!\.\d), matched per line and without regard to case, and a list continues across commas, whitespace, and, and &.

  Linear facts: the word lists move (five changes in seven months), so keep them in one place; updates is new and is on the changelog and the GitLab page rather than the GitHub page. Closing words fire on open as well as on merge, and a link can pull a Done issue back to In Progress. Negation is not read. A bare title identifier links. Unverified: whether an intervening word fully stops a link (the closest public cohorts sit at or near the rate for a bare mention), and how Linear treats identifier case.

  Accepted limits: a key limited by team cannot see every team, while Linear's integration acts for the whole workspace, so an identifier from an unseen team is not guarded. A foreign Linear URL or markdown link with no word before it is also not guarded, though public data shows such links attaching some of the time by a mechanism nobody could name.

  Parked: reading attachmentsForURL after open and repairing a stray link with an Ignore line (trigger: the first observed wrong move, or a report of a parser change). A person runs the revised live check in that report before a Linear-tracked project relies on this guard; if the inserted word links, the Ignore line becomes the mechanism. Keeping key-shaped tokens out of the branch slug (trigger: a branch link moves an issue the task does not own; build notes in notes/challenge-1f3e070c-r2/journal.md).

  Out of scope: commit messages. Linear acts on magic words in commits only with its commit-linking toggle on, this workspace has it off (ruling 1), and hall9k does not author them. The objective seed and the daemon's draft objectives are unchanged for the same reason; the guard at pull request open covers them wherever they reach a pull request. Parked, with triggers, in notes/challenge-1f3e070c/journal.md: a non-closing word on a task's own issue, and commit messages.
