objective: Pull requests on a Linear-tracked project carry the issue key in their title, and the title and body hall9k writes never move, unlink, or create a Linear issue through Linear's magic words
criteria:
  - PullRequestBody.Title puts the Linear identifier at the front of the pull request title once, exactly as a Jira key is placed today (whole-token check, an authored title that already starts with the identifier kept as written), and a GitHub issue number still gets no prefix
  - |-
    The work-item line on the body renders a Linear link as [ENG-123](<issue web URL>) with no magic word before it, so it mentions the issue without instructing Linear; when no web URL can be resolved it falls back to the existing unlinked form, Work item: linear:ENG-123
  - |-
    On a Linear-tracked project (one with a Linear team bound, or a task whose own reference is a Linear one), the composed pull request title and body pass through a pure Linear guard in RelayedText that works on the raw text and is deliberately not markdown-aware, so text already inside a code span or a fenced block is treated like any other text. A linking word, in any case, counts when only spaces, tabs, or colons separate it on the same line from a run of targets, where a target is a Linear identifier, a Linear issue URL with or without its slug, or a markdown link to either, and a run is one target or several joined by commas, whitespace, and, or &. When any target in the run names an identifier other than the task's own, the guard inserts the neutral word ticket directly before the first such target, so on a task that owns none of them Fixes ENG-123, DES-5, and ENG-256 becomes Fixes ticket ENG-123, DES-5, and ENG-256, Fixes: DES-5 becomes Fixes: ticket DES-5, and does not close ENG-2 becomes does not close ticket ENG-2, and on task ENG-123 Fixes ENG-123, DES-5 becomes Fixes ENG-123, ticket DES-5. The linking words sit in one list: Linear's closing words (close, fix, resolve, complete, and implement in every form Linear lists, plus the phrase linear issue) and its non-closing words (ref, refs, references, part of, contributes to, toward, towards, and updates); skip and ignore get the same treatment before any identifier, the task's own included, because they unlink a pull request. The guard is idempotent, never inserts the word issue, and a test pins the objective, each criterion, the authored title and body, and the agent summary against the composed title and body, including a phrase inside a code span and one inside a fenced block
  - |-
    The title holds no Linear identifier but the task's own, because a bare identifier in a title links with no magic word. Any other identifier is dropped before the task's key is placed, together with a Linear issue URL or markdown link that carries it and the brackets, backticks, or separator that only framed it, so under task ENG-123 the titles DES-5: Fix login and [DES-5] Fix login both become ENG-123: Fix login, and ENG-1234 compatibility becomes ENG-123: compatibility. An authored title left with no words falls back to the objective, as a blank authored title does today, and an objective left with no words leaves the task's own identifier alone with no separator, or the words Untitled change on a task with none, so the title is never blank. GitHub's closing-keyword rule sees the title after the drop, so Fixes DES-5 #12 can never reach GitHub as a live Fixes #12
  - An identifier counts only when its team key, compared without regard to case, is one the install's Linear connection can see, read across every page of teams once when the pull request text is composed and only when that text holds a key-shaped token other than the task's own, so Fix SHA-256 hashing stays as written on a Linear-tracked project and a pull request that names only its own issue makes no Linear call. The read counts as failed when this install has no Linear connection, when any page fails (a partial list is never used), and on a timeout; only cancellation of the caller's own token propagates. On a failed read the guard matches by shape, the title rule is skipped, and opening the pull request never fails for a tracker reason. A project that is not Linear-tracked makes no Linear call when its pull request opens
  - The {TEAM}-NEW form loses its hyphen, so ENG-NEW becomes ENG NEW and cannot create an issue. It is matched in upper case against those team keys, or by shape when the read failed, and such a token also triggers the read, so brand-new stays as written
  - |-
    On a project that is not Linear-tracked the title and body are byte for byte what they are today: RelayedText.WithoutClosingKeywords is unchanged, and tests pin Fix SHA-256 hashing and Fixes PROJ-1 surviving as written on a Jira-tracked and a GitHub-tracked project
  - The phrases relates to and related to before an identifier are left alone, because Linear documents them as changing no status, and they are how hall9k text may name another issue; a closing or non-closing word before the task's own identifier alone is left alone too
  - |-
    Closeout posts no comment to a Linear issue and changes no Linear state: the pull request adds no Linear code to CloseoutEngine, and the close-linked-issue rule stays GitHub-only
  - On a Linear-tracked project, LinkedWorkItemImport finds a Linear identifier in a pull request's title or body, bare or inside a Linear issue URL with or without its slug, only against the team keys the install's Linear connection can see, read across every page of teams at scan time and only when the text holds a key-shaped token, so an issue from a team other than the project's default is found and a token that merely looks like a key (UTF-8, SHA-256, CVE-2024-1) is not. A Linear identifier wins over a GitHub closing reference in the same text. A project that is not Linear-tracked makes no Linear call and behaves exactly as today. With no Linear connection, or on any failure of either Linear read other than cancellation, the scan adds no context and the adoption or review mint carries on, as an unbound Jira board or an unreadable item does today
  - Because hall9k relies on Linear's branch-name linking and writes no magic word, h9k doctor warns, with no network call, when a Linear-tracked project's branch template carries no {key} token, naming h9k project set <project> --branch-template "{key}-{slug}"; the default task/{shortid}-{slug} template carries no identifier for Linear to link. This covers a template changed after the bind, including --branch-template none, which the warning given at bind time does not see
  - Every Linear call in these tests runs against recorded responses, and no test opens a pull request or touches GitHub
