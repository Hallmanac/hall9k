objective: When a QA or design review report has offered to run the branch locally and the reviewer says yes in their orchestrator window, the orchestrator runs h9k task run-local, which stands that branch up in the pull request's worktree by the project's run skill and reports the address and every human step, so a reviewer walks the change without setting anything up
criteria:
  - A review report's launch offer carries a recorded identity (task, run, worktree) so a yes in the orchestrator window resolves to exactly one branch and worktree without the human naming either; h9k task run-local <task> is the command and it refuses with a sentence when the worktree is gone, the run skill is absent, or another launch of the same task is already up
  - The command follows the run skill's steps in order on that worktree, on an ephemeral port when the skill's launch command allows one, records a launch event with the port and the process, and prints the address or entry point plus every human step from the skill in the order needed
  - Where a step needs a human, the command stops at that step, prints exactly what to do, and h9k task run-local <task> --continue resumes from the next step; the orchestrator relays both to the reviewer as the recipe's normal relay
  - h9k task run-local <task> --stop ends the process and records the event; a launch is torn down automatically when the task closes out or the worktree is removed, never left running
  - |-
    Tests with a fake run skill of three steps and one human step: the launch stops at the human step, continues after it, prints the address, refuses a second launch of the same task, and stops on close-out; a missing run skill refuses with the sentence
  - dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each, and the orchestrator recipe generator gains the one sentence telling a window to run the command on a reviewer's yes
