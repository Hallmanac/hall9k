objective: A member can lay hold of an idea, visibly to the fleet or team, before any task exists, and only the idea's assignee or creator decides its fate
criteria:
  - h9k idea assign <id> [<member>] records an idea assignee with a new ProjectScoped event carrying the assignee's owner id and root fingerprint plus who set it and when; h9k idea unassign <id> clears it with another, allowed only to the current assignee or an Owner-role override. h9k idea show, h9k idea list, and the rendered idea.md show the assignee.
  - Moving an idea to a project becomes h9k idea move <id> <project>, which writes the existing IdeaAssignedToProject unchanged. h9k idea assign <id> --project <name>, or h9k idea assign given a name that resolves to a project and no member, refuses and names h9k idea move (decision ca1f0313).
  - The idea's assignee, or its creator when it has none, may assign it to any member, itself included (a hand-off). Any other Member is refused, including assigning themselves to another member's unassigned idea (decision b8aa9007). Assigning another member to an idea that is not Team-scoped refuses and names h9k idea share. An Owner-role member may override any refusal with --holder and --reason, with the same refusal wording and override announcement h9k task assign gives. The CLI and the receive gate judge by one pure rule over verified owner roots (TaskOwnerRule.Decide may be reused with no holder). Tests cover an assignee handing off (accepted), a creator assigning an unassigned idea (accepted), a Member self-assigning a teammate's unassigned idea (refused), a non-owner naming someone else (refused), and a hand-off of a Fleet-scoped idea to a teammate (refused).
  - Only the idea's assignee, or its creator when it has none, or an Owner-role member with --holder and --reason, may conclude, archive, or promote it (h9k idea archive replaced discard; no verb is added). Owner roots decide, so an idea stays its creator's to decide from every node of the creator's fleet, and an idea captured before this change stays concludable by its creator with no flag. An idea whose creator this node cannot resolve refuses and names the Owner-role override. Cutting a task from an idea (h9k task add --from-idea) and the daemon's spike verdict stay open to any member. Tests cover each refusal, a conclude by the creator from another node of the same fleet (accepted), a pre-change idea concluded by its creator (accepted), and an unresolvable creator (refused, naming the override).
  - Each node's receive gate (EventReplicationInbox) classifies the two new idea events, IdeaConcluded, and IdeaArchived, and judges them by criteria 3 and 4's rule, comparing verified root fingerprints and never raw owner ids. A node records an idea creator's verified root the way TaskCreatorRootRecord does for a task, never from an unverified relayed claim, and an act it cannot yet judge because that root is unknown is held, not applied or dropped. IdeaAssignedToProject, IdeaTaskCut, IdeaSpikeConcluded, IdeaRevised, and IdeaScopeSet are admitted exactly as today. Gate tests (pure) cover a hand-off from the assignee (applied), a self-take of a teammate's unassigned idea (refused), a conclude by an assignee who is not the creator (applied), a conclude by the creator after handing the idea away (refused), a conclude by a non-owner Member (refused), a conclude on an idea whose creator root is unknown (held), and an IdeaSpikeConcluded from a teammate's node (applied).
  - h9k task add --from-idea on an assigned idea does not copy the assignee onto the task; a task carries an assignee only when one is set on it directly.
  - A replication test asserts what a node that does not know the new idea events does when it receives one and after it upgrades, and the PR description states it, that a node on an older build has no idea gate and applies an idea conclude or archive that upgraded peers refuse, and the rule that every node of every member updates before anyone assigns an idea to another member.
  - The docs and the hall9k-cli-reference skill describe idea assign, idea unassign, and idea move. No remaining line in src/, docs/, or .claude/ tells anyone to move an idea to a project with idea assign; the decision logs are history and stay unedited. DispatchedSessionCommandClassification classifies idea move and idea unassign as it classifies idea assign.
