context: |-
  Card D of idea 8d0b724b (ideas/8d0b724b-*/workspace/draft-task.md, report.md, and the rulings in workspace/journal.md). It gives ideas the assignee field card C1 (62d382cc, merged as #690) gave tasks. Unlike C1 it builds new machinery rather than moving a rule: today nothing decides whose an idea is (no idea command checks the actor, IdeaDecider checks state only, TaskActClassificationRegistry lists no idea event, and IdeaCaptured carries only a per-node OwnerId Guid, so a peer has no verified creator root). TaskOwnerGuard, TaskOwnerFactsReader, and TaskCreatorRootRecord are task-only; build the idea equivalents by outcome. The cell B pair 7 challenge (verdict-opus.md and verdict-fable.md in this task's directory) confirmed these facts on origin/main at 7dae1f68f. Vocabulary: call the field the assignee; "holder" is the ledger lock and "claim" is the node lease (the --holder flag on the Owner-role override keeps its meaning). Governing decisions: ca1f0313 (idea assign names a person; idea move moves an idea to a project), b8aa9007 (no self-take of another member's unassigned idea; assignee or creator hands off), 8a5822cc and the 2026-10-01 cross-owner acts ruling (Owner-role override with --holder and --reason), e495334c (capturing an idea never assigns its creator). Request-and-approve is a separate parked idea (c19e644a), not this card. Card C2 (635b5e04) is building in parallel and touches the task verbs, not the idea ones. If the build overruns, the seam is model, verbs, move, display, and docs (criteria 1, 2, 6, 8) before the rule and the gate (3, 4, 5, 7). Tests: no branches, git, or GitHub; gate rules are pure unit tests; the Postgres fixture is fine for projections and replay.
