criteria:
  - The redirect test (A_redirect_never_carries_the_token_to_the_second_server_and_the_retry_without_it_succeeds) no longer compares the whole process environment before and after the call, so a test in another collection that sets or clears an unrelated variable such as HALL9K_TEST_PUBLICATION_JIRA_TOKEN while it runs cannot fail it.
  - The redirect test still fails if, after the call, any test host environment variable whose name starts with GIT_ (which includes GIT_CONFIG_COUNT and every GIT_CONFIG_KEY_n and GIT_CONFIG_VALUE_n entry) differs from what it was before the call (added, removed, or changed), or if any process environment entry's name or value contains extraHeader, the token, or the token's Basic encoding.
  - The code comment above those assertions describes what they now pin, and names no whole-environment guarantee the test no longer makes.
  - |-
    The change touches only tests/Hall9k.Tests/Connectors/GitRemoteAuthenticationLocalServerTests.cs: no product code, no change to RenderSweepTests, no change to any xUnit collection or parallelization setting, and no change to DaemonGitRemoteAuthenticationTests.
  - dotnet test --filter "FullyQualifiedName~GitRemoteAuthenticationLocalServerTests" passes.
