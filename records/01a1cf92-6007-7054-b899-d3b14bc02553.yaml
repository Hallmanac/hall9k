context: |-
  ## What failed

  On the Mac host gate on 2026-11-12, the redirect test failed both gate attempts with "Expected ProcessEnvironment() to be equal to {...} because nothing here writes to this process's own environment, but found additional keys {"HALL9K_TEST_PUBLICATION_JIRA_TOKEN"}". The defect is in the test, not the product, and it fails the host gate for unrelated tasks.

  ## Why, at ee555e7ae

  - `tests/Hall9k.Tests/Connectors/GitRemoteAuthenticationLocalServerTests.cs:54` snapshots the whole process environment through `ProcessEnvironment()` (line 165), and line 70 asserts the whole environment is equal afterwards. Both arrived in ddb42c07d.
  - The class is `[Collection("RealProcessSpawn")]` (line 21). `tests/Hall9k.Tests/Integration/RenderSweepTests.cs` has no collection attribute (its own class collection, `[Trait("Category", "RequiresDocker")]` at line 64), sets `HALL9K_TEST_PUBLICATION_JIRA_TOKEN` at line 1424 and clears it in `Dispose` at line 77. The two run in parallel, so the whole-environment equality races with any test that touches the environment.
  - The product never writes the process environment: `GitRemoteAuthentication.Apply` (`src/Hall9k.Connectors/Processes/GitRemoteAuthentication.cs`, around lines 181 to 215) and `NonInteractiveGit.Apply` (`src/Hall9k.Connectors/Processes/NonInteractiveGit.cs`, lines 31 to 49) change the child's `ProcessStartInfo.Environment` only. They set `GIT_CONFIG_COUNT`/`GIT_CONFIG_KEY_n`/`GIT_CONFIG_VALUE_n`, set `GIT_EDITOR`, `GIT_SEQUENCE_EDITOR` and `GIT_TERMINAL_PROMPT` (NonInteractiveGit.cs:33-35), and remove the five trace variables listed at GitRemoteAuthentication.cs:90-93 (lines 211 to 214). Every variable a regression could write to the host is therefore named `GIT_`.
  - No test in `tests/` sets a `GIT_` variable on the process (they all write to a child's `StartInfo.Environment`), so a before/after comparison restricted to `GIT_` names does not race.
  - The gate's own environment has carried `GIT_CONFIG_COUNT=1` (see `tests/Hall9k.Tests/Connectors/NonInteractiveGitTests.cs:23`), so the assertion must compare before with after; it must not assert that no `GIT_CONFIG_*` key is present.

  ## The smallest fix

  Replace the line 70 equality with a before/after comparison restricted to variables whose names start with `GIT_`. Keep the existing scan loop at lines 71 to 76, which already fails on any entry naming `extraHeader` or containing the token or its Basic encoding. Update the comment at lines 67 to 69 to match.

  ## Out of scope

  - Serializing collections, or changing RenderSweepTests.
  - `tests/Hall9k.Tests/Daemon/DaemonGitRemoteAuthenticationTests.cs`: it scans the environment (lines 44 to 51) rather than comparing it whole, so it does not carry this race.
