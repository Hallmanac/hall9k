objective: A teammate whose Postgres lives on another host learns, from the docs and from the doctor's own refused-connection message, that a container published on one specific address (such as a Parallels network address) cannot start after a reboot until that address exists, and how to bring it back
criteria:
  - docs/operations.md's existing "Postgres on another host" section (under "Network exposure") gains one short paragraph, and no other section changes. The paragraph says that a Postgres published on one specific address (the binding that section's first bullet already recommends) can only start once that address exists; that a Parallels Shared-network address such as 10.211.55.2 exists only once Parallels has brought up its Shared network, so after a reboot in which Docker starts first, that container cannot bind; that Docker's documented restart-policy rule (a policy takes effect only after a container has started successfully, linked to Docker's "Start containers automatically" page) means it is not expected to be retried; and that the fix is to start whatever brings that address up (Parallels and its virtual machine in the example), then run docker start <container> on that machine. It states this as Docker's documented behavior, not as a failure anyone has observed.
  - When the refused-connection diagnosis (reached from h9k doctor, h9k daemon start, and the passive diagnosis any command runs after its own database connection fails) is still refused for an address that is not hall9k's own local container (anything but localhost or 127.0.0.1 on port 5432), the closing line that reads "Is Postgres running? Start it, then try again." today instead names that host and port, says to start Postgres on that machine, says that a container published on one specific address stays stopped if that address did not exist yet when Docker started, even after the address appears, until someone runs docker start on that machine (a Parallels network address after a reboot is the example; nothing detects the vendor), and points at docs/operations.md's "Postgres on another host" section. That path still runs no docker command of any kind. The "Configured (from ...) to connect to ..., but nothing is listening there" line before it is unchanged, and for a local address every line the diagnosis prints today is unchanged, "Is Postgres running? Start it, then try again." included.
  - A new unit test drives the refused-connection diagnosis directly with a refused off-host address (for example 10.211.55.2:5432) and a recording fake process runner, and asserts that the output contains "Postgres on another host", does not contain "Is Postgres running? Start it, then try again.", and that the runner recorded no call at all. A second drives it with a refused 127.0.0.1:5432 address, no fix offered, and a fake runner that answers the docker calls the local path makes, and asserts the output contains "Is Postgres running? Start it, then try again." and does not contain "Postgres on another host".
