context: |-
  Second half of the split of idea fd736bba's task A (walk notes in ideas/fd736bba-*/workspace/notes.md, item A, Brian's addition: evaluate feedback before any fix so a requested change that missed the intent can be challenged). Stacked on a1af8b15, the membership gate, which raises a needs-you item per non-member feedback key and leaves a seam for an assessment. a1af8b15's criterion 3 says the item dispatches no session; this card deliberately changes that to one evaluator, so updating that test here is intended, not a regression. pr-review sessions run under ClaudeSettingsFile.BuildForPrReview (src/Hall9k.Connectors/Prompts/ClaudeSettingsFile.cs about line 421), whose only run-directory write today is mention-answer.md (about line 445), chosen in ClaudeExecutor.cs about 58-66. The evaluator runs on AgentRole.Review (h9k config set --model-review, --effort-review), not ReviewStageComposition; no new model setting. Existing caps to copy: DaemonOptions.cs about 156-185 (mention follow-up turn cap, lifetime cap 3, cooldown). The cap exists because this is the first session a stranger can trigger: once the interaction limit lifts, fifty threads must not mean fifty sessions billed to the owner. Only the recommendation word reaches h9k status and the feed because the orchestrator window reads both with permissions bypassed.
