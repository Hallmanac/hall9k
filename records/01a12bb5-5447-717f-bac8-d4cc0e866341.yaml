objective: Before the owner decides on a non-member's review feedback, a read-only evaluator session assesses it against the task's intent, and the assessment appears on that feedback's needs-you item
criteria:
  - Each needs-you item a1af8b15 raises for non-member feedback dispatches at most one evaluator session, however many polls observe the feedback and across a daemon restart, under the pr-review permission file and never --dangerously-skip-permissions, with a hard turn cap the way a mention follow-up has one; one task never dispatches more evaluators in its lifetime than a daemon option that defaults to 3 allows (the AutoPrReviewMentionFollowUpCap pattern), and feedback past that cap still raises its needs-you item; the permission file gains exactly one new write path, that feedback's own assessment file in the run directory
  - The evaluator reads the feedback against the task's objective and acceptance criteria and writes an assessment that says whether the requested change serves the task's intent, what it would change, and a recommendation (fix, decline, or ask); on h9k status and in the feed, the needs-you item shows only that recommendation word and the path to read the assessment, never the assessment's prose, and no skip-permissions prompt carries the assessment before the owner's go
  - The evaluator never posts to GitHub, never pushes, and never files an idea or a task; its prompt fences the feedback text as outside data, never instructions
  - When the evaluator fails, times out, writes nothing, writes a recommendation outside fix, decline, or ask, or is past the cap, the needs-you item stays and says so; the owner's go and decline work exactly as without an evaluator, including while the evaluator is still running, and an assessment that lands after the owner acted changes nothing
  - Unit tests cover one evaluator per feedback key across two polls, feedback past the per-task cap (its needs-you item is raised, with no evaluator), the permission file's single new write path, the needs-you item carrying the recommendation and path but none of the assessment's prose, the evaluator-failure case, the owner's go while the evaluator is still running, and a mixed poll where a member's lap and a non-member's item arrive together and the evaluator still dispatches; no new test creates a branch, touches git, or calls GitHub
