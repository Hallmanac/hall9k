objective: |-
  A newcomer can learn hall9k's distributed-team model from the user docs alone: docs/concepts.md gains one section covering identity, fleet, membership, invites, the ledger and message refs on the project remote, and cross-node task holding; docs/cli.md, docs/operations.md, README.md, docs/getting-started.md, and docs/INSTALL.md carry the commands, settings, on-disk and on-remote side effects, and the word fleet wherever more than one machine is meant
criteria:
  - docs/concepts.md has one new section a newcomer can read top to bottom that explains signing keys and the owner root, membership roles with vouch and revoke, invites and GitHub attestation, the ledger and message refs on the project remote, and cross-node holding (holder, HeldElsewhere, take, grant, refuse, handoff, placement, scope); every claim in it is checkable against the CLI's --help text or the v0.10.44 code.
  - The word fleet means an owner's own nodes wherever the docs speak of more than one machine, and the older phrasings are gone.
  - docs/cli.md lists every command and flag in this theme that h9k --help and its groups print (owner, node, members, vouch, revoke, invite, message, messages, take, grant, refuse, handoff, scope, share, assign --node, and their flags), with one sentence each, and nothing it lists is absent from --help.
  - docs/operations.md says what registration and joining write on disk (the keys directory) and on the remote (the refs), documents the take-policy, take-timeout, and message poll settings in its settings blocks, and shows the needs-you rows this theme adds.
  - README.md, docs/getting-started.md, and docs/INSTALL.md describe the registration side effects and the invite flow where a first-time reader meets them, and the existing docs/concepts.md sections on leases and the shape of the system are amended, not contradicted.
