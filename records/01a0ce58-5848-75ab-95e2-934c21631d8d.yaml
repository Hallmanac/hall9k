objective: |-
  A Windows ARM64 machine installs and updates hall9k from a GitHub release the same way the three existing platforms do: every release carries a hall9k-win-arm64.zip asset with self-contained h9k and h9kd binaries, and h9k update on such a machine fetches it instead of failing for want of an asset
criteria:
  - Every release from the next tag on carries hall9k-win-arm64.zip, produced by a fourth release.yml matrix line (windows-latest, rid win-arm64) that cross-publishes both projects self-contained from the existing x64 runner; the tar and zip archive steps both key on the win- prefix instead of the literal win-x64, so win-arm64 gets exactly one archive and the per-RID checksum step still sees one file; checksums.txt lists all four assets.
  - ReleasePlatform's map is a table of four (architecture, OS) rows to RID; CurrentRid() looks the running machine up in it, and the RID list h9k update prints on an unsupported platform is derived from the same table; ReleasePlatformTests covers the ARM64 Windows row through the lookup without depending on the host machine, the win-arm64 zip extension, and asserts the host's own RID is null or in the shared list; no real download.
  - On an ARM64 Windows machine h9k update downloads hall9k-win-arm64.zip and verifies it against checksums.txt exactly as win-x64 does today, including when the running h9k is the x64 build under emulation (the map keys on OSArchitecture); nothing else in UpdateCommand or ReleaseArchive changes.
  - scripts/install.ps1 picks win-x64 on x64 and win-arm64 on ARM64 with a probe that answers the same under Windows PowerShell 5.1 and PowerShell 7, native or emulated (the machine-scope PROCESSOR_ARCHITECTURE value unless the colleague's observed probe on the card shows OSArchitecture already reports Arm64 under 5.1), refuses any other architecture by name, and its header no longer says x64 only; scripts/install.sh is unchanged.
  - docs/INSTALL.md, README.md's install section, and docs/operations.md name Windows ARM64 wherever they list the release platforms; the pull request states that dotnet publish -r win-arm64 --self-contained of both projects succeeded on the build machine and reports the PE machine type of the published h9k.exe and h9kd.exe as ARM64 (0xAA64); the first release run after merge (five assets) and the install on the operator's Parallels ARM64 VM are recorded on the card by the orchestrator and the operator, not claimed by the build session.
