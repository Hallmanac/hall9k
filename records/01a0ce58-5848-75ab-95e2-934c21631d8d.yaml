context: |-
  Origin (Brian, 2026-09-23): a colleague runs hall9k on Windows ARM64 inside Parallels on a Mac (Docker and the Postgres container run natively on the Mac and the VM reaches them over the Parallels shared network). No win-arm64 asset exists, so that machine can only install from source with h9k install --repo and the .NET SDK, and h9k update has nothing to fetch. The release workflow (.github/workflows/release.yml) is a three-line matrix (osx-arm64 on macos, win-x64 and linux-x64) doing dotnet publish --self-contained per RID plus a zip for win-x64; win-arm64 is a fourth matrix line cross-published from a windows-latest runner (no ARM runner needed for a self-contained publish), zipped like win-x64, listed in checksums.txt, and recognized by whatever in h9k update maps the running platform to an asset name (check RuntimeInformation.OSArchitecture handling there). The post-cuts-after-release-assets rule then counts five assets, not four; update the orchestrator's journal grant line and the Windows post text when this ships. Walked with Brian 2026-09-24 and challenged by a headless session the same morning (verdict in this task's journal.md); Brian accepted the verdict's criteria and calls.

  Challenge findings that shape the work (2026-09-24): the cross-publish is purely managed (no PublishAot, ReadyToRun, PublishTrimmed, or RuntimeIdentifier anywhere; the only RID-scoped package asset is System.Diagnostics.EventLog's OS-keyed managed runtimes/win/lib file; every Windows P/Invoke uses IntPtr and Marshal.SizeOf), so the fourth matrix line needs no ARM runner. release.yml keys BOTH archive steps on the literal win-x64 (tar on !=, zip on ==); both must key on the win- prefix or win-arm64 gets two archives and the per-RID checksum step (archive=$(ls hall9k-<rid>.*)) fails the whole release. Everything downstream globs. ReleasePlatform.CurrentRid() is a parameterless tuple switch, which is why ReleasePlatformTests can only assert the host; the four-row table is what makes the ARM64 test possible and is also where the refusal list in UpdateCommand.cs (line 84 at 7e451f71a) comes from. Key on OSArchitecture, not ProcessArchitecture: an x64 h9k running emulated on ARM64 Windows then fetches win-arm64 on its next update, which is the migration wanted. scripts/install.ps1 lines 55-59 are the only architecture logic and its header says x64; it runs under Windows PowerShell 5.1 by default (the iwr | iex one-liner in INSTALL.md), and whether 5.1 on ARM64 reports Arm64 through RuntimeInformation.OSArchitecture is unverified; the machine-scope PROCESSOR_ARCHITECTURE value reads ARM64 under every host, native or emulated, and AMD64 under the 32-bit Windows PowerShell (x86) on x64. Brian is asking the colleague to run in the VM: $PSVersionTable.PSVersion; [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture; [Environment]::GetEnvironmentVariable('PROCESSOR_ARCHITECTURE', 'Machine'); if the answer is on the card by the time you reach the script, write the probe to it, otherwise use the machine-scope variable. Proof: release.yml runs only on a version tag and ci.yml never publishes with a RID, so no pull request can name a CI run that built win-arm64; the honest proof is a local dotnet publish -r win-arm64 --self-contained true of both projects (a managed cross-publish from macOS works like the runner's) and the PE machine field of the published h9k.exe and h9kd.exe (e_lfanew at offset 0x3C, machine at PE+4; 0xAA64 is ARM64, 0x8664 would be an x64 payload under an arm64 name). Notes to the orchestrator, not for the build session to act on: at closeout the four-asset gate becomes five (journal grant line, memory post-cuts-after-release-assets, the Windows post text) and the first tag after merge is the CI proof, recorded on the card with the run id; the colleague's source-built h9k carries the old map and refuses update until it is itself replaced, so their first release install is install.ps1 or one more h9k install --repo from a checkout at or after the merge, and every update after that works; a permanent PE machine-type check in release.yml is parked. docs/scope.md's history line about three platforms stays as history.
