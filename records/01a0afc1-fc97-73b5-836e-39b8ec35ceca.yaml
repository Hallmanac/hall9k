objective: A team member declares zero or more review personas (engineer, qa, designer) on their member record, and a pull request assigned to them runs one review session per persona on the pr-review task's single worktree, with no persona meaning today's engineer review and every review carrying the standing question of whether the change altered how the application runs locally
criteria:
  - |-
    A team member declares zero or more personas from the fixed set engineer, qa, designer on their own member record: the local owner record today through h9k owner set --persona (repeatable, --clear-personas to reset) and the ledger member record once the distributed-team chain ships; h9k owner show prints them; no persona reads as engineer, so nothing changes for anyone who never declares one
  - When a pr-review task is minted (a review request, a mention, or h9k task add --type pr-review --from-pr), the run reads the assignee's personas and dispatches one review session per persona through a persona registry mapping each persona to its prompt and criteria; engineer maps to today's PR review prompt unchanged; a persona with no registered prompt is named in the report as skipped, never silently ignored
  - Every persona review of one pull request runs on the pr-review task's single worktree and branch as separate sessions with their own transcripts and findings files; the task's report carries one section per persona in the fixed order engineer, qa, designer, and the walk-pr-review-findings flow presents them together
  - An assignee holding several personas gets every matching review on the one task; h9k task show lists which personas ran and which reports are in, and a persona whose session failed is named rather than dropped
  - Every review cycle inside a task run and the engineer's pull-request review carry one standing question, whether this change altered how the application runs locally; a yes is a finding of the new kind run-skill drift, routed like any finding (fixed in the pull request by updating the run skill through the daemon's event, or carried as a ride-along); a no is recorded as checked so the report shows the question was asked
  - |-
    Tests: persona set and show round-trip on the owner record; selection dispatches one session per persona and the engineer prompt when none is declared; an unregistered persona is named as skipped; the report carries the per-persona sections; a golden test shows the drift question in every review prompt; a drift finding routes
  - dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each, the log recording the fixed persona set and that no persona means engineer
