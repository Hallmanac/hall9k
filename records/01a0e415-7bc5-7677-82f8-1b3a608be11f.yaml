objective: The doctor's guarded Postgres recreate waits until the recreated container accepts connections before its reachability probe, so h9k update --restart completes and restarts the daemon instead of exiting 1 and leaving it stopped
criteria:
  - |-
    After the doctor's --yes recreate (the 359e0d7a path), the reachability probe runs only once the container is ready: it retries a real connection (or docker's pg_isready) with a bounded wait, and exits nonzero only after that wait expires, naming the wait it tried
  - h9k update --restart on a node whose guarded recreate runs finishes with the daemon running on the new binaries, with no second doctor or daemon start by hand
  - A unit test over the recreate-then-probe sequence proves the probe is retried until ready and fails loudly after the bound, with no real container or sleep (injected clock or probe)
