objective: |-
  A content task (documentation, skill markdown, prompt templates, other non-compiled files) runs a lighter pipeline by default: its type selects skipped build and test gates and a single review lens, so a README or skill change clears the pipeline in minutes rather than hours while the type can never carry compiled or tested code past the gates
criteria:
  - |-
    h9k task add and h9k task revise accept --type content. A content task dispatches with the conformance-only review composition by default, recorded on the run's stream at dispatch exactly as the composition already is, and the type itself is the acknowledgment, so no --accept-reduced-review is required; the existing composition flags still override it per task. The build and test gates are not the type's concern: they skip by d05e141c's evidence, which criterion 2 guarantees always holds for a content task
  - At every entry into the gates, a content task whose diff includes any path outside the project's non-executable set fails the pre-gate check naming each offending path, with the same outcome a failed gate has today, so the type can never carry compiled or tested code past a reduced review. The check uses the classifier and the project set d05e141c builds, never a copy, and honours a project's added globs
  - |-
    The Decisions Log entry names ef2fefe5 as the baseline (3 hours 22 minutes claim to merge, 44 minutes of gates, 54 minutes of review on a two-file skill fix) and states the target: under 30 minutes claim to pull request for the same shape as a content task. The measurement itself comes from the record of the first content task to merge and is not this pull request's to produce
  - |-
    Tests prove: a content task dispatches with conformance-only recorded and no acknowledgment demanded; an explicit composition flag overrides the default; a content task diff with one path outside the set fails naming that path; a content-only diff passes the check and skips the gates through the shared classifier; the other six types dispatch exactly as before. docs/scope.md and the CLI help describe the type, its default, and the refusal with one worked example, and PLAN.md's Decisions Log gains the next-numbered entry beside d05e141c's
