context: |-
  Discovery for idea f8212260: findings.md and journal.md in the idea's workspace; the challenge's evidence is notes/challenge-6c797e04/journal.md in the project home. Brian ruled (2026-10-29) that ideas stay in member projects only, that this piece ships apart from onboarding, and, at the publish walk, what the solution window is: a standalone interactive window that monitors the member project orchestrators and directs them to act on the solution's behalf, prompting the user with a member's launch line in a new terminal whenever that member has no live orchestrator, so project orchestrators are expected to be running interactively almost always. The solution window therefore registers no presence of its own and never drains a member's feed; a solution-level presence and a courier over every member's feed are parked with the trigger that directing by message proves too slow for daily use. Blocked by the solution base task, not stacked on it: this piece edits commands the base introduces (h9k solution add, show and close), so it must be cut from main after the base merges, which a plain blocked-by already guarantees; stacking would only start it earlier at the cost of replays while the base is in review. It runs beside 3cc0afdc, which also edits the solution command tree and the cli-reference skill, so expect a keep-both rebase there. Reuse rather than copy: LaunchAnchorDocument.WriteStep, RecipeSettingsDocument.WriteStep, RecipeSkillPublisher.Seed, SkillSeeder.Seed and the ProjectHomePaths helpers all take a bare home path; ProjectHomeRecipe and ProjectAgentsDocument are project-specific (they read ProjectDetails and materialise repo/), so the solution needs its own small builder and renderer. Put the AGENTS.md renderer in Hall9k.Domain beside the task and idea renderers, because both the CLI and the daemon's ProjectHomeRenderEngine call it. h9k orchestrator register requires one project and keys presence by node and project, so a solution window registering against a member would collide with that member's own window.
