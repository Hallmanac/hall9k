objective: A solution has a thin home on every node that holds it, at ~/.hall9k/solutions/<name>, with an AGENTS.md the platform keeps current that names each member's home, and the orchestrator recipe generator gains a solution mode, so one interactive solution window can read the solution board, walk member projects' ideas, cut tasks into any member, and direct each member's own project orchestrator, handing the user that member's launch line whenever none is live.
criteria:
  - |-
    h9k solution init <name> creates or repairs the solution home at ~/.hall9k/solutions/<name> on this node (the path is a convention, so nothing needs to record it), is idempotent, and reports each step the way h9k project init does; h9k solution add runs it for the new solution. The home holds recipes/launch-anchor.md and recipes/settings.json rendered by the existing platform writers (settings resolved through the node's orchestrator model and effort, since a solution has no project override), the orchestrator-recipe-generator seeded into recipes/ and .claude/skills/, and the canonical skill set seeded into skills/; it has no repo/, ideas/ or tasks/. An AGENTS.md already at the path that the platform did not render is refused before anything is written, and the recipe skill never writes the anchor or settings.json (Decisions Log #147, #155).
  - |-
    The solution home's AGENTS.md is a platform render of the solution's membership: the solution's name, and every member project with its repository URL and either its home path on this node or a plain statement that this node has not joined it. The daemon's home render sweep re-renders it whenever those facts change, including a membership that arrives by replication and a member this node joins later, and writes only when the bytes differ; the CLI writes the first copy at init so the file exists before the next sweep.
  - h9k solution show prints the solution home's path on this node, or says there is none and names h9k solution init; h9k solution close leaves the home on disk and says so.
  - h9k orchestrator refresh-anchors, and so h9k install and h9k update, also refreshes the launch anchor in every solution home on this node that already has one, and the anchor's registration step tells a window launched in a solution home that, like a node window, it registers no orchestrator presence and never drains a member's feed.
  - |-
    The orchestrator-recipe-generator skill (the repository copy under .claude/skills, which install publishes) gains a solution mode beside project mode and node mode, resolved by matching the working directory against the home path h9k solution show prints, and writes a solution orchestrator recipe and its scoped-session recipes. That recipe makes the solution window a director of the member project orchestrators: on start-up and on ask it reports each member's presence from h9k orchestrator status --project <member> and the board from h9k solution show; any act that belongs to a member (a park ruling, a merge, a dispatch or placement, reading or draining that member's feed) is sent to that member's live orchestrator by name through ListAgents and SendMessage and the outcome relayed, exactly as a project window already forwards node-scope commands; and when the member's orchestrator is not live the window stops, prints that member's own launch line from h9k orchestrator project <member> for the user to open in a new terminal, and continues once it is up. Reads that need no window (task show, idea list --project <member> once per joined member, epic show) run locally; ideas stay in member projects and tasks are cut into a member with --project.
  - Unit tests cover the AGENTS.md render (a joined member, a member not joined here, a renamed solution, a member added by replication) by assertion on the rendered text, the home layout in a temporary directory, the refusal of a foreign AGENTS.md, and the anchor refresh reaching a solution home; no test creates a branch, clones a repository or touches GitHub.
  - docs/scope.md and the hall9k-cli-reference skill describe the solution home, h9k solution init, the solution-mode recipe and the director relationship to member orchestrators.
