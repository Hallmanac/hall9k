objective: The replication outbox never moves its bookmark past an event that was still being written when it swept, so every event a node writes reaches its peers.
criteria:
  - |-
    An event that got its number before a sweep but committed after it is still sent, and nothing numbered after it is sent ahead of it. A test proves it: it holds one write open while a later-numbered write commits, shows a sweep then queues neither, commits the held write, and shows the next sweep queues both.
  - A number that is taken but never written (as when a writing process dies) holds the outbox back for no longer than a bounded wait named in the code, after which later events are sent normally, and a gap already waited out is never waited on again, including on the rescans a held-back private event causes. A test takes a number without writing it and shows the later event is not queued before the wait passes and is queued after it; a second test holds a private event below a waited-out gap and shows a new event is queued on the next sweep without a second wait.
  - |-
    The outbox's existing behavior is otherwise unchanged: its existing tests (private hold-back, scope-widening resend, envelope caps) pass with their assertions untouched.
