objective: Another node's foreign-session ceiling expiry never replaces a challenge or refinement outcome that the dispatching node recorded, and a node whose replication is behind does not record such an expiry on the first sweep that finds the dispatch overdue.
criteria:
  - |-
    When a draft's stream holds challenge session S's dispatch, a verdict for S recorded by the node that dispatched it, and another node's DispatchExpired failure for S, in either order, TaskAggregate and TaskDetails end exactly as the same stream without the expiry would leave them. That covers the latest challenge outcome, the latest verdict, the running session's standing, RevisedSinceChallengeVerdict, LatestChallengeVerdictJudgedOlderDraft, and RevisedSinceLastDraftSession. So `h9k task show` prints no failed challenge line for S, and TaskDetails shows no challenge running with the verdict as the latest outcome, which is the fact the plan loop absorbs. The publish gate reads the verdict in both orderings; that part is a regression guard, because a failure already never replaces the latest verdict. A DB-free test applies the following to both the aggregate and the projection and compares each result against the same stream without the expiry: (a) dispatched S, a person's revision, the verdict, a second revision, then the expiry; (b) dispatched S, a person's revision, the expiry, then the verdict. Both orderings fail without the change.
  - The same holds for a refinement session R. When R's dispatch, an outcome for R recorded by the node that dispatched it, and another node's DispatchExpired failure for R are all on the stream, in either order, TaskAggregate and TaskDetails end exactly as the same stream without the expiry would leave them. That covers the latest refinement outcome, the running session's standing, RevisedSinceLastDraftSession, RevisedWhileRefinementRan, and JudgedSinceChallengeVerdict. A DB-free test covers both orderings on the aggregate and the projection, each with a person's revision made while R ran, and fails without the change.
  - A DispatchExpired failure recorded for a challenge or refinement session S changes nothing on the draft when it arrives after a later session T of the same kind was dispatched, whether T is still running or has already recorded its outcome. The same is true of the dispatching node's own outcome for S when it arrives after T was dispatched on a node that had expired S. "Nothing" covers T's standing (session id, node, dispatch time, model and effort), the latest outcome, the latest verdict, ChallengeRequested, and the revision facts. A DB-free test covers both kinds, on the aggregate and the projection, with T running and with T recorded. The challenge cases, and the refinement cases with T already recorded, fail without the change.
  - |-
    Neither DraftChallengeEngine nor PlanEngine ends another node's dispatch on the first sweep that finds it past the foreign-session ceiling. It ends one only if the dispatch is still standing when a later sweep of the same engine runs at least a settle period after the first. With default options the settle period is at least five minutes, so it spans several of the message sweep's idle intervals (MessageIdlePollMaxSeconds), and a replication read that fails right after a node wakes still leaves later attempts inside the period. An integration test per engine does the following on one engine instance: seed an overdue foreign dispatch, run a sweep that records nothing, append the dispatching node's outcome, run a second sweep after the settle period has passed, and find no DispatchExpired on the stream. Without the change, the first sweep records one.
  - A dispatch from a node that never records an outcome is still ended once it has stood past the ceiling and stayed standing through the settle period. The existing tests for this, Another_nodes_dispatch_stands_until_the_foreign_ceiling_and_is_then_ended_so_the_draft_can_be_challenged_again in DraftChallengeEngineTests and Another_nodes_refinement_dispatch_stands_until_the_foreign_ceiling_and_is_then_ended_on_the_task in PlanEngineTests, still pass, changed only to run both sweeps on one engine instance and to account for the settle period.
  - docs/cli.md, where it says a dispatch another node made is ended past the foreign-session ceiling, also says the dispatch is ended only after the settle period and that the dispatching node's own outcome wins over an expiry. If the settle period is a new daemon option, the options table in docs/operations.md has a row for it.
