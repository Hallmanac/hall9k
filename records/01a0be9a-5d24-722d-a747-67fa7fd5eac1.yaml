context: |-
  Captured 2026-09-20 07:4x EDT by the Mac project window on the node pin's first cross-node re-placement. Evidence: on the Mac (v0.10.8, the genesis node for hall9k, root c8f5c859..., node 01a00d41-5b80-753d-a3f1-070b25e490e4), h9k task assign 504c9c3b --node 01a00d41-5b80-753d-a3f1-070b25e490e4 answered 'Node 01a00d41-5b80-753d-a3f1-070b25e490e4 is not vouched into this owner's fleet for this project — h9k node vouch ... first'. The Mac's own node file is on the ledger (nodes/<mac>/node.yaml) and the root is owners/c8f5.../root.yaml, but only Windows has owners/<root>/nodes/<id>.yaml (vouched 2026-09-19 12:51 by invite); the root never vouches itself, and the placement resolver (TaskAssignCommand's fleet resolution from 693ffe5d, PR #506) only reads the vouched set. Workaround applied: the root vouched itself with h9k node vouch, then the placement succeeded. Pointers: TaskAssignCommand.ResolveNodeIdAsync and the fleet seeding fixed in cycle 1 of 693ffe5d (this install's own node id auto-qualifies only when the task is its own owner's work; the root case is the same gap seen from the fleet side), TrustChain / TrustedOwner (the root is the chain's origin), h9k project members. Lineage: a follow-on to the node pin, not a fix of a fix. Placement: either node.
