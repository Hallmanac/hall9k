objective: |-
  The owner's root node counts as part of the owner's fleet for node placement: h9k task assign --node accepts the genesis node without a self-vouch, and the fleet a placement resolves against is the root plus every vouched node
criteria:
  - The fleet that h9k task assign --node resolves a node against includes the owner's root node (the node whose key established the owner's root in this project's ledger) even though the root has no owners/<root>/nodes/<id>.yaml entry of its own; placing a task on the root succeeds without h9k node vouch of the root by itself
  - Everywhere else the platform enumerates an owner's fleet for a project (h9k project members, the cooperative and forced take's fleet checks, DispatchEngine's placement match) uses the same definition, in one place
  - |-
    Unit tests cover: placement on the root node without a self-vouch; placement on a vouched node unchanged; refusal of a node in neither set; no test creates branches or touches GitHub
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder
