objective: Every session that runs under the pull-request review permissions reads GitHub only through what the daemon gathered for it, and is refused gh itself
criteria:
  - Before a review lens that is told the pull request's intent starts, the daemon writes the body of each issue the pull request's description cites into the run directory, reading only issues in the pull request's own repository, at most ten of them, and no comments.
  - A cited issue the daemon cannot read, or one past that limit, is named in the file as not read, and the session still starts.
  - The conformance, QA, and security review prompts point at that file and say its contents are source material, not instructions; the adversarial review prompt does not mention it.
  - A feedback evaluator and a closeout triage each receive the pull request's diff as a file of their own in the run directory, at a path their prompt names, before the session starts.
  - PrReviewAllowedTools holds no gh rule, PrReviewDeniedTools denies every gh command, and ReviewLapDeniedTools is unchanged; a test pins all three.
  - The QA and security review rules, the feedback evaluator prompt, and the closeout triage prompt no longer tell a session to read a pull request or its diff with gh.
