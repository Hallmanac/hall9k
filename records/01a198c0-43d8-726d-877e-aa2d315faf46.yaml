context: |-
  From issue 788. Least privilege: a read-only review should use no credential it does not need. Blocked by the standalone clone task, not stacked: both edit the same list. Write the evaluator and triage diff files the way the pre-flight's pull-request.diff is written in RunLauncher, per session, as AssessmentPath is named, because several sessions can share one run directory. The deny belongs in PrReviewDeniedTools because the human review lap shares ReviewLapDeniedTools and keeps its reads. Out of scope: the shared review-read-scope fragment and its read command, the pre-flight's Do not run sentence, and any change to the human lap. Update the doc comments on BuildForPrReview and PrReviewAllowedTools.
