objective: Remove another project's identifiers from hall9k's current source tree, replacing them with consistent neutral stand-ins, so the public repository names no other project, organization, repository number, or teammate
criteria:
  - A case-insensitive PCRE search of every tracked file with the private patterns file (git grep -l -i -P -f <file>) returns nothing, covering code, tests, docs, skills, .claude/, and both legacy files; and a search for each name without a word boundary finds only innocent substrings inside ordinary identifiers, which the pull request lists by file and line without quoting any identifier.
  - Every pull-request or issue number that points into the other project's repository is removed or made generic; references into other tools' trackers, fixture numbers on placeholder repositories, and the decisions-citation test's sentinel number are unchanged; the pull request says how many numbers were changed.
  - |-
    Replacements read naturally and consistently: test fixtures use neutral stand-ins that share no word with text the product renders (for example sample-project for a project name, and logins like reviewer-a and reviewer-b), each used the same way across files; comments that record where a rule came from keep the date and the lesson and refer to 'a teammate's project' or 'a teammate'; docs and the legacy files use whichever generic phrase reads best in the sentence.
  - |-
    Only names change: no test is deleted or weakened, every test asserts what it asserted before, production code changes only in comments and in string literals that are examples or help text, and both CI legs pass. A production literal that turns out to be real configuration rather than an example is left unchanged and named in the pull request (generically) for the maintainer.
  - |-
    Nothing the change produces leaks what it removes: commit messages, the pull-request title and body, every comment or reply this task's sessions post on the pull request, and this task's records use only generic wording; the patterns file is never copied into the repository, and no guard test that lists the identifiers is added.
