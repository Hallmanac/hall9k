context: |-
  The identifiers to remove are listed, as case-insensitive PCRE patterns, in the private file /Users/brianhallmanac/.hall9k/projects/hall9k/notes/naming-sweep-2026-10-13/terms.txt on this Mac. Search with git grep -l -i -P -f <file>; do not use -E, because macOS git grep -E silently ignores \b and misses about a third of the matches. Never copy the file, quote it, or name any of its entries in the repository, a commit message, the pull request, a PR comment or reply, or this task's records. On origin/main ddfd2d9ad the patterns match 94 tracked files: test fixtures that use the other project's name as a sample project and teammates' names and logins as sample commenters (about 51 files under tests/), code comments recording where a rule came from (src/), docs (including a design document whose protocol walkthrough uses one of the names as a persona: replace it with a neutral persona name), .claude/skills, and two legacy files embedded in src/Hall9k.Domain, the v0 decisions log and its sibling agents-standing-rules.md (Brian ruled both are swept; the importer keys entries by citation, so rewording never re-imports; ledger decision events already imported are outside the tree and out of scope, do not touch the ledger). Teammates' first names count. The word-boundary patterns do not split compound code identifiers (camelCase, underscores, joined logins, test method names), so also search each name without a word boundary and use judgment: at least one ordinary hall9k identifier contains a first name across a word join and must stay. Pull-request and issue numbers that point into the other project's repository count; hall9k's own PRs are below 1000, and references into other tools' trackers (the .NET runtime, the gh CLI, Claude Code), fixture numbers on placeholder repositories, and the decisions-citation test's sentinel number are innocent and stay. Stand-ins must share no word with text the product renders (for example not 'teammate' as a login, since tests assert on that word in rendered output). This is the first pass; a history rewrite is a separate, later idea and out of scope. Walked with Brian 2026-10-13, challenged the same day (verdict in this task's journal); house rule (2026-10-12): hall9k records refer to another project only generically.
