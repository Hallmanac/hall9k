context: |-
  Found by the challenge of 9b4bfd1d (its Parks section); revised by d48a7874's own challenge (/Users/brianhallmanac/.hall9k/runs/01a19cca-97c7-716e-989e-9b3822229736/challenge-report.md: both musts and both shoulds applied) and by Brian's 2026-11-02 ask that the unseen blocker be shown, not silent. The sweep runs on every node over every Blocked task (DispatchEngine.cs:709-712) and treats an unknown blocker id as gone (TaskDependencyResolver.cs:150-170, 263-266), recording TaskDependencyFailed, which is project-scoped (EventScopeRegistry.cs:107), so a teammate's node that joined only the dependent's project parks it for everyone; a node that sees the blocker lifts it again, so two views flip the hold each cycle (TaskDependencyResolver.cs:161, 208-218; TaskAggregate.cs:1818-1833). Edges are bare ids (TaskAdded.BlockedBy, TaskAssigned.UnmetDependencies), and a purge deletes the project's ProjectDetails (ProjectPurgeEngine.cs:358-360), so neither tells an unseen project from a purged one; a purge record this node wrote is the evidence. 9b4bfd1d touches the same resolver's recovery and DeathReason text but not the missing-id loop; expect at most a trivial text merge. Release note owed: the flip-flop ends only when every node in the project runs this fix. Brian wants it before v0.17.0.
