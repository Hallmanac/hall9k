objective: A node that has no record of a blocker leaves the dependent task Blocked instead of recording the dependency as failed, unless this node itself purged the blocker's project, so one node's partial view never parks a correctly blocked task for every node.
criteria:
  - When the dependency sweep meets a blocker id that names no task on this node, it records a TaskDependencyFailed for it only when this node's own purge record names that id as a task this node destroyed while purging a project. Otherwise it records nothing and leaves the dependent Blocked, whatever project the blocker belongs to. A blocker in a project this node has not registered and joined, or one whose events have not reached this node yet, therefore never parks the dependent.
  - Purging a project on this node records the ids of the tasks it destroyed, on this node only, in the same save that destroys them, and that record never replicates. A dependent whose blocker this node purged is still recorded as failed, with the same reason it gets today.
  - |-
    The pull request description states the rule and why it was chosen: a dependency edge records no project for its blocker, and a purge deletes the blocker project's own record, so neither one can tell an unseen project from a purged one. A purge this node carried out is the only evidence the sweep relies on.
  - Tests cover these cases. A missing blocker with no purge record leaves the dependent Blocked with no TaskDependencyFailed, both when the blocker was in another project and when it was in the dependent's own project. A blocker destroyed by a purge on this node still fails the dependent, and the existing purge integration test keeps passing unchanged. A node with no purge record does not record the failure again after another node lifted the hold. The tests may be unit or integration tests. No test spawns an agent or touches GitHub.
  - On the node that cannot see it, the blocker is shown as an unknown blocker wherever that node reports the task (h9k status, h9k task show, and the orchestrator feed the courier delivers), named by its short id only and never its objective, with a hint that it most likely belongs to a project in a solution held on a teammate's node and the user can ask that teammate about it. Wording and placement follow the existing blocked-reason lines; a golden or unit test pins the line.
