context: |-
  Reported by a teammate on a shared project: the owner's pr-review task replicated to the teammate's node, and h9k task add --from-pr on that pull request refused, printing it as 'already this node's pr-review task'. Cause on origin/main 8fd49cdb0: FindPrReviewHolderAsync (src/Hall9k.Cli/Commands/TaskAddCommand.cs:1026-1048) and RefuseSecondAdoptionAsync (:1150-1191) filter on reference, type, and state with no owner scope; the misattributing words are at :1061, reached through :565-569; --again skips the lookup and goes to the guard (:909-913); the guard is shared with --from-issue and --from-jira (:545, :555, :915); the owner root is already resolved at :542. The daemon owner-scopes the same check via src/Hall9k.Daemon/AutoPrReview/OwnerScopedCoverage.cs (commits eb3690792, e2b1642d8), which is internal to the daemon; Hall9k.Cli references only Domain and Connectors, and everything the helper uses is already public in Domain, so move it and tests/Hall9k.Tests/Daemon/OwnerScopedCoverageTests.cs into Domain as public (Brian's ruling: one rule, DRY). The daemon request path mints alongside a teammate's live review (AutoPrReviewEngine.cs:1232-1236), so this matches existing platform behavior. The guard takes the first match with FirstOrDefaultAsync (:1180); ownership is not SQL-filterable, so read the candidates and filter them, oldest first as today. NextStepFor (:1072) is unchanged; the guard's own refusal text (:1187) stays. Model the new tests on tests/Hall9k.Tests/Integration/RepeatPullRequestAdoptionTests.cs. Out of scope: h9k pr review's refusal when only a teammate's live task covers a pull request (deliberate, PullRequestReviewCommand.cs:330-341; parked as a parity question); why the teammate's daemon did not auto-mint.
