objective: h9k task add --from-pr counts only the caller's own pr-review tasks on a pull request, so a teammate's replicated review never blocks or is named as this node's
criteria:
  - For a pull-request reference, h9k task add --from-pr considers only pr-review tasks that this node's owner root may act on by TaskOwnerRule with no Owner-role override, the way OwnerScopedCoverage judges them, in both the existing-holder lookup (FindPrReviewHolderAsync) and the one-live-task refusal (RefuseSecondAdoptionAsync), with or without --again. A teammate's pr-review task on the same pull request, in any state, neither refuses the mint nor is printed as the holder.
  - A pr-review task this node cannot attribute to any owner is never minted over, exactly as this owner's own task is not. In a state the command names (AwaitingAuthor, Done, or NeedsHuman with follow-through open), the message names the task and says this node cannot yet tell whose task it is, rather than calling it this node's, and no task is created. In any other live state, the command refuses it as it does today.
  - The CLI and the auto-pr-review engine judge pull-request coverage through one shared helper (OwnerScopedCoverage, moved where both can reach it, with its tests), not a second copy of the rule, and the engine's behavior is unchanged.
  - A node whose owner has no root fingerprint keeps today's behavior unchanged. --from-issue and --from-jira adoption is unchanged.
  - |-
    Tests cover each of these cases: a teammate's AwaitingAuthor pr-review task is not named and the mint goes through; a teammate's Claimed pr-review task does not refuse the mint; this owner's own AwaitingAuthor task is named exactly as today; an unattributable AwaitingAuthor task is named with the new wording and nothing is created; an unattributable Claimed task is refused; and on a node with no owner root, a task created by another owner is still named as today. Tests may use the Postgres fixture; no test creates branches or touches GitHub.
