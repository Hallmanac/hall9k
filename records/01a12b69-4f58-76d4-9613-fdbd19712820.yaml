context: |-
  Seen 2026-10-08 to 10-11: d6c9e897, 149a9acb, b0b4897b were claimed by Windows (HALL-AGELESSRX, node ef6ab27d) on 10-08 at 17:11Z, which wrote the ledger holder. Each failed its host gate; a failure appends TaskFailed and deletes the lease in one transaction with no holder release (VerificationRunner.cs:2799-2800, and the same at all 11 TaskDecider.Fail sites). Windows then ran assign --node 25e490e4 and retry; neither touches the holder. The lease sweep needs a lease (gone), and Windows never reclaims a task placed on the Mac, so nothing released it: the Mac stood down about every 8 seconds per task for about 66 hours (50,102 log lines) until Windows ran h9k task release at 14:39Z on 10-11, and the Mac claimed each within 15 seconds.

  Where the fix goes: extend the existing lease-expiry path, not a new one. The new selection feeds the same holdersToRelease list in DispatchEngine.SweepExpiredLeasesAsync (see the symbols, not line numbers, which moved on main), appending TaskDecider.ReleaseHolder and calling ReleaseLedgerHolderBestEffortAsync, which brings the pending-row retry. The placed-elsewhere release does not mirror a tracker release (skip MirrorTrackerReleaseBestEffortAsync for it), for the same reasoning as the lease-expiry comment there: the task is moving, not concluded, and a mirror would race the new node's claim-time MirrorTrackerAssigneeBestEffortAsync. Safety: a claim appends Claimed locally before any run starts, so a placement change replicating in mid-run finds the task Claimed and releases nothing; the Mac never writes another node's holder. A state-keyed rule covers every route into held-here-but-placed-elsewhere (11 failure sites, a reopened Done task moved), where a failure-site fix would be a third event-keyed patch after 724a1899a (leave that scan alone). The release behaviour of h9k task release is right (any state except Claimed when this node is the holder, TaskReleaseCommand.cs:111); its help (CliCommandTree.cs:1845-1849) and class comment wrongly say Done or Blocked only. Delivery: the old holder performs the release, so Windows gets this only with a tag; until then a Windows-held task moved to the Mac still needs h9k task release on Windows. Out of scope and parked: an unplaced task whose old holder is offline (h9k task take --force covers it); stand-down has no backoff; GrantTake's guard and ClaimRequestEngine's comment assume a Failed task has no holder. Late-release race (challenge, 2026-10-12): TaskHolderReleased names no node and Apply clears whatever HolderNodeId holds, so Windows' release replicated after the Mac's claim wiped the Mac's holder on d6c9e897 (claim v12, release v14) and 149a9acb, and closeout (which releases only when HolderNodeId is this node, CloseoutEngine.cs about :2327) left their ledger records naming the Mac though both are Done; the sweep rule would make this race the normal path. Every release site appends only when the appender is the holder, so a receiving-side check (origin node against current HolderNodeId) breaks no current path and works once the receiving node updates; an additive node field on the event is the alternative, the build's choice. Root-cause findings and the challenge verdict with full references: this task's journal.md. Walked with Brian 2026-10-12.
