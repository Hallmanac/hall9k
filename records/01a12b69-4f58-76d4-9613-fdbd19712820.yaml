objective: A node that holds a task's ledger record releases its own holder claim once the task is queued and placed on another node and nothing of it runs here, so a task moved off a node after a failure is claimed by its new node without anyone running h9k task release
criteria:
  - A node that holds a task's ledger record releases that holder on its next dispatch sweep when the task is Queued and placed on another node, provided this node has no lease and no live run for it; the placed node then claims the task on its own next sweep, with no h9k task release run anywhere
  - A node never releases a holder for a task in Claimed state (claimed by any node), or one this node leases or runs, even when the task's placement names another node
  - A release whose ledger write fails is retried on later sweeps, the same way a lease-expiry release is
  - h9k task release's help names every state its holder-only release accepts, matching the code
  - A holder release that reaches a node from a node other than the task's current holder there leaves that holder in place, so a task claimed by its new node before the old holder's release replicated still has its ledger record released at the new node's closeout
  - Unit tests cover the sweep release and its refusals through DispatchEngine's ILedger with FakeLedger (tests/Hall9k.Tests/Fakes), and the late-release rule as an aggregate replay test (claimed by node B, then a replicated release from node A) or a test of the inbox verdict; TaskHolderClaimTests is skipped pending 76912727 and is not the pattern; no new test creates a branch, touches git, or calls GitHub
