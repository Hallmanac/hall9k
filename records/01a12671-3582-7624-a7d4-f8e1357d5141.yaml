objective: On macOS, every daemon-dispatched agent session runs inside a one-rule seatbelt profile that lets it signal only processes it started, as a stated stopgap until Claude Code's own sandbox can run a headless browser
criteria:
  - On macOS only, every agent session the daemon spawns through ClaudeExecutor.SpawnAsync runs under /usr/bin/sandbox-exec with exactly the profile `(version 1)(allow default)(deny signal)(allow signal (target same-sandbox))(allow process-exec (literal "/bin/ps") (with no-sandbox))`, held as a single named constant in one file, with ClaudeExecutor composing the prefix ahead of the claude command it hands to IProcessManager.Spawn (the generic process managers stay policy-free). A test that runs on every operating system shows that the command handed to the process manager carries the wrapper when the platform is macOS and containment is on, and carries none when containment is off or the platform is Linux or Windows. Gate commands (VerificationRunner's gate shell processes), h9k task run-local, and the Linux and Windows spawn paths are unchanged; agent sessions VerificationRunner itself spawns, such as the commit-recovery session, are contained like any other.
  - The PID the daemon records is still the agent's own PID for its whole life (the existing exec chain is kept), so the stream file, SessionResultWaiter, and TerminateTree behave exactly as before.
  - A macOS-only test in the RealProcessSpawn collection and category (returning early, not failing, on other platforms; its evidence is the Mac host gate's run, since CI has no macOS leg) builds its command from the same constant and composition code the executor uses and, using only sleep processes ended by PID, proves that a process in the sandbox can signal a child it detached with `( sleep … & )`, cannot signal a sleep started outside the sandbox (Operation not permitted), leaves that outside sleep alive, can run /bin/ps, and that the PID the spawn returns is the sandboxed process's own. No test runs pkill, killall, kill -1, or any pattern or glob in a kill or rm.
  - On macOS, before each contained spawn, the executor confirms /usr/bin/sandbox-exec exists and applies the profile (for example by running it with the profile over /usr/bin/true); if either fails, no agent process starts and the run's recorded launch failure names containment as the reason. Linux and Windows never consult sandbox-exec. A node setting written by h9k config set turns containment off; it defaults to on, takes effect at the daemon's next start like every other operating setting, and appears in h9k config show and among the settings rows h9k daemon status prints.
  - |-
    The profile constant's doc comment records the boundary. It covers any signal from the session or anything it starts, including detached and re-grouped processes. It does not cover Docker, launchctl, Apple Events, file writes, sessions started by h9k task start or h9k task delegate, or Linux and Windows. It names the known incompatibilities: anything inside a session that applies its own seatbelt sandbox fails with Operation not permitted (Chrome with its sandbox on, Claude Code's own sandbox setting, swift build without --disable-sandbox; Playwright's --no-sandbox default is stated with its source); setuid binaries other than /bin/ps (top, sudo, su, login, at, crontab, traceroute) cannot run; and a signal-0 liveness probe of a process outside the sandbox gets Operation not permitted. It records that Claude Code's built-in sandbox, Codex, and srt call the same sandbox-exec, so the deprecation risk is shared, not avoided; that the vendor sandbox was set aside because headless Chromium cannot start under it on macOS (Claude Code issue 82660); and that moving to it is the planned exit, triggered when Chromium launches under it with --no-sandbox.
