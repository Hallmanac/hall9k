context: |-
  A dispatched session's own cleanup command killed processes it never started: on 2026-10-09 at 11:05 EDT, ntss-platform task 44ecd7f4 (run 01a1212d) ran `pkill -f "vite" -P 1 2>/dev/null`; macOS BSD pkill stops option parsing at the first pattern, so -P and 1 became patterns and about 64 of the operator's processes got SIGTERM. Discovery is done (idea 1ca8cda1; evidence in the hall9k project home at ideas/1ca8cda1-a-dispatched-session-s-own-cleanup-command-killed-processes/workspace/report.md and alternatives.md). Card A (357d5141, the macOS signal fence) and Card B (7e8e92a1, the supported helper-server route) are separate pull requests, neither stacked nor blocked on the other. Brian ruled 2026-10-10 to keep this mechanism as a stopgap rather than adopt Claude Code's own sandbox, because that sandbox cannot run headless Chromium. Every wrap of sandbox-exec blocks setuid binaries, and Claude Code's own Bash-tool tree kill uses `ps -A`, which is why /bin/ps runs outside the sandbox (it only reads). sandbox-exec fails after Spawn has returned a PID (exit 65 bad profile, 71 apply failure), so the fail-closed outcome needs a check before the spawn. Notes to the orchestrator, not criteria: (1) it records the boundary decision at closeout from Brian's 2026-10-10 ruling, using the constant's doc comment as the text, because a dispatched session cannot record decisions; (2) after merge and a local install, it dispatches one browser-using task on the Mac, confirms it completes under containment with at least one h9k CLI call from inside the session, that `claude agents` still lists the window, and that outside sessions' lock files under ~/.local/state/claude/locks survive, and records the run id in the task journal; (3) parked: wrapping h9k task start and h9k task delegate sessions (HeadlessLaunch), trigger the first incident from one of them; the constant would then move to Hall9k.Connectors.
