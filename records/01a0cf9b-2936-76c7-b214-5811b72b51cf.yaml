context: |-
  Evidence, from both nodes (2026-09-24). Three occurrences on arx-platform: #2140 (2026-09-23): 0222aa22 minted on Windows 18:42:08Z, 0ac2114a from the Mac born 18:42:40Z by UUIDv7, received on Windows 18:44:39Z, claimed there 18:45:22Z. #2143 (2026-09-24): 9233aaaa minted on Windows 15:36:10Z, a3ab84ac from the Mac born 15:36:41Z, received 15:38:04Z, claimed on Windows 15:38:29Z. #2147 (2026-09-24): 5859bfc5 minted on Windows 22:50:17Z, 84e20e28 from the Mac born 22:50:24Z, received 22:52:09Z, claimed on Windows 22:52:32Z, abandoned by hand 22:55:17Z. Each node's log names only its own mint as created; the later 'already covers it' lines name the twin. Aggravators: the Mac's arx-platform per-project ceiling was 0, so the Mac-born twin queued there and was claimed on Windows after replication; and the two nodes ran different modes because ProjectSettingsChanged is EventScope.NodeScoped. Since 2026-09-24 20:23 EDT the Mac has arx-platform auto pr-review off, so the live race is closed for that project by configuration; this fix is for any project two nodes both watch. Design, settled by the challenge session of 2026-09-24 20:41 EDT (verdict in this task's journal.md): the decision is NOT made in the replication inbox (EventReplicationInbox is a bare replay with no side effects, commits per record, and a later replicated TaskClaimed from the origin node would flip an abandoned twin back to Claimed because TaskAggregate.Apply(TaskClaimed) sets state unconditionally). It is a standing convergence pass in AutoPrReviewEngine, a sibling of ConcludeWithdrawnAsync (near line 1033), run every sweep and also called from MessageSweepEngine right after a replication read that applied events (near line 329) so the abandon lands within seconds; plus a claim-time refusal in DispatchEngine.TryClaimAsync (near line 1526) beside the placement and tracker gates, which is the actual guarantee. The daemon abandons as the owner (node.OwnerId, ConcludeOneAsync's precedent near line 1179). TaskAbandoned is ProjectScoped and replicates; Apply(TaskAbandoned) is idempotent; TaskDecider.Abandon refuses a terminal task, so the pass reads state first. Owner scope through TaskDecider.IsGrantedToThisOwner (fingerprint when present, else owner id; DispatchEngine near line 1696) and WasAutoPrReviewCreated (TaskListItem near line 170). Run retirement: no new termination code; GenerationFence.AllowsAsync(refuseAbandonedTask: true) at every pr-review dispatch site (PrReviewEngine near lines 561, 926, 1061; RunSupervisor exit handler near 1470) already retires a run whose task is Abandoned at its next phase boundary (test at PrReviewTaskEngineTests near line 1872). SweepExpiredLeasesAsync skips tasks not Claimed (DispatchEngine near line 270), so the pass must delete this node's TaskLease and append ReleaseHolder for an Abandoned task it holds (TaskAbandonCommand lines 47 to 52 are the shape). Mention carry-over through TaskDecider.ObservePrReviewMention. UUIDv7 is DomainId.New (UUIDNext, Postgres-friendly); compare ids in one place (bytewise ORDER BY and Guid.CompareTo agree). Criterion 3 already holds today (TaskListItemProjection is inline; the fast path near line 455 and the existing query near line 704 filter on reference and state only) and needs only a test seeded by replication. Test harness: EventReplicationTests (OpenStoreB, SeedQueuedTaskAsync, EventReplicationOutbox.QueuePendingAsync, MessageOutbox.FlushAsync, EventReplicationInbox.ReadFromAsync over InMemoryMessageTransport and FakeLedger; A_replicated_claim_never_dispatches_locally_and_shows_HeldElsewhere near line 1612) plus PrReviewTaskEngineTests.ScriptedGh (near line 390) for the engine. Rendering: ReviewRequestPane.Covering picks live-first, TaskStatusComposer groups Abandoned as Archived, the courier feed renders TaskAbandoned as 'abandoned: <reason>', so criterion 6 costs the reason wording and tests. The hold layer is task 1cccd3f7, blocked by this one; stay out of DecideAsync, RecordObservationAsync, ObservedReviewRequest, and DaemonOptions so the two do not collide. Notes to the orchestrator, not for this build: two pre-existing gaps are separate drafts (reference-only dedup blocks an owner's mint when a teammate holds a task on the same pull request; a replicated lifecycle event can resurrect a locally terminal stream); widening the takeover sweep to terminate on Abandoned is parked. Dispatched sessions must not run board-mutating h9k commands; the abandon belongs to the platform. No em dashes in anything authored.
