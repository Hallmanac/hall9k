objective: |-
  One GitHub review request produces exactly one live pr-review task across every node of the owner's fleet: when two nodes mint for the same pull request, the younger task is abandoned as a duplicate on every node and never claimed, so never two live tasks
criteria:
  - |-
    Root cause is written into the fix's own commit and the card: two daemons of one owner, both with the project registered and auto pr-review on under the same GitHub login, each mint a pr-review task for the same review request within seconds; each node keeps its own ObservedReviewRequest record (id prefixed with its own node id) and the store-level task query in CreateOneAsync sees the peer's task only when replication lands, about two minutes later, after both dispatchers have claimed; the record names the two aggravating facts from the incident (the loser's twin queued under a per-project ceiling of 0 on one node and was claimed on the other after replication, and the two nodes ran different auto pr-review modes because the setting is node-scoped)
  - |-
    A standing convergence pass in the auto-pr-review sweep, also run right after a replication read that applied events: whenever two or more live (not Done, not Abandoned) auto-created pr-review tasks of the same owner (fingerprint when present, else owner id) share one external reference, every one but the smallest UUIDv7 id is abandoned by the daemon as the owner with a reason naming the survivor's id; a task already Abandoned is left alone; the pass deletes this node's TaskLease and releases this node's ledger holder for any such task it holds, whether the abandon was its own or arrived by replication; a mention recorded on the abandoned task is appended to the survivor; the pass is re-evaluated every sweep, so a lifecycle event that replicates in after the abandon (the origin node's own claim) is re-converged rather than resurrecting the duplicate; the id comparison is made in one place and pinned by a unit test with reversed wall-clock order
  - The dispatcher never claims a pr-review task that has an older live auto-created pr-review task of the same owner on its external reference, checked at claim time in TryClaimAsync on every node, so the younger twin is never claimed however the sweeps interleave
  - A run the abandoned task already owns is retired as superseded by the existing abandoned-task fence at its next phase boundary, with no new termination code; the existing retirement test still passes
  - |-
    Tests: a two-store test where both stores mint for the same review request and the exchange is replayed in both directions ends with exactly one live task on both sides and the same survivor on both; a replicated younger duplicate arriving after the local one is claimed is abandoned and refused by the dispatcher; the mirror case abandons the local younger task; a replicated claim on the loser arriving after its abandon is re-converged on the next pass; a replicated live task already counts as covering in CreateOneAsync and the fast path (the existing already-covered test seeded by replication); a teammate's live task on the same pull request is never abandoned; a mention on the loser reaches the survivor
  - h9k status shows the survivor as the covering task and never a needs-you row for the duplicate, and the courier feed shows the abandon once per node with the reason naming the survivor; both asserted by test, no rendering change expected
