context: |-
  ## Why

  Read `ideas/13403621-named-agent-files-claude-code-s-claude-agents-as-a-bridge-be/workspace/task-notes-brief.md` under the project home, section Task 1 closely, and the Rulings in `journal.md` beside it. Those rulings are decided: do not reopen them.

  ## Shape

  One task and one pull request, the first of two. Draft 61c3eee4 (promotion) is blocked by this one and not stacked, because this task is useful on merge and that one touches closeout rather than the notes path. Promotion, Ralph loops, lesson search, multi-vendor work, and a way to vouch for a held-back note are out of scope.

  ## Settled decisions, with reasons

  - Refuse the read in every dispatched session rather than by role. This replaces the brief's likely cut of passing a role through. No session that reads notes needs the verb, because the prompt is the ruled way in, so the refusal needs no role vocabulary, no new variable for it, and no list of review spawn sites. `UsesReviewPermissions` could not have carried it: that flag is true only for pr-review sessions, not for the conformance, adversarial, or verify sessions. A new session kind is refused by default. The same refusal keeps a held-back note out of a session's hands, and the cost is that a session cannot read past the cap.
  - Add a fourth `DispatchedSessionAccess` value, for example `PersonOnly`, with its own message, because `Refused` words every refusal as decision 13f11af2 on lifecycle, which is false here. Update the class doc, which says there are three.
  - `h9k logs` gets the same class because its transcript prints a session's `h9k task note` calls and its closing block. No shipped template names it for a dispatched session (verified at 6b18a7db8; the only skill that names it runs in a window, which carries no run variable).
  - Notes live on the task stream, with a note id inside each event. A lesson took a stream of its own for an identity to cite and retire, and to spare a project read from replaying every lesson. A note gets its identity from the id field, has no retire lifecycle, and belongs to one task. The task stream brings project scope, the private flag and task scope narrowing, the genesis rule, the inbox ownership guard, and project purge for free; its own stream would need a new `ReplicationStreamFamily`, a resolver branch reading the task's scope, a genesis entry, and a purge list. `LessonPickRecorded` is the precedent.
  - Hold note entries as a list on `TaskDetails`, read by nothing except the prompt read, `h9k task notes`, and the render. The repository has no `MultiStreamProjection`, and this avoids introducing the first one. `TaskDetails.LessonPick` is the shape to copy.
  - Do not add a text check. `RunHandoffRecorded`, `TaskHandoffNoted`, and `LearningRecorded` already put agent text in the same ledger with no check, and no helper exists to reuse, so a check on notes alone closes no hole. The prompt wording and the length limit are the whole rule here.
  - The caps are constants, not `h9k config` settings. Lesson caps are settings because a project's lesson inventory grows with age; a task's notes do not. The numbers match the lesson defaults because that bound is already paid for.
  - Attended sessions get notes: each of the three CLI commands already loads lessons beside its builder call.
  - The verbs are `h9k task note` and `h9k task notes`, matching the singular-write, plural-read shape in the brief.
  - `TASK NOTES:` rather than `NOTES:`, because a false match is a permanent public event. Bullets only, with no sample bullet in any prompt, for the reason `HandoffParser` gives for last-marker-wins: sessions quote their instructions.
  - The closing block is captured only where the daemon already handles a work session's end. The pre-final-pass and settling-gate sessions read notes and may use the verb, but their prompts do not ask for the block. A delegated contractor's prompt does not ask for the block either: nothing records its final message, and `h9k task deliver` only strips it.
  - A pr-review session can never write a note. `PrReviewAllowedTools` grants it no `h9k`, and a pr-review final message is excluded from capture, because that session reads attacker-written text and a note is permanent and public.
  - `h9k task show` prints no count either, so no surface a review session reaches needs a role check.

  ## Where the code is (verified at 6b18a7db8)

  - Spawn stamping: `src/Hall9k.Daemon/Execution/ClaudeExecutor.cs:94` and `src/Hall9k.Cli/Commands/HeadlessLaunch.cs:121`, the variables in `src/Hall9k.Domain/Features/Run/DispatchedRunEnvironment.cs`. Stamp the session's id and name here so the verb can record them. `AgentSpawnRequest` holds the name and the id, but on a resume the session's id is `ResumeSessionId`; `SessionId` then only names the dispatch (`IExecutor.cs:12`). An attended session and a plain terminal record neither.
  - Provenance trap: `RecordingProvenanceReader.FromEnvironmentAsync` reads only the interactive run variable, and `FromNamedTaskAsync` throws when a task has no active run. Neither fits the verb directly: read the dispatched run variable first, then the interactive one, otherwise `RecordedProvenance.FromShell`. Without this a dispatched note reads as "no run named", which is the failure `LessonProvenanceMark.NoRunNamed` documents. Never infer the run from the task's current run.
  - Stamp the recording node at the append on both write paths, as `LearnCommand.RunAsync` does and says why. `TaskDetailsProjection` is Inline (`MartenConfiguration.cs:74`), so it runs before the origin-stamping listener: without the stamp every agent note reads as `AgentOnUnobservedNode` and is silently held out of every prompt. `TaskDetails.Apply` for `TaskHandoffNoted` (`TaskDetails.cs:1216`) is the precedent for reading the sender and origin.
  - Keeping the block out of derived text: do not split in `StreamJsonParser.TryParseResult`. That parser serves every session and cannot tell a work session from a review, so a report that quotes the marker would lose lines with no note recorded. Put a pure split in `src/Hall9k.Connectors/Prompts/` beside `HandoffParser`, and apply it where a work session's result enters: the top of `RunSupervisor.CompleteRunAsync` and of `HandleDeliberateHeadlessStartExitAsync`, after the type check, replacing `result` with a clean copy so `CaptureHandoffAsync`, the reason at `:2030`, and the triage, dispute, and reply paths at `:2383` to `:2664` all read it; the fix session's result in `ReviewEngine` ahead of `:1852`, which also covers `RecordFixResultAsync` (`:6904`); and `PullRequestOpener.TryReadAgentSummary` (`:905`). `TaskDeliverCommand.ReadHeadlessResultFromStreamFile` (`:636`) parses the stream for itself, so it strips the block there and records nothing. `HandoffParser` takes everything after its marker and `ParseDisagreements` ends a block only at `RESOLUTION:` or `HANDOFF:`, so either would otherwise carry notes onward.
  - Capture sites: `RunSupervisor.CaptureHandoffAsync` (`:3048`, called at `:1353` and `:1953`) and `ReviewEngine.RecordFixResultAsync`. The first also runs for pr-review and spike primaries, so the type check matters there.
  - Prompts: `AppendRecordedLessons` calls in `src/Hall9k.Daemon/Execution/AgentPromptBuilder.cs` at 530 (follow-up), 640 (changes requested), 1147 (checks), 1299 (rebase), 1843 (pre-final-pass), 1996 (settling repair), 4224 (review fix); `WorkPromptBuilder` for the fresh build, with `AppendHandoffRules` at `:444` showing where a headless-only ask goes. Leave out `BuildStackReplay` (2121): it carries no new intent. Add a fragment under `.claude/templates/work-prompt-builder/`.
  - The lesson read: `src/Hall9k.Domain/Features/Learning/Queries/LessonPromptFeed.cs`, its callers `RunLauncher.cs:1815`, `ReviewEngine.cs:8502`, `TaskStartCommand.cs:185`, `TaskDelegateCommand.cs:526`, `TaskDriveCommand.cs:339`. The notes read sits in the Domain beside it. Since the picker merged, `RunLauncher` composes the prompt again after a pick (`:928` to `:961`), so notes must reach both compositions. Fix-side callers are `ReviewEngine.cs:2539`, `:2550`, `:4986`, and `:5546`.
  - The trust rule: `LessonProvenanceMark.Of`, `ReachesAPrompt`, and `HeldFromPrompts`, with `LocalFleetReader` read only when a note is replicated, as `ComposeCandidatesAsync` does.
  - Projection: `RenderTask` in `src/Hall9k.Daemon/ProjectHomes/ProjectHomeRenderEngine.cs:569` and `HomeEntryWriter.Write`; the foreign-file rule in `KnowledgeDocuments.WriteInto`. Do not touch `RenderKnowledgeDocumentsIntoAsync` in `RunLauncher`.
  - `OrchestratorFeedInterest` admits by listed type, so leaving the new type unlisted keeps it out of the feed.
  - `src/Hall9k.Domain/Infrastructure/Persistence/EventScopeRegistry.cs` needs the new type; `EventScopeRegistryTests` fails without it.
  - Replication gate: classify the event `MemberSafe` in `src/Hall9k.Domain/Infrastructure/Persistence/TaskActClassificationRegistry.cs`, not `Conditional` like the lesson pick and the handoff note. Under `Conditional` a teammate's note on a task someone else holds is dropped, and on an unassigned task it is held and queues that teammate's later acts behind it (`EventReplicationInbox.cs:1169`, `:2203`). `MemberSafe` is safe because the trust rule holds such a note out of every prompt. Keep the event in `Hall9k.Domain.Features.Tasks.Events`: `FamilyOf` reads the namespace, and an unknown family on a Task stream is refused permanently. Test this with a Member-role sender, because an owner-role sender skips the gate.
  - The note append carries no `expectedVersion`, by the rule at `TaskLogInteractionCommand.cs:102`: it is a pure log entry, and a fenced note could lose a record. A fenced writer that loses to a note recovers the way it does for any concurrent writer, as a retry or a sweep.
  - Rendering: use the lesson path in the prompt (one line, then `RelayedText.Printable`, `WorkPromptBuilder.cs:1939`), `ExternalText.ForTerminal` at the terminal, and `ReplicatedNote.Origin` for a replicated note's author, since `RecordedByOwnerId` resolves to nobody on another node. Read a sibling by `EpicId`, not through `EpicIdResolver.ResolveGroupAsync`, which spans a solution's projects.

  ## Work in flight

  ee441155 (internal PR gate) dispatches a fix session at its gate. That session carries notes as any review fix does, so this task needs no gate code and depends on nothing there. 3e3c9f7f, ee441155, e8fc520c, and 0a3d47e0 all add lines to `DispatchedSessionCommandClassification`, `EventScopeRegistry`, or the prompt builders, so expect trivial merges, and re-check line numbers against main before starting.

  ## Constraints

  Events stay additive so older streams replay. Tests never create branches or touch GitHub. Keep selection pure, as `LessonInjection` is, so the caps, ordering, and trust rule are provable without a store.
