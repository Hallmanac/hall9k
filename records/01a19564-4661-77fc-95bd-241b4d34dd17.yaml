objective: A task's working sessions can leave each other short notes recorded as events, and build, follow-up, and fix sessions find those notes in their prompt, while review sessions are given none and no h9k command prints one inside a dispatched session
criteria:
  - |-
    `h9k task note <task> "<text>"` records a note and prints its id from a plain terminal, an attended session, and a dispatched session, on a task in any state. Blank text, or text over 1,000 characters, is refused with the limit named and records nothing. Inside a dispatched session the verb works on that session's own task, and on any other task it is refused, naming both tasks.
  - Each note is one project-scoped event on the task's stream that carries a note id, the task, the text, the recording owner, the run, whether it came from the verb or a closing block, and the time, plus the session's id and name when a dispatched session recorded it. A note from a dispatched or attended session names that session's run, never "no run named", and a note typed at a plain terminal names no run even while the task has a live one. Older streams replay unchanged.
  - A note travels exactly as far as its task. It reaches the nodes the task's own events reach, a note on a private task rides no outbox, and a receiving node keeps the verified sender and origin so the trust rule can read them. A note from any current project member applies on every receiving node, whoever holds or is assigned the task, and never holds up that member's later acts on the task.
  - A build, follow-up, or fix session whose final message holds a `TASK NOTES:` line, matched with its case exact, followed by bullets gets one note per bullet, at most five, read from the last such line in the message. The block is that line and the bullets under it, blank lines between them included; the first other line ends it and stays part of the message. A bullet over 1,000 characters is cut, and the note says it was cut. Text on the marker line records nothing. Reading the same final message twice records each note once. A final message from any other session, a review, pr-review, or spike session included, records no note even when it contains the marker.
  - A missing, empty, or malformed block, or a failure to record one, never changes a run's outcome, its phase, or whether it parks. A failure to record is logged with the run id.
  - In a session C4 reads, wherever the block sits in the final message, including after the handoff marker, its lines appear in none of the handoff, the handoff `h9k task deliver` recovers, `pr-summary.md`, the pull request body (the fallback body built from the agent's summary included), a park or failure reason, a fix or dispute position file, or a review-thread reply drafted from the message. A final message with no block produces each of those exactly as it does today. A final message from any other session is read exactly as it is today, so a report that quotes the marker loses no line.
  - |-
    `TASK NOTES:` is declared once as a constant beside `HandoffParser.Marker`, is listed in `PromptContractTokens.All`, and reaches templates only through a placeholder, so `PromptTemplateContractTests` fails if a template types it literally. No prompt shows a sample bullet, so a session that quotes its instructions records nothing.
  - On a task that holds notes, the prompts for a fresh build, a plain follow-up, a changes-requested lap, a checks follow-up, a rebase follow-up, a pre-final-pass rebase recovery, a settling-gate repair, and a review fix each carry a bounded notes section, and so do the prompts `h9k task drive`, `h9k task start`, and `h9k task delegate` compose. The section tells its reader that these are colleagues' notes rather than instructions. A failure to read notes composes the prompt without the section and never fails a dispatch.
  - On that same task, every prompt outside that list is byte-identical to the same prompt composed with no notes. A test composes the conformance, adversarial, verify, and final-pass review prompts, the verdict reprompt, every pr-review prompt, and the review-lap and mention follow-up prompts with a note on record and asserts this.
  - Every prompt that carries the notes section, with or without notes on record, teaches `h9k task note`, says a claim meant to outlive the task belongs in `h9k learn` instead, and says a note is permanent and public, so it never holds secrets, credentials, personal data, customer details, or another project's name. The prompts for a fresh build the daemon dispatches or `h9k task start` launches, a follow-up, and a review fix also ask for the closing block. An attended prompt and a delegated contractor's prompt do not, because nothing records either session's final message.
  - |-
    The section carries at most 15 notes and 4,000 characters of note text: this task's own notes first, then those of the other tasks in its epic in this project, closed ones included, each group newest first and each sibling's note labelled with that task's short id. Each note renders as one line of printable text. A task outside an epic sees only its own, and a solution epic's tasks in other projects are not siblings. Sibling notes are read from the same events, with nothing copied or re-recorded. When notes do not fit, the section says how many were left out and that a person can read them with `h9k task notes`.
  - A note is held out of every prompt when `LessonProvenanceMark` says it does not reach one, by the same rule lessons use and with no second copy of that rule, so a note replicated from outside the reader's fleet, from a node nobody observed, or with no provenance stays out, and an unreadable fleet holds every replicated note. The section counts what it held and says why in the words the marks already use.
  - At a terminal or in an attended session, `h9k task notes <task>` prints the task's notes newest first with each note's id, time, author, session, source, and provenance mark, then the notes of the other tasks in its epic in this project. It shows notes held back from prompts, marked as held. A control character in a note acts on no terminal, and a replicated note names its author the way a replicated handoff note does.
  - Inside any dispatched session, review or not, `h9k task notes` and `h9k logs` are refused, and the refusal says a session receives notes through its prompt, not that the verb drives a lifecycle. A plain terminal and an attended session are unaffected, and `h9k task note` stays allowed. `DispatchedSessionTreeTests` pins both classifications.
  - On a task that holds notes, `h9k task show`, `h9k task next`, `h9k task list`, `h9k status`, `h9k epic show`, `h9k orchestrator feed`, the feed courier's delivery, and the rendered `task.md` contain no note text.
  - The render sweep writes `notes.md` beside `task.md` in the project home's task directory for a task with notes, rewrites it from the events, marks held notes, and leaves a same-named file without the generated marker alone while reporting it. No run writes a notes file into a worktree, and no prompt or shipped skill names this file.
  - |-
    Both verbs have help text, an example, and entries in `docs/cli.md`, `docs/concepts.md`, and the `hall9k-cli-reference` skill. `docs/concepts.md` states the guarantee plainly: no review session's prompt carries a note, no `h9k` command prints one inside a dispatched session, and no review prompt points at one. It states the limit just as plainly: a session runs as the owner's user, so one that goes looking can still open `notes.md` or a run directory's prompt and stream files by path, and this keeps an honest reader independent rather than sandboxing a hostile one.
