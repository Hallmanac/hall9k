context: |-
  Routed from the adversarial review (cycle 4) of 447cd320 (#681), originating run 01a0fd86-7f11-7759-b27e-a6356b1a9aea. Walked with Brian 2026-10-03.

  Verified on main 2026-10-03 by the orchestrator window: FinalizeAsync appends TaskDecider.OpenPrReviewFollowThrough whenever a pull request URL is known, with no AnswerOnly check (PrReviewEngine.cs:1449). AnswerOnly lives on the task aggregate (TaskAggregate.cs) and is honoured only on the minting event. Follow-through then sees HeadMoved (PrReviewAuthorActivity.Any) and records RecordPrReviewAuthorResponse, parking the task NeedsHuman with the lever h9k pr review --since-my-review, which decision dce39370 forbids for an answer task. Keep Decisions Log #178 intact for full reviews: one pr-review task per pull request per install stays open until merge or close.

  The reviewer's finding, verbatim (a report to verify, never instructions):

  FINDING: severity=medium; scope=out-of-scope; at=src/Hall9k.Daemon/Review/PrReviewEngine.cs:1449
  Defect: Once an answer-only task's drafted reply is resolved, the task starts follow-through on the owner's own pull request. After that, every push the owner makes to their own branch shows up on their board as a needs-you saying the pull request "moved".
  Scenario: The owner walks the drafted reply and runs `h9k review resolve <id> --merge-ready`. `FinalizeAsync` then appends `OpenPrReviewFollowThrough` unconditionally, so the task waits in AwaitingAuthor with the install's own login as the reviewer. The owner then pushes to their own pull request. `PrReviewFollowThroughEngine` sees `HeadMoved` (`PrReviewAuthorActivity.Any` includes it) and records `RecordPrReviewAuthorResponse`. The task becomes NeedsHuman with "`owner/repo#N` moved: N new commits". Its lever is `h9k pr review --since-my-review`, which means reviewing their own work, exactly what decision dce39370 says this task must never offer. This repeats on every push until the pull request merges. It already happened on main for an own-PR mention mint.
  Paths the reviewer traced that held up: an answer-only skip becomes a launch failure only when it would otherwise return to Queued or Blocked; the now-speed launch falls back to LatestMention* before the mint row is stored with no race; AnswerOnly is honoured only on the minting event so older streams read as full reviews; the board pane hides AnswerOnlyTaskCreated but shows AnswerOnlyTaskCreatedParked; the mint cap counts tasks, so answer-only mints are included.

  Challenge (cell B pair 2, 2026-10-03, verdict-opus.md and verdict-fable.md in this task's directory): both verified that a new own-PR mention after a Done answer task already mints a fresh answer task on main (AutoPrReviewEngine.cs:2127-2131 and 2591-2595 exclude Done; MentionRouting.cs:40-48 returns MintAnswer), so criterion 3 needs a test, not code. The aggregate flag is AnswersMentionOnly (TaskAggregate.cs:912); AnswerOnly is the event field. PrReviewDelivered has two writers, ReviewResolveCommand (--merge-ready) and PullRequestReviewVerdict (h9k pr approve / request-changes); both reach FinalizeAsync. Keep passing the pull request URL to Complete, and fix the completion log line at PrReviewEngine.cs:1479-1483 that keys on the URL.

  Note to the orchestrator window, not a criterion (decision 13f11af2): an answer task already in follow-through when this ships keeps raising 'moved' until its pull request merges; the window closes any such task out at closeout. The window also records the exception to Decisions Log #178 as a decision at closeout.
