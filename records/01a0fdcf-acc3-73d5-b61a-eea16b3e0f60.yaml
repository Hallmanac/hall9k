objective: Resolving an answer-only task on the owner's own pull request ends the task, so the owner's later pushes never raise a needs-you offering a review of their own work.
criteria:
  - Resolving an answer-only task by either route that records PrReviewDelivered (h9k review resolve --merge-ready, or h9k pr approve / h9k pr request-changes) ends it as Done, with the pull request URL on the completion, and opens no follow-through; the daemon's completion log line says so. A full pr-review task still opens follow-through exactly as before. The choice is a pure decision over the task aggregate (TaskDecider), not a branch inside FinalizeAsync (PrReviewEngine.cs:1449).
  - After an answer-only task is Done, the follow-through sweep never selects it and no author response can be recorded on it, so a push to the owner's own pull request produces no needs-you row and no 'moved' notice.
  - A new mention on the same own pull request after the answer-only task is Done mints a fresh answer-only task (AnswerOnlyTaskCreated); it neither attaches to the finished task nor is dropped. This holds on main today; a test in AutoPrReviewMentionEngineTests beside A_mention_on_a_pull_request_whose_only_task_is_done_mints_a_fresh_task proves it for the answer-only case, touching no branch, git, or GitHub, and no production code changes for it.
  - Event streams written before AnswerOnly existed still finalize as full reviews and still open follow-through.
  - Criteria 1, 2 and 4 each have a unit test that touches no database, branch, git, or GitHub.
  - docs/operations.md says, on both the answer-only row (about line 1594) and the h9k pr approve / request-changes row (about line 1876), that an answer-only task ends at resolve and nothing watches the pull request afterwards; the comment above the follow-through choice carries the same exception.
