context: |-
  Platform defect captured under the dogfood rule. Evidence: on 2026-09-18 GitHub was unreachable from this Mac (DNS) from 13:03 to about 13:23. a67fa552 was abandoned at 13:19, and its holder release could not fetch refs/hall9k/ledger/records; the dispatch engine retried it on every tick, every five seconds, for four minutes (38 attempts, three warn lines each: two GitLedger fetch failures and one "releasing the ledger holder failed"), until the network came back. The tracker-mirror pending rows already have a backoff table (DispatchEngine.TrackerMirrorRetryBackoff, added in #467's fix cycle); the holder-release pending row does not use it. Small and self-contained; published unassigned in the fixes lane behind the distributed-team chain (Brian, 2026-09-18).
