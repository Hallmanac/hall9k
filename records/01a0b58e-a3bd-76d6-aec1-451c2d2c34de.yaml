objective: A pending ledger holder release that cannot reach origin is retried with backoff, not on every dispatch tick, so an outage produces a handful of attempts and a handful of log lines instead of one every five seconds
criteria:
  - A TaskHolderReleasePending row (and the matching claim and release mirror pending rows) records its attempt count and last attempt time, and the sweep retries it only once its backoff has elapsed, on the same schedule the tracker-mirror retries already use (TrackerMirrorRetryBackoff, capped at an hour)
  - The warning for a failed release attempt is logged once per episode and once more when the attempt count crosses each backoff step, never on every tick; the first success after failures logs one line saying how many attempts it took
  - |-
    Tests through the dispatch engine's existing fakes: a release that fails is not retried before its backoff elapses; a release that succeeds after failures clears the row and logs the recovery once; the pending row survives a daemon restart with its attempt count
  - dotnet build and dotnet test pass; the decision log carries one entry
