objective: A cooperative-take grant records who the task was granted to as a fingerprint verified against the ledger's trust chain, so a vouched node cannot forge another owner's identity by sending an unverifiable owner id
criteria:
  - TaskHolderReleased (and the TaskTakeRequested event that precedes it) carry the requester's owner root fingerprint as verified by ClaimRequestWatchLoop against the ledger trust chain, beside the self-declared owner Guid; the aggregate's AssignedOwnerId is set from a self-declared Guid only when that Guid resolves to an owner this node knows with that same fingerprint, otherwise the assignment is recorded by fingerprint and h9k task show says the owner is known by fingerprint only
  - DispatchEngine's claim gate compares fingerprints, not Guids, when deciding whether a task granted by a cooperative take belongs to this node's owner, so a forged Guid can neither steal a claim on the receiving node nor block the true grantee
  - |-
    Unit tests cover: a vouched node sending its true fingerprint with another owner's Guid is recorded by fingerprint and never becomes AssignedOwnerId; the true grantee's node claims; an unknown fingerprint is refused as before; existing events without the new field replay unchanged (the field is optional and old streams still aggregate)
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder; no test creates branches or touches GitHub
