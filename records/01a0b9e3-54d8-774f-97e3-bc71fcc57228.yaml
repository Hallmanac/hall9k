context: |-
  Cut 2026-09-19 09:4x EDT on Brian's ruling accepting the cycle-6 dispute on 777f0e18 (the cooperative take, idea 202383dc item 5). Evidence: tasks/777f0e18-*/runs/01a0b800-97e3-72c1-9d03-a885d150f03f/review-6-findings.md (adversarial, medium, ClaimRequestWatchLoop.cs:144) and review-6-fix-position.md. What 777f0e18 already does after its cycle-6 fix: ClaimRequestWatchLoop.ReactAsync resolves the sending node's self-announced device-key fingerprint from its ledger node.yaml (NodeSelfAnnouncedKeyResolver) and checks the claimed RequesterOwnerFingerprint with TrustedOwner.ContainsForNode before ClaimRequestEngine.ReceiveRequestAsync; a mismatch is logged and marked handled. What remains: RequesterOwnerId (a Guid) is self-declared and unverifiable on any other node, because Owner events (OwnerRegistered, OwnerRootClaimed, OwnerSettingsChanged, NodeVouched, NodeRevoked) are OwnerScoped in EventScopeRegistry and never replicate; under take-policy auto, TaskAggregate.Apply(TaskHolderReleased) sets AssignedOwnerId = GrantedToOwnerId (TaskAggregate.cs about line 1417), the field DispatchEngine's claim gate (DispatchEngine.cs about line 951) compares against a node's own owner id. Residual exploit: a vouched node sends its own true fingerprint with another real owner's Guid observed from replicated task history. Boundaries: keep the fingerprint check where it is; do not make owner events replicate; the smallest schema change is an optional fingerprint on the two events plus a fingerprint comparison at the claim gate. Lineage: a follow-on to a review finding on a feature, not a fix of a fix. Held unassigned behind the chain unless a chain piece is bitten.
