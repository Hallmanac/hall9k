  ```
  Title: Back off repeated feed courier failures and make them visible

  Work item: [#846](https://github.com/Hallmanac/hall9k/issues/846)

  A project whose feed couriers kept failing used to respawn one about every minute until the 500-a-day cap was spent, with nothing visible beyond "never delivered". Each project now keeps a failure streak in the daemon's database, so the wait before the next courier grows as min(base x 2^(n-1), ceiling). The base is the project's courier max wait but never less than 60 seconds. The ceiling is a new `Hall9k__CourierFailureBackoffCeiling` option, 30 minutes by default and never less than the base. At the defaults a project that never delivers spends about fifty couriers a day instead of the cap.

  The streak resets on a delivery, and when a window registers after the last failed courier was dispatched. A courier the daemon itself ended neither counts nor resets, but it holds the next spawn off for one step. The first sweep tick after a daemon start pulls the next attempt in to the base wait, and an urgent item that no failed courier carried gets one early attempt without resetting the doubling. The two existing guards still hold: an urgent item already carried by a failed courier waits, and a failed project never rides the quiet ramp down to zero.

  The courier line on `h9k status` now shows a failing or day-capped state with the streak count, next try and last reason. `h9k doctor` gains a courier section that warns on a streak of five or more, a spent day cap, or a feed item left undrained for over an hour. The docs describe the backoff, its resets and the new output.
  ```
