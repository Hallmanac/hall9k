objective: |-
  The mechanical pre-final-pass rebase resolves a Decisions Log tail-append conflict on its own: when the only conflict is that main and the branch both appended an entry at the end of PLAN.md section 16, it keeps main's entry first and the branch's placeholder entry after it and continues, instead of parking the run for a human
criteria:
  - |-
    The pre-final-pass rebase's conflict branch in ReviewEngine runs a shape check before parking: the shape matches only when exactly one file is conflicted (PLAN.md), it holds exactly one conflict hunk, ours (main's side) is one or more complete numbered section-16 entries that sit at the tail of section 16 on main, and theirs is this task's own placeholder entry with its placement note, recognised through the same helper DecisionsLogRenumberer uses for 'this task's own placeholder' so the two steps can never disagree; a conflict from an insertion in the middle of the log, a second hunk, a second file, or another task's placeholder is not the shape and parks exactly as today
  - On the shape the resolver writes ours followed by theirs, stages PLAN.md, and continues the rebase; because a rebase stops commit by commit, the shape check re-runs on every stop of the same rebase and the run parks the moment a stop is not the shape (the worktree restored to the pre-attempt tip as today); the existing renumber step then assigns the placeholder its real number; the outcome is recorded on the run's rebase event as resolved mechanically, a third value distinct from a clean apply and from recovery by an agent session, and the log line names the shape and the entry numbers it kept
  - The stacked-child checkpoint replay's conflict branch calls the same resolver when the shape matches and is otherwise unchanged; if the builder finds that path needs any logic of its own beyond calling the resolver, it is left out of this task and noted in the pull request as a follow-up
  - |-
    Unit tests over the resolver's input (the conflicted file list and the conflict text, no git repository created) cover the exact shape, a two-entry ours, and near-misses that must still park: a conflict elsewhere in PLAN.md, a second conflicted file, a placeholder that is not this task's own, a main-side hunk that is an incomplete or unnumbered entry, and a second stop of the same rebase that is a real conflict after the first stop was resolved; one test covers the checkpoint replay calling the resolver if that clause ships; the task's own Decisions Log entry names this as the single exception to the 2026-09-04 ruling that a git conflict is itself evidence judgment is required, and states the shape
