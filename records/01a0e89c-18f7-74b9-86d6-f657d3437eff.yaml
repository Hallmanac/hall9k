context: |-
  Evidence 2026-09-28 (challenge verdict in the project home notes/win-fetch-race-2026-09-28/journal.md): since #625 (6b96efe8) merged, 7 of 13 first attempts of build-test (windows-latest) failed on FetchAsync_ConcurrentCalls_UseDistinctStagingNames_AndDoNotCollide with 'unable to write file ./objects/..: Permission denied / unpack-objects failed' (runs 36409230913, 36415982391, 36419399826, 36432742652, 36440786787 attempt 1, 36441075799, 36449743498), and every push to main since 10:21Z is red on Windows; ubuntu never fails. Cause: on POSIX git treats EEXIST on an existing object as success; Windows returns a sharing violation. The daemon and every CLI read fetch into one bare repository, so the race is cross-process; an in-process lock would not fix production. A retry is the smallest fix: the winner's objects are present on the second try. Rejected: core.fsyncObjectFiles (durability, not concurrency), fetch.unpackLimit=1 (pack rename can still collide, unprovable without Windows experiments), and a test-only fix (leaves the production defect). Never reproduce by loading the host. Parked siblings, not this task: concurrent hash-object -w (GitLedger.cs:563, GitLedgerMessageTransport.cs:758, GitLedgerCommitReader.cs:201, GitLedgerChainReader.cs:1338) and concurrent base-branch fetches share the shape in principle; none has failed.
