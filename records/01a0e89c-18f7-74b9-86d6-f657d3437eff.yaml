objective: Two ledger fetches of one ref into one repository at the same time both succeed on Windows, as they already do on Linux, so the git object-store race stops failing windows-latest CI and stops giving a node a spurious fetch failure
criteria:
  - |-
    When two fetches of one ledger ref run at once against one repository (two processes included), both return the fetched tip and neither throws LedgerFetchFailedException, on Windows as on Linux: FetchAsync and FetchPrefixAsync retry a failed fetch a bounded number of times, on any failure other than a missing remote ref, without matching git's stderr text (it is localized on a non-English node).
  - A scripted-runner test where the first fetch fails with the unpack-objects error and the second succeeds shows FetchAsync and FetchPrefixAsync each returning the tip; FetchAsync_ConcurrentCalls_UseDistinctStagingNames_AndDoNotCollide keeps its assertions unchanged and passes in the pull request's own windows-latest leg.
  - With the scripted runner, a fetch that succeeds the first time spawns exactly one git fetch, and a fetch that keeps failing still throws LedgerFetchFailedException after the bounded attempts.
