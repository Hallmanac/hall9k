objective: On the node that dispatched a plan's challenge, another node's ceiling expiry for that challenge no longer parks the plan while this node is still running the session, so the plan takes the session's own verdict when it lands.
criteria:
  - A plan on this node has requested a challenge of a draft, and this node's challenge engine has dispatched session S (S's DraftChallengeDispatched is on the draft's stream) and is still running it. A DraftChallengeRecorded with failure DispatchExpired for S, recorded under this node's id as another node writes it, then lands on the draft. A plan sweep that runs while S is still running does not park the plan, and the plan's record of the draft still holds the challenge as requested. When S's verdict is recorded afterwards, the next plan sweep records the same step for the draft that the same verdict records without the expiry; for publish as written, that is a PlanDraftMoved that marks the draft ready. An integration test covers this and fails without the change, because the first sweep parks the plan with ChallengeFailed.
  - When the same expiry lands and this node is not running S (it never dispatched S, or S's session is no longer running on this node, as after a restart), the next plan sweep parks the plan with ChallengeFailed, as it does at a8cfd74dd. An integration test covers the case where this node dispatched S but no longer runs it, so a session that died cannot hold a plan waiting forever.
