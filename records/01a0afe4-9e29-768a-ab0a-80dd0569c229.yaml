objective: Every hall9k project gets a run skill on the ledger describing how to run it locally, composed by a discovery agent from the repository's own documentation and written by the daemon, so a review session or an orchestrator can stand the project up on any member's machine without guessing
criteria:
  - |-
    When a project is added, or h9k project set --discover-run-skill is run on an existing one, the daemon dispatches a discovery session that reads the repository's README, docs, AGENTS.md, CLAUDE.md, skills, and build files and composes the run skill as markdown in one shape every project shares: prerequisites, one-time setup, the launch command, how to know it is up, the address or entry point, and the human steps it cannot do
  - The discovery session hands its composed markdown back through the daemon, which records a run-skill event with the author, the time, and the commit it was composed against and writes the file into the ledger's hall9k ref namespace; the session never writes the ledger itself; h9k project run-skill show prints it and h9k project run-skill set --file replaces it by hand through the same event
  - When the repository already carries skills or documentation that cover launching it, the run skill points at them by path and adds only what they leave out; when it carries none, the run skill holds the whole procedure and cites the files each step derives from; the skill's first line states which of the two it is
  - |-
    Anything the agent could not determine (a secret, a login, a service it could not reach) is listed under human steps with what is needed, never guessed; a repository with no discoverable way to run it produces a run skill that says so and the project shows 'run skill: none discoverable' rather than nothing
  - |-
    Tests through the seam with a fake repository and a fake ledger: a README launch section yields a full-text skill citing it; a skills directory yields a pointer skill; nothing yields the none-discoverable outcome; set replaces through the event; the ledger write goes through the daemon's seam, never the session
  - dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each, the log recording that the run skill lives on the ledger, composed by an agent and written by the daemon (tools before tokens), with drift caught by the review question of the personas piece
