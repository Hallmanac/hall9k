context: |-
  Throwaway follow-up to smoke spike 99675fc1 for idea 1ca8cda1. kill -0 sends no signal; it only checks permission, so both probes are harmless. Run exactly: kill -0 $$; echo $?   then   kill -0 59965; echo $?   then   ps -p 59965 -o pid,comm to show the target exists. Send no other signal to any process, never use pkill, killall, or kill without -0, and do not try to work around a refusal. If the second probe succeeds, record that plainly: it means the fence was not applied.
