context: |-
  Discovery for idea f8212260: findings.md and journal.md in the idea's workspace; the challenge's evidence is notes/challenge-9e4998eb/journal.md in the project home. Brian's rulings (2026-10-29): no home project; in a solution project every epic is solution-wide, so every member knows of it before any task exists; a second task may hold one tracker issue only inside the same solution epic and a different member project (the case of one issue needing a backend and a frontend change, raised by the Linear connector discovery, idea 5d12221a). Mechanism, chosen at challenge and accepted by Brian: a solution epic is one ordinary epic per member project, all carrying a shared solution epic key (one trailing optional field on EpicAdded, so existing streams replay unchanged). No replication code changes: ReplicationProjectResolver, EventReplicationOutbox, EventReplicationInbox and EventCatchUpResponder each resolve a stream to exactly one project, and teaching them otherwise would reopen the inbox's stream-ownership guard. An older build sees each copy as a plain project epic, which is the right fallback. Closeout's linked-task check reads only tasks this node holds, which is why the closeout criterion guards on holding every member. Stacked on the solution base task because it reads the SolutionMembership type and the solution key that task introduces, and it changes the epic list --solution option that task adds.
