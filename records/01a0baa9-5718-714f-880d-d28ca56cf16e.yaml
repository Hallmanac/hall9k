context: |-
  Cut 2026-09-19 13:2x EDT on Brian's word after the first two-node connection (Mac genesis, Windows joined by invite 12:51 EDT on v0.10.0), narrowed at 13:3x, widened at 13:5x with the verified root cause. Evidence: live replication works (the Mac's refs/hall9k/messages/<node> outbox carries kind=events envelopes; the Mac holds an EventReplicationInboxCursor for Windows). Windows's re-run of h9k task add --project hall9k --from-issue 447 at 13:40 queued the broadcast events-request (Windows outbox messages/2.json, forStreamId 01a0afc1-fc97-73b5-836e-39b8ec35ceca) and the Mac answered events-unavailable 'nothing held here matches this request' (Mac outbox messages/14.json, 13:41). Root cause, verified in code and store: EventCatchUpResponder skips every candidate with candidate.Sequence <= switchOnSequence (EventReplicationOutbox.EnsureSwitchedOnAsync; the Mac's ReplicationSwitchedOn at 16:46:12Z has switchOnGlobalSequence 30084) while ec35ceca's nine events sit at seq 28273 to 30020, with origin headers present (nodeId, ownerRootFingerprint). So any task published on a node before that node switched replication on can never be served to a peer, and the from-issue refusal keeps promising it will arrive. Related: MessageSweepEngine.HasAnyLocalHistoryAsync gates the bootstrap to brand-new nodes. Lineage: a gap in M2b (idea 202383dc), not a fix of a fix. Boundaries: keep the switch-on exclusion for ordinary flushes and gap-fills (history is inert until asked for); an explicit stream request is the opt-in; never serve a private task or idea; reuse EventCatchUpCoordinator and the responder. Placement: Mac; a chasing fix for the distributed-team release, candidate for v0.10.1.
