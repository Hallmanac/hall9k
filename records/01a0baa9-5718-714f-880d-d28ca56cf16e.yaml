objective: An established node can pull a named task's event stream, or a project's history since a point, from a peer on demand, so work published on one node before replication switched on can be handed to another node that already has its own history
criteria:
  - h9k task pull <id> (working name; match the noun-first CLI conventions) on a node that lacks that task's stream writes a targeted catch-up request naming the stream to the ranked candidate peers through the existing EventCatchUpCoordinator, and the answering peer's sweep serves that stream in full through the same envelopes the bootstrap answer uses; the task appears on the requesting node's board with its dependencies, stacking, and issue link intact, and the command prints where it stands and what to run next
  - h9k project pull <project> --since <global-sequence|all> requests the project's history the same way for a node that has its own history and therefore never bootstraps (MessageSweepEngine.HasAnyLocalHistoryAsync gates the bootstrap to brand-new nodes); an answer is applied idempotently against streams the node already holds
  - The --from-issue refusal for a task published elsewhere names the pull command instead of promising that catch-up will bring the stream, which is true only for a brand-new node; the docs (concepts.md, cli.md) say which node states bootstrap, which gap-fill, and which need a pull
  - |-
    Unit tests cover: a targeted request for one stream is written and answered; an established node's request for history since a point; idempotent application over a stream already held; the refusal text; no test creates branches or touches GitHub
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder
