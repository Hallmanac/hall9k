objective: A node can pull a task's event stream from its peers without needing a linked issue, and the adoption refusal tells the truth about whether a stream request was queued
criteria:
  - An explicit stream request (EventCatchUpRequest.ForStreamId set, from a vouched member) is answered with the stream's whole history even when its events sit at or below the answering node's switch-on sequence, private tasks and ideas excepted; ordinary flushes and gap-fills keep the switch-on exclusion
  - h9k task pull <id> (working name; match the noun-first CLI conventions) on a node that lacks that task's stream queues the same broadcast events-request that h9k task add --from-issue already queues for a task published elsewhere (EventCatchUpCoordinator.RequestStreamBroadcastAsync), refuses with a sentence naming h9k project join when this node has no owner root yet, and prints where the request stands; h9k status shows the outstanding request the way it shows the others
  - |-
    The --from-issue refusal for a task published elsewhere says whether a request was queued or not: when the node has no owner root, it says catch-up cannot bring the stream until h9k project join has run, instead of promising it will appear
  - h9k project pull <project> --since <global-sequence|all> queues a history request for an established node that never bootstraps (MessageSweepEngine.HasAnyLocalHistoryAsync gates the bootstrap to brand-new nodes), answered under the same explicit-request rule and applied idempotently over streams the node already holds; docs (concepts.md, cli.md) say which node states bootstrap, which gap-fill, which pull
  - |-
    Unit tests cover: a ForStreamId request served below the switch-on sequence and a private task still refused; an ordinary flush still excluded below it; the pull queues one broadcast request and a second call reports it outstanding; both refusal texts; a project pull applied over held streams; no test creates branches or touches GitHub
  - dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder
