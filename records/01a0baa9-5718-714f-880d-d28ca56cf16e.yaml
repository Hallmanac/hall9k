context: |-
  Cut 2026-09-19 13:2x EDT on Brian's word after the first two-node connection (Mac genesis, Windows joined by invite 12:51 EDT on v0.10.0). Evidence: live replication works (the Mac's refs/hall9k/messages/<node> outbox carries kind=events envelopes with run events after replication_switched_on; the Mac holds an EventReplicationInboxCursor for the Windows node), but the five persona tasks published on the Mac on 2026-09-17 (ec35ceca, cd722750, b1b20c23, 0569c229, 09fad63d) never reach Windows: Windows's h9k task add --from-issue 447 answered 'already published elsewhere as task ec35ceca, but that task's own event stream has not reached this node yet ... It will appear on this node's own board once catch-up brings that stream in', while src/Hall9k.Daemon/Messaging/MessageSweepEngine.cs AdvanceCatchUpAsync requests the bootstrap (EventCatchUpCoordinator.RequestBootstrapAsync) only when HasAnyLocalHistoryAsync is false for the project (no ReplicatedEventRecord, no TaskListItem, no IdeaDetails), and RequestGapFillAsync covers outbox seq gaps, not streams that predate the switch-on sequence (ReplicationSwitchedOn.SwitchOnGlobalSequence). Windows has its own hall9k history, so it never bootstraps. Lineage: a gap in M2b (idea 202383dc), not a fix of a fix. Boundaries: reuse EventCatchUpCoordinator, the ranked candidates, the timeout and cascade; do not widen bootstrap to established nodes wholesale; a pull never overwrites a stream the node already holds. Placement: Mac; a chasing fix for the distributed-team release, candidate for v0.10.1.
