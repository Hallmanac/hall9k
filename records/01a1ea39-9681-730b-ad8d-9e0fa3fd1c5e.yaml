objective: Every claude command line Hall9k prints for a person to paste runs under the project's bound Claude Code account, a resume line is never offered for a session that lives under another account, and Hall9k's reads of the Claude Code session registry follow CLAUDE_CONFIG_DIR
criteria:
  - |-
    For a project bound to a claude-code account, the claude-code window line printed by `h9k orchestrator project` and `h9k orchestrator launch-text show --project`, the `h9k task drive` resume and fresh lines, the human-gate step-in line `h9k task drive` prints, and the discovery resume line in `h9k plan show` each set CLAUDE_CONFIG_DIR to the binding's recorded directory for the claude command alone: `CLAUDE_CONFIG_DIR='<path>' claude ...` in the POSIX form and `$env:CLAUDE_CONFIG_DIR='<path>'; claude ...` in the PowerShell form. The prefix sits immediately before the first claude command word, which is the first unquoted word that is exactly `claude` and either begins the text or follows `&&`, `||`, `;`, or `|` and any spaces. This holds for a stored launch text and for the computed default alike, and a directory containing a single quote still produces a line its shell parses to that exact directory (`'\''` in POSIX, `''` in PowerShell). Unit tests over the composed strings cover both shells, a stored and a default text, a quote in the path, and a stored text in which `claude` first appears inside a quoted argument.
  - A stored claude-code launch text in which no claude command word can be found, by the rule in criterion 1, is printed unchanged for a bound project, followed by one sentence saying that the line does not carry the project's account and naming the account's directory. A launch text stored for any other CLI never gets the prefix. Unit tests cover both.
  - Apart from the cross-account resume refusal criterion 10 describes, every printed line for an unbound project is byte-identical to today, and the existing launch-text, task-drive, plan-show, and launch-line wrapping tests pass with their assertions unchanged.
  - |-
    `h9k orchestrator launch-text set`, at node and project scope, refuses any text containing `CLAUDE_CONFIG_DIR`. The refusal says that the account comes from the project's binding and is added when the line is printed, names `h9k project set <p> --claude-code-account` as the way to bind, and says that a line copied from `launch-text show` must have its prefix removed before it is set. Unit tests cover the refusal at both scopes, and a round trip: the line `show` printed for a bound project, with that prefix removed, is stored, and `show` afterwards prints it with the prefix exactly once.
  - The solution window line printed by `h9k solution init` and `h9k solution add` carries the account every member agrees on, as given by the solution resolver from the task this one is stacked on, and no prefix when the members disagree or none is bound. The node window line printed by `h9k orchestrator node` and `h9k orchestrator launch-text show` without `--project` never carries one. Unit tests cover agreeing, disagreeing, and all-unbound members.
  - The orchestrator-recipe-generator skill tells the generating session to learn from `h9k project show` whether the project is bound. For a bound project, the session copies the prefix exactly as `h9k orchestrator launch-text show --project <p>` printed it on the window line and writes it immediately before `claude` in the scoped spawn, fresh-start fallback, and step-in lines it generates. For an unbound project it writes those lines unchanged. In its launch-text step, it removes that same prefix from the line `show` printed before passing the line to `launch-text set`.
  - The launch anchor tells the window to read the session name from `${CLAUDE_CONFIG_DIR:-$HOME/.claude}/sessions/$CLAUDE_PID.json` in place of `~/.claude/sessions/$CLAUDE_PID.json`, and the `--session` option description of `h9k orchestrator register` names the same location. `h9k orchestrator refresh-anchors` writes the new text into existing homes, and LaunchAnchorDocumentTests pin the new path.
  - |-
    `h9k task register-session` reads the session's name from the sessions directory under the CLAUDE_CONFIG_DIR in its own environment, and from ~/.claude/sessions when the variable is unset or blank. A unit test covers both directory choices without reading the operator's real registry.
  - |-
    The sessions `h9k task register-session` and `h9k task drive --direct-launch` record for a run each record, on the already node-scoped InteractiveSessionStarted, the account the session runs under as exactly one of three values: a claude-code connection, the default, or unrecognized. The record never holds a path or an email. `register-session` derives the value from its own CLAUDE_CONFIG_DIR: unset or blank means the default, a directory equal, under the stacked-on task's path rule, to a claude-code connection's recorded directory means that connection, and any other value is unrecognized. `--direct-launch` records the account it spawned under. RunDetails keeps the registered session's account beside `RegisteredInteractiveClaudeSessionId`, and a registration written before this field existed counts as the default. Unit tests cover each derivation.
  - |-
    `h9k task drive` prints a resume line only when the recorded session's account equals the project's current binding. Otherwise it prints the fresh line as the line to paste, preceded by one sentence saying the earlier conversation lives under a different Claude Code account and cannot be resumed under this one, and an unrecognized account is never offered a resume. Unit tests cover a matching account, a binding changed since registration, an old registration on a bound and on an unbound project, and an unrecognized account.
  - |-
    docs/cli.md and the hall9k-cli-reference skill describe the following: the account prefix on printed lines; that the PowerShell form sets the variable for the rest of that shell; the refused cross-account resume; that a resume or step-in line printed after a binding change, for a session started before it (a plan's discovery session included), will not find its conversation; that the recipe should be regenerated after a binding changes; that windows on different accounts cannot discover or message each other, while the courier runs on its project's account and so still reaches that project's window; that a bare `claude` typed in a project folder is outside Hall9k; and how to log a directory in by hand. Every example directory is ~/.claude-alt.
  - No test creates a branch, touches a remote, or calls GitHub; the tests stop at composed strings, scratch directories, and fakes.
