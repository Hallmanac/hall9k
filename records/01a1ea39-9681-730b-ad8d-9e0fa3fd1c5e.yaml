context: |-
  **Why.** The task this one is stacked on (d5c94f15) binds a project to an alternate Claude Code account on this node and makes every claude Hall9k starts honor it. Lines a person pastes are not started by Hall9k, so without this task a pasted window, step-in, or resume line runs on whatever account that terminal happens to have, and a window on the wrong account lands on a different session mesh from the courier that delivers to it. Claude Code keeps its session registry under the config directory (`sessions/` beside the transcripts in `projects/`), so registry reads must follow the variable too. The idea's workspace journal (idea 4faa4335) holds the research summary and the rulings; this task's journal holds what refinement and the challenge found. This task uses three things the stacked-on task adds: the claude-code connection and its path rule, the node-only project binding that `h9k project show` prints, and the solution resolver.

  **Where the lines come from.** LaunchTextDefaults (src/Hall9k.Cli/Orchestrator/LaunchTextDefaults.cs) composes the window line (Render), the task-drive lines (RenderTaskDrive and TaskDriveLine), and the discovery resume line (DiscoveryResumeLine), each in a POSIX and a PowerShell form chosen by LaunchShell. OrchestratorLaunchTextResolution.Resolve returns a stored launch text ahead of the computed default, and OrchestratorReport.Print prints it for `h9k orchestrator project` and `h9k orchestrator node`; OrchestratorLaunchTextShowCommand prints it for `launch-text show`. TaskDriveCommand renders the human-gate line with no resume id and the drive line with `run.RegisteredInteractiveClaudeSessionId`. PlanShowCommand.ReadDiscoveryAsync renders the discovery line. SolutionHomeInit.RunAsync in SolutionInitCommand.cs prints the solution line for both `solution init` and `solution add` and nothing stores it.

  **Stored text.** The recipe generator stores the default verbatim (its SKILL.md, the launch-text section near line 1050: `set` with "the exact line show just printed"), so a prefix added only inside Render would miss most real projects, and a stored text is an arbitrary string: the `launch-text set` examples in CliCommandTree.cs store one with no `cd` at all. Apply the prefix where the line is printed, to stored and default text alike, using the command-word rule in criterion 1. The POSIX prefix must sit on the claude command itself, since an assignment before `cd` would apply only to `cd`. The stored text never carries the prefix: `set` refuses any text containing CLAUDE_CONFIG_DIR, and the generator removes the prefix from what `show` printed before it stores the line. This matters because the generator single-quotes the line it passes to `set` and is told to stop and ask on any single quote in it (SKILL.md, near lines 1073-1082), and every prefix quotes its path; with the prefix removed, the generator never meets a quote the prefix introduced.

  **Prefix forms.** POSIX: `CLAUDE_CONFIG_DIR='<path>' claude ...`. PowerShell has no inline form: `$env:CLAUDE_CONFIG_DIR='<path>'; claude ...`, which persists in that shell; the docs say so. A single-quoted path escapes a quote as `'\''` in POSIX and `''` in PowerShell. A line for an unbound project stays byte-identical to today, with no unset prefix (a ruling, made to avoid churning every printed line for every user). The generator copies the prefix from the window line `launch-text show --project` printed rather than composing it, because the stacked-on task promises that `project show` prints the binding and its email but not the directory, and copying keeps the escaping identical to the platform's.

  **Registry reads.** The launch anchor is a C# raw string in src/Hall9k.Cli/Orchestrator/LaunchAnchorDocument.cs (step 1, the session-name sentence), not a template file, and `h9k orchestrator refresh-anchors` re-renders it into every home. TaskRegisterSessionCommand.ReadClaudeSessionName(int) hard-codes `~/.claude/sessions` beside the overload that takes the directory. Nothing else in the code reads the registry, but the `--session` option description in OrchestratorRegisterCommand.cs teaches agents the same hard-coded path, so it changes with the anchor.

  **Resume across accounts.** A session started under another account lives in another directory's transcripts, and `--resume` under the current directory will not find it. InteractiveSessionStarted (src/Hall9k.Domain/Features/Run/Events/InteractiveSessionStarted.cs) is already NodeScoped in EventScopeRegistry and is appended in four places: TaskRegisterSessionCommand, TaskStartCommand, TaskDelegateCommand, and TaskDriveCommand's direct launch. RunDetails takes the resume id only from a session whose name is not the task's build session name (RunDetails.cs, the InteractiveSessionStarted apply). `h9k task start` and `h9k task delegate` append under the build name and never feed it, so only `register-session` and `drive --direct-launch` record the account. A new optional field on that event is the smallest carrier; the account it names is a connection id, the default, or unrecognized, never the path or the email. Transcripts are never copied between directories.

  **Docs.** Say plainly that windows on different accounts cannot discover or message each other (a Claude Code limit Hall9k does not work around), that the courier runs on its project's account so it still reaches that project's window, that a bare claude typed in a project folder is outside Hall9k, and how to log a directory in by hand (`CLAUDE_CONFIG_DIR='<dir>' claude`, then /login). Also say that a resume or step-in line printed after a binding change will not find a conversation started before it (plans record no account, so the discovery line is in this case), and that the recipe should be regenerated after rebinding, because the generator writes its scoped lines into the recipe once.

  **Boundaries.** Do not change spawn environments, the connection, the binding, the run freeze, or doctor; those belong to the stacked-on task. Recording the account on InteractiveSessionStarted is this task's, at `register-session` and at `drive --direct-launch`; `task start` and `task delegate` are not touched by this task. Public records: examples use ~/.claude-alt and never name another project, organization, or person.
