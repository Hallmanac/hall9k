objective: |-
  GitLedgerChainReaderTests stops dominating the host suite: the trust rules are tested fast in memory, a small real-git set keeps the end-to-end proof, and the Windows host gate fits well inside its 30-minute timeout again
criteria:
  - Every scenario the 66 tests cover today is still covered after the change, either by a fast in-memory test of the trust rules or by a kept end-to-end test; the PR lists each existing test and where its scenario now lives
  - |-
    No more than about eight tests keep real git repositories and real signing keys, chosen to prove the end-to-end paths the in-memory tests cannot: commit signature verification, carried bundles with embedded commits, ref rewind refusal, and genesis selection by ref order
  - The fast tests are not in the RealProcessSpawn category or collection, so they run in the parallel test gate and not the serialized host gate
  - |-
    Measured on this Windows node with the host gate's own command and a trx logger at the PR's head: GitLedgerChainReaderTests and its fast replacement together take under 5 minutes, and the whole host suite takes under 20 minutes; the PR records before and after numbers
  - Any production seam added to make the rules testable leaves every verification result unchanged; the existing end-to-end tests that remain pass unmodified in what they assert
