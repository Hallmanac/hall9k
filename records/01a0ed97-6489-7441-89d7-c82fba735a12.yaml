context: |-
  Why: on 2026-09-29 the host suite at origin/main 4c5e8d48c took 37m56s on Windows (20m51s on the Mac), over the 30-minute DaemonOptions.VerifyGateTimeout, so no host gate here can pass (53ffc224, PR #636, parked on three timeouts). GitLedgerChainReaderTests (tests/Hall9k.Tests/Connectors/Trust/GitLedgerChainReaderTests.cs, 66 tests) took 1,675 s of it, 28 to 86 s per test, and sits in [Collection("RealProcessSpawn")], so its tests run one after another and form the suite's critical path. It grew with the trust-chain security work, commits 4e6064006 through f3be40fc0 (09-26 to 09-28). Evidence and per-test numbers: the project home's notes/host-gate-slowdown-2026-09-28.md and notes/timing-2026-09-29/results/host.trx.
  Approach: most of these tests exercise the trust rules (vouch, revoke, rotation, rank, carried bundles, fixed-point resolution), which need no real git repository and no real signing key. Test those rules against fast in-memory inputs, keep a small real-git, real-key end-to-end set, and take the fast tests out of the serialized RealProcessSpawn collection.
  Boundaries: do not raise the gate timeout. Do not weaken any trust rule or drop a scenario. A production seam extracted for testability must not change any verification result. Other slow classes (ReviewEngineTests, CloseoutEngineTests, StackedChildTests) are out of scope.
