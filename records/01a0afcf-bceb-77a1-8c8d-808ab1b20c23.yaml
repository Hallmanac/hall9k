objective: The qa persona's review reads a pull request through blast radius and compliance, runs the project's end-to-end tests on the worktree and drives the running product through browser automation only when the project's qa-review-drive setting is on (off by default), states for every affected behavior whether it is covered, needs a new automated test, or needs a human walk-through, and ends with the offer to run the branch locally
criteria:
  - |-
    The persona registry gains qa, mapped to a QA review prompt whose first job is a blast-radius map: the behaviors the diff changes, the adjacent behaviors sharing code paths or data with them, and the user-facing flows crossing either; the map is the report's first section in plain language and every later finding cites the map entry it came from
  - |-
    For each map entry the report says one of three things: covered by an existing automated test it names, needs a new automated end-to-end test it specifies in a sentence, or needs a human walk-through it describes step by step; no entry is left without one
  - The session runs the project's end-to-end tests on the worktree, scoped to the blast radius where the test layout allows and in full otherwise, and reports pass, fail, or absent with evidence; with the project's qa-review-drive setting off (the default) it never launches the application, and a verdict needing the running product becomes a human walk-through under the previous criterion; with the setting on it launches the product on the worktree from the ledger's run skill on an ephemeral port it reports and tears down, drives the changed flows through browser automation, and the report carries each screenshot beside the finding it supports and a Driven section naming the flows walked
  - The report checks the change against the project's stated conventions, the writing conventions, the decision log where it applies, and any acceptance criteria on the linked task or issue, naming each as met, not met, or not verifiable from the code alone
  - The report ends with the offer to run the branch locally so the reviewer can walk it, present only when the project has a run skill on the ledger and phrased with the walk-throughs as the suggested route; the offer is a question in the report, never an action
  - |-
    Tests: the registry maps qa to the prompt; the prompt is golden-tested; a fake diff produces a blast-radius map with the three verdict kinds; a project without a run skill produces a report with no offer and no drive; with qa-review-drive on and a run skill present the session launches and the report carries the Driven section; a failing end-to-end run is reported with its evidence rather than swallowed
  - h9k project set --qa-review-drive on|off (default off) and h9k project show print the setting; the same setting shape exists for the design persona (design-review-drive, default on, in piece 3) so both reviews share one mechanism for launching and driving
  - dotnet build and dotnet test pass; the CLI reference and the decision log carry one entry each, the log recording that QA reviews run tests and drive the product only by the project's setting, off by default (Brian, 2026-09-17)
  - The QA review prompt ships as its own template directory under .claude/templates with the same fragment layout the review-lap prompt uses (objective, blast radius, checks, findings report, closing, rules), loaded through PromptTemplates and golden-tested, never hard-coded in C#, so it is editable by the same mechanism as every other prompt and by the project override layer of the follow-on piece
