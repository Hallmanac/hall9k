context: |-
  Follow-up to PR #866 (merged 2026-11-11, shipped in v0.18.2), from the post-merge review at
  `notes/review-866/journal.md` in the project home (findings at lines 37 to 40, routing at 47 to 50).
  The review's verdict was safe to tag; these are its four low findings, done as one pull request
  because they all sit in the remote git token seam and none is large enough to stand alone.

  Code, as of 631c949ce:

  - **Host of the token read.** `src/Hall9k.Connectors/WorkItems/ProjectGitHubClient.cs:286` runs
    `gh auth token --user <login>` with no host, so gh reads the token for its default host, which
    `GH_HOST` changes; the header is always scoped to `https://github.com/`
    (`src/Hall9k.Connectors/Processes/GitRemoteAuthentication.cs:190`). The two failure messages at
    lines 290 to 301 quote the command and should quote it as run. Existing tests assert the arguments
    with `ContainInOrder` and the message with a `*gh auth token --user hallmanac*` wildcard
    (`tests/Hall9k.Tests/Connectors/ProjectGitHubClientTests.cs:39,53`), so appending
    `--hostname github.com` after the login keeps them passing. The ambient `GH_TOKEN`/`GITHUB_TOKEN`
    path (line 321) is unchanged.
  - **Redirect memory.** The redirect branch in `GitRemoteAuthentication.RunAsync`
    (`GitRemoteAuthentication.cs:251-252`, and the redirect case of the authentication retry at
    261-265, which `GitRemoteAuthenticationTests.cs:321` already exercises) retries without the keys
    but remembers nothing. The model to follow is the gh-failure memory in
    `src/Hall9k.Connectors/WorkItems/ProjectGitRemoteTokenSource.cs:49,56,70-75`, keyed by working
    directory like `resolutions` (line 48) and lasting `ResolutionTtl` (line 40). Telling the source
    about a redirect needs a member on `IGitRemoteTokenSource` (`GitRemoteAuthentication.cs:13`) or an
    equivalent; the test sources that implement it (`TokenSequence` in
    `tests/Hall9k.Tests/Connectors/GitRemoteAuthenticationLocalServerTests.cs` and `FakeTokenSource`
    in `GitRemoteAuthenticationTests.cs`) follow. `ProjectGitHubClient` caches a login's token for the
    same two minutes (`ProjectGitHubClient.cs:61`), so a count of token reads cannot show the skip;
    what the call is handed can.
  - **Startup pin.** The daemon configures the source inline at `src/Hall9k.Daemon/Program.cs:425-426`,
    a top-level program a test cannot run, so the wiring moves into a method Program.cs calls
    (`Hall9k.Tests` already references `Hall9k.Daemon`, which grants it internals).
    `GitRemoteAuthentication.Configure` is process-wide and is read by every remote git call a test
    makes without a flow-local source, across many collections, so no test may set it, even with a
    restore afterwards (the project's binding rule against tests observing process-global state that
    another test set). The method therefore takes the setter as a parameter, and the test passes a
    capturing one. The existing check at `GitRemoteAuthenticationLocalServerTests.cs:67-70` looks at
    the test host around one call and says so in its comment; point that comment at the new test.
  - **Docs.** `docs/operations.md:1787-1797` holds both bullets.

  Out of scope (the review declined them): the CLI store's last-wins source at
  `src/Hall9k.Cli/Infrastructure/CliStore.cs:41`, the 404 case with no fallback, and pruning the
  source's dictionaries.
