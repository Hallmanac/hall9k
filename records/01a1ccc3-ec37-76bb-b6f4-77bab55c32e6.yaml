objective: Remote git calls carrying a project's GitHub token read that token for github.com explicitly and skip the token keys for a working directory that recently redirected, the daemon's startup is pinned by a test as writing no token or header key into its own environment, and operations.md says that git's own child processes inherit the keys.
criteria:
  - The keyring read of a project account's token (ProjectGitHubClient.TokenAsync, which both the pinned gh calls and the remote git calls use) names github.com as the host, so a GH_HOST in h9kd's environment cannot change which host's token is read. A unit test asserts the gh arguments include the host flag with github.com. Both failure messages of that read quote the command as it is run, including the host flag, and the existing assertions on that read and its failure message still pass.
  - When a remote git call fails on a redirect while carrying the token keys, whether on its first attempt or on the retry after an authentication failure, its working directory is remembered for two minutes (the source's resolution TTL). A remote git call from that directory inside the window runs exactly once and is handed no keys; once the window lapses, the next call from it carries the keys again. A unit test with a controllable clock pins the skip and the lapse, and shows that a call from a different working directory still carries the keys inside the window.
  - The daemon's wiring of git remote authentication moves out of Program.cs into a method that Program.cs calls, and that method takes the setter it configures the source through; Program.cs passes GitRemoteAuthentication.Configure. A test runs that method with a ProjectGitHubClient whose token read returns a known test token and with a capturing setter in place of GitRemoteAuthentication.Configure. It asserts that the setter was handed a source, and that afterwards this process's environment holds no variable whose name or value contains extraHeader in any letter case, and contains neither the test token nor its Basic encoding. The test never calls GitRemoteAuthentication.Configure, so it changes no process-wide state.
  - In docs/operations.md, the "Per call, never ambient" bullet says in one sentence that git's own child processes (hooks, auto-maintenance, a credential helper for another host, git-lfs) inherit the keys for the length of the call, and no longer claims the token reaches nothing else. The "Redirects" bullet says a redirect is remembered for two minutes per working directory, during which calls from it run without the keys.
