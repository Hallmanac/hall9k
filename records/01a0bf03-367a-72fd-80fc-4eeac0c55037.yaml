  Second of two, stacked on 98484f36 (the seam and the 28 Postgres-backed classes); builds on its real branch and dispatches at its Delivered. Drafted 2026-09-20 with Brian from the gate-timeout discussion and revised after the headless challenge session (verdict in tasks/98484f36-*/journal.md). Scope: the Hall9kHome-tagged classes that do not carry RequiresDocker (46 at drafting). The first task carries the wall-clock gain; this one is hygiene: it retires the tag, widens the guard to the whole test project, and moves about 900 fast test cases out of the host gate into the fast gate. Uses the helper and the rewritten guard from the first task. The environment collection from the first task (classes that write the claude path, Hall9k__ settings, or the MSBuild node-reuse flag) stays as the one serialized set.
