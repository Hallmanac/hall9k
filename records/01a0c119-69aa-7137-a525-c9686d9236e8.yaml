  Evidence gathered 2026-09-20 19:2x EDT by the hall9k project orchestrator (hall9k-e9). Board row: h9k status showed a needs-you Delivered row 61777203 with project '?', empty objective and type, 'added 739878d ago', pointing at an open pull request in another project's repository, 'no run record is watching it'. Event stream on this node (mt_events, stream 01a0ac19-53bb-733b-bc85-d15261777203): exactly two events, version 1 task_branch_pushed (pushedAt 2026-09-20T14:57:30Z on the sender) and version 2 task_completed (runId 01a0ba8d-5368-720a-8773-a9c84018b7f5), both appended here at 2026-09-20 22:49:55Z; no task_added anywhere for that stream. Replication records (mt_doc_replicatedeventrecord): 42 records for project 01a0c0e5-da6e-713d-b99c-8b6cbcd96d29, all appliedAt 22:49:30Z, sender 01a04de3-7a23-75c0-8a06-9314ef6ab27d (the Windows node), inbox cursor highestSeqInspected 2; the run stream 01a0ba8d got its full 40 events from version 1, the task stream only its tail. The project was registered on this node at 22:18:04Z the same evening (project_registered seq 42954), so the sender's outbox for it holds only events since replication began there, and the task's earlier life never travelled. Marten's inline single-stream projection materialises a document with no matching Create (IdeaDetails.cs documents the same behaviour), which is what produced the headless TaskDetails. Related: 70160be0 (#523) added a cross-sweep guard for a permanently skipped genesis, but that guard keys on a recorded skip; a genesis that simply never arrived has no record to key on. A catch-up request document type already exists (EventCatchUpRequest); h9k project pull is the bootstrap path that would normally carry history. Constraints: no test may touch a real git repository or GitHub (memory no-git-integration-tests); the fix is receiver-side, the sender's ledger is not edited. Boundaries: do not change the outbox's MaxEventsPerEnvelope or the bootstrap gate's semantics beyond what the second criterion needs; do not widen h9k status into a project filter here (that is a separate idea).
