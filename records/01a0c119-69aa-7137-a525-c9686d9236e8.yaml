objective: A replicated stream whose genesis this node has never seen (a task whose task_added predates the sender's outbox, a run whose parent task never arrived) is held rather than applied, so the receiving node never auto-vivifies a headless projection that reaches the board as a task with no project, no objective, a default added time, and a needs-you flag
criteria:
  - |-
    EventReplicationInbox refuses to start a local stream from a replicated record whose version is not 1 (or whose type is not that aggregate's genesis) when this node holds no events for that stream: the record is held, not applied, and the hold is logged with the stream id, the sender, and the event type; the cursor still advances past the envelope so the sender's replication is never frozen by it (the same shape as the cross-sweep genesis-skip guard from 70160be0, which keys on a recorded skip; this covers a genesis that never arrived)
  - |-
    A held tail is applied once its genesis arrives, in order and never lost: the builder chooses between minting an EventCatchUpRequest to the sender for the stream's missing history and applying the held records when a later envelope carries the genesis, and the pull request states which and why (Brian, 2026-09-20 walk: the catch-up request is the better product but touches the bootstrap path, so the choice is the builder's with reasoning, not a requirement); a unit test over the inbox's apply loop replays a task's branch-pushed and completed events without its task_added, asserts no TaskDetails document exists afterwards, then replays the genesis and asserts the task projects completely
  - |-
    The node-wide board never shows a headless projection: h9k status and h9k task list skip (and, with --all, mark as 'partial history held') a TaskDetails or IdeaDetails whose ProjectId is Guid.Empty or whose AddedAt is default, so a partial stream can never surface as a needs-you row; covered by a unit test on the board's row filter
  - The headless document already on this Mac (task 01a0ac19-53bb-733b-bc85-d15261777203, two events applied 2026-09-20 22:49Z from sender 01a04de3-7a23-75c0-8a06-9314ef6ab27d) is repaired by the same code path on install (the projection is rebuilt or the document dropped and the two records re-held), with no hand SQL and no change to the sender's ledger
