objective: |-
  A verify gate can be scoped to a path set, so a run whose diff touches none of a gate's paths records that gate as skipped instead of running it (TaylorDenny, arx-platform #2218)
criteria:
  - VerifyCommand carries an optional path set (a list of globs, absent by default), and two gates with the same name, command, host-coupled filter, and path set contents are equal, so h9k project set re-validates against clean base only the gates whose configuration actually changed, and h9k project accept-gates shows an unchanged scoped gate as unchanged. A gate with no path set behaves exactly as today on every pass, and every event stream recorded before the field existed replays unchanged.
  - |-
    h9k project set <project> --verify-gate-paths "NAME=GLOB[,GLOB...]" sets one gate's path set (repeatable, one per gate), and "NAME=none" clears it. It folds onto the list --verify sets in the same invocation, or onto the recorded list, and refuses exactly where --verify-gate-filter already refuses: a NAME that is not configured, and a bare change to a gate set this node has not accepted. It also refuses a set with no positive glob, because a set of only ! exclusions would skip that gate on every run.
  - A path set uses NonExecutablePathClassifier's existing matching rules and no new matcher, including its leading ! exclusion, which wins over any positive glob in the same set. The --non-executable-path refusal of ! does not apply to a gate's path set.
  - VerifyCommand.Fingerprint includes the path set only when one is set, so the fingerprint of a gate without one is byte-identical to today's (a unit test pins an existing fingerprint string). Each glob in it is length-prefixed the way a gate's name and command already are, so two different path sets never share a fingerprint (a unit test shows that ["a,b"] and ["a","b"] differ). A changed path set therefore holds runs on a node until that node accepts it, and both h9k project accept-gates and h9k project show print each gate's path set.
  - |-
    Each daemon verification pass decides every scoped gate against the changed-path list the non-executable skip already reads (the whole branch against its base, or its stacked fork point), after dropping the paths that match the project's effective non-executable set: the gate runs when at least one remaining path matches its set and is skipped otherwise. When the changed paths cannot be read, or the list is empty, every gate runs whatever its path set. When every configured gate is skipped this way, the pass is recorded as passing with a note saying no gate's path set matched this diff, worded differently from both the no-gates-configured note and the non-executable skip.
  - A path-skipped gate is recorded as a GateDuration with zero duration, Passed true, and a new PathScopeSkipped flag that defaults to false on older streams. h9k task show's Gates cell reads "skipped (path scope)" for it. The path-scope skip is decided before host-coupled handling, so no host-coupled permit is taken for a skipped gate. A path-skipped gate never counts among the pass's dotnet-test gates and never makes the pass's ranFullScope false, and GateDurationHistoryQuery and h9k task show's duration comparison leave it out the same way they leave out a host-coupled skip. Only the gates this pass will actually run take part in the dotnet-test scope decision, so a pass whose every dotnet-test gate was path-skipped writes no test-gate scope note and decides its ranFullScope as if no dotnet-test gate were configured.
  - |-
    The run-or-skip decision is a pure function in src/Hall9k.Domain/Features/Project beside NonExecutablePathClassifier (changed paths, the effective non-executable set, and the gates in; which gates run and which skip out), with unit tests showing: a front-end-only diff in the #2218 shape (several paths, each under Web/react-apps/customer-portal/ or Playwright/, listed in the test itself) skips two .NET gates scoped "**,!Web/react-apps/customer-portal/,!Playwright/" and runs a vitest gate scoped "Web/react-apps/customer-portal/"; a diff that also touches a backend path runs all three; a README-plus-front-end diff still skips the .NET gates; a null and an empty path list run every gate; an unscoped gate always runs. The recorded outcome of a pass (each gate's GateDuration, including PathScopeSkipped, and the all-skipped note) is likewise built by a pure function with its own unit tests, so VerifyCoreAsync only wires the two in; no new test creates a branch or a commit, starts a container, or touches git.
  - docs/cli.md (the flag table and the flag's own --help text) and docs/operations.md (the verify gates section, beside the non-executable set) describe the path set, its glob rules, the whole-branch diff it is judged against, and the rule that every gate runs when that diff cannot be read. They also say that a positive glob which misses a path skips its gate, so a directory prefix ending in / or the exclusion form is the safe shape (a glob like a/**/b needs at least one directory between a and b), and that paths in the non-executable set never wake a scoped gate, and that a fleet node on an older binary drops the unknown field and runs every gate.
