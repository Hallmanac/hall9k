context: |-
  Let a verify gate be scoped to a path set, so a diff confined to one part of a split repo (arx-platform's customer-portal React app) runs only the gates that can observe it, instead of every gate on every lap (TaylorDenny, arx#2218: about 30 minutes of .NET gates for a one-line .ts doc comment).

  Discovery: notes/taylor-observations-2026-10-08/discovery-8cc3396d/summary.md in the project home (design, scenario, and the RECOMMENDATION block). Origin: transport message b21c6dce item 1.

  Pointers on main (verified at 5fa78e34b):
  - src/Hall9k.Domain/Features/Project/VerifyCommand.cs: the record and Fingerprint. HostCoupledFilter is the precedent for a trailing optional field.
  - src/Hall9k.Domain/Features/Project/NonExecutablePathClassifier.cs: Matches is internal and MatchRule (where ! wins) is private, so the new decision function needs MatchRule's set-level logic. Expose it; do not copy it.
  - src/Hall9k.Domain/Features/Project/GateSetAcceptance.cs, src/Hall9k.Connectors/Verification/GateSetAcceptanceDisplay.cs (FormatGate), and src/Hall9k.Cli/Commands/ProjectShowCommand.cs (about line 357, which prints the host-coupled filter itself) are the display sites.
  - src/Hall9k.Cli/Commands/ProjectSetCommand.cs: --verify-gate-filter's option (about line 89), the unaccepted-set refusal (about lines 663 to 697), and ApplyHostCoupledGateFilter (about line 1553) are the pattern to mirror.
  - src/Hall9k.Daemon/Execution/VerificationRunner.cs, VerifyCoreAsync: GetChangedPathsAsync and the non-executable classification (about lines 271 to 305), the test-scope block, dotnetTestGateCount, and the host-coupled skip in the per-gate loop (about lines 360 to 475), and ranFullScope (about line 601).
  - src/Hall9k.Domain/Features/Run/GateDuration.cs; TaskShowCommand.cs FormatGateDurations (about line 2043) and the duration-comparison loop (about line 2104); src/Hall9k.Domain/Features/Run/Queries/GateDurationHistoryQuery.cs (about lines 61 and 188).

  Out of scope: prompt gate lines (040cd5ed, stacked on this task), local h9k task verify parity, a pull-request description note, Azure CI, judging comment-only edits, a warning when --verify drops a path set (it fails safe, because the gates run), skipping clean-base re-validation when only a path set changes, and anything that runs more at once.

  Note to the orchestrator: the design is the operator's to record with h9k decide at closeout, because AGENTS.md says decisions are a human's to record. The dispatched session does not record it.

  Notes from the challenge pair (2026-10-08): VerifyCommand is a positional record, so a list-typed member compares by reference once deserialized (GateSetAcceptance.Diff at about line 100 and ProjectSetCommand.cs line 918 both rely on gate equality), which is why criterion 1 requires contents equality. The comment at ProjectSetCommand.cs lines 949 to 952 naming --verify and --verify-gate-filter as the only flags feeding the fingerprint goes stale and should name the new flag. Passing --verify-gate-filter and --verify-gate-paths in one call without --verify on an unaccepted set is worth one unit test, since whichever fold block runs second sees the first fold's value. VerificationRunnerTests is a Docker, Postgres, and real-git class, and no fake gate runner exists on main, which is why criterion 7 keeps the behaviour in pure functions. The test-scope block at VerificationRunner.cs line 365 still counts a path-skipped dotnet-test gate, which is the false note criterion 6's last sentence prevents.
