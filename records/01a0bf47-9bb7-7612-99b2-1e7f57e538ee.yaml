context: |-
  One Bugfix task carrying three concerns, folded 2026-09-20 11:1x from 487e2647 (comparison skip) and 61ea066a (gate directory) into this draft on Brian's batching call and the headless challenge session's recommendation (verdict in tasks/487e2647-*/journal.md; the two are abandoned as superseded). 2201d90f (a bounded permit wait) did not pass the challenge and is parked as a draft: no bound fits inside the 30-minute limit after the seam without false trips, and its one gain, naming holders, is cheaper at the kill site (criterion 4 here). Commits split by concern so each reverts alone; order inside the task: prompts first, comparison second, gate directory last. Not stacked on 98484f36 (no shared hunks). Evidence: Windows project window hall9k-56, 2026-09-20 10:38 and 10:44 EDT. The feed's host gate died at 08:23 and the designer persona's at 10:40 at the 30-minute limit with no real failure; what shared the box each time was a session's own hand-run full suite (the feed rebase lap, 10:22, dotnet test --no-build in its worktree) and the daemon's clean-base comparison for the dead gate (twelve classes queued on the four permits for its whole five-minute life, twice); the permit directory held 25 stale wait files from dead pids, and one-byte lock files name no holder. Root causes from the code: WorkPromptBuilder.AppendGateLines (line 824) prints gate.Command raw, so the host gate appears as a bare dotnet test; AgentPromptBuilder does the same for rebase (line 913) and review-fix (line 3582); foreground-gates.md says the foreground ceiling fits the full suite; so the 10:22 hand-run suite was obedience. The comparison spawns through AdHocGateRunner under the checkout lock only (VerificationRunner.cs 2100 to 2199) and never takes the host-coupled permit at line 1134, so a failed host gate starts a second host suite outside the serialized slot; extend the condition at VerificationRunner.cs 1991 with gate.IsHostCoupled. CrossProcessContainerGate polls every 50 ms (line 50) and writes evidence every five seconds (line 184); PostgresFixture is built per class by xUnit 2.9.3 with no test context, so a holder record names pid, process start time, working directory (which names the worktree and so the run or session), and the acquire time, not a class. The gate kill at VerificationRunner.cs 1284 is a tree kill with a five-second reap; the timeout classifier's 80 percent bar (line 1327) stays as is. Enforcement beyond the prompt (a hook) is a fold-in whose trigger is a session pid appearing in a holder sidecar. Memory gate-limit-stays-at-thirty and never-stress-the-host-to-chase-a-flake apply. Placed on the Mac per Brian.
