objective: |-
  Host-coupled suites run only in the node's serialized host gate: every gate list a session is shown names the host-coupled gate as daemon-only instead of printing its bare dotnet test command, a failed host-coupled gate skips its clean-base comparison, and the container gate sweeps dead waiters' files and records each holder so a killed gate names who held the permits
criteria:
  - |-
    Every rendered gate list a session sees (WorkPromptBuilder.AppendGateLines, AgentPromptBuilder's rebase and review-fix gate lines, and the build/test/run block of the AGENTS.md the project home renders) prints an ordinary gate's command as today and, for a host-coupled gate, omits its command and prints one sentence in its place: that gate runs only in the daemon's serialized host gate and the session never runs it, with the scoped set (a touched test class by name) as the one exception; golden tests over the rendered prompts and the AGENTS.md block prove it at every site
  - When a gate carrying the host-coupled filter fails, the daemon classifies the failure without spawning a clean-base comparison, and the failure text says the comparison was skipped because it would run a second host-coupled suite outside the node's serialized host gate; an ordinary gate's failure keeps its comparison exactly as today; a unit test proves both paths without spawning a suite; docs/concepts.md's host-coupled paragraph says so
  - When a waiter starts and on each five-second evidence tick, any discoverable wait file whose recorded process is no longer alive on this machine is deleted; each acquirer writes a sidecar beside its slot file naming its process id, that process's start time, its working directory, and the time acquired, removed with the permit and read as stale by the same liveness check; unit tests through a fake process probe cover the sweep of a dead waiter's file, the survival of a live one, and the sidecar's write and removal; no test starts a container
  - The daemon's timeout failure text for a killed gate lists the wait files and holder sidecars found in the gate directory at the kill, as text, without changing what classifies as infrastructure; a unit test proves the excerpt from a fake directory
  - Commits are split by concern (prompts, comparison, gate directory) so each reverts alone; dotnet build and dotnet test pass; the decision log carries one entry under this task's placeholder; no test creates branches or touches GitHub
