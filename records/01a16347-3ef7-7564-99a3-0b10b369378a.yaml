  - [56f86714] dotnet test --results-directory <path> run against Hall9k.slnx from the repo root (as ci.yml's ubuntu Test step does) writes blame/results output directly under <path> as one GUID-named run folder, not per test project, so an actions/upload-artifact step with path: <same path> (no glob needed) captures --blame-hang's Sequence file and mini dump; verified locally by running the exact flags added to .github/workflows/ci.yml (--blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini --results-directory ./TestResults) against the full suite.
  - [bc66af41] EventReplicationOutbox resolves each event's project LIVE at flush time (ReplicationProjectResolver on the stream's current state), so after h9k idea assign moves an idea from project X to Y, the move AND any of that idea's earlier events not yet flushed ride Y's outbox, arriving at a receiver that still holds the idea under X. Any inbox-side project-ownership check must treat an idea stream crossing projects as potentially legitimate (EventReplicationInbox.EvaluateCrossProjectIdeaEvent checks the sender against the SOURCE project's own ledger chain) rather than refusing on ProjectId mismatch alone.
  - [3e3d7b43] In EventReplicationInbox relay tests, a forwarded Task/Run act now needs a genuine EventCatchUpRequest (ForStreamId = the task id, Candidates = [], addressed as MessageAudience.Node(receiverNodeId) with about = requestId.ToString()) to pass IsForwardedRecordAdmitted before it ever reaches the Task/Run act classification gate; EventCatchUpResponder.ResolveRequestedStreamIdsForAdmissionAsync always includes the requested stream id itself even when the requesting node has never seen that stream yet (a fresh-genesis catch-up ask), so ForStreamId is a valid admission shape even for a relayed genesis.
  - [ddfafcdd] Hall9k now generates a per-install Postgres password (32 CSPRNG bytes as 64 lowercase hex, PostgresRuntime.GeneratePassword) instead of shipping the public 'hall9k' constant; Hall9kDatabase.DefaultConnectionString is gone, replaced by ConnectionStringWithPassword(password) plus an internal LegacyDefaultConnectionString/IsLegacyDefaultConnectionString pair used only to detect a pre-migration config.json. DatabaseDoctor.MaybeMigrateLegacyPasswordAsync migrates an existing install on the first 'h9k doctor --yes' that runs with the daemon stopped, over one Npgsql transaction (ALTER ROLE with a precomputed SCRAM-SHA-256 verifier via ScramSha256PasswordVerifier, then config.json, then COMMIT), guarded by the same ownership check as task 359e0d7a's port-binding recreate. This is a binding decision a human needs to record with 'h9k decide --supersedes "Decisions Log #118"': h9k decide record itself refuses from this dispatched, unattended run ('a decision recorded from inside a run needs a human attending').
  - [dadda959] In GitLedgerCommitReader.ReadCommitsTouchingPathAsync, a trailer-less (pre-trailer) commit that is TREESAME to its parent for one path is ambiguous between 'never touched this path' and 'deliberately reasserts this path's already-current content' - git tree diffing alone cannot tell them apart, since both produce an identical tree entry for that path. The safe disambiguator is whether the commit's WHOLE tree (every path, not just the one being checked) is byte-identical to its parent's: a true no-op commit changed nothing anywhere, so unlike an ordinary owner write to some other real path (the cycle-5 laundering scenario), there is no actual content change in it to launder the queried path through, making it safe to treat as touching every path including the one being queried.
  - [3ec737b2] A daemon sweep engine test that seeds a node via NodeBootstrapSeed.NewNodeAsync gets no OwnerDetails.RootFingerprint at all, since bootstrap never claims one; any new owner-role gate keyed off OwnerRootFingerprintResolver.ResolveAsync (like PromptAddendaSweepEngine.PushAsync's own gate) needs the test's own seed step to append OwnerDecider.ClaimRoot for that owner and build a matching FakeLedgerChainReader TrustChain (an Owner-role ProjectMember at that fingerprint), the same pattern MessageSweepEngineTests already uses, or every existing push-path test silently starts failing its own Owner-role check.
  - [ad0727c5] A raw NpgsqlConnection OpenAsync (DatabaseReachability.ProbeAsync, SchemaPresentAsync) uses Npgsql's default pool, and Npgsql 9's PoolingDataSource.CheckIdleConnector only checks IsBroken and lifetime, never socket liveness, so after hall9k-postgres is recreated or restarted inside the same h9k process an idle pooled connector to the dead container opens with no I/O and reads as Reachable; the first real query on it then throws 'Exception while reading from stream'. Any probe meant to prove a freshly (re)started Postgres ready must use Pooling=false or call NpgsqlConnection.ClearAllPools() after the container action. Verified by decompiling Npgsql 9.0.4 with ilspycmd.
  - [19c5368a] To find unused using directives in this repo, temporarily append '[*.cs]' and 'dotnet_diagnostic.IDE0005.severity = warning' to the root .editorconfig, then run 'dotnet build tests/Hall9k.Tests -p:EnforceCodeStyleInBuild=true -p:GenerateDocumentationFile=true --no-incremental' and grep the output for IDE0005; restore the .editorconfig afterward. 'dotnet format style --diagnostics IDE0005 --verify-no-changes' exits clean and prints nothing here even when unused usings exist, so its silence proves nothing.
  - [ddc8ecf7] Claude Code's settings.json effortLevel key accepts only low, medium, high and xhigh — never max. Verified against the installed binary (2.1.282) by grepping its Mach-O for the settings schema: effortLevel:G(["low","medium","high","xhigh"]).optional().catch(void 0), while the sibling maxEffortLevel key takes the five-name list including max, and the binary's own help text says 'max is session-only and is not written'. The .catch(void 0) means an out-of-enum value is swallowed silently: no warning, the key resolves to undefined, and the session runs at the model's own default. Only the --effort CLI flag and CLAUDE_CODE_EFFORT_LEVEL accept max. Before shipping any knob that writes a Claude Code settings key, grep the installed binary for that key's own zod schema rather than assuming the documented CLI vocabulary matches the file vocabulary.
  - [7a81f6ce] To reproduce an h9k install or update path from a dispatched session, isolate it with HALL9K_HOME plus HALL9K_CONNECTION_STRING at a scratch database AND clear HALL9K_DISPATCHED_RUN_ID in the child's environment: DispatchedSessionInterceptor refuses install/update/uninstall on the run-id variable alone, with no regard for whether HALL9K_HOME points anywhere near the live install, so the scratch run is refused exit 70 before the command starts. A redirected HALL9K_HOME also makes install and update skip the PATH link (no symlink, no HKCU Environment Path write on Windows), so bare h9k inside the scratch run still resolves to the live install and you must call the scratch bin/h9k by path. One thing HALL9K_HOME does not redirect: a real h9kd started against the scratch store is a real daemon (stop it before you delete the scratch tree).
  - [a907b770] Anything h9k install/update runs after InstallCommand.SwapIntoPlace must touch only assemblies the process has already loaded. The swap leaves the new release's files at the old absolute paths and the runtime resolves each assembly lazily on first touch, so a first load after it comes from the new release into a process running the old one. That does not surface as a schema error you can catch: on Windows v0.10.42 to v0.10.43 it was System.TypeLoadException ('Method TeardownExistingProjectionStateAsync in type Marten.DocumentStore from assembly Marten, Version=8.17.0.0 does not have an implementation') raised while the runtime compiled LiveGateGuard.FindOnThisNodeAsync, so it landed at the delegate call site OUTSIDE that method's own catch(Exception) and reached Program.Main uncaught. If a post-swap step needs the store, spawn the newly installed h9k as a child instead.
  - [abdfed4d] Under Marten 9, a public non-generic top-level SingleStreamProjection subclass does NOT need the partial keyword: JasperFx.Events.SourceGenerator (shipped as analyzers/dotnet/cs/JasperFx.Events.SourceGenerator.dll inside the Marten package itself) emits the dispatcher as a separate 'file sealed class <Name>Evolver' plus an '[assembly: JasperFx.Events.Aggregation.GeneratedEvolver(...)]' attribute, and only falls back to injecting a member into the projection type (EvolverCodeEmitter.RequiresMemberInjection) when the class cannot be named from file scope - generic, nested in a generic, or non-public. When partial IS required and missing, the failure is a compile-time error JFXEVT003, never a runtime exception, so 'partial is missing' can never reach a running store from this repo's own compilation. Verify any such claim by decompiling that analyzer DLL with ilspycmd rather than trusting a migration guide.
  - [a98bc083] A challenge session's prepared mechanical patch (h9k-marten9-source-changes.patch) that targets Directory.Packages.props by old pin values fails to git-apply once a stacked blocker task has already moved those same lines; apply with --exclude on that one file and hand-edit the pins, and expect FakeEvent<T>-style stub additions in the patch to collide with members the blocker task already added (drop the patch's duplicate rather than keeping both) — check what the blocker's own criteria already changed before trusting a pre-built patch's every hunk.
