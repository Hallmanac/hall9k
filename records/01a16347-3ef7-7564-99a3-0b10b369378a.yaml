  - [f059f669] A prefix allow rule Bash(git diff:*) is not read-only-within-the-checkout: git diff with any path outside the working tree (e.g. git diff /dev/null ~/.config/gh/hosts.yml) silently switches to --no-index and prints that file's content, and git log/diff do not accept abbreviated long options (--outp= is refused), so --output is the only write flag to guard but --no-index/outside paths are a read escape that Read/Grep path scoping does not cover.
  - [4f2802a6] ProjectAgentsDocument.AppendVerifyGateLines (src/Hall9k.Cli/ProjectHomes/ProjectAgentsDocument.cs) is not gated on GateSetAcceptance: it always writes the project's CURRENT VerifyCommands (never checks AcceptedVerifyCommands) into a project home's rendered AGENTS.md 'Build / test / run' section. That file is read by any interactive session opened in the project home, including the ad hoc orchestrator window AGENTS.md itself names ('If you are an interactive session opened in this directory, you are an ad hoc orchestrator'), which can run with skip-permissions the same as a dispatched build session. A follow-up should gate it the same way WorkPromptBuilder.AppendGateLines, AgentPromptBuilder's rebase/review-fix/review-gate-status checklists, and QaReviewPromptBuilder.AppendChecks now are (task d57b49f8).
  - [3d94121a] UnverifiedLedgerWriteDecider.Observe previously threw DomainValidationException when RootFingerprint was blank, but the 'ref' kind MessageSweepEngine.WithAppendOnlyExactRefIntegrityAsync and GitLedgerChainReader's members/owner/node ref refusals all deliberately pass an empty RootFingerprint for a ref with no single owning root (records, members, prompt-addenda, run-skill) - every such refusal threw and was silently swallowed by the sweep's own catch block, so it never once reached h9k status until the validation was relaxed to allow a blank root fingerprint. Also, git show-ref --verify --quiet exits 128 (not the ordinary 1) the moment a ref's own commit object is missing locally, so a bool ref-exists check built on it can never distinguish 'missing object' from 'ref truly absent' - for-each-ref --format=%(refname) <exact-ref> is the correct existence probe since it never resolves the target object.
