  - [2b83a214] On the Mac, a gate's wall-clock span includes lid-closed sleep and the gate timer counts awake time only; check pmset -g log before calling a gate overrun or killing its process by PID
  - [48418886] A background task that appends to a task stream with no expected version races closeout polls and sibling background tasks over the same stream, and Marten throws EventStreamUnexpectedMaxEventIdException for the loser, so reload the aggregate and retry a bounded number of times instead of dropping the write; and a test double that records spawn requests from concurrent sessions needs a lock around its List, or an add is silently lost and a one-per-key assertion flakes.
  - [7c1c956b] An owner's go on a GitHub comment pinned only by its node id does not pin its text: review comments and review bodies stay editable forever, and a session told to read 'comment X by id' reads whatever X says now. Pin an approval to what the owner saw by carrying a copy of the body (as the admitted-review path does) or by recording lastEditedAt / a body hash at hold time and refusing the read when it changed.
  - [63ae102d] A unit test of ClaudeExecutor's spawned command must not assert it starts with the literal "claude": other tests in the same process set HALL9K_CLAUDE_PATH, so the binary part is a fake-claude.sh path whenever they overlap; assert on a stable flag such as ' -p --output-format stream-json ' or on the wrapper prefix instead.
  - [6cc71858] A CLI command that prints untrusted multi-line text (a PR comment body, an issue body) beneath its own structural header lines (Comment N by <login>:, Status:, Thread N:) must fence each body with RelayedText.Fenced(RelayedText.Printable(body)), the way ReviewLapPromptBuilder.Fenced does; folding only the one-line fields to OneLine still lets the body print forged header rows that misattribute text to another login or fake a thread status.
  - [cf41e5c6] When a change widens who the replication receive gate refuses for a Conditional task act (e.g. reading the assignee instead of the creator for TaskPublished/TaskRevised), check that every CLI command appending that act runs TaskOwnerGuard first: h9k task publish and h9k task revise carry no owner guard at all, so a Member-role sender the gate now refuses still appends locally and its own node forks from every peer (the drop is permanent when origin == sender).
  - [2377a581] An acceptance criterion asking for the whole host suite's own before/after timing, measured with the host gate's own command, cannot be satisfied from inside a dispatched build session: AGENTS.md's working rules forbid running dotnet test with no filter (the host gate's own full command) from here, with the sole exception being a single touched test class scoped by name. When a card's acceptance criteria and AGENTS.md's own working rules point in different directions on how something must be measured, AGENTS.md wins: report the touched-class timing you can measure directly, and state plainly in the PR that the full-suite number needs the daemon's own host gate run rather than fabricating or extrapolating it as though it were measured.
  - [6ab6853e] A pre-flight-style gate that reads attacker-controllable content through two separate CLI calls to the same external tool (gh pr diff --name-only then gh pr diff, or any read-twice-and-compare pattern) cannot be made race-free by rereading and retrying around it, because the tool's own response never says which underlying commit/state it actually read; the only race-free fix is to pin the read to an explicit, named identifier in the request itself (e.g. GitHub's compare API with an explicit base...head, rather than gh pr diff's implicit 'whatever the PR's head currently is'). Found in RunLauncher.DispatchPrReviewPreflightAsync (independent pre-PR review, cycle 5, adversarial lens).
  - [8be8b68c] A background monitor that can end without reaching a real verdict (timeout, budget exhaustion, launch failure, a dead process at restart) must mark its own row with a distinct terminal marker, not merely leave its own completion field null — a gate that reads null-completion alone as still in flight, or a sweep that re-processes an incomplete row without excluding one already handled, loops forever with no fresh attempt ever dispatched again.
  - [57835971] A gh subcommand's own minimum version (when it first shipped, e.g. gh attestation verify at 2.49.0) is not the same floor as the flags a caller actually passes to it (--source-ref/--signer-workflow needed 2.68.0, cli/cli#10308); a too-old-gh detector matching only the wording for an unrecognized subcommand ('unknown command') misses a gh new enough for the subcommand but too old for a flag, which fails with 'unknown flag' instead — match both wordings and quote the flag-driven floor, not the subcommand's first-shipped version, in messages/help/docs.
  - [06a7910b] A CLI command whose confirmation prompt needs to be driven from a test (interactive y/n vs non-interactive refuse) should reuse Hall9k.Cli.Infrastructure.IInteractiveConfirmation / ConsoleInteractiveConfirmation / Tests.Fakes.FakeInteractiveConfirmation, the existing seam OwnerPromoteCommand already uses, rather than inventing a parallel AnsiConsole.Profile.Capabilities.Interactive check: it is directly discoverable via that one existing consumer and keeps every interactive-confirm command testable the same way.
  - [62a14459] A Windows host-gate timeout whose verify-host.log goes silent right after TaskHolderClaimTests's own Skip block, with its per-run gate-wait-host directory empty, is not CrossProcessContainerGate permit contention: TaskHolderClaimTests's PostgresFixture is never constructed when every one of its own tests is Skip-attributed (confirmed: dotnet test --filter on that class alone finishes in 26ms with zero container start). The silence has to be a different Postgres-backed class's own Testcontainers container start hanging past its 5-minute ContainerStartTimeout without the CancellationToken actually unblocking it and without ever throwing the DockerApiException/Testcontainers marker GateInfrastructureFailureClassifier looks for, so it reads as a bare 30-minute timeout with nothing to classify. Reproduced twice on PR #636 (task 53ffc224) with the identical symptom on two separate host-gate runs; every individually-scoped class this PR's diff touches (unit and Docker-backed) passed in seconds both alone and combined, ruling out this PR's own commits as the cause.
  - [1808724b] A prompt-builder test that isolates one line with prompt.Split('\n')[0] must TrimEnd('\r') the result before measuring its length: StringBuilder.AppendLine writes Environment.NewLine, so on Windows that segment still carries the trailing '\r' of its own "\r\n", inflating length-bound assertions by exactly one character only on that OS. Windows-only PR #636 CI failure in AgentPromptBuilderTests's spike-heading-length test was this, not a flake.
  - [4a5df6e3] A command-text safety guard that reassembles shell words (GitReadOnlyGuardRoutes.UnescapeShellQuoting) still misses bash expansions that create or split words after quote removal: brace expansion (git diff {/dev/null,~/.config/gh/hosts.yml} reads the file; git diff -{-output=/tmp/x,-stat} writes it) and unquoted $IFS word splitting (git diff --output${IFS}/tmp/x). Refuse any git diff/log command whose text contains an unquoted '{...,...}' or a '$' expansion outside a fully single-quoted word, or better, allowlist the argument shapes a lens needs instead of denylisting spellings one at a time.
  - [7cbb8b22] A shell-command safety regex that unescapes quoting before matching must reassemble whole shell words, not judge each quote or escape in isolation: GitReadOnlyGuardRoutes.UnescapeShellQuoting's cycle 1-3 fixes each checked only its own quoted span (plain quote, or a $'...' span) against the refused-term list, so a flag split across a quote boundary (--out'put'=<path>), wrapped whole in a plain quote with a space (git diff '--output=/tmp/my file.txt'), or split between an unquoted prefix and a $'...' remainder (--outp$'ut=/tmp/my file.txt') all bypassed it because the refused term only appears once the pieces around the quote are joined. The fix: join every adjacent unquoted/'...'/"..."/$'...' piece between runs of unquoted whitespace into one word first, then check whether that whole word starts with the refused term. Any future command-text safety check built the same way (unescape-then-match on raw PreToolUse command text) should reassemble words this way from the start rather than adding quote-form handling one spelling at a time.
  - [a436114a] A shell-command safety regex that unescapes quoting before matching (GitReadOnlyGuardRoutes.UnescapeShellQuoting) must also decode bash's $'...' ANSI-C quoting, not just '...'/"..."/backslash: $'\x75' decodes to a literal character before bash ever runs the command, so --outp$'\x75't=<path> reassembles into --output=<path> and $'/etc/passwd' reassembles into a literal absolute path, defeating the same guard a prior cycle already closed for plain-quote and backslash splitting. Any future command-text safety check built the same way (unescape-then-match on raw PreToolUse command text) should be checked for this exact gap.
  - [66e98a3f] A pr-review task's agent context must keep WorkItemContext.CarriesQuotedDescription true: AgentPromptBuilder's adopted-external-item, QaReviewPromptBuilder's basis-is-data and DesignReviewPromptBuilder's context-is-data rules key on WorkItemContext's exact NonInstructionFraming sentence, so any new composer that quotes stranger text (e.g. AutoPrReviewEngine.ComposePrReviewContext) with different framing prose silently drops those platform-authored data-only rules; reuse the sentence or widen the detector, and pin it with a test.
  - [14c63c2d] FakeLedger.WriteAsync never throws LedgerPushRejectedException or InvalidOperationException, it only returns a Conflict outcome on blob-id mismatch, so a command's catch-after-throw escalation branch (e.g. NodeRevokeCommand's WriteRevokedSuccessorAsync catch) is untestable through FakeLedger alone; when the failure condition is knowable in advance (e.g. by comparing TrustedOwner.RootKeys rank before writing), prefer a check-before-write design over relying on the write to throw, since only the former is directly testable with the existing fakes.
