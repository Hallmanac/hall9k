context: |-
  Hand-off from idea f8212260's discovery (its workspace findings.md:185-187), where it was inferred. Settled by reading the code at origin/main 619890054: the daemon's guard exists and the command has none. Not run live.

  Shape: one task, one small pull request, not stacked. 71b8826c (a draft about a missing archived-project check in the same method) goes right after the project resolves and this check goes after the pull-request read, so they touch different lines, neither changes the other's behaviour, and neither blocks the other.

  The daemon refuses this case at both of its checkout sites, before any fetch: src/Hall9k.Daemon/Execution/RunLauncher.cs:243-271 and 1156-1173. Its comment states the hazard: the checkout fetches from the project's own origin, so a pull request from a different repository either silently checks out whatever pull request shares that number, or fails with an unhelpful missing-ref error.

  The command has no such check, in src/Hall9k.Cli/Commands/PullRequestReviewCommand.cs:
  - The argument accepts owner/repo#N and URLs (help text, lines 65-70), and GitHubPullRequestSurface.cs:151-158 passes that repository to gh pr view --repo. A bare number passes no repository, so gh answers from the checkout's default repository, which in a fork checkout can be upstream while the worktree still fetches from origin. That is why the guard reads what gh returned rather than what was typed. That catches the case when the project has a recorded URL. With no recorded URL and a checkout that has a second remote named upstream, gh pr view and gh repo view both answer from upstream (observed on gh 2.103.3), so they agree and the guard cannot see that the worktree fetches from origin. That gap is parked and is not this task's to close.
  - RunAsync goes straight from the read (lines 139-141) to minting the reference (line 143), then to the adopt and attach arms (lines 148-171). No line compares pullRequest.Repository with the project's repository.
  - Both checkout sites cut by number from project.RepositoryPath (lines 620-621 and 854-856). GitWorktreeManager.cs:209-210 fetches refs/pull/N/head from origin.
  - The command's PrReviewWorktreeRequest passes no head commit, unlike RunLauncher.cs:1193, so nothing notices the mismatch.

  The result is a briefing about one pull request over a checkout of another, which is worse than a failure because it reads as a normal lap.

  Place the check immediately after the read and before RefuseUnreviewablePullRequest, so that a closed foreign pull request gets this refusal and the check covers adoption and attachment alike. It also applies under --no-worktree, where there is no wrong checkout but the lap would still put a review task on the wrong project's board, the hazard the doc comment at lines 239-242 names. A DomainValidationException reaches stderr with a non-zero exit through Program.cs:103-106.

  Compare owner and repo only, ignoring case, exactly as the daemon does: PullRequestUrls.RepositoryFrom (Hall9k.Connectors, PullRequestUrls.cs:53) on the project's URL against pullRequest.Repository. No new helper is needed. Do not use PullRequestUrls.NamesForeignRepository: it also compares hosts, so a project recorded with an SSH host alias (git@github-work:you/project.git, which h9k project add accepts) would have its own pull requests refused. GitHubPullRequestReference.RepositoryFromUrl refuses a pull request off github.com, but that bounds only the pull request's side. A project recorded off github.com whose owner and repo match a repository on github.com still passes when the pull request is named by shorthand or URL. The daemon's guard has the same gap, and draft d30d4128 carries that finding. It is accepted and parked: a host check cannot tell an enterprise ssh host from a host alias, so the comparison stays owner and repo only, and criterion 1 does not cover this case. The project's URL is project.RepositoryUrl, falling back to GitHubWorkItemProvider.TryObserveRepositoryHostAsync through the same processRunner the read uses, as RunLauncher.cs:256-258 does. RunLauncher.OwnerRepoFrom is internal to the daemon and stays as it is; this task does not switch the daemon over.

  Accepted consequence: a renamed repository whose recorded URL is stale is refused, even on a bare number, because gh answers with the new name (observed on a renamed public repository) and h9k project set has no option to correct a recorded URL. The daemon already refuses automated reviews on such a project, so only the hand lap changes, and it fails with a clear message. This is parked rather than solved here.

  A transfer to a new owner behaves the same way (observed). A second accepted consequence: with no recorded URL, a checkout whose gh default is not its origin has a pull request in origin refused when it is named by shorthand or URL, because gh repo view names the other repository. The daemon refuses the same case, and gh repo set-default in the checkout corrects it (observed).

  Suggested message for the recorded-URL case, which the build may reword within criterion 1:

  {prRepository}#{number} lives in {prRepository}, not {project}'s own repository ({projectRepository}, from the recorded URL {url}). A review lap's checkout is always cut from the project's own origin, so reviewing a pull request from another repository needs a project registered against {prRepository}. If {projectRepository} was renamed or transferred to {prRepository}, the recorded URL is stale and h9k project set cannot change it, so register a new project: h9k project add --name <name> --repo-url https://github.com/{prRepository}

  RunAsync already takes its gh and git seams as parameters for tests. tests/Hall9k.Tests/Integration/ReviewLapTests.cs has no case for this. Its ScriptedGh (line 1882) answers every call with the same pull-request JSON, so the fourth criterion needs a scripted gh that answers gh repo view separately. The fixture's project has a recorded URL, so existing cases never reach the fallback.

  Add one clause to the <PULL-REQUEST> help text (lines 66-70) and the paragraph at docs/cli.md:456-466, saying the shorthand or URL must name the project's own repository.

  Out of scope: h9k task add --from-pr still adopts a foreign pull request, and the daemon refuses it at launch with a clear message.
