objective: h9k pr review refuses a pull request from a repository other than the one its project names, before it claims a task, records a lap or checks anything out, so a reviewer is not handed one pull request's briefing over another pull request's code.
criteria:
  - When the pull request gh read belongs to a repository other than the project's, however it was named (a number, owner/repo#N, or a URL), h9k pr review exits non-zero and says why on stderr, naming both repositories, where the project's repository came from (the recorded URL, quoted, or gh repo view), and that reviewing it needs a project registered against that repository. When it came from a recorded URL, the message also says a rename or transfer produces this refusal and that the way through is a new project with h9k project add --repo-url. When it came from gh repo view, the message also says gh repo set-default corrects a checkout whose default repository is not its origin.
  - After that refusal, no task, claim, run, lap record, worktree or tracking ref was created or changed. This holds with --no-worktree, with --since-my-review, and when a live task already holds the foreign pull request.
  - A pull request in the project's own repository, however it was named, opens a lap as it does today, including when the project's recorded URL differs from the pull request's in letter casing, a .git suffix, or being an ssh remote, whether on github.com or through an SSH host alias (ssh://git@github-work/owner/repo.git).
  - The project's repository is the one its recorded URL names or, when no URL is recorded, the one gh repo view observes; a mismatch against either is refused as the first criterion says. When neither names a repository, the lap proceeds, matching the daemon's guard.
  - Automated tests cover the first four criteria through the command's scripted gh and worktree seams, without touching real git or GitHub.
