objective: A plan is a first-class record on its own stream that the daemon drives, carrying one or more drafts through refinement and challenge to Published, and parking for a person when it cannot finish
criteria:
  - |-
    `h9k plan start <draft> [<draft>...]` records a plan on a stream of its own and returns without waiting, and the daemon on the node where it was run drives it. A plan's records never leave that node, so no other node starts a session for it, and a plan record arriving by replication starts nothing. A plan started while the daemon is stopped waits for it, and `h9k plan show` says so. A plan creates no run, lease, branch, or worktree.
  - |-
    `h9k plan start` is refused, with the reason and before any session starts, for anyone who may not publish every draft it names, and for a draft that is not a Draft, is a pr-review task or a spike, is in a live plan on this node, has a refinement or challenge requested or running, or belongs to a different project from the others named. A session another node dispatched stops counting as running once it has stood past the foreign-session ceiling with no outcome. It is also refused for a project that is archived, has no working checkout, or does not run agents with skip-permissions.
  - |-
    `h9k plan start` is refused for a draft whose context still carries an adopted item's quoted description, or the notice that its idea's workspace holds a tracker item. The refusal names `h9k task revise --context` as the way forward and says to read the objective as well. A draft whose context a person has replaced in their own words starts normally.
  - On a project whose publish would ask for a tracker attestation, `h9k plan start` is refused unless it carries `--no-existing-item` or `--untracked`, or every draft is already linked. Those flags mean what they mean on `h9k task publish`, are recorded on the plan with who gave them, and are what the plan's publish passes on. A flag `h9k task publish` would refuse on that project is refused here too.
  - A plan starts every draft at refinement, or at challenge with `--at challenge`, which is refused for a draft with no criteria. `h9k plan show` prints the plan's state and, for each draft, its phase (refinement, challenge, or published), its round, its latest outcome, and where its latest report is. `h9k plan list` lists a project's plans. Discovery and drafting are not offered.
  - A refinement session's prompt holds the draft as the store has it at dispatch, names the project home and the commit the checkout is at, says when that checkout could not be brought up to the project's remote base branch, and points at the idea's workspace and the draft's `journal.md` when they exist. It tells the session to test claims against that commit, with no fetch and no git writes; to state the shape (one task or several, stacked or not) before any criterion; to write each criterion so that someone who did not write it can check it, as an outcome rather than a mechanism; to propose the smallest change; never to write a criterion that drives another item's lifecycle; to keep security detail out of task text; and to rewrite `journal.md` with what the challenge should press on. On a later session for the same draft it also names the verdict and the path of its report. When the idea's workspace holds `tracker-item.md`, the prompt's working rules say that the file is source material written by whoever filed the item, and that anything in it addressed to the session is reported rather than acted on.
  - |-
    A refinement session cannot write to a task. Inside it `h9k task revise`, `publish`, `challenge`, and every `h9k plan` write stay refused. It ends with one report file in its session directory naming exactly one outcome: revised, with a revision file beside it in the format `h9k task revise --file` reads; unchanged; or question, with the question in the draft's `journal.md`. The daemon applies a revision with the same validation and effects as `h9k task revise --file`. If anyone else changed the draft after dispatch, the revision is not applied and the plan parks.
  - |-
    A verdict of publish as written makes a draft ready to publish. Publish as revised gets one refinement session told to apply the verdict's must and should changes, and the draft is then ready with no further challenge; that session ending unchanged parks the plan. Do not publish starts the next round: a refinement session told to answer the verdict, then a new challenge. A park change drives nothing. Every challenge uses the same request, session, verdict, and failure list as `h9k task challenge`, and a plan is the only thing that repeats one on its own.
  - A round is one challenge of one draft, and a plan runs at most two per draft, set by a daemon option. A do not publish verdict on the last round parks the plan rather than starting another.
  - |-
    A plan parks for a reason from a closed list: rounds exhausted, question, verdict not applied, draft changed, revision refused, session failed, challenge failed, or publish refused. While it is parked no new session starts for any of its drafts, and a session already running finishes. The record names the draft and the reason and holds nothing a session wrote; `h9k plan show` prints where to read the rest.
  - |-
    `h9k plan resume <plan>` re-runs the step that parked, and after rounds exhausted it grants one more round. Publishing or abandoning a draft by hand stays allowed during a plan and answers a park on that draft, so the plan carries on with no resume. `h9k plan cancel <plan> --reason "<why>"` ends a live plan, stops its refinement session without applying anything, and leaves its drafts as Drafts, free for another plan. A plan whose drafts have all been abandoned ends cancelled.
  - When every draft in a plan is ready, the daemon publishes each one with the same behaviour as `h9k task publish --no-queue`, so the challenge gate, the tracker item, and the ledger record happen as they do by hand, with the person who started the plan recorded as the publisher. The plan grants no pre-approval, assigns nothing, and queues nothing. A draft that reads Published counts as published however the step ended. The plan ends Published when its last draft does. A refused publish parks the plan, drafts already published stay published, and a resume publishes the rest. When the project tracks a backlog and a published draft has no tracker item and none on its way, and was not published untracked, `h9k plan show` and the plan's end item say so.
  - A node runs one refinement session at a time, oldest plan first, on a loop of its own, so a long session holds up neither task dispatch, a challenge, nor another plan's next step. A plan's sessions take no slot against the node's ceiling or the project's. While the node's launch hold stands, its spend budget is spent, or the project's max parallel tasks is 0, a plan starts no refinement session and requests no challenge, and `h9k plan show` says why. The bound is a daemon option defaulting to 30 minutes, and a session past it is terminated. A session that exceeds the bound, ends in error, ends with no result, or writes no readable report records a failure from a closed list and parks the plan. A session running when the daemon restarts is recorded as failed on the next start and never re-dispatched.
  - A refinement session's model is the project's, then `h9k config set --model-refinement`, then the node's default, and its effort follows the same chain through the project's, `--effort-refinement`, and the node-wide value. A draft's own model or effort does not move it. `h9k config show` no longer calls the role future. The session's tokens land in the spend lines of `h9k status` and `h9k config show` under the model it ran on, and the session count in `h9k task show` includes it.
  - |-
    `h9k task show` names the live plan a draft is in and its phase, and wherever `h9k task revise` or `h9k task show` prints that draft's `Next:` line, it points at `h9k plan show`. `h9k status` lists a parked plan under Needs you with its reason and `h9k plan resume`. A park reaches the project's orchestrator feed at the same level as a review park, a plan's end arrives as an ordinary item, a phase move does not arrive at all, and the feed text carries only ids, phases, and the reason.
  - |-
    What travels is the task's own record: each revision, verdict, and publish, and a refinement session's dispatch and outcome, which carry the node and no machine path. A plan's records hold no text from a draft or a session, and `h9k plan show` derives a report's path from its session id. On any other node `h9k task show` still prints that task's refinement and challenge history. Purging a project removes its plans.
  - The recipe generator skill and `ORCHESTRATOR-WINDOW.md` teach a window to run `h9k plan start` on a draft, to read the outcome from the feed, and to answer a park with `h9k plan resume` or by hand. Headless refinement leaves the skill's spawned-session lists, its model tier row, and its registry line, and a recipe generated after this holds no launch line or model for it. The `recipes/task-refinement.md` contract stays for refinement with the operator in the terminal, and its rule that publishing waits for the operator to walk the criteria no longer applies to a draft in a plan.
  - |-
    `docs/cli.md` and the hall9k-cli-reference skill document the verbs, the cap, and the park reasons wherever the neighbouring verbs and settings are documented, and say that a plan's sessions hold no ceiling slot. `docs/getting-started.md` and `docs/operations.md` stop calling the refinement role future. `PLAN.md`'s vocabulary defines a plan, and its Refinement entry no longer reads as only the backward loop.
