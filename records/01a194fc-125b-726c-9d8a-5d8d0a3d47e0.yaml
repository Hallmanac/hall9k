context: |-
  Shape: one of four tasks in epic 5e451233, section B1 of the brief, one pull request. Blocked by 3e3c9f7f (A1) and not stacked on it, because each is useful on merge. That is already ruled. Priority: fold-in.

  Why and what was decided: `ideas/13403621-named-agent-files-claude-code-s-claude-agents-as-a-bridge-be/workspace/plan-work-brief.md`, section B1, and the Rulings in `journal.md` beside it. Refinement's reasoning is `notes/refine-0a3d47e0/journal.md`. All three are in the project home.

  This task rests on A1. Use its request, its verdict event, its gate, its failure list, and its forgiving report reader as they merged, and read their names from the code rather than from this text. A1's criterion that nothing repeats a challenge on its own holds for everything except a plan.

  The stream. Add a `Plan` feature slice with its own aggregate and projection. The plan holds the project id, the draft ids, each draft's phase, round, and latest outcome, the start phase, and the attestation. It holds no prose, not even a title. Every plan event is NodeScoped in `EventScopeRegistry`, like the courier's and `PrReviewPreflightDispatched`, so the outbox never carries one and the inbox refuses one that arrives (`EventReplicationInbox.cs:795`). That is what makes "no other node starts a session" a fact rather than a sweep rule. Removal goes in `ProjectPurgeEngine`, the same way courier runs do (`ProjectPurgeEngine.cs:269`). Plan events carry the project id, and the ones that concern a draft carry its id; `OrchestratorFeedReader` reads them from the event, as its root-rotation arm does, so `ReplicationProjectResolver` does not change. The session's own dispatch and outcome go on the task's stream, ProjectScoped, following A1's dispatch and recorded outcome: Conditional in `TaskActClassificationRegistry` and in `PreAssignmentCapableConditionalTypes`, with no machine path. Reuse `PublicationTokensRecorded`, and count the dispatch through `TaskPassageQuery`'s `taskEvents` line as A1 does. Append both streams in one save.

  The session. Copy `CardPublicationLoop` for the sweep and the doorbell. Run the session as `CloseoutTriageSessions` does, as a background job the sweep starts and does not await, because `CardPublicationEngine` awaits its session inside the sweep (`:671`). From `CardPublicationEngine` take `ProjectCheckout.ForReading` plus `RefreshReadingCheckoutAsync`, the dispatch saved under a fence before the spawn, `RunPaths.GlobalDirectory(sessionId)`, and `TaskId` and `SessionName` on the spawn request. Pass `project.SkipPermissions` and use `ClaudeSettingsFile.Build`. Take recovery from `CloseoutTriageSessions`, as A1 does, and use `ForeignPublicationCeiling` for another node's dispatch. Skip-permissions is required because the session writes its report, a revision, and the draft's journal outside its checkout, which the plain settings refuse (probed in `notes/challenge-3e3c9f7f/journal.md`, Must 2). Add `AgentPromptBuilder.BuildPlanRefinement` over a template in `.claude/templates`, pinned as a golden, carrying the project's writing conventions. The workspace notice's fixed sentence is checked beside `CarriesQuotedDescription`, and the `tracker-item.md` rule is a working rule the daemon authors, gated on the file existing. Share that template line with A1's challenge prompt, so the same rule reaches a challenge session. Tell it that a must only a person can settle ends with the question outcome. The rules in criterion 6 come from the House rule lines of `recipes/task-refinement.md`, and the template carries them so that a project with no recipe gets them too. Read the report the way A1 reads its own, using one closing line such as `REFINEMENT: revised`.

  The daemon's writes. `DispatchedSessionCommandClassification` refuses `task revise`, `task publish`, and `task challenge` in any session, and that stays. The daemon does those three acts itself by running the installed `h9k` as a child process, with `DaemonRuntime.BinDirectory` first and PATH second, using the platform's binary name, with stdin redirected, a bound on the child, and the daemon's resolved connection string in `HALL9K_CONNECTION_STRING`, passing `--file` for a revision and `--no-queue` for a publish, and with the `HALL9K_DISPATCHED_*` variables cleared from the child's environment. This is deliberate. `TaskFileParser`, `TrackInBacklogAsync`, `WriteRecordAsync`, `TaskRecordPublication`, and `LinearPublishTracking` all live in `Hall9k.Cli`, which the daemon does not reference, and moving them out would be a refactor larger than this task's own logic. A non-zero exit is a refusal, with one exception: after a publish, read the task, because a publish cut short exits non-zero having committed, and a tracker failure exits zero. Keep the child's output in a file beside the plan's session directories and never on a stream, because it can quote a session's text. A refinement sets no model, and `--file` reads one, so read the file with `FrontmatterYaml.Parse` first; a revision naming a model is refused as revision refused. The draft-changed check asks whether a `TaskRevised` landed after the dispatch, the same fact A1's gate reads. The stream version moves for events that change nothing about the draft.

  The cap. The cap is a daemon option beside the session bound, defaulting to 2, with no node, project, or task setting, because only a person's resume or a new plan grants more. Two is the default because none of the 27 recorded verdicts is a flat do not publish (`notes/challenge-3e3c9f7f/journal.md`, press point 6) and only one draft ever had a second challenge.

  Classify the new commands in `DispatchedSessionCommandClassification`: `plan show` and `plan list` are ReadOnly, the rest Refused. Add feed entries to `OrchestratorFeedInterest` with text in `OrchestratorFeedDescription`. The adopted-text refusal reads `WorkItemContext.CarriesQuotedDescription`, the same gate the build prompt's data-only rule uses. The reason it refuses rather than frames: refinement rewrites a quoted description into the task's own context, the gate then reads false, and a build would take a stranger's words as the owner's instruction with nobody having read them. The Refinement role already flows through `RoleModelDefaults`, `RoleEffortDefaults`, and `ResolveModel`, so no new role and no compiled floor are added; pass a null task override so a draft's build model stays out of it. A `TaskRevised` carries no human gate through `--file`, and a revision must not. Also fix the "(future)" wording in `ConfigSetCommand.cs:153` and `:236`.

  Recipe generator. In `.claude/skills/orchestrator-recipe-generator/SKILL.md` the lines to move are the tier row at 337, the sentence at 358, the registry at 558, the spawn list at 566 to 571, and the publishing sentence at 890 to 892, as numbered at ef0ee52f9, so re-find them after A1 lands.

  Not in this task: the epic flag on `h9k plan start` (B2), a settable round cap, a session creating drafts, adding a draft to a live plan, discovery and drafting phases (all B2, 80f1460d), a per-project prompt addendum for refinement, a plan-level title, plans on a project without skip-permissions, plan records that travel to other nodes, automatic retry of a failed session, task notes, Ralph loops, agent files, multi-vendor, and the coordination layer. A refinement that believes a draft should split ends with the question outcome, and a person answers by cancelling and starting a plan on the resulting drafts. No test spawns a real agent, creates a branch, or touches GitHub.

  Note to the orchestrator (decision 13f11af2), not to the build session: after this merges, regenerate the project recipes and adopt them, supersede the memory rule that criteria are walked before publishing as the brief directs, and move the challenge-before-publish rule onto `h9k plan start`. Confirm the Mac's `--model-refinement` and `--effort-refinement` are what you want before the first plan, since they fall through to the node defaults.
