  Read `report.md` and this file in `ideas/b2a6f46c-*/workspace/` in the project home for the evidence. Brian ruled the fold on 2026-10-13 (the idea's journal, 15:11 entry); a separate Security lens is out of scope. The Adversarial prompt is built by `BuildAdversarialReview` (`src/Hall9k.Daemon/Execution/AgentPromptBuilder.cs`, around line 3108), reached through `BuildReview` (around line 2579), with its prose in `.claude/templates/agent-prompt-builder/adversarial-review.md`. The engine's only call site is `ReviewEngine.DispatchReviewPassAsync` (`src/Hall9k.Daemon/Review/ReviewEngine.cs`, around line 2161), which is where the setting can be resolved through `SecurityReviewSetting.ResolveAsync` and handed in. `SecurityReviewPromptBuilder.AppendLenses` (`src/Hall9k.Daemon/Execution/SecurityReviewPromptBuilder.cs`, around line 86) shows the six fragment names. Reuse those six only. The file's `heading` and `intro` fragments are written for the persona; the intro tells the reader a change touching none of the areas is a complete review, which is wrong for an Adversarial pass, so the section's heading and framing belong in `adversarial-review.md`. Keep the existing "where defects hide" warm-up as it is, even though its first bullet overlaps the injection area. The pr-review lens arrives through `BuildPrReviewLens` (around line 2610) with `DiffIsForeignPullRequest: true`; that flag is the existing seam the method already uses to tell the two apart. The kind seam: `ReviewFindingKind` (`src/Hall9k.Domain/Features/Run/ReviewFindingKind.cs`), `ReviewResultParser` (`KindTagKey`, and the parse around line 180), `ReviewFinding.ToRecord`, and `ReviewEngine.FindingLabel` (around line 7140). The run-skill drift fragment in `finding-contract.md` and `RunSkillDriftQuestionTests` are the pattern to copy. `PromptTemplateContractTests` refuses a contract token typed literally in a template, so the tag key and the `security` word reach the prompt as substituted parameters, exactly as the