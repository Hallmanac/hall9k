objective: Every pre-PR Adversarial review pass also reads the diff for the six security areas the Security persona hunts, under the project's existing `--security-review` switch, and the findings it makes in those areas are recorded as security findings so they can be counted.
criteria:
  - With the project's security-review setting on (the default), the prompt for every pre-PR Adversarial pass, both Discovery and the final full pass, contains a section naming the six security areas (injection; secrets handling; authentication and authorization; unsafe process, file, or network use; dependency changes; CI or release workflow changes). The text of each area is read at build time from `.claude/templates/security-review-prompt-builder/lenses.md`, so an edit to one of those six fragments changes the pr-review Security persona's prompt and the Adversarial prompt alike.
  - With the setting off, the pre-PR Adversarial prompt is identical, byte for byte, to what the same inputs produce without this change (the existing golden).
  - A pr-review task's own lenses never carry the section, whatever the setting, and the Security persona's own prompt is unchanged; the Conformance, Verify, and verdict-reprompt prompts are unchanged whatever the setting.
  - When the section is present, the prompt tells the reviewer to tag each finding that falls in one of the six areas `kind=security`. A finding so tagged, from any pre-PR review pass, is recorded on `ReviewPassCompleted` with the kind `security`; a run stream written before this change replays unchanged.
  - A security-tagged finding is fixed, routed, or carried as a ride-along exactly as an untagged finding of the same grade and scope would be, and the merged findings document the fix session reads labels it as a security finding, the way it already labels a run-skill drift finding.
  - The setting is read when each Adversarial pass is dispatched, so a project's change to it takes effect from the next pass; nothing new is recorded on the run.
  - The `--security-review` help text and its on/off error message, both texts of the `project show` "Security review" row, and the passages describing the `--security-review` setting in `docs/concepts.md`, `docs/operations.md`, `docs/cli.md`, and `docs/scope.md` say the switch governs both the pr-review Security persona and the security areas in the pre-PR Adversarial lens. The docs also say that a review stage composition that runs no Adversarial pass (`ConformanceOnly`, `None`) does no pre-PR security reading.
  - |-
    Unit tests, none of which creates a git repository or a branch or touches GitHub, prove: the Adversarial prompt's content with the setting on, in both Discovery and FinalFullPass modes (each of the six area texts as loaded from `lenses.md`, and the tag instruction) and with it off (the existing golden, unchanged); the Conformance, Verify, and verdict-reprompt goldens unchanged; that the pr-review lens prompt carries no security section with the setting on; a golden for the Security persona's own prompt, which has no content test today; that `kind=security` parses and an unrecognized kind still reads as an ordinary finding; that a `ReviewFindingRecord` with the security kind round-trips, and an old payload without a kind still does; that disposition ignores the kind; and the findings-document label.
