name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Every machine that runs h9kd already has a git identity configured: NodeBootstrap
      # itself reads git config user.name/user.email as the node's own operator identity, and
      # every agent-driven commit throughout the platform already depends on it being set. A
      # bare CI runner is the one environment that doesn't have one, and the mechanical-rebase
      # integration test is the one path that actually replays commits (a real divergent
      # history, not a faked conflict read), so it is the one path that notices: git refuses to
      # create the replayed commits without an identity, which ubuntu-latest's hostname-based
      # auto-detection can't supply. Configuring one here matches what every real machine
      # already has, rather than teaching the mechanical-rebase code to invent its own.
      - name: Configure git identity for integration tests
        run: |
          git config --global user.name "Hall9k CI"
          git config --global user.email "ci@hall9k.invalid"
      - name: Build
        run: dotnet build --configuration Release
      # blame-hang fails this step on its own once a test hangs past the given timeout and
      # dumps the in-flight tests' stacks; the step timeout backstops a hang it misses.
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 20
        run: >
          dotnet test --configuration Release --no-build --verbosity normal
          --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini
          --results-directory ./TestResults
      - name: Upload hang diagnostics
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blame-hang-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
          retention-days: 5
      # Windows runners cannot run Linux containers, so the Testcontainers-backed
      # integration tier is excluded there.
      - name: Test (without Docker-dependent tests)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 20
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=RequiresDocker"
