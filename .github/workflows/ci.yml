name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build --configuration Release
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test --configuration Release --no-build --verbosity normal
      # Windows runners cannot run Linux containers, so the Testcontainers-backed
      # integration tier is excluded there.
      - name: Test (without Docker-dependent tests)
        if: matrix.os == 'windows-latest'
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=RequiresDocker"
